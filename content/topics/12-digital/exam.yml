  - type: single
    question: При разборе задачи «Логические уровни» какой вывод обоснован?
    options:
      - Совместимость логики проверяют по гарантированным входным и выходным уровням.
      - Любые 3,3 В гарантированно принимаются любым 5-вольтовым CMOS
      - Неопределённую область можно использовать как стабильную логику
    answer: 0
    hint: >-
      Сопоставь минимум VOH источника с минимумом VIH приёмника и максимум VOL с максимумом VIL.
      Отдельно проверь абсолютные пределы напряжения.
    explanation: >-
      Совместимость логики проверяют по гарантированным входным и выходным уровням. Напряжение 3,3 В
      не всегда является надёжной единицей для 5-вольтового входа. VIH/VIL задают гарантированные
      границы входа, VOH/VOL — выходные уровни при заданном токе. Между VIL и VIH находится
      неопределённая область. Запас по шуму рассчитывают между гарантированными границами. Ошибочные
      варианты: Любые 3,3 В гарантированно принимаются любым 5-вольтовым CMOS; Неопределённую
      область можно использовать как стабильную логику. Они не учитывают описанный принцип.
    id: digital-logic-levels-0
    lesson: logic-levels
    difficulty: 1
  - type: numeric
