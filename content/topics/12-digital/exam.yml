  - type: single
    question: При разборе задачи «Логические вентили» какой вывод обоснован?
    options:
      - НЕ зависит от двух входов одновременно
      - XOR даёт единицу при разных входах.
      - XOR даёт единицу при любых двух единицах
    answer: 1
    hint: >-
      Сначала запиши требование словами, затем проверь каждую строку таблицы, включая оба нуля и обе
      единицы.
    explanation: >-
      XOR даёт единицу при разных входах. Два датчика могут совместно разрешать работу устройства. И
      даёт единицу только при двух единицах, ИЛИ — хотя бы при одной, НЕ инвертирует, XOR выделяет
      различие. И-НЕ и ИЛИ-НЕ инвертируют результаты соответствующих операций. Таблица истинности
      перечисляет все комбинации входов. Ошибочные варианты: XOR даёт единицу при любых двух
      единицах; НЕ зависит от двух входов одновременно. Они не учитывают описанный принцип.
    id: digital-logic-gates-0
    lesson: logic-gates
    difficulty: 1
