questions:
  - id: "dg-001"
    lesson: "binary-hex"
    difficulty: 1
    type: "numeric"
    question: "Переведи 0b10110010 в десятичное число."
    answer: 178
    unit: "ед."
    tolerance_percent: 1
    explanation: "128 + 32 + 16 + 2 = 178 (0xB2)."
  - id: "dg-002"
    lesson: "binary-hex"
    difficulty: 1
    type: "numeric"
    question: "Чему равно 0xC8 в десятичной записи?"
    answer: 200
    unit: "ед."
    tolerance_percent: 1
    explanation: "12·16 + 8 = 200."
  - id: "dg-003"
    lesson: "binary-hex"
    difficulty: 2
    type: "single"
    question: "Сколько битов в одной шестнадцатеричной цифре?"
    options:
      - "4"
      - "8"
      - "2"
    answer: 0
    explanation: "Одна hex-цифра — полубайт, четыре бита."
  - id: "dg-004"
    lesson: "binary-hex"
    difficulty: 2
    type: "numeric"
    question: "Сколько значений можно закодировать в 14 битах?"
    answer: 16384
    unit: "знач."
    tolerance_percent: 1
    explanation: "2¹⁴ = 16 384."
