    unit: мА
    tolerance_percent: 1
    hint: I = U/R. При U в В и R в кОм результат получается в мА.
    explanation: 3,3/7 = 0,471429 мА.
    id: digital-pullup-opendrain-1
    lesson: pullup-opendrain
    difficulty: 1
