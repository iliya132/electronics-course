      - Защитный узел проверяют до соединения с GPIO.
      - Стабилитрон любого номинала гарантирует защиту любого входа
    answer: 1
    hint: >-
      Сначала проверяй макет без подключения GPIO. Измерь максимум на выходе и проверь поведение при
