    question: При разборе задачи «Триггеры, счётчики, регистры» какой вывод обоснован?
    options:
      - У 74HC595 сдвиг данных и обновление выходов выполняются разными тактами.
      - Каждый импульс SHCP обязательно немедленно меняет все внешние выходы
      - Выходы регистра не имеют ограничений суммарного тока
    answer: 0
    hint: >-
      Проверь питание, OE, MR и порядок битов. Не нагружай каждый выход до предела без проверки
      суммарного тока корпуса.
    explanation: >-
