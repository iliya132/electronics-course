    question: При разборе задачи «Оптопары и гальваническая развязка» какой вывод обоснован?
    options:
      - Типичный CTR гарантирован у всех экземпляров и температур
      - Изоляция требует отсутствия других проводящих связей между сторонами.
      - Соединение земель не влияет на гальваническую развязку
    answer: 1
    hint: >-
      Рассчитай ток LED и выходную подтяжку по минимальному CTR. Не соединяй земли, если нужна
      гальваническая развязка.
    explanation: >-
      Изоляция требует отсутствия других проводящих связей между сторонами. Сигнал можно передать
      без прямого электрического соединения земель. Оптопара содержит LED и фотоприёмник. CTR
      связывает входной и выходной ток, но меняется с температурой, током и старением. PC817
      подходит для сравнительно медленных сигналов; изоляция зависит также от зазоров платы и
      источников питания. Ошибочные варианты: Соединение земель не влияет на гальваническую
      развязку; Типичный CTR гарантирован у всех экземпляров и температур. Они не учитывают
      описанный принцип.
