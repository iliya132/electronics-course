    question: При разборе задачи «Буферы и триггер Шмитта» какой вывод обоснован?
    options:
      - Любой буфер обязательно имеет вход Шмитта
      - Гистерезис защищает от любого перенапряжения
      - Шмитт повышает устойчивость к медленным фронтам за счёт гистерезиса.
    answer: 2
    hint: >-
      Проверь тип входа по даташиту и согласуй уровни питания. Даже вход Шмитта не устраняет
      необходимость ограничивать перенапряжение.
    explanation: >-
      Шмитт повышает устойчивость к медленным фронтам за счёт гистерезиса. Медленный или шумный
      фронт может вызвать несколько переключений. Триггер Шмитта использует два порога и превращает
      медленный сигнал в устойчивые логические переходы. 74HC14 инвертирует, а 74HC125 — буфер с
      управлением выходом; это разные функции. Ошибочные варианты: Любой буфер обязательно имеет
      вход Шмитта; Гистерезис защищает от любого перенапряжения. Они не учитывают описанный принцип.
    id: digital-schmitt-buffers-0
    lesson: schmitt-buffers
    difficulty: 1
