  - type: single
    question: При разборе задачи «Согласование уровней» какой вывод обоснован?
    options:
      - Любой вывод ESP32 допускает 5 В
      - Согласование уровней зависит от типа интерфейса, а не только двух напряжений.
      - Делитель подходит для любого быстрого двунаправленного интерфейса
    answer: 1
    hint: >-
      Выбирай метод по направлению, частоте и типу выхода. Проверь состояние при выключенном питании
      одной стороны.
    explanation: >-
      Согласование уровней зависит от типа интерфейса, а не только двух напряжений. Сигнал 5 В может
      повредить GPIO ESP32. Для медленного однонаправленного сигнала подходит рассчитанный делитель;
      для I²C применяют совместимый двунаправленный преобразователь открытого стока. BSS138-схема
      требует правильных подтяжек и уровней; TXS и буферы LVC имеют свои ограничения. Ошибочные
      варианты: Делитель подходит для любого быстрого двунаправленного интерфейса; Любой вывод ESP32
      допускает 5 В. Они не учитывают описанный принцип.
    id: digital-level-shifting-0
    lesson: level-shifting
    difficulty: 1
  - type: numeric
    question: >-
      Ненагруженный делитель: Uвх = 5 В, R1 сверху = 10 кОм, R2 снизу = 7 кОм. Найди Uвых
      относительно GND.
    answer: 2.0588235294117645
    unit: В
    tolerance_percent: 1
    hint: Uвых = Uвх·R2/(R1+R2); одинаковые приставки сопротивлений сокращаются. 1 кОм = 1000 Ом.
    explanation: 5 × 7/(10+7) = 2,05882 В.
    id: digital-level-shifting-1
    lesson: level-shifting
    difficulty: 1
