    question: При разборе задачи «Двоичная и шестнадцатеричная системы» какой вывод обоснован?
    options:
      - Один байт содержит четыре бита
      - 0x10 равно десятичному десяти
      - Шестнадцатеричная цифра кодирует четыре двоичных разряда.
    answer: 2
    hint: >-
      Различай число и его запись. Для маски одного бита используй 1 с беззнаковым сдвигом; проверь
      ширину типа.
    explanation: >-
      Шестнадцатеричная цифра кодирует четыре двоичных разряда. Регистры микроконтроллера удобнее
      читать в двоичной записи. Бит имеет два состояния; байт содержит восемь битов.
      Шестнадцатеричная цифра соответствует четырём битам, поэтому 0xA5 = 10100101₂ = 165. Сдвиг
      влево умножает беззнаковое число на два, пока не происходит переполнение. Ошибочные варианты:
      Один байт содержит четыре бита; 0x10 равно десятичному десяти. Они не учитывают описанный
      принцип.
    id: digital-binary-hex-0
    lesson: binary-hex
    difficulty: 1
  - type: numeric
    question: Каково десятичное значение двоичного числа 10111?
    answer: 23
    unit: ед.
    tolerance_percent: 1
    hint: >-
      Двоичные разряды справа налево имеют веса 1, 2, 4, 8, 16… Значение — сумма весов единичных
      разрядов.
    explanation: 1+2+4+16 = 23 ед..
    id: digital-binary-hex-1
    lesson: binary-hex
    difficulty: 1
