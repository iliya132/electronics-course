    question: При разборе задачи «Подтяжка и открытый сток» какой вывод обоснован?
    options:
      - Открытый сток активно выдаёт высокий уровень
      - Сильная подтяжка не влияет на ток при нуле
      - Высокий уровень открытого стока создаёт подтяжка.
    answer: 2
    hint: >-
      Проверь допустимый ток стока и RC-время подъёма. Не соединяй push-pull выходы как открытые
      стоки.
    explanation: >-
      Высокий уровень открытого стока создаёт подтяжка. Ненажатая кнопка без подтяжки оставляет вход
      неопределённым. Pull-up задаёт высокий уровень, кнопка замыкает линию на GND. Открытый сток
      может только тянуть вниз; несколько таких выходов образуют wired-AND активных уровней. Меньший
      резистор ускоряет фронт, но увеличивает ток низкого состояния. Ошибочные варианты: Открытый
      сток активно выдаёт высокий уровень; Сильная подтяжка не влияет на ток при нуле. Они не
      учитывают описанный принцип.
    id: digital-pullup-opendrain-0
    lesson: pullup-opendrain
    difficulty: 1
