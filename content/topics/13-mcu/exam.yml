    lesson: "clock-crystal"
    difficulty: 2
    type: "numeric"
    question: "Точность 20 ppm. На сколько секунд уйдут часы за сутки (86 400 с)?"
    answer: 1.73
    unit: "с"
    tolerance_percent: 4
    explanation: "86 400 · 20·10⁻⁶ ≈ 1,73 с."
  - id: "mc-015"
    lesson: "clock-crystal"
    difficulty: 1
    type: "single"
    question: "Что точнее: внутренний RC или кварц?"
    options:
      - "Кварц"
      - "Внутренний RC"
      - "Одинаково"
    answer: 0
    explanation: "Кварц — десятки ppm, RC — проценты."
