  - type: single
    question: При разборе задачи «Питание МК» какой вывод обоснован?
    options:
      - Развязка нужна у каждой группы выводов питания согласно документации.
      - Достаточно подключить только один из нескольких GND
      - AREF всегда нужно напрямую соединить с 5 В
    answer: 0
    hint: >-
      Сверь все VCC/GND, включая аналоговые и скрытые на схеме выводы. Проверяй напряжение
      непосредственно на чипе при активной нагрузке.
    explanation: >-
      Развязка нужна у каждой группы выводов питания согласно документации. МК может сбрасываться от
      короткой просадки питания. Каждый вывод питания требует локальной развязки, аналоговые цепи
      имеют свои требования к AVCC/AREF. Brown-out detector удерживает устройство в безопасном
      сбросе при недостаточном напряжении. AREF нельзя автоматически соединять с питанием без
      проверки режима. Ошибочные варианты: Достаточно подключить только один из нескольких GND; AREF
      всегда нужно напрямую соединить с 5 В. Они не учитывают описанный принцип.
    id: mcu-power-pins-0
    lesson: power-pins
    difficulty: 1
  - type: numeric
    question: >-
      Импульс нагрузки 0,1 А длится 7 мс. Какова просадка идеального конденсатора 1000 мкФ без
      подпитки?
    answer: 0.7000000000000001
    unit: В
    tolerance_percent: 1
    hint: ΔU = I·Δt/C; I в А, Δt в с, C в Ф. ESR и индуктивность создают дополнительные изменения.
    explanation: 0,1 × 7 × 10⁻³ / (1000×10⁻⁶) = 0,7 В.
    id: mcu-power-pins-1
    lesson: power-pins
    difficulty: 1
