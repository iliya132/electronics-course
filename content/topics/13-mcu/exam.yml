    question: При разборе задачи «Сброс и загрузка» какой вывод обоснован?
    options:
      - BOOT любого МК имеет одинаковую полярность и назначение
      - RESET и выбор загрузочного режима решают разные задачи.
      - Нажатие RESET всегда стирает Flash
    answer: 1
    hint: >-
      Проверь активный уровень RESET и требования к длительности. Не путай RESET с BOOT; состояние
      некоторых выводов считывается только при старте.
    explanation: >-
      RESET и выбор загрузочного режима решают разные задачи. Нажатие кнопки сброса перезапускает
      программу, но не обязательно меняет прошивку. RESET задаёт начальное состояние, boot-настройки
      выбирают источник загрузки. Подтяжка предотвращает случайный сброс, RC помогает сформировать
      задержку. Автосброс Arduino использует импульс от DTR через конденсатор. Ошибочные варианты:
      Нажатие RESET всегда стирает Flash; BOOT любого МК имеет одинаковую полярность и назначение.
      Они не учитывают описанный принцип.
    id: mcu-reset-boot-0
    lesson: reset-boot
    difficulty: 1
  - type: numeric
    question: R = 10 кОм, C = 70 мкФ. Найди постоянную времени RC.
    answer: 0.7
    unit: с
    tolerance_percent: 1
    hint: τ = RC, если R в Ом и C в Ф. кило = 10³, микро = 10⁻⁶; их произведение даёт 10⁻³.
    explanation: 10000 × 70 × 10⁻⁶ = 0,7 с.
    id: mcu-reset-boot-1
    lesson: reset-boot
    difficulty: 1
