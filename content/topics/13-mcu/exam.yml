    question: При разборе задачи «Режимы энергосбережения» какой вывод обоснован?
    options:
      - Срок батареи зависит от среднего тока всей системы.
      - Deep sleep чипа гарантирует такой же ток DevKit
      - Средний ток равен току самого долгого режима
    answer: 0
    hint: >-
      Измеряй всю плату, а не только значение из даташита чипа. Проверь зарядные импульсы
      конденсаторов и пробуждение.
    explanation: >-
      Срок батареи зависит от среднего тока всей системы. Датчик большую часть времени может спать.
      Средний ток считают по долям времени активного и спящего режимов. Но стабилизатор, светодиод
      питания и датчики продолжают потреблять энергию. Источники пробуждения и сохранность памяти
      зависят от режима МК. Ошибочные варианты: Deep sleep чипа гарантирует такой же ток DevKit;
      Средний ток равен току самого долгого режима. Они не учитывают описанный принцип.
    id: mcu-low-power-modes-0
    lesson: low-power-modes
    difficulty: 1
  - type: numeric
    question: 'Цикл 600 с: активный ток 80 мА длится 7 с, остальное время сон 0,01 мА. Найди средний ток.'
    answer: 0.9432166666666666
    unit: мА
    tolerance_percent: 1
    hint: >-
      Iср = (Iакт·tакт+Iсон·tсон)/T. Токи всей платы, включая стабилизатор и датчики, считают
      вместе.
    explanation: '[80×7+0,01×(600−7)]/600 = 0,943217 мА.'
    id: mcu-low-power-modes-1
    lesson: low-power-modes
    difficulty: 1
