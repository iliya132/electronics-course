    question: При разборе задачи «АЦП/ЦАП в МК» какой вывод обоснован?
    options:
      - Опора всегда точно равна напряжению USB
      - Разрядность не равна фактической точности измерения.
      - 12 бит гарантируют точность лучше 10 бит при любых условиях
    answer: 1
    hint: >-
      Проверь рекомендуемый импеданс, время выборки, ослабление и калибровку. Не переносись с
      идеальной формулы прямо к точным измерениям ESP32 без проверки.
    explanation: >-
      Разрядность не равна фактической точности измерения. Встроенный АЦП зависит от опоры и
      входного источника. Uno использует 10-битное преобразование, классический ESP32 — 12-битный
      SAR с заметными особенностями диапазона и калибровки. Внутренняя выборочная ёмкость требует
      времени заряда, поэтому слишком высокое сопротивление источника ухудшает точность. Ошибочные
      варианты: 12 бит гарантируют точность лучше 10 бит при любых условиях; Опора всегда точно
      равна напряжению USB. Они не учитывают описанный принцип.
    id: mcu-adc-dac-mcu-0
    lesson: adc-dac-mcu
    difficulty: 1
  - type: numeric
    question: >-
      Идеальный 10-битный АЦП имеет код 448 при Uref = 5 В. Найди нижнюю границу интервала этого
      кода.
    answer: 2.1875
    unit: В
    tolerance_percent: 1
    hint: Uниж = code·Uref/2ⁿ. Код задаёт интервал, а не бесконечно точное напряжение.
    explanation: 448×5/1024 = 2,1875 В.
    id: mcu-adc-dac-mcu-1
    lesson: adc-dac-mcu
    difficulty: 1
