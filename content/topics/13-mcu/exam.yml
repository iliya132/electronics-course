      - "Чтобы питать кварц"
      - "Чтобы фильтровать питание"
    answer: 0
    explanation: "Кварц рассчитан на определённую ёмкость нагрузки."
  - id: "mc-017"
    lesson: "reset-boot"
    difficulty: 2
    type: "numeric"
    question: "R = 47 кОм, C = 100 нФ. Постоянная времени τ, мс?"
    answer: 4.7
    unit: "мс"
    tolerance_percent: 3
    explanation: "47 000 · 10⁻⁷ = 4,7 мс."
