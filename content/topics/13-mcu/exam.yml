  - type: single
    question: При разборе задачи «GPIO» какой вывод обоснован?
    options:
      - Если один вывод выдерживает ток, весь порт выдержит сумму без ограничений
      - Абсолютный максимум GPIO не является рекомендуемым рабочим током.
      - 40 мА на ATmega328P — нормальный ток для любого проекта
    answer: 1
    hint: >-
      Для LED выбери малый ток, например несколько мА, и резистор. Моторы и реле включай драйвером.
      Проверь ток всего порта и корпуса.
    explanation: >-
      Абсолютный максимум GPIO не является рекомендуемым рабочим током. Вывод МК — маленький
      транзисторный каскад с ограничениями. В режиме входа он считывает уровень, в выходе push-pull
      активно задаёт оба состояния, open-drain — только низкое. Для Uno R3 указывают рабочий ток
      порядка 20 мА на вывод; 40 мА у ATmega328P — абсолютный предел, не проектный ток. Есть
      суммарные ограничения портов. Ошибочные варианты: 40 мА на ATmega328P — нормальный ток для
      любого проекта; Если один вывод выдерживает ток, весь порт выдержит сумму без ограничений. Они
      не учитывают описанный принцип.
    id: mcu-gpio-0
    lesson: gpio
    difficulty: 1
  - type: numeric
    question: 'Красный LED: Vf = 2 В при 10 мА, питание 10 В. Найди расчётный резистор до округления.'
    answer: 800
    unit: Ом
    tolerance_percent: 1
    hint: R = (Uпит−Vf)/I; I подставляют в А. После расчёта выбирают E12 вверх и проверяют мощность.
    explanation: (10−2)/0,01 = 800 Ом.
    id: mcu-gpio-1
    lesson: gpio
    difficulty: 1
