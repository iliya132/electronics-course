questions:
  - type: single
    question: При разборе задачи «Что такое микроконтроллер» какой вывод обоснован?
    options:
      - RAM всегда сохраняется после отключения питания
      - Любой МК имеет одинаковые радио и USB
      - RAM хранит рабочие данные, Flash обычно хранит программу энергонезависимо.
    answer: 2
    hint: >-
      Разделяй постоянную программу и временные переменные. Проверь объём памяти и нужную периферию
      по конкретной модели.
    explanation: >-
      RAM хранит рабочие данные, Flash обычно хранит программу энергонезависимо. Микроконтроллер
      может управлять устройством без полноценного компьютера. В одном корпусе находятся ядро, Flash
      программы, RAM данных и периферия. ATmega328P, ESP32 и STM32 отличаются архитектурой,
      ресурсами и напряжениями; наличие названия семейства не задаёт точную распиновку. Ошибочные
      варианты: RAM всегда сохраняется после отключения питания; Любой МК имеет одинаковые радио и
      USB. Они не учитывают описанный принцип.
    id: mcu-mcu-what-0
    lesson: mcu-what
    difficulty: 1
  - type: numeric
    question: Запись занимает 16 байт. Каков объём 700 записей без файловых накладных расходов?
    answer: 11200
    unit: байт
    tolerance_percent: 1
    hint: >-
      V = N·B; N — число записей, B — байтов на запись. Файловая система требует дополнительного
      места.
    explanation: "700×16 = 11\_200 байт."
    id: mcu-mcu-what-1
    lesson: mcu-what
    difficulty: 1
