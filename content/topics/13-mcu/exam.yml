  - type: single
    question: При разборе задачи «Тактирование» какой вывод обоснован?
    options:
      - Для любого кварца всегда нужны ровно 22 пФ
      - CL равна простой сумме C1+C2
      - Нагрузочные конденсаторы рассчитывают с учётом паразитной ёмкости.
    answer: 2
    hint: >-
      Размести кварц и конденсаторы рядом с выводами, коротко и симметрично. Сверь CL и режим
      генератора конкретного МК.
    explanation: >-
      Нагрузочные конденсаторы рассчитывают с учётом паразитной ёмкости. Процессору нужен источник
      тактов. Внутренний RC прост, но менее точен; кварц даёт более стабильную частоту при
      правильной нагрузочной ёмкости. Два конденсатора вместе с паразитной ёмкостью образуют
      CL=C1C2/(C1+C2)+Cпараз. Номиналы нельзя выбирать только по частоте кварца. Ошибочные варианты:
      Для любого кварца всегда нужны ровно 22 пФ; CL равна простой сумме C1+C2. Они не учитывают
      описанный принцип.
    id: mcu-clock-crystal-0
    lesson: clock-crystal
    difficulty: 1
  - type: numeric
    question: Нагрузочная ёмкость кварца CL = 17 пФ, паразитная 2 пФ, C1=C2. Найди каждый конденсатор.
    answer: 30
    unit: пФ
    tolerance_percent: 1
    hint: CL = C1C2/(C1+C2)+Cпараз. При C1=C2=C получаем C=2(CL−Cпараз). Пико = 10⁻¹².
    explanation: 2×(17−2) = 30 пФ.
    id: mcu-clock-crystal-1
    lesson: clock-crystal
    difficulty: 1
