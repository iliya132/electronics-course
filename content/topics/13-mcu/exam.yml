id: exam-mcu
topic: mcu
pass_percent: 70
questions_per_attempt: 10
questions:
  - id: "mc-001"
    lesson: "mcu-what"
    difficulty: 1
    type: "single"
    question: "В каком блоке МК обычно хранится программа?"
    options:
      - "Во Flash"
      - "В RAM"
      - "В регистрах ШИМ"
    answer: 0
    explanation: "Flash энергонезависима и хранит код."
  - id: "mc-002"
    lesson: "mcu-what"
    difficulty: 2
    type: "numeric"
    question: "Во Flash 16 КБ. Сколько это байт (1 КБ = 1024)?"
    answer: 16384
    unit: "байт"
    tolerance_percent: 1
    explanation: "16 · 1024 = 16 384."
  - id: "mc-003"
    lesson: "mcu-what"
    difficulty: 2
    type: "single"
    question: "Чем ESP32 отличается от ATmega328P?"
    options:
      - "Wi-Fi и Bluetooth, питание 3,3 В, 32-разрядные ядра"
      - "Только меньшей памятью"
      - "Отсутствием Flash"
    answer: 0
    explanation: "ESP32 — 32-битный МК с радиомодулями."
  - id: "mc-004"
    lesson: "mcu-what"
    difficulty: 2
    type: "numeric"
    question: "Экранный буфер 128×32 при 1 бите на пиксель. Сколько байт?"
    answer: 512
    unit: "байт"
    tolerance_percent: 1
    explanation: "128·32/8 = 512."
  - id: "mc-005"
    lesson: "gpio"
    difficulty: 2
    type: "numeric"
    question: "Светодиод 8 мА, предел вывода 20 мА. Сколько светодиодов (целое число) можно подключить к одному выводу?"
    answer: 2
    unit: "шт"
    tolerance_percent: 1
    explanation: "20/8 = 2,5 → 2."
  - id: "mc-006"
    lesson: "gpio"
    difficulty: 1
    type: "single"
    question: "Какой режим вывода тянет линию только к нулю?"
    options:
      - "Открытый сток"
      - "Push-pull"
      - "Вход с подтяжкой"
    answer: 0
    explanation: "У открытого стока работает только нижний ключ."
  - id: "mc-007"
    lesson: "gpio"
    difficulty: 2
    type: "single"
    question: "Что произойдёт при подаче 5 В на вывод МК с питанием 3,3 В?"
    options:
      - "Откроется защитный диод, вывод может выйти из строя"
      - "Ничего"
      - "Вывод станет выходом"
    answer: 0
    explanation: "Напряжение выше питания открывает защитный диод."
  - id: "mc-008"
    lesson: "gpio"
    difficulty: 2
    type: "numeric"
    question: "Резистор 470 Ом, питание 5 В, Vf = 2 В. Ток светодиода, мА?"
    answer: 6.4
    unit: "мА"
    tolerance_percent: 3
    explanation: "3/470 ≈ 6,4 мА."
  - id: "mc-009"
    lesson: "power-pins"
    difficulty: 1
    type: "single"
    question: "Какая развязка ставится у выводов VCC и GND?"
    options:
      - "Керамический конденсатор 100 нФ"
      - "Резистор 100 Ом"
      - "Диод"
    answer: 0
    explanation: "Конденсатор даёт локальный запас заряда."
  - id: "mc-010"
    lesson: "power-pins"
    difficulty: 2
    type: "numeric"
    question: "LC-фильтр AVCC: L = 10 мкГн, C = 1 мкФ. Частота среза f = 1/(2π√(LC)), кГц?"
    answer: 50.3
    unit: "кГц"
    tolerance_percent: 3
    explanation: "√(10⁻⁵·10⁻⁶) = 3,16·10⁻⁶; f ≈ 50,3 кГц."
  - id: "mc-011"
    lesson: "power-pins"
    difficulty: 2
    type: "single"
    question: "Почему ATmega328P на 16 МГц нельзя питать от 3,3 В?"
    options:
      - "По даташиту при 2,7–4,5 В допустимо до 10 МГц"
      - "Он не включится"
      - "Нужно 12 В"
    answer: 0
    explanation: "Предельная частота зависит от питания."
  - id: "mc-012"
    lesson: "power-pins"
    difficulty: 1
    type: "single"
    question: "Для чего служит схема Brown-out Detection (BOD)?"
    options:
      - "Сбрасывает МК при просадке питания"
      - "Повышает питание"
      - "Меняет частоту"
    answer: 0
    explanation: "Защита от работы на недопустимо низком питании."
