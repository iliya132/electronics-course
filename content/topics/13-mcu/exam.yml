    lesson: "clock-crystal"
    difficulty: 2
    type: "numeric"
    question: "Кварц CL = 14 пФ, Cпар = 4 пФ. Каков номинал C1 = C2, пФ?"
    answer: 20
    unit: "пФ"
    tolerance_percent: 2
    explanation: "2·(14 − 4) = 20 пФ."
