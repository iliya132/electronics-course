    question: При разборе задачи «Прерывания» какой вывод обоснован?
    options:
      - volatile делает любую многобайтную операцию атомарной
      - Длительный delay в ISR не влияет на остальные события
      - В обработчике прерывания полезно фиксировать событие и быстро возвращаться.
    answer: 2
    hint: >-
      Учитывай дребезг кнопки и частоту событий. Не выполняй долгие задержки, сетевые запросы и
      тяжёлый вывод в ISR.
    explanation: >-
      В обработчике прерывания полезно фиксировать событие и быстро возвращаться. Короткий импульс
      может пройти между двумя чтениями входа. Прерывание вызывает обработчик по событию. Обработчик
      должен быть коротким: записать флаг или данные, а длительную работу выполнить в основном
      цикле. Общие переменные требуют учёта атомарности; volatile само по себе не делает операции
      атомарными. Ошибочные варианты: volatile делает любую многобайтную операцию атомарной;
      Длительный delay в ISR не влияет на остальные события. Они не учитывают описанный принцип.
    id: mcu-interrupts-0
    lesson: interrupts
    difficulty: 1
  - type: numeric
    question: Частота сигнала 350 Гц. Чему равен период в миллисекундах?
    answer: 2.857142857142857
    unit: мс
    tolerance_percent: 1
    hint: T = 1/f; T в с, f в Гц. Для миллисекунд умножь результат на 1000.
    explanation: 1000/350 = 2,85714 мс.
    id: mcu-interrupts-1
    lesson: interrupts
    difficulty: 1
