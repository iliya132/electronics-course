    question: При разборе задачи «Подключение аналоговых датчиков» какой вывод обоснован?
    options:
      - Усреднение устраняет любую систематическую ошибку
      - Любое сопротивление датчика линейно связано с температурой
      - Калибровка исправляет модель по известным точкам, усреднение решает другую задачу.
    answer: 2
    hint: >-
      Измерь опорные точки, сохрани коэффициенты и проверь промежуточную точку. Для NTC используй
      фактическую β и не путай верхнее и нижнее плечо.
    explanation: >-
      Калибровка исправляет модель по известным точкам, усреднение решает другую задачу. Сырой код
      датчика ещё не является температурой. NTC требует нелинейного преобразования сопротивления,
      потенциометр — масштабирования, фоторезистор — эмпирической калибровки. Усреднение снижает
      независимый шум, но не исправляет постоянное смещение и неверную модель. Ошибочные варианты:
      Усреднение устраняет любую систематическую ошибку; Любое сопротивление датчика линейно связано
      с температурой. Они не учитывают описанный принцип.
    id: arduino-sensors-analog-0
    lesson: sensors-analog
    difficulty: 1
