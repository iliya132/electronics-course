  - type: single
    question: При разборе задачи «Кнопка» какой вывод обоснован?
    options:
      - При INPUT_PULLUP кнопка на GND обычно активна уровнем LOW.
      - Нажатие такой кнопки создаёт HIGH
      - Одно нажатие гарантирует один электрический фронт
    answer: 0
    hint: >-
      Не оставляй вход плавающим. Измеряй время устойчивости через millis и проверяй переход
      состояния, если нужно одно событие на нажатие.
    explanation: >-
      При INPUT_PULLUP кнопка на GND обычно активна уровнем LOW. Один нажим кнопки может дать много
      фронтов. Механические контакты дребезжат; INPUT_PULLUP задаёт высокий уровень без нажатия, а
      кнопка на GND создаёт LOW. Программный фильтр принимает изменение после устойчивого интервала.
      Ошибочные варианты: Нажатие такой кнопки создаёт HIGH; Одно нажатие гарантирует один
      электрический фронт. Они не учитывают описанный принцип.
    id: arduino-digital-input-button-0
    lesson: digital-input-button
    difficulty: 1
  - type: numeric
