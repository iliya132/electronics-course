    question: При разборе задачи «Serial» какой вывод обоснован?
    options:
      - Serial.print не занимает времени и памяти
      - Скорость монитора и Serial.begin должна совпадать.
      - Любой текст автоматически декодируется при любой скорости
    answer: 1
    hint: >-
      Печатай метку, значение и единицу в понятном формате. Для графика выбирай постоянный интервал
      и избегай больших задержек вывода.
    explanation: >-
      Скорость монитора и Serial.begin должна совпадать. Отладочный текст показывает, что происходит
      внутри программы. Serial.begin задаёт скорость; монитор должен использовать ту же. Чрезмерный
      вывод может блокировать выполнение, а плоттер ожидает понятный числовой формат. Текст и
      двоичные данные нельзя путать. Ошибочные варианты: Любой текст автоматически декодируется при
      любой скорости; Serial.print не занимает времени и памяти. Они не учитывают описанный принцип.
    id: arduino-serial-debug-0
    lesson: serial-debug
    difficulty: 1
  - type: numeric
    question: UART 8N1, 9600 бод, 70 байт без пауз. Сколько миллисекунд занимает передача?
    answer: 72.91666666666667
    unit: мс
    tolerance_percent: 1
    hint: '8N1: один стартовый + восемь информационных + один стоповый = 10 бит/байт. t = 10N/baud.'
    explanation: 10×70/9600×1000 = 72,9167 мс.
    id: arduino-serial-debug-1
    lesson: serial-debug
    difficulty: 1
