  - type: single
    question: При разборе задачи «Платформы и IDE» какой вывод обоснован?
    options:
      - Любой профиль Uno подходит любой плате семейства
      - Любой USB-кабель передаёт данные
      - Профиль платы в IDE должен соответствовать конкретной аппаратной модели.
    answer: 2
    hint: >-
      Установи совместимое ядро платы, выбери порт и загрузи штатный Blink. Если порта нет, проверь
      кабель данных и драйвер именно установленного USB-моста.
    explanation: >-
      Профиль платы в IDE должен соответствовать конкретной аппаратной модели. Готовая плата
      сокращает путь от схемы до программы. Uno R3 и классический Nano используют ATmega328P, Mega
      имеет больше выводов и памяти, Pro Mini обычно требует внешнего USB-UART. Названия Nano и Uno
      охватывают разные поколения, поэтому выбирай точную плату и ядро в IDE. Ошибочные варианты:
      Любой профиль Uno подходит любой плате семейства; Любой USB-кабель передаёт данные. Они не
      учитывают описанный принцип.
    id: arduino-arduino-intro-0
    lesson: arduino-intro
    difficulty: 1
  - type: numeric
    question: Запись занимает 16 байт. Каков объём 700 записей без файловых накладных расходов?
    answer: 11200
    unit: байт
    tolerance_percent: 1
    hint: >-
      V = N·B; N — число записей, B — байтов на запись. Файловая система требует дополнительного
      места.
    explanation: "700×16 = 11\_200 байт."
    id: arduino-arduino-intro-1
    lesson: arduino-intro
    difficulty: 1
