      Для надёжного охлаждения нужна обработка неисправности датчика. Вентилятор будет ускоряться
      при нагреве датчика. Arduino вычисляет температуру и задаёт заполнение PWM на внешнем
      MOSFET-ключе; минимальный рабочий режим должен обеспечивать запуск. Ошибочные варианты:
      Сломанный датчик всегда должен выключать охлаждение; Любой вентилятор устойчиво запускается от
      сколь угодно малого PWM. Они не учитывают описанный принцип.
