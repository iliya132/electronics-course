  - type: single
    question: При разборе задачи «Первая программа» какой вывод обоснован?
    options:
      - setup выполняется перед каждой итерацией loop
      - Период мигания включает время высокого и низкого уровней.
      - Частота определяется только первой задержкой
    answer: 1
    hint: >-
      Сначала меняй одну длительность и сравни период с суммой включённого и выключенного времени.
      Используй LED_BUILTIN для встроенного индикатора.
    explanation: >-
      Период мигания включает время высокого и низкого уровней. Первое мигание проверяет всю цепочку
      загрузки. setup выполняется один раз после сброса, loop повторяется. pinMode задаёт режим,
      digitalWrite — логический уровень, delay останавливает обычное выполнение на указанное время.
      Ошибка компиляции отличается от ошибки загрузки. Ошибочные варианты: Частота определяется
      только первой задержкой; setup выполняется перед каждой итерацией loop. Они не учитывают
      описанный принцип.
    id: arduino-blink-program-0
    lesson: blink-program
    difficulty: 1
  - type: numeric
    question: LED включён 700 мс и выключен 200 мс в цикле. Найди частоту мигания.
    answer: 1.1111111111111112
    unit: Гц
    tolerance_percent: 1
    hint: T = tвкл+tвыкл; f=1/T. При длительностях в мс f=1000/(tвкл+tвыкл).
    explanation: 1000/(700+200) = 1,11111 Гц.
    id: arduino-blink-program-1
    lesson: blink-program
    difficulty: 1
