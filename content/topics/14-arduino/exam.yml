    question: 'При разборе задачи «Без `delay()`: `millis()` и конечный автомат» какой вывод обоснован?'
    options:
      - Конечный автомат хранит состояние и проверяет время без блокирующего ожидания.
      - Для параллельных задач достаточно длинного delay
      - Переполнение millis делает вычитание unsigned всегда неверным
    answer: 0
    hint: >-
      Каждую итерацию быстро опрашивай события и проверяй сроки. Не смешивай signed int с
      результатом millis.
    explanation: >-
