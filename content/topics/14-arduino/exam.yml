    question: При разборе задачи «Логгер тока и энергии INA219» какой вывод обоснован?
    options:
      - Одно мгновенное значение тока равно расходу энергии за час
      - INA219 допускает любое напряжение измеряемой цепи
      - Энергию вычисляют интегрированием мощности по фактическому времени.
    answer: 2
    hint: >-
      Сверь нулевой ток и коэффициент калибровки, затем сравни одну точку с мультиметром. Не
      превышай диапазон модуля.
    explanation: >-
      Энергию вычисляют интегрированием мощности по фактическому времени. Запишем ток и напряжение
      во времени и оценим энергию. INA219 измеряет шунт и напряжение шины; допустимый диапазон
      зависит от микросхемы и шунта модуля. Энергию получают суммой P·Δt, учитывая единицы.
      Ошибочные варианты: Одно мгновенное значение тока равно расходу энергии за час; INA219
