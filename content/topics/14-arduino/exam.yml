      Питай привод от подходящего источника с учётом пускового тока, соединяя земли. Не бери силовой
      ток с GPIO и не рассчитывай на слабую линию 5 В платы.
    explanation: >-
      Сигнальный GPIO управляет приводом, а силовое питание подаёт энергию. Сервопривод может
      перезапустить плату при старте. Сигнальный импульс задаёт положение, а энергия поступает по
      отдельному силовому питанию. Servo-библиотека использует таймеры; мотор постоянного тока
      требует драйвера. Общая земля нужна для неизолированного сигнала. Ошибочные варианты:
      Сервопривод питается от сигнального вывода; Раздельное питание всегда требует разъединить
      сигнальные земли. Они не учитывают описанный принцип.
