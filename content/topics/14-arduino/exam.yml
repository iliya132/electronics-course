      Не записывай EEPROM на каждой итерации loop. Добавь версию структуры и разумные значения по
      умолчанию при повреждённых данных.
    explanation: >-
      Энергонезависимую память записывают по необходимости с учётом ресурса. Настройку хочется
      сохранить после выключения. EEPROM хранит данные без питания, но имеет конечный ресурс
      перезаписи. Библиотеки скрывают детали, однако их API, версия и поддерживаемые платы
      различаются. Для сохранения используй update или запись только при изменении, а также
      проверяемый формат. Ошибочные варианты: EEPROM выдерживает бесконечные записи; Любая
      библиотека одинаково работает на всех архитектурах. Они не учитывают описанный принцип.
