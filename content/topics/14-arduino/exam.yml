    question: При разборе задачи «analogRead/analogWrite» какой вывод обоснован?
    options:
      - Любой цифровой вывод Uno поддерживает analogWrite как ЦАП
      - map защищает от выхода сигнала за диапазон
      - analogWrite на Uno формирует ШИМ, а не непрерывное аналоговое напряжение.
    answer: 2
    hint: >-
      Проверь PWM-метку вывода и диапазоны 0…1023/0…255. Для аналогового выхода нужен фильтр или
      отдельный ЦАП.
    explanation: >-
      analogWrite на Uno формирует ШИМ, а не непрерывное аналоговое напряжение. analogRead и
      analogWrite на Uno делают разные вещи. Первый возвращает 10-битный код АЦП, второй обычно
      задаёт 8-битное заполнение ШИМ на специальных выводах. map выполняет целочисленное линейное
      преобразование и не ограничивает вход автоматически. Ошибочные варианты: Любой цифровой вывод
      Uno поддерживает analogWrite как ЦАП; map защищает от выхода сигнала за диапазон. Они не
      учитывают описанный принцип.
    id: arduino-analog-pwm-0
    lesson: analog-pwm
    difficulty: 1
  - type: numeric
    question: >-
      Идеальный 10-битный АЦП имеет код 448 при Uref = 5 В. Найди нижнюю границу интервала этого
      кода.
    answer: 2.1875
    unit: В
    tolerance_percent: 1
    hint: Uниж = code·Uref/2ⁿ. Код задаёт интервал, а не бесконечно точное напряжение.
    explanation: 448×5/1024 = 2,1875 В.
    id: arduino-analog-pwm-1
    lesson: analog-pwm
    difficulty: 1
