    unit: мА
    tolerance_percent: 1
    hint: I = U/R. При U в В и R в кОм результат получается в мА.
    explanation: 3,3/7 = 0,471429 мА.
    id: arduino-digital-input-button-1
    lesson: digital-input-button
    difficulty: 1
