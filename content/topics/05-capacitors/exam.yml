  - type: single
    question: При разборе задачи «RC-цепь» какой вывод обоснован?
    options:
      - Удвоение C уменьшает время заряда вдвое
      - Постоянная времени RC задаёт скорость экспоненциального заряда.
      - Через одну τ конденсатор полностью заряжен
    answer: 1
    hint: >-
      Измеряй напряжение параллельно конденсатору. Начинай каждый опыт с одинакового начального
      заряда и учитывай входное сопротивление прибора.
    explanation: >-
      Постоянная времени RC задаёт скорость экспоненциального заряда. Напряжение конденсатора не
      скачет мгновенно при конечном токе. Резистор ограничивает зарядный ток, который уменьшается по
      мере заряда. Uc=Uист·(1−exp(−t/RC)), при разряде Uc=U0·exp(−t/RC). Через одну τ заряд
      достигает около 63,2 %, через три — 95,0 %, через пять — 99,3 %. Ошибочные варианты: Через
      одну τ конденсатор полностью заряжен; Удвоение C уменьшает время заряда вдвое. Они не
      учитывают описанный принцип.
    id: capacitors-rc-charge-0
    lesson: rc-charge
    difficulty: 1
