    question: При разборе задачи «Разделительная ёмкость» какой вывод обоснован?
    options:
      - Разделительный конденсатор требует пути задания DC-уровня после него.
      - После конденсатора вход может всегда оставаться плавающим
      - Конденсатор одинаково пропускает все частоты вплоть до DC
    answer: 0
    hint: >-
      Создай путь постоянного тока для входа принимающего каскада, например резистор смещения.
      Проверь полярность и максимальное напряжение на ёмкости.
    explanation: >-
      Разделительный конденсатор требует пути задания DC-уровня после него. Аудиосигнал нужно
      передать между каскадами с разным DC-смещением. Последовательный конденсатор вместе со входным
      сопротивлением образует ФВЧ. Постоянная составляющая после установления блокируется, но
      слишком низкие частоты ослабляются. При включении возможен переходный импульс. Ошибочные
      варианты: После конденсатора вход может всегда оставаться плавающим; Конденсатор одинаково
      пропускает все частоты вплоть до DC. Они не учитывают описанный принцип.
    id: capacitors-ac-coupling-0
    lesson: ac-coupling
    difficulty: 1
