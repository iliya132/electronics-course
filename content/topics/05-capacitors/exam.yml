    question: При разборе задачи «Накопительные (bulk) конденсаторы» какой вывод обоснован?
    options:
      - ESR не влияет на мгновенную просадку
      - >-
        Большая ёмкость уменьшает просадку короткого импульса, но не исправляет нехватку средней
        мощности.
      - Конденсатор любого размера питает нагрузку бесконечно
    answer: 1
    hint: >-
      Оцени длительность импульса и допустимую просадку, затем выбери ёмкость и ESR. Измеряй минимум
      напряжения у потребителя.
    explanation: >-
      Большая ёмкость уменьшает просадку короткого импульса, но не исправляет нехватку средней
      мощности. Мотор кратко просаживает общую линию питания. Накопительный конденсатор отдаёт
      недостающий заряд, пока источник реагирует на изменение нагрузки. ΔU≈IΔt/C описывает идеальный
      вклад; дополнительный скачок I·ESR появляется мгновенно. Если нагрузка длительна, необходим
      более мощный источник. Ошибочные варианты: Конденсатор любого размера питает нагрузку
      бесконечно; ESR не влияет на мгновенную просадку. Они не учитывают описанный принцип.
    id: capacitors-bulk-caps-0
    lesson: bulk-caps
    difficulty: 1
