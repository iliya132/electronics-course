id: exam-capacitors
topic: capacitors
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Конденсатор и ёмкость ─────
  - id: k-001
    lesson: capacitor-basics
    difficulty: 1
    type: numeric
    formula:
      - "Q = C · U"
      - "C в фарадах, U в вольтах, Q в кулонах"
    question: "Конденсатор 470 мкФ заряжен до 10 В. Какой заряд на нём? Ответ в милликулонах."
    answer: 4.7
    unit: "мКл"
    tolerance_percent: 2
    explanation: "Q = C·U = 470 мкФ × 10 В = 4700 мкКл = 4,7 мКл."
  - id: k-002
    lesson: capacitor-basics
    difficulty: 1
    type: single
    question: "Как ведёт себя полностью заряженный конденсатор в цепи постоянного тока?"
    options:
      - "Как разрыв цепи: ток через него не идёт"
      - "Как короткое замыкание"
      - "Как резистор постоянного сопротивления"
    answer: 0
    explanation: "Когда напряжение на конденсаторе не меняется, ток I = C·ΔU/Δt равен нулю. Конденсатор перестаёт пропускать ток."
  - id: k-003
    lesson: capacitor-basics
    difficulty: 2
    type: numeric
    formula:
      - "E = C · U² / 2"
      - "C в фарадах, U в вольтах, E в джоулях"
    question: "Какую энергию хранит конденсатор 100 мкФ при напряжении 24 В? Ответ в миллиджоулях."
    answer: 28.8
    unit: "мДж"
    tolerance_percent: 2
    explanation: "E = C·U²/2 = 100·10⁻⁶ × 576 / 2 = 0,0288 Дж = 28,8 мДж."
  - id: k-004
    lesson: capacitor-basics
    difficulty: 2
    type: numeric
    formula:
      - "1 мкФ = 1000 нФ"
      - "нано → микро: ÷ 1000"
    question: "Переведи 220 нФ в микрофарады."
    answer: 0.22
    unit: "мкФ"
    tolerance_percent: 1
    explanation: "1 мкФ = 1000 нФ, значит, 220 нФ = 0,22 мкФ."
  - id: k-005
    lesson: capacitor-basics
    difficulty: 3
    type: numeric
    formula:
      - "E = C · U² / 2"
      - "C в фарадах, U в вольтах, E в джоулях"
      - "P = E / t"
    question: "Конденсатор 2200 мкФ заряжен до 5 В и разряжается в нагрузку за 10 мс. Какова средняя мощность? Ответ в ваттах."
    answer: 2.75
    unit: "Вт"
    tolerance_percent: 2
    explanation: "E = 0,0022 × 25 / 2 = 0,0275 Дж. P = E / t = 0,0275 / 0,01 = 2,75 Вт."
  # ───── RC-цепь ─────
  - id: k-006
    lesson: rc-charge
    difficulty: 1
    type: numeric
    formula:
      - "τ = R · C"
      - "кОм · мкФ = мс; МОм · мкФ = с"
    question: "Найди постоянную времени RC-цепи при R = 22 кОм и C = 47 мкФ. Ответ в секундах."
    answer: 1.034
    unit: "с"
    tolerance_percent: 2
    explanation: "τ = R·C = 22 кОм × 47 мкФ = 1034 мс ≈ 1,03 с (кОм × мкФ = мс)."
  - id: k-007
    lesson: rc-charge
    difficulty: 1
    type: single
    question: "До какой доли от напряжения источника заряжается конденсатор через резистор за время τ?"
    options:
      - "Примерно до 63 %"
      - "Примерно до 37 %"
      - "Полностью, до 100 %"
    answer: 0
    explanation: "За время τ при заряде достигается 1 − e⁻¹ = 63 %. Остаток 37 % — это доля при разряде за то же время."
  - id: k-008
    lesson: rc-charge
    difficulty: 2
    type: numeric
    formula:
      - "Разряд: U = U₀ · e^(−t/τ)"
      - "за τ остаётся 37 %, за 2τ — 14 %, за 3τ — 5 %"
    question: "Конденсатор заряжен до 9 В и разряжается через резистор. Какое напряжение будет на нём через 3τ? Ответ в вольтах."
    answer: 0.45
    unit: "В"
    tolerance_percent: 3
    explanation: "U = 9 × e⁻³ = 9 × 0,0498 = 0,448 В ≈ 0,45 В, то есть около 5 % от начального."
  - id: k-009
    lesson: rc-charge
    difficulty: 2
    type: numeric
    formula:
      - "t = τ · ln(E / (E − Uпорог))"
      - "для 50 %: t ≈ 0,693 · τ"
    question: "τ = 20 мс. Через какое время напряжение на заряжающемся конденсаторе достигнет 50 % от E? Ответ в миллисекундах."
    answer: 13.9
    unit: "мс"
    tolerance_percent: 2
    explanation: "t = τ·ln 2 = 0,693 × 20 = 13,86 мс."
  - id: k-010
    lesson: rc-charge
    difficulty: 3
    type: numeric
    formula:
      - "R = τ / C"
      - "τ — в секундах, C — в фарадах, R — в омах"
    question: "Нужна постоянная времени 0,5 с при конденсаторе 47 мкФ. Какое сопротивление нужно? Ответ в килоомах."
    answer: 10.6
    unit: "кОм"
    tolerance_percent: 2
    explanation: "R = τ / C = 0,5 / 47·10⁻⁶ = 10 638 Ом ≈ 10,6 кОм. Ближайший стандартный — 10 кОм (τ = 0,47 с)."
  # ───── Типы конденсаторов ─────
  - id: k-011
    lesson: capacitor-types
    difficulty: 1
    type: single
    question: "Какие из этих конденсаторов поляризованные (у них есть «плюс» и «минус»)?"
    options:
      - "Алюминиевые электролитические"
      - "Керамические MLCC"
      - "Плёночные"
    answer: 0
    explanation: "Электролиты и танталовые конденсаторы поляризованы, и их нельзя включать обратной полярностью. Керамические и плёночные полярности не имеют."
  - id: k-012
    lesson: capacitor-types
    difficulty: 2
    type: numeric
    formula:
      - "C_эфф = C_ном · (доля сохранённой ёмкости)"
    question: "Керамический X5R 22 мкФ при рабочем напряжении сохраняет 55 % номинала. Какова эффективная ёмкость? Ответ в мкФ."
    answer: 12.1
    unit: "мкФ"
    tolerance_percent: 2
    explanation: "22 × 0,55 = 12,1 мкФ."
  - id: k-013
    lesson: capacitor-types
    difficulty: 2
    type: single
    question: "Какой тип конденсатора особенно чувствителен к перенапряжению и может при этом вспыхнуть?"
    options:
      - "Танталовый"
      - "Плёночный"
      - "C0G керамический"
    answer: 0
    explanation: "Танталовые конденсаторы при превышении напряжения и броске тока могут разрушаться с нагревом и возгоранием. Поэтому для них берут запас по напряжению не менее двукратного."
  - id: k-014
    lesson: capacitor-types
    difficulty: 3
    type: single
    question: "На линии 5 В поставлен керамический конденсатор X7R 10 мкФ, 6,3 В. Какая проблема вероятна?"
    options:
      - "Реальная ёмкость при 5 В окажется заметно меньше 10 мкФ"
      - "Конденсатор будет работать как индуктивность на постоянном токе"
      - "Ёмкость возрастёт вдвое"
    answer: 0
    explanation: "При смещении, близком к номиналу, у керамики с высоким εr ёмкость падает на десятки процентов. Остальные варианты физически неверны."
  # ───── Развязка ─────
  - id: k-015
    lesson: decoupling
    difficulty: 1
    type: single
    question: "Какой конденсатор по умолчанию ставят у каждого вывода питания микроконтроллера?"
    options:
      - "Керамический 100 нФ"
      - "Электролит 1000 мкФ"
      - "Керамический 10 пФ"
    answer: 0
    explanation: "Керамика 100 нФ имеет малые ESR и ESL и справляется с быстрыми бросками тока. 1000 мкФ слишком индуктивен, а 10 пФ слишком мал."
  - id: k-016
    lesson: decoupling
    difficulty: 2
    type: numeric
    formula:
      - "U = L · ΔI / Δt"
      - "L — в генри, Δt — в секундах"
    question: "Дорожка питания имеет индуктивность 30 нГн. Ток нарастает на 20 мА за 4 нс. Найди выброс напряжения. Ответ в вольтах."
    answer: 0.15
    unit: "В"
    tolerance_percent: 3
    explanation: "ΔI/Δt = 0,02 / 4·10⁻⁹ = 5·10⁶ А/с. ΔU = 30·10⁻⁹ × 5·10⁶ = 0,15 В."
  - id: k-017
    lesson: decoupling
    difficulty: 2
    type: numeric
    formula:
      - "ΔU = I · Δt / C"
    question: "Импульс тока 30 мА длится 3 нс, у вывода конденсатор 100 нФ. Какова просадка от разряда конденсатора? Ответ в милливольтах."
    answer: 0.9
    unit: "мВ"
    tolerance_percent: 3
    explanation: "ΔU = I·Δt / C = 0,03 × 3·10⁻⁹ / 10⁻⁷ = 9·10⁻⁴ В = 0,9 мВ."
  - id: k-018
    lesson: decoupling
    difficulty: 2
    type: numeric
    formula:
      - "f₀ = 1 / (2π · √(L · C))"
      - "L — в генри, C — в фарадах"
    question: "Найди резонансную частоту конденсатора 100 нФ с ESL 1,5 нГн. Ответ в мегагерцах."
    answer: 13
    unit: "МГц"
    tolerance_percent: 3
    explanation: "f = 1 / (2π√(L·C)) = 1 / (2π√(1,5·10⁻⁹ × 10⁻⁷)) = 1 / (2π × 1,225·10⁻⁸) ≈ 13 МГц."
  - id: k-019
    lesson: decoupling
    difficulty: 3
    type: single
    question: "Конденсатор 100 нФ поставлен на обратной стороне платы в 3 см от вывода питания. Почему такая развязка работает плохо?"
    options:
      - "Длинная дорожка к нему имеет индуктивность, и он не успевает отдавать ток быстрых импульсов"
      - "Конденсатор на обратной стороне платы теряет ёмкость"
      - "Развязка вообще не зависит от расстояния"
    answer: 0
    explanation: "При 10 нГн на сантиметр три сантиметра дают около 30 нГн, и на быстрых фронтах конденсатор «не виден» из-за индуктивности пути."
  # ───── Накопительные конденсаторы ─────
  - id: k-020
    lesson: bulk-caps
    difficulty: 1
    type: single
    question: "Где обычно размещают накопительный (bulk) конденсатор?"
    options:
      - "У входа питания платы и у стабилизаторов"
      - "Только вплотную к каждому выводу микросхемы"
      - "Только на землянной плоскости"
    answer: 0
    explanation: "Bulk закрывает миллисекундные пики потребления всей платы, поэтому его ставят у источника питания и стабилизаторов."
  - id: k-021
    lesson: bulk-caps
    difficulty: 2
    type: numeric
    formula:
      - "C = I · Δt / ΔU"
    question: "Импульс тока 0,4 А длится 100 мкс, допустимая просадка 0,2 В. Какая минимальная ёмкость нужна? Ответ в микрофарадах."
    answer: 200
    unit: "мкФ"
    tolerance_percent: 2
    explanation: "C = I·Δt / ΔU = 0,4 × 10⁻⁴ / 0,2 = 2·10⁻⁴ Ф = 200 мкФ."
  - id: k-022
    lesson: bulk-caps
    difficulty: 2
    type: numeric
    formula:
      - "ΔU = I · T / C"
      - "T — время между подзарядами"
    question: "Выпрямитель питает ток 0,3 А, интервал между подзарядами 10 мс, конденсатор 1000 мкФ. Каковы пульсации? Ответ в вольтах."
    answer: 3
    unit: "В"
    tolerance_percent: 2
    explanation: "ΔU = I·T / C = 0,3 × 0,01 / 0,001 = 3 В."
  - id: k-023
    lesson: bulk-caps
    difficulty: 3
    type: single
    question: "Через конденсатор с ESR 0,2 Ом проходит импульс тока 1 А. Какую добавку к просадке даёт ESR?"
    options:
      - "0,2 В"
      - "0,5 В"
      - "5 В"
    answer: 0
    explanation: "ΔU = I·ESR = 1 × 0,2 = 0,2 В. Она добавляется к просадке от разряда ёмкости."
  # ───── Разделительная ёмкость ─────
  - id: k-024
    lesson: ac-coupling
    difficulty: 1
    type: single
    question: "Что пропускает конденсатор, включённый последовательно в сигнальную линию?"
    options:
      - "Переменную составляющую сигнала, постоянную блокирует"
      - "Постоянную составляющую, переменную блокирует"
      - "Обе без изменений"
    answer: 0
    explanation: "Конденсатор блокирует постоянное напряжение и пропускает быстрые изменения."
  - id: k-025
    lesson: ac-coupling
    difficulty: 2
    type: numeric
    formula:
      - "fc = 1 / (2π · R · C)"
    question: "Вход с сопротивлением 47 кОм, разделительный конденсатор 100 нФ. Найди частоту среза в герцах."
    answer: 33.9
    unit: "Гц"
    tolerance_percent: 2
    explanation: "fc = 1 / (2π × 47 000 × 10⁻⁷) = 1 / 0,02953 ≈ 33,9 Гц."
  - id: k-026
    lesson: ac-coupling
    difficulty: 2
    type: single
    question: "Входное сопротивление, на которое нагружен разделительный конденсатор, увеличили вдвое. Как изменилась частота среза?"
    options:
      - "Уменьшилась вдвое"
      - "Увеличилась вдвое"
      - "Не изменилась"
    answer: 0
    explanation: "fc = 1 / (2πRC), поэтому при R вдвое больше fc вдвое меньше."
  - id: k-027
    lesson: ac-coupling
    difficulty: 3
    type: numeric
    formula:
      - "U_смещ = U_пит · R2 / (R1 + R2)"
    question: "Делитель смещения: верхний резистор 10 кОм до 3,3 В, нижний 22 кОм до земли. Какое напряжение смещения на входе? Ответ в вольтах."
    answer: 2.27
    unit: "В"
    tolerance_percent: 2
    explanation: "U = 3,3 × 22 / (10 + 22) = 72,6 / 32 = 2,27 В."
  # ───── Напряжение, ESR, срок службы ─────
  - id: k-028
    lesson: capacitor-ratings-esr
    difficulty: 1
    type: single
    question: "Какое минимальное номинальное напряжение выбрать для танталового конденсатора на линии 5 В?"
    options:
      - "10 В"
      - "6,3 В"
      - "5 В"
    answer: 0
    explanation: "Для тантала рабочее напряжение не более 50 % от номинала, поэтому 5 В требуют номинала 10 В."
  - id: k-029
    lesson: capacitor-ratings-esr
    difficulty: 2
    type: numeric
    formula:
      - "P = I² · ESR"
    question: "Ток пульсаций 1 А (действующий), ESR конденсатора 0,08 Ом. Какая мощность выделяется в конденсаторе? Ответ в ваттах."
    answer: 0.08
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P = I²·ESR = 1 × 0,08 = 0,08 Вт."
  - id: k-030
    lesson: capacitor-ratings-esr
    difficulty: 2
    type: numeric
    formula:
      - "L = L₀ · 2^((T₀ − T) / 10)"
      - "L₀ — срок службы при T₀, T — рабочая температура"
    question: "Электролит с паспортным сроком 1000 ч при 105 °C работает при 75 °C. Каков примерный срок службы? Ответ в часах."
    answer: 8000
    unit: "ч"
    tolerance_percent: 2
    explanation: "30 °C разницы — три удвоения: 1000 × 2³ = 8000 ч."
  - id: k-031
    lesson: capacitor-ratings-esr
    difficulty: 3
    type: single
    question: "У старого электролита вздулась крышка, а ёмкость упала вдвое. Что произошло внутри?"
    options:
      - "Электролит высох и разложился, ESR вырос, ёмкость упала"
      - "Конденсатор «заряжен» сверх нормы"
      - "Просто изменилась температура, это временно"
    answer: 0
    explanation: "Вздутие и потеря ёмкости — признаки разрушения электролита. ESR при этом растёт, и конденсатор нужно заменить."
  # ───── Проект: измерение ёмкости ─────
  - id: k-032
    lesson: measure-capacitance
    difficulty: 1
    type: numeric
    formula:
      - "τ = t (время падения до 37 %)"
      - "C = τ / R"
    question: "При разряде через R = 100 кОм напряжение упало до 37 % за 4,7 с. Какова ёмкость? Ответ в микрофарадах."
    answer: 47
    unit: "мкФ"
    tolerance_percent: 2
    explanation: "C = t / R = 4,7 / 100 000 = 4,7·10⁻⁵ Ф = 47 мкФ."
  - id: k-033
    lesson: measure-capacitance
    difficulty: 2
    type: single
    question: "Начальное напряжение конденсатора 5,00 В. До какого значения должно упасть напряжение, чтобы время считалось равным τ?"
    options:
      - "1,84 В"
      - "3,16 В"
      - "2,50 В"
    answer: 0
    explanation: "Порог 0,368·U₀ = 0,368 × 5 = 1,84 В. 3,16 В — это 63 % и относится к заряду, 2,5 В — половина."
  - id: k-034
    lesson: measure-capacitance
    difficulty: 2
    type: numeric
    formula:
      - "C_мин = C · (1 − допуск)"
    question: "Электролит 47 мкФ имеет допуск ±20 %. Какова наименьшая допустимая ёмкость? Ответ в микрофарадах."
    answer: 37.6
    unit: "мкФ"
    tolerance_percent: 1
    explanation: "47 × 0,8 = 37,6 мкФ."
  - id: k-035
    lesson: measure-capacitance
    difficulty: 3
    type: single
    question: "Почему метод «разряд через 100 кОм и секундомер» непригоден для керамики 100 нФ?"
    options:
      - "τ = 10 мс слишком мало для мультиметра и секундомера"
      - "Керамика не разряжается через резистор"
      - "У керамики нет ёмкости"
    answer: 0
    explanation: "τ = R·C = 100 кОм × 100 нФ = 10 мс: быстрее, чем мультиметр обновляет показания, а человек не успеет нажать секундомер. Для таких ёмкостей нужен осциллограф или другой метод."
