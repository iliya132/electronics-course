    question: При разборе задачи «Развязка (блокировочные) конденсаторы» какой вывод обоснован?
    options:
      - Один дальний электролит заменяет любую локальную керамику
      - Длинная дорожка к развязке не влияет на импульсы
      - Для развязки важны близость к выводам и малая петля тока.
    answer: 2
    hint: >-
      Ставь конденсатор между питанием и GND максимально близко к выводам, с коротким возвратом.
      Сравни шум осциллографом коротким земляным контактом щупа.
    explanation: >-
      Для развязки важны близость к выводам и малая петля тока. Микроконтроллер берёт ток короткими
      импульсами. Проводники имеют индуктивность и не успевают мгновенно доставить дополнительный
      ток. Локальный керамический конденсатор, часто 100 нФ, закрывает короткую петлю питания;
      накопительная ёмкость помогает на более длинных импульсах. ESL и ESR ограничивают идеальную
      модель. Ошибочные варианты: Один дальний электролит заменяет любую локальную керамику; Длинная
      дорожка к развязке не влияет на импульсы. Они не учитывают описанный принцип.
    id: capacitors-decoupling-0
    lesson: decoupling
    difficulty: 1
  - type: numeric
