    unit: с
    tolerance_percent: 1
    hint: τ = RC, если R в Ом и C в Ф. кило = 10³, микро = 10⁻⁶; их произведение даёт 10⁻³.
    explanation: 10000 × 70 × 10⁻⁶ = 0,7 с.
    id: capacitors-rc-charge-1
    lesson: rc-charge
    difficulty: 1
