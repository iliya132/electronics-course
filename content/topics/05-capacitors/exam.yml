  - type: single
    question: При разборе задачи «Конденсатор и ёмкость» какой вывод обоснован?
    options:
      - Идеальный конденсатор постоянно проводит DC-ток после заряда
      - Полярность электролита не влияет на безопасность
      - Энергия конденсатора растёт как квадрат напряжения.
    answer: 2
    hint: >-
      Перед измерением сопротивления или перестановкой разряди ёмкость через подходящий резистор и
      проверь остаточное напряжение.
    explanation: >-
      Энергия конденсатора растёт как квадрат напряжения. После отключения питания на конденсаторе
      может остаться напряжение. Две проводящие обкладки разделены диэлектриком; заряд связан с
      напряжением формулой Q=CU. Энергия E=CU²/2. Для идеального конденсатора i=C·dU/dt: он проводит
      ток изменения напряжения, а в установившемся DC ток равен нулю. Ошибочные варианты: Идеальный
      конденсатор постоянно проводит DC-ток после заряда; Полярность электролита не влияет на
      безопасность. Они не учитывают описанный принцип.
    id: capacitors-capacitor-basics-0
    lesson: capacitor-basics
    difficulty: 1
  - type: numeric
