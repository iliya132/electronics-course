    question: >-
      При разборе задачи «Рабочее напряжение, запас, ESR, ток пульсаций, температура и срок службы
      электролита (правило «−10 °C ×2»)» какой вывод обоснован?
    options:
      - Любая меньшая ESR улучшает любой стабилизатор
      - Правило ресурса точно одинаково для всех конденсаторов
      - Рабочее напряжение, ESR и ток пульсаций проверяют как отдельные параметры.
    answer: 2
    hint: >-
      Проверь допустимый RMS-ток пульсаций, температуру, напряжение и условия ресурса в
      документации. Слишком малая ESR иногда нарушает устойчивость старого стабилизатора.
    explanation: >-
      Рабочее напряжение, ESR и ток пульсаций проверяют как отдельные параметры. Электролит может
      нагреваться от пульсаций даже без превышения напряжения. Потери приблизительно равны
      Iпульс,rms²·ESR. Ресурс зависит от температуры; правило удвоения срока при снижении на 10 °C —
      грубая модель отдельных серий, не универсальная гарантия. Ошибочные варианты: Любая меньшая
      ESR улучшает любой стабилизатор; Правило ресурса точно одинаково для всех конденсаторов. Они
      не учитывают описанный принцип.
