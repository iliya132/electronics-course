  - type: single
    question: При разборе задачи «Измерение ёмкости по времени» какой вывод обоснован?
    options:
      - Ёмкость измеряют при подключённом внешнем питании в режиме омметра
      - По времени до 63,2 % питания можно оценить C≈t/R.
      - Время до любого напряжения всегда равно RC
    answer: 1
    hint: >-
      Сначала разряди конденсатор через резистор. Измерь время до порога и оцени погрешность
      секундомера и мультиметра.
    explanation: >-
      По времени до 63,2 % питания можно оценить C≈t/R. Оценим неизвестную ёмкость по скорости
      заряда. При известном сопротивлении время достижения 63,2 % питания примерно равно RC.
      Ошибочные варианты: Время до любого напряжения всегда равно RC; Ёмкость измеряют при
      подключённом внешнем питании в режиме омметра. Они не учитывают описанный принцип.
    id: capacitors-measure-capacitance-0
    lesson: measure-capacitance
