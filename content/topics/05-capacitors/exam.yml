  - type: single
    question: При разборе задачи «Типы конденсаторов» какой вывод обоснован?
    options:
      - Эффективная ёмкость некоторых керамических конденсаторов падает под DC-смещением.
      - Номинальная ёмкость гарантирована при любом напряжении
      - Полоска на любом типе конденсатора обозначает один и тот же вывод
    answer: 0
    hint: >-
      Выбирай тип по рабочему напряжению, температуре, частоте, ESR и требуемой эффективной ёмкости.
      Сверяй полярность по документации корпуса.
    explanation: >-
      Эффективная ёмкость некоторых керамических конденсаторов падает под DC-смещением. Одинаковая
      надпись ёмкости не означает одинаковое поведение. Керамика C0G стабильна, X7R/X5R может терять
      эффективную ёмкость при постоянном смещении. Электролиты дают большую ёмкость с полярностью и
      ESR, тантал требует строгого режима, плёнка удобна для стабильных сигналов. Суперконденсатор
      хранит много заряда при малом допустимом напряжении. Ошибочные варианты: Номинальная ёмкость
      гарантирована при любом напряжении; Полоска на любом типе конденсатора обозначает один и тот
      же вывод. Они не учитывают описанный принцип.
    id: capacitors-capacitor-types-0
    lesson: capacitor-types
    difficulty: 1
