    question: При разборе задачи «RS-485 и CAN (обзор)» какой вывод обоснован?
    options:
      - Терминация ставится на концах магистрали, а не на каждом узле.
      - RS-485 и CAN являются одним протоколом
      - Чем больше терминаторов, тем надёжнее сигнал
    answer: 0
    hint: >-
      Не добавляй терминатор у каждого узла. Для двух 120 Ом параллельно измерение обесточенной
      линии между проводами часто даёт около 60 Ом при отсутствии других влияний.
    explanation: >-
      Терминация ставится на концах магистрали, а не на каждом узле. Длинный кабель подвержен
      помехам и разности потенциалов. RS-485 и CAN используют дифференциальные линии, но отличаются
      протоколом и правилами доступа. Терминаторы около волнового сопротивления, часто 120 Ом,
      ставят на концах линейной магистрали; ответвления делают короткими. Ошибочные варианты: RS-485
      и CAN являются одним протоколом; Чем больше терминаторов, тем надёжнее сигнал. Они не
      учитывают описанный принцип.
    id: buses-rs485-can-0
    lesson: rs485-can
    difficulty: 1
