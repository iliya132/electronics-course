    question: При разборе задачи «Логический анализатор и осциллограф» какой вывод обоснован?
    options:
      - Вход дешёвого анализатора выдерживает любое напряжение
      - Логический декодер не показывает все аналоговые проблемы фронта.
      - Успешное декодирование доказывает отсутствие выбросов
    answer: 1
    hint: >-
      Начни с сигнала такта, затем адреса или CS, затем подтверждения и данных. Общий провод
      измерителя должен быть подключён безопасно.
    explanation: >-
      Логический декодер не показывает все аналоговые проблемы фронта. Нужно узнать, почему датчик
      не отвечает. Логический анализатор показывает цифровые уровни и декодирует протокол,
      осциллограф показывает реальную форму напряжения, звон и фронты. Частоту выборки анализатора
      выбирают с запасом относительно скорости, а пороги и допустимые напряжения проверяют отдельно.
      Ошибочные варианты: Успешное декодирование доказывает отсутствие выбросов; Вход дешёвого
      анализатора выдерживает любое напряжение. Они не учитывают описанный принцип.
    id: buses-logic-analyzer-0
    lesson: logic-analyzer
    difficulty: 1
