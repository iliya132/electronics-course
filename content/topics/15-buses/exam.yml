    question: При разборе задачи «I²C» какой вывод обоснован?
    options:
      - Сканер гарантирует исправность всех регистров датчика
      - Подтяжки I²C выбирают между ограничениями по току нуля и времени фронта.
      - 4,7 кОм подходит любой длине и скорости шины
    answer: 1
    hint: >-
      Просканируй адреса и проверь реальные подтяжки, включая уже установленные на модулях.
      Параллельные подтяжки уменьшают суммарное сопротивление.
    explanation: >-
      Подтяжки I²C выбирают между ограничениями по току нуля и времени фронта. Несколько датчиков
      разделяют две линии. SDA передаёт данные, SCL — такт; участники используют открытый сток,
      поэтому нужны подтяжки. Адрес выбирает устройство, ACK подтверждает этап передачи. Скорость
      ограничивают ёмкость шины и время фронта; 4,7 кОм — частый, но не универсальный номинал.
      Ошибочные варианты: 4,7 кОм подходит любой длине и скорости шины; Сканер гарантирует
      исправность всех регистров датчика. Они не учитывают описанный принцип.
    id: buses-i2c-0
    lesson: i2c
    difficulty: 1
  - type: numeric
    question: >-
      Упрощённая RC-модель I²C: Cшины = 350 пФ, tr,max = 1000 нс. Найди максимальную подтяжку R =
      tr/(0,8473C) в кОм.
    answer: 3.372055773802499
    unit: кОм
    tolerance_percent: 1
    hint: Rmax = tr,max/(0,8473C). Rmin = (VDD−VOLmax)/IOL; допустимый диапазон должен быть непустым.
    explanation: 1000×10⁻⁹/(0,8473×350×10⁻¹²)/1000 = 3,37206 кОм.
    id: buses-i2c-1
    lesson: i2c
    difficulty: 1
