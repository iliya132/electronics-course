    question: При разборе задачи «CSV-логгер на SD» какой вывод обоснован?
    options:
      - Закрытие файла важно для сохранения буферизованных данных.
      - SD-карта безопасно принимает 5 В напрямую на сигналы
      - millis автоматически содержит календарную дату
    answer: 0
    hint: >-
      Используй модуль с подходящим преобразованием уровней для Uno. Время millis — время от старта,
      а для календарной даты нужен RTC.
    explanation: >-
      Закрытие файла важно для сохранения буферизованных данных. Сохраним температуру и время работы
      в CSV на SD. Карта требует корректного питания, уровней SPI и закрытия файла для сброса
      буферов. Отключение во время записи может повредить файл. Ошибочные варианты: SD-карта
      безопасно принимает 5 В напрямую на сигналы; millis автоматически содержит календарную дату.
      Они не учитывают описанный принцип.
