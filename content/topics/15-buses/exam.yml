    question: При разборе задачи «OLED по I²C» какой вывод обоснован?
    options:
      - Подтяжки OLED всегда совместимы с любой платой
      - Ответ на адрес подтверждает присутствие устройства, но не правильную настройку дисплея.
      - Любой найденный адрес означает исправную картинку
    answer: 1
    hint: Сначала проверь питание и уровни подтяжек, затем адрес и размер экрана.
    explanation: >-
      Ответ на адрес подтверждает присутствие устройства, но не правильную настройку дисплея.
      Подключим OLED и убедимся в его адресе до вывода изображения. Сканер проверит ответ на адрес,
      после чего библиотека отправит команды контроллеру. Ошибочные варианты: Любой найденный адрес
      означает исправную картинку; Подтяжки OLED всегда совместимы с любой платой. Они не учитывают
      описанный принцип.
