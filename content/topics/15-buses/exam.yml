  - type: single
    question: При разборе задачи «SPI» какой вывод обоснован?
    options:
      - Режим SPI должен совпадать у ведущего и ведомого.
      - SPI автоматически назначает адрес каждому устройству
      - CS не влияет на работу общей MISO
    answer: 0
    hint: >-
      Проверь режим, порядок битов, максимальную частоту и уровень CS. Не выбранные устройства
      должны освобождать общую MISO.
    explanation: >-
      Режим SPI должен совпадать у ведущего и ведомого. Дисплей или память могут передавать данные
      быстрее простой двухпроводной шины. SPI использует SCK, линии MOSI/MISO и выбор CS. CPOL и
      CPHA задают полярность такта и момент выборки. В режиме 0 такт покоится низко, данные
      считываются по нарастающему фронту. Ошибочные варианты: SPI автоматически назначает адрес
      каждому устройству; CS не влияет на работу общей MISO. Они не учитывают описанный принцип.
    id: buses-spi-0
    lesson: spi
    difficulty: 1
  - type: numeric
