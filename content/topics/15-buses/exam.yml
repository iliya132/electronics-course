    question: При разборе задачи «USB (обзор)» какой вывод обоснован?
    options:
      - Любой USB-C разъём подключён к нативному USB микроконтроллера
      - USB-UART всегда работает как HID-клавиатура
      - Разъём, электрический интерфейс и USB-класс являются разными уровнями описания.
    answer: 2
    hint: >-
      Проверь, какие линии разъёма идут к USB-контроллеру, а какие только питают плату. Соблюдай
      правила дифференциальной пары и ESD-защиты.
    explanation: >-
      Разъём, электрический интерфейс и USB-класс являются разными уровнями описания. USB-порт
      сначала узнаёт устройство, а потом обменивается данными. Enumeration включает обнаружение и
      чтение дескрипторов; классы CDC и HID описывают разные функции. Нативный USB на некоторых
      ESP32-S2/S3 отличается от внешнего USB-UART моста. Разъём USB-C сам по себе не означает
      наличие контроллера данных. Ошибочные варианты: Любой USB-C разъём подключён к нативному USB
      микроконтроллера; USB-UART всегда работает как HID-клавиатура. Они не учитывают описанный
