    question: При разборе задачи «1-Wire и DS18B20» какой вывод обоснован?
    options:
      - Любой длинный провод работает без подтяжки
      - DS18B20 выдаёт новое точное значение сразу после команды
      - Паразитное питание 1-Wire имеет дополнительные требования к линии.
    answer: 2
    hint: >-
      Для первого опыта выбери отдельное питание и проверенную библиотеку. Проверь время
      преобразования, CRC и отсутствие значения ошибки.
    explanation: >-
      Паразитное питание 1-Wire имеет дополнительные требования к линии. Несколько цифровых
      термометров могут работать на одной линии данных. 1-Wire использует временные слоты и
      идентификатор устройства; линия имеет подтяжку. DS18B20 может питаться отдельно или паразитно,
      но паразитное питание требует условий сильной подтяжки во время преобразования. Ошибочные
      варианты: Любой длинный провод работает без подтяжки; DS18B20 выдаёт новое точное значение
      сразу после команды. Они не учитывают описанный принцип.
    id: buses-one-wire-0
    lesson: one-wire
    difficulty: 1
