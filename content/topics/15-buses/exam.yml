    question: При разборе задачи «UART» какой вывод обоснован?
    options:
      - UART всегда требует отдельную линию такта
      - RX соединяют с RX независимо от назначения
      - UART 8N1 тратит десять битовых интервалов на один байт данных.
    answer: 2
    hint: >-
      Проверь уровень сигнала, baud, количество битов и общую землю. Неправильная скорость часто
      даёт бессмысленные символы.
    explanation: >-
      UART 8N1 тратит десять битовых интервалов на один байт данных. Две платы обмениваются байтами
      без отдельного такта. UART согласует скорость и формат, например 8N1: старт, восемь бит
      данных, стоп. TX одной стороны подключают к RX другой, земли объединяют при отсутствии
      изоляции. USB-UART CH340/CP2102/FT232 преобразует интерфейс, но не гарантирует нужные
      логические уровни. Ошибочные варианты: UART всегда требует отдельную линию такта; RX соединяют
      с RX независимо от назначения. Они не учитывают описанный принцип.
    id: buses-uart-0
    lesson: uart
    difficulty: 1
  - type: numeric
    question: UART 8N1, 9600 бод, 70 байт без пауз. Сколько миллисекунд занимает передача?
    answer: 72.91666666666667
    unit: мс
    tolerance_percent: 1
    hint: '8N1: один стартовый + восемь информационных + один стоповый = 10 бит/байт. t = 10N/baud.'
    explanation: 10×70/9600×1000 = 72,9167 мс.
    id: buses-uart-1
    lesson: uart
    difficulty: 1
