    question: При разборе задачи «Светодиодная прозвонка» какой вывод обоснован?
    options:
      - Резистор ограничивает ток светодиода и проверяемой цепи.
      - Светодиод подключают к батарейке без резистора
      - Пробник проверяет детали под сетевым напряжением
    answer: 0
    hint: >-
      Проверяй только отдельные обесточенные провода и предохранители. На плате параллельные цепи
      могут давать неоднозначное показание.
    explanation: >-
      Резистор ограничивает ток светодиода и проверяемой цепи. Сделаем индикатор непрерывности
      провода. LED светится, когда испытательный ток проходит через проверяемый обесточенный
      участок; резистор ограничивает ток. Ошибочные варианты: Светодиод подключают к батарейке без
      резистора; Пробник проверяет детали под сетевым напряжением. Они не учитывают описанный
      принцип.
