    question: При разборе задачи «Делитель напряжения» какой вывод обоснован?
    options:
      - Делитель является идеальным источником питания
      - Выход всегда равен половине входа
      - Нагрузка делителя меняет его выходное напряжение.
    answer: 2
    hint: >-
      Сначала измерь выход без нагрузки, затем с известным резистором к GND. Пересчитай нижнее плечо
      как параллельное соединение и сравни просадку.
    explanation: >-
      Нагрузка делителя меняет его выходное напряжение. АЦП не должен получать напряжение батареи
      напрямую. Делитель создаёт часть входного напряжения на нижнем резисторе. Если подключить
      нагрузку, она окажется параллельно нижнему плечу и изменит результат. Поэтому делитель
      пригоден для сигнала, но обычно не для питания устройства. Ошибочные варианты: Делитель
      является идеальным источником питания; Выход всегда равен половине входа. Они не учитывают
      описанный принцип.
    id: circuits-divider-0
    lesson: divider
    difficulty: 1
