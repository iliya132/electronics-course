    question: При разборе задачи «Мультиметр и макетная плата» какой вывод обоснован?
    options:
      - Токовый вход безопасно подключить поперёк батареи
      - Сопротивление измеряют на питаемой плате
      - Амперметр включают в разрыв цепи, вольтметр — параллельно.
    answer: 2
    hint: >-
      На обесточенной макетке прозвони группы контактов. Перед каждым замером назови величину,
      режим, гнёзда и схему подключения; после тока верни красный щуп в V.
    explanation: >-
      Амперметр включают в разрыв цепи, вольтметр — параллельно. Неправильное гнездо мультиметра
      способно замкнуть батарейку. Напряжение измеряют параллельно, ток — в разрыв, сопротивление —
      без питания. Токовый вход имеет малое сопротивление и предохранитель. В макетке группы
      контактов соединены шинами, а центральный паз разделяет половины. Ошибочные варианты: Токовый
      вход безопасно подключить поперёк батареи; Сопротивление измеряют на питаемой плате. Они не
      учитывают описанный принцип.
    id: circuits-multimeter-breadboard-0
    lesson: multimeter-breadboard
    difficulty: 1
