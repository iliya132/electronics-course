    question: При разборе задачи «Законы Кирхгофа» какой вывод обоснован?
    options:
      - В контуре напряжения всегда складывают без знаков
      - В стационарном узле сумма входящих токов равна сумме выходящих.
      - В узле часть тока обязательно теряется
    answer: 1
    hint: >-
      Нарисуй стрелки токов до записи уравнений. Отрицательный результат означает обратное
      направление, а не отрицательное количество носителей.
    explanation: >-
      В стационарном узле сумма входящих токов равна сумме выходящих. По измерениям отдельных ветвей
      можно найти неизвестный ток. Первый закон Кирхгофа выражает сохранение заряда в узле. Второй
      говорит, что алгебраическая сумма изменений потенциала вдоль замкнутого контура равна нулю.
      Знаки зависят от выбранного направления обхода. Ошибочные варианты: В узле часть тока
      обязательно теряется; В контуре напряжения всегда складывают без знаков. Они не учитывают
      описанный принцип.
    id: circuits-kirchhoff-0
    lesson: kirchhoff
    difficulty: 1
