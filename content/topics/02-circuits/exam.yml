    question: При разборе задачи «Источник с внутренним сопротивлением» какой вывод обоснован?
    options:
      - Просадка растёт с током и последовательным сопротивлением.
      - Максимум мощности всегда даёт максимальный КПД
      - Напряжение идеального источника обязательно падает с током
    answer: 0
    hint: >-
      Измерь напряжение у источника и у нагрузки при одном токе. Их разность относится к потерям на
      проводах и контактах; измерение без тока не выявит эту проблему.
    explanation: >-
      Просадка растёт с током и последовательным сопротивлением. Длинный кабель снижает напряжение
      на плате. Источник можно приближённо представить идеальной ЭДС и последовательным внутренним
      сопротивлением. Под нагрузкой падение Ir растёт с током. Максимум мощности при Rнаг=r
      сопровождается большими потерями и не является целью эффективного питания. Ошибочные варианты:
      Максимум мощности всегда даёт максимальный КПД; Напряжение идеального источника обязательно
      падает с током. Они не учитывают описанный принцип.
    id: circuits-source-load-0
    lesson: source-load
    difficulty: 1
  - type: numeric
