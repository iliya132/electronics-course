  - type: single
    question: При разборе задачи «Последовательное соединение» какой вывод обоснован?
    options:
      - Ток исчезает после первого резистора
      - В последовательной цепи ток одинаков, а напряжения складываются.
      - Каждый последовательный резистор получает всё напряжение источника
    answer: 1
    hint: >-
      Измерь напряжение каждого резистора относительно его двух выводов. Сумма падений должна
      совпасть с напряжением цепочки с учётом погрешности прибора.
    explanation: >-
      В последовательной цепи ток одинаков, а напряжения складываются. Два последовательно
      включённых резистора ограничивают один и тот же ток. Разветвлений между ними нет, поэтому
      заряд не может уходить другим путём. Напряжение источника распределяется между элементами;
      больший резистор получает большее падение при том же токе. Ошибочные варианты: Каждый
      последовательный резистор получает всё напряжение источника; Ток исчезает после первого
      резистора. Они не учитывают описанный принцип.
    id: circuits-series-0
    lesson: series
    difficulty: 1
