  - type: single
    question: 'При разборе задачи «Цепь: источник, нагрузка, ключ, замыкание» какой вывод обоснован?'
    options:
      - Любое пересечение линий всегда соединяет провода
      - Открытый выключатель проводит ток как провод
      - Короткое замыкание обходит нагрузку путём с малым сопротивлением.
    answer: 2
    hint: >-
      Проследи путь от плюса через нагрузку до минуса. Сначала проверь отсутствие прямого соединения
      клемм источника, затем полярность компонентов.
    explanation: >-
      Короткое замыкание обходит нагрузку путём с малым сопротивлением. Лампа не светится при
      оборванном проводе. Электрическая цепь требует замкнутого пути через источник и нагрузку. Узел
      соединяет проводники, а ключ разрывает путь. На принципиальной схеме важны соединения, а не
      физическое положение деталей; пересечение без точки обычно не означает соединения. Ошибочные
      варианты: Любое пересечение линий всегда соединяет провода; Открытый выключатель проводит ток
      как провод. Они не учитывают описанный принцип.
    id: circuits-circuit-basics-0
    lesson: circuit-basics
    difficulty: 1
