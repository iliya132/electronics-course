    question: При разборе задачи «Лаборатория делителя» какой вывод обоснован?
    options:
      - Плечи делителя можно менять без изменения выхода
      - Выход нагруженного делителя ниже ненагруженного при той же входной линии.
      - Нагрузка не влияет на делитель
    answer: 1
    hint: >-
      Записывай напряжение источника перед каждым опытом. Сравни ненагруженный расчёт и расчёт с
      параллельной нагрузкой.
    explanation: >-
      Выход нагруженного делителя ниже ненагруженного при той же входной линии. Проверим, почему
      делитель нельзя считать полноценным источником питания. Сначала получим половину напряжения,
      затем изменим нижнее плечо и подключим нагрузку. Ошибочные варианты: Нагрузка не влияет на
      делитель; Плечи делителя можно менять без изменения выхода. Они не учитывают описанный
      принцип.
