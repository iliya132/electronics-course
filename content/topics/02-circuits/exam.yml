    question: При разборе задачи «Параллельное соединение» какой вывод обоснован?
    options:
      - У параллельных ветвей одинаковое напряжение, а токи могут различаться.
      - Параллельное сопротивление больше любого резистора
      - Ток каждой ветви всегда равен суммарному
    answer: 0
    hint: >-
      Измерь напряжение на обеих ветвях и сравни рассчитанные токи. Проверь, способен ли источник
      отдать их сумму без просадки.
    explanation: >-
      У параллельных ветвей одинаковое напряжение, а токи могут различаться. При добавлении
      параллельной нагрузки источник отдаёт больше тока. Обе ветви подключены к одной паре узлов,
      значит напряжение одинаково. Токи ветвей складываются. Эквивалентное сопротивление
      положительных резисторов меньше наименьшего из них. Ошибочные варианты: Параллельное
      сопротивление больше любого резистора; Ток каждой ветви всегда равен суммарному. Они не
      учитывают описанный принцип.
    id: circuits-parallel-0
    lesson: parallel
    difficulty: 1
