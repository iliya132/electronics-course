id: exam-circuits
topic: circuits
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Электрическая цепь и схема ─────
  - id: c-001
    lesson: circuit-basics
    difficulty: 1
    type: single
    question: "Что обязательно нужно, чтобы по цепи пошёл постоянный ток?"
    options:
      - "Замкнутый контур, содержащий источник"
      - "Наличие хотя бы одной лампы"
      - "Наличие выключателя"
    answer: 0
    explanation: "Ток идёт только по замкнутому контуру, в котором есть источник. Лампа и выключатель в цепи могут быть, но не обязательны: без лампы будет короткое замыкание, но ток всё равно пойдёт."
  - id: c-002
    lesson: circuit-basics
    difficulty: 1
    type: single
    question: "Как на схеме показывают, что два пересекающихся провода соединены между собой?"
    options:
      - "Точкой в месте пересечения"
      - "Волнистой линией"
      - "Тем, что провода нарисованы одним цветом"
    answer: 0
    explanation: "Соединение отмечают точкой. Цвет и вид линий на принципиальных схемах не несут электрического смысла, а волнистая линия вообще обозначает другое."
  - id: c-003
    lesson: circuit-basics
    difficulty: 2
    type: numeric
    formula:
      - "I = E / (r + R)"
    question: "Аккумулятор с E = 3,6 В и внутренним сопротивлением 0,08 Ом замкнули проводом сопротивлением 0,02 Ом. Каков ток короткого замыкания?"
    answer: 36
    unit: "А"
    tolerance_percent: 2
    explanation: "Полное сопротивление 0,08 + 0,02 = 0,10 Ом. I = 3,6 / 0,10 = 36 А. Если учесть только провод (0,02 Ом), получится 180 А, а это неверно: внутреннее сопротивление тоже стоит в цепи."
  - id: c-004
    lesson: circuit-basics
    difficulty: 1
    type: single
    question: "Лампа и резистор соединены последовательно с батарейкой. Амперметр между батарейкой и лампой показывает 0,2 А. Что покажет такой же амперметр между лампой и резистором?"
    options:
      - "0,2 А"
      - "0,1 А"
      - "0 А"
    answer: 0
    explanation: "В неразветвлённой цепи ток одинаков в любом сечении. Лампа энергию превращает в свет, а ток не «расходует»."
  - id: c-005
    lesson: circuit-basics
    difficulty: 3
    type: multi
    question: "Выбери все верные утверждения о коротком замыкании."
    options:
      - "Ток при КЗ ограничен лишь малыми сопротивлениями источника и проводов"
      - "Предохранитель защищает цепь, перегорая при превышении тока"
      - "Чем больше сопротивление нагрузки, тем ближе режим к короткому замыканию"
      - "Провода и батарейка при КЗ нагреваются, так как выделяется мощность I²R"
    answer: [0, 1, 3]
    explanation: "Верны первое, второе и четвёртое. Третье неверно: КЗ — это как раз отсутствие нагрузки, то есть очень малое сопротивление, а не большое."
  # ───── Последовательное соединение ─────
  - id: c-006
    lesson: series
    difficulty: 1
    type: numeric
    formula:
      - "R = R1 + R2"
    question: "Резисторы 330 Ом и 470 Ом соединены последовательно. Найди общее сопротивление."
    answer: 800
    unit: "Ом"
    tolerance_percent: 1
    explanation: "При последовательном соединении сопротивления складываются: 330 + 470 = 800 Ом."
  - id: c-007
    lesson: series
    difficulty: 2
    type: numeric
    formula:
      - "I = U / (R1 + R2)"
      - "U₂ = I · R₂"
    question: "К источнику 12 В подключены последовательно резисторы 1 кОм и 2 кОм. Какое напряжение на резисторе 2 кОм?"
    answer: 8
    unit: "В"
    tolerance_percent: 2
    explanation: "Ток I = 12 / 3 кОм = 4 мА. U = 4 мА × 2 кОм = 8 В. Короче: на резисторе упадёт доля 2/3 от 12 В."
  - id: c-008
    lesson: series
    difficulty: 1
    type: single
    question: "Две лампы включены последовательно. Одна перегорела. Что произойдёт со второй?"
    options:
      - "Погаснет, так как цепь разорвана"
      - "Станет светить вдвое ярче"
      - "Продолжит светить как прежде"
    answer: 0
    explanation: "Единственный путь тока проходит через обе лампы, и обрыв в одной останавливает ток во всей цепи. «Как прежде» было бы при параллельном соединении."
  - id: c-009
    lesson: series
    difficulty: 3
    type: numeric
    formula:
      - "R = (Uпит − Uсв) / I"
    question: "Светодиод с падением 2 В должен работать при токе 15 мА от источника 5 В. Какой резистор нужно включить последовательно?"
    answer: 200
    unit: "Ом"
    tolerance_percent: 2
    explanation: "На резисторе должно упасть 5 − 2 = 3 В при токе 0,015 А. R = 3 / 0,015 = 200 Ом."
  - id: c-010
    lesson: series
    difficulty: 1
    type: single
    question: "Резисторы 100 Ом и 300 Ом соединены последовательно с источником. На первом упало 2 В. Сколько упало на втором?"
    options:
      - "6 В"
      - "2 В"
      - "0,67 В"
    answer: 0
    explanation: "Ток один, а сопротивление второго в три раза больше, поэтому и напряжение на нём втрое больше: 3 × 2 = 6 В. Вариант 2 В был бы при равных резисторах."
  # ───── Параллельное соединение ─────
  - id: c-011
    lesson: parallel
    difficulty: 1
    type: numeric
    formula:
      - "Два одинаковых резистора: R = R1 / 2"
    question: "Два резистора по 1 кОм соединены параллельно. Найди общее сопротивление."
    answer: 500
    unit: "Ом"
    tolerance_percent: 1
    explanation: "Для двух одинаковых резисторов R = 1000 / 2 = 500 Ом."
  - id: c-012
    lesson: parallel
    difficulty: 2
    type: numeric
    formula:
      - "I = U / R для каждой ветви"
      - "I = I1 + I2"
    question: "К источнику 12 В параллельно подключены резисторы 60 Ом и 120 Ом. Какой общий ток отдаёт источник?"
    answer: 300
    unit: "мА"
    tolerance_percent: 2
    explanation: "I1 = 12 / 60 = 0,2 А = 200 мА, I2 = 12 / 120 = 0,1 А = 100 мА. Общий ток 300 мА."
  - id: c-013
    lesson: parallel
    difficulty: 1
    type: single
    question: "Как изменится общее сопротивление цепи, если к уже включённому резистору подключить параллельно ещё один?"
    options:
      - "Уменьшится"
      - "Увеличится"
      - "Не изменится"
    answer: 0
    explanation: "Появился ещё один путь для тока, поэтому общее сопротивление становится меньше любого из резисторов. Увеличивает сопротивление последовательное соединение."
  - id: c-014
    lesson: parallel
    difficulty: 3
    type: numeric
    formula:
      - "R = R1 · R2 / (R1 + R2)"
      - "или 1/R = 1/R1 + 1/R2"
    question: "Нужно получить сопротивление 75 Ом, подключив параллельно к резистору 100 Ом ещё один. Какого номинала он должен быть?"
    answer: 300
    unit: "Ом"
    tolerance_percent: 2
    explanation: "1/R2 = 1/75 − 1/100 = (4 − 3)/300 = 1/300, значит R2 = 300 Ом. Проверка: 100·300 / 400 = 75 Ом."
  # ───── Делитель напряжения ─────
  - id: c-015
    lesson: divider
    difficulty: 1
    type: numeric
    formula:
      - "Uвых = Uвх · R2 / (R1 + R2)"
      - "R2 — нижний резистор (к земле), R1 — верхний"
    question: "Делитель: R1 = 6 кОм сверху, R2 = 3 кОм снизу, Uвх = 9 В. Найди Uвых."
    answer: 3
    unit: "В"
    tolerance_percent: 1
    explanation: "Uвых = 9 × 3 / (6 + 3) = 3 В."
  - id: c-016
    lesson: divider
    difficulty: 2
    type: numeric
    formula:
      - "R1 = R2 · (Uвх / Uвых − 1)"
    question: "Нужно получить из 5 В половину, то есть 2,5 В. Нижний резистор R2 = 4,7 кОм. Каким должен быть R1 в килоомах?"
    answer: 4.7
    unit: "кОм"
    tolerance_percent: 2
    explanation: "Половина напряжения получается при R1 = R2: R1 = R2 · (5 / 2,5 − 1) = 4,7 кОм."
  - id: c-017
    lesson: divider
    difficulty: 2
    type: single
    question: "Почему вход АЦП микроконтроллера хорошо подходит в качестве нагрузки делителя?"
    options:
      - "У него очень большое входное сопротивление, и он почти не меняет выход делителя"
      - "У него очень малое сопротивление, поэтому ток большой"
      - "АЦП сам стабилизирует напряжение делителя"
    answer: 0
    explanation: "Нагрузка параллельна R2 и влияет тем меньше, чем она больше. У входа АЦП сопротивление порядка мегаом, и это даёт малую ошибку. Малое сопротивление, наоборот, просадило бы выход."
  - id: c-018
    lesson: divider
    difficulty: 3
    type: numeric
    formula:
      - "R2экв = R2 · Rн / (R2 + Rн)"
      - "Uвых = Uвх · R2экв / (R1 + R2экв)"
      - "Нагрузка Rн включена параллельно R2"
    question: "Делитель из R1 = 20 кОм и R2 = 10 кОм питается от 12 В. К выходу подключили нагрузку 10 кОм. Каково Uвых?"
    answer: 2.4
    unit: "В"
    tolerance_percent: 2
    explanation: "Нижняя часть: 10 ‖ 10 = 5 кОм. Uвых = 12 × 5 / (20 + 5) = 60 / 25 = 2,4 В. Без нагрузки было бы 4 В."
  - id: c-019
    lesson: divider
    difficulty: 2
    type: multi
    question: "Выбери верные утверждения о делителе напряжения без нагрузки."
    options:
      - "Выход зависит только от отношения R2 / (R1 + R2)"
      - "Увеличение R2 при неизменном R1 увеличивает Uвых"
      - "Выход всегда больше входа"
      - "Если R1 = R2, на выходе половина входного напряжения"
    answer: [0, 1, 3]
    explanation: "Верны первое, второе и четвёртое. Третье неверно: делитель только уменьшает напряжение, и Uвых не превышает Uвх."
  # ───── Законы Кирхгофа ─────
  - id: c-020
    lesson: kirchhoff
    difficulty: 1
    type: numeric
    formula:
      - "Узел: Σ I входящих = Σ I выходящих"
    question: "В узел входят токи 4 мА и 9 мА, а выходят 6 мА и ещё один ток. Найди его."
    answer: 7
    unit: "мА"
    tolerance_percent: 1
    explanation: "Входит 4 + 9 = 13 мА, значит, выходящий неизвестный ток 13 − 6 = 7 мА."
  - id: c-021
    lesson: kirchhoff
    difficulty: 1
    type: numeric
    formula:
      - "Контур: E = U₁ + U₂ + U₃ + …"
    question: "В контуре источник 24 В и четыре резистора. На трёх упало 5 В, 7 В и 9 В. Сколько упало на четвёртом?"
    answer: 3
    unit: "В"
    tolerance_percent: 1
    explanation: "24 = 5 + 7 + 9 + U₄, значит, U₄ = 24 − 21 = 3 В."
  - id: c-022
    lesson: kirchhoff
    difficulty: 3
    type: numeric
    formula:
      - "Источники навстречу: E = E₁ − E₂"
      - "I = E / R"
    question: "Два источника, 10 В и 4 В, включены в один контур навстречу друг другу, то есть плюс к плюсу. Общее сопротивление контура 200 Ом. Каков ток в контуре?"
    answer: 30
    unit: "мА"
    tolerance_percent: 2
    explanation: "ЭДС вычитаются: 10 − 4 = 6 В. I = 6 / 200 = 0,03 А = 30 мА. Если сложить ЭДС (14 В), получится 70 мА, а это ошибка."
  - id: c-023
    lesson: kirchhoff
    difficulty: 2
    type: single
    question: "Какой физический принцип лежит в основе проверки решения схемы балансом мощностей?"
    options:
      - "Сохранение энергии"
      - "Закон Ома для участка цепи"
      - "Закон Ампера"
    answer: 0
    explanation: "Мощность, которую отдают источники, не может исчезнуть и должна равняться мощности, выделяемой на резисторах. Закон Ома связывает величины на одном участке, а закон Ампера — про магнитные силы."
  # ───── Источник с внутренним сопротивлением ─────
  - id: c-024
    lesson: source-load
    difficulty: 1
    type: numeric
    formula:
      - "I = E / (r + Rн)"
    question: "Источник с E = 9 В и r = 1 Ом нагружен резистором 8 Ом. Каков ток?"
    answer: 1
    unit: "А"
    tolerance_percent: 2
    explanation: "I = E / (r + Rн) = 9 / 9 = 1 А. Напряжение на нагрузке при этом 8 В."
  - id: c-025
    lesson: source-load
    difficulty: 2
    type: numeric
    formula:
      - "P_max = E² / (4r)"
      - "достигается при Rн = r"
    question: "Источник E = 10 В, r = 5 Ом. Какую наибольшую мощность можно получить в нагрузке?"
    answer: 5
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P_max = E² / (4r) = 100 / 20 = 5 Вт при Rн = 5 Ом."
  - id: c-026
    lesson: source-load
    difficulty: 2
    type: single
    question: "Ток через длинный кабель вырос вдвое. Как изменится мощность, выделяющаяся в самом кабеле?"
    options:
      - "Вырастет вчетверо"
      - "Вырастет вдвое"
      - "Не изменится"
    answer: 0
    explanation: "Мощность потерь P = I²·R, ток в квадрате: 2² = 4. Вариант «вдвое» учитывает ток, но не его квадрат."
  - id: c-027
    lesson: source-load
    difficulty: 2
    type: numeric
    formula:
      - "η = Rн / (r + Rн)"
    question: "Источник с r = 0,5 Ом нагружен на Rн = 4,5 Ом. Каков КПД в процентах?"
    answer: 90
    unit: "%"
    tolerance_percent: 1
    explanation: "η = Rн / (r + Rн) = 4,5 / 5 = 0,9, то есть 90 %."
  - id: c-028
    lesson: source-load
    difficulty: 3
    type: numeric
    formula:
      - "I = E / (r + R_кабеля + Rн)"
      - "U = I · Rн"
    question: "Источник 5 В с r = 0,2 Ом питает нагрузку 4,5 Ом через кабель с сопротивлением 0,3 Ом (туда и обратно). Найди напряжение на нагрузке."
    answer: 4.5
    unit: "В"
    tolerance_percent: 2
    explanation: "Полное сопротивление 0,2 + 0,3 + 4,5 = 5 Ом, ток 1 А, на нагрузке 1 × 4,5 = 4,5 В. На источнике и кабеле теряется 0,5 В."
  # ───── Мультиметр и макетка ─────
  - id: c-029
    lesson: multimeter-breadboard
    difficulty: 1
    type: single
    question: "В какое гнездо мультиметра вставляют чёрный щуп?"
    options:
      - "COM"
      - "VΩ"
      - "10A"
    answer: 0
    explanation: "Чёрный щуп всегда в общем гнезде COM. Красный меняется в зависимости от режима."
  - id: c-030
    lesson: multimeter-breadboard
    difficulty: 2
    type: single
    question: "Как правильно измерить ток 3 А, который течёт через двигатель?"
    options:
      - "Красный щуп в гнездо 10A, прибор в режиме A и включён в разрыв цепи"
      - "Красный щуп в гнездо VΩ, прибор параллельно двигателю"
      - "Красный щуп в гнездо mA, прибор параллельно источнику"
    answer: 0
    explanation: "Ток 3 А выходит за пределы гнезда mA (до 200–400 мА), нужно гнездо 10A, а амперметр всегда включают последовательно, в разрыв. Параллельное включение — это короткое замыкание."
  - id: c-031
    lesson: multimeter-breadboard
    difficulty: 1
    type: single
    question: "Резистор вставили обоими выводами в отверстия a и b одного и того же столбца макетки. Что получилось?"
    options:
      - "Резистор замкнут накоротко внутренней перемычкой, ток через него не идёт"
      - "Резистор работает в обычном режиме"
      - "Резистор отключён от схемы, но цепь цела"
    answer: 0
    explanation: "Пять отверстий столбца соединены между собой, поэтому оба вывода связаны проводником, а ток идёт мимо резистора."
  - id: c-032
    lesson: multimeter-breadboard
    difficulty: 3
    type: numeric
    formula:
      - "R = R_нагрузки + R_амперметра"
      - "I = U / R"
    question: "Нагрузка 9,5 Ом подключена к источнику 5 В. В разрыв включили амперметр с собственным сопротивлением 0,5 Ом. Какой ток покажет прибор?"
    answer: 500
    unit: "мА"
    tolerance_percent: 2
    explanation: "Резистор и амперметр теперь последовательны: 9,5 + 0,5 = 10 Ом, I = 5 / 10 = 0,5 А = 500 мА. Без прибора было бы 526 мА."
  # ───── Проект «Лаборатория делителя» ─────
  - id: c-033
    lesson: divider-lab
    difficulty: 1
    type: numeric
    formula:
      - "Uвых = Uвх · R2 / (R1 + R2)"
      - "R2 — нижний резистор (к земле), R1 — верхний"
    question: "Делитель из R1 = 10 кОм и R2 = 22 кОм питается от 12 В без нагрузки. Каков Uвых?"
    answer: 8.25
    unit: "В"
    tolerance_percent: 2
    explanation: "Uвых = 12 × 22 / (10 + 22) = 264 / 32 = 8,25 В."
  - id: c-034
    lesson: divider-lab
    difficulty: 2
    type: single
    question: "В лаборатории выход делителя после подключения нагрузки упал. Какова причина?"
    options:
      - "Нагрузка подключена параллельно R2 и уменьшила сопротивление нижней части делителя"
      - "Нагрузка уменьшила напряжение батареи"
      - "Нагрузка увеличила сопротивление R1"
    answer: 0
    explanation: "Нагрузка включена между выходом и землёй, то есть параллельно R2. Сопротивление нижней части падает, и вместе с ним падает доля напряжения на выходе."
  - id: c-035
    lesson: divider-lab
    difficulty: 3
    type: numeric
    formula:
      - "R2экв = R2 · Rн / (R2 + Rн)"
      - "Uвых = Uвх · R2экв / (R1 + R2экв)"
      - "Нагрузка Rн включена параллельно R2"
    question: "Делитель 10 кОм / 10 кОм питается от 9 В. К выходу подключили нагрузку 5 кОм. Каково Uвых?"
    answer: 2.25
    unit: "В"
    tolerance_percent: 2
    explanation: "Нижняя часть: 10 ‖ 5 = 3,333 кОм. Uвых = 9 × 3,333 / (10 + 3,333) = 30 / 13,33 = 2,25 В."
  # ───── Проект «Прозвонка» ─────
  - id: c-036
    lesson: continuity-tester
    difficulty: 1
    type: numeric
    formula:
      - "R = (Uпит − Uf) / I"
    question: "Красный светодиод (падение 2 В) должен работать при токе 10 мА от источника 5 В. Какой нужен резистор?"
    answer: 300
    unit: "Ом"
    tolerance_percent: 2
    explanation: "R = (5 − 2) / 0,01 = 300 Ом."
  - id: c-037
    lesson: continuity-tester
