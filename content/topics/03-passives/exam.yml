    question: При разборе задачи «Термисторы NTC/PTC и варисторы» какой вывод обоснован?
    options:
      - В β-модели NTC температура подставляется в кельвинах.
      - NTC увеличивает сопротивление при нагреве
      - В формулу β без перевода подставляют градусы Цельсия
    answer: 0
    hint: >-
      Измеряй NTC малым током, чтобы не нагревать сам датчик. Для варистора важны рабочее
      напряжение, импульсная энергия и предохранитель; сетевые опыты исключены.
    explanation: >-
      В β-модели NTC температура подставляется в кельвинах. Температуру можно превратить в
      напряжение делителя. У NTC сопротивление падает при нагреве, у PTC растёт. Для NTC используют
      R(T)=R0·exp[β(1/T−1/T0)], температуры только в кельвинах. Варистор нелинейно ограничивает
      выброс напряжения, но стареет и требует защиты от перегрева. Ошибочные варианты: NTC
      увеличивает сопротивление при нагреве; В формулу β без перевода подставляют градусы Цельсия.
      Они не учитывают описанный принцип.
    id: passives-thermistors-varistors-0
    lesson: thermistors-varistors
    difficulty: 1
