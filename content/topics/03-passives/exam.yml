    question: При разборе задачи «Роли резисторов на плате» какой вывод обоснован?
    options:
      - Любой резистор рядом с МК является подтяжкой
      - Резистор нулевого номинала задаёт напряжение
      - Роль резистора определяется его соединениями и режимом.
    answer: 2
    hint: >-
      Определи роль по соединениям, а не только по цвету или корпусу. У подтяжки проверь ток при
      низком уровне и достаточную скорость фронта.
    explanation: >-
      Роль резистора определяется его соединениями и режимом. Одинаковый резистор выполняет разные
      работы в разных местах платы. Последовательно с LED он ограничивает ток; в паре делит
      напряжение; от линии к питанию задаёт подтяжку; малый номинал в силовой цепи служит шунтом.
      Последовательный резистор сигнала может демпфировать отражения, согласующий — согласовать
      линию. Ошибочные варианты: Любой резистор рядом с МК является подтяжкой; Резистор нулевого
      номинала задаёт напряжение. Они не учитывают описанный принцип.
    id: passives-pullups-resistors-roles-0
    lesson: pullups-resistors-roles
    difficulty: 1
