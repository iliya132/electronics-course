    question: >-
      При разборе задачи «Предохранители и самовосстанавливающиеся (PTC, polyfuse)» какой вывод
      обоснован?
    options:
      - Ток удержания PTC гарантированно вызывает отключение
      - У защиты важны и величина тока, и длительность перегрузки.
      - Предохранитель любого номинала срабатывает мгновенно
    answer: 1
    hint: >-
      Сравни рабочий и пусковой ток нагрузки с время-токовой характеристикой. Проверь напряжение,
      отключающую способность и падение на PTC в норме.
    explanation: >-
      У защиты важны и величина тока, и длительность перегрузки. USB-порт защищают от длительной
      перегрузки. Плавкий предохранитель разрывает цепь, а PTC при нагреве увеличивает
      сопротивление. Ток удержания PTC не равен току срабатывания; время зависит от перегрузки и
      температуры. Предохранитель не является точным ограничителем тока. Ошибочные варианты:
      Предохранитель любого номинала срабатывает мгновенно; Ток удержания PTC гарантированно
      вызывает отключение. Они не учитывают описанный принцип.
    id: passives-fuses-ptc-0
    lesson: fuses-ptc
    difficulty: 1
