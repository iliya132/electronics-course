  - type: single
    question: При разборе задачи «Термометр на NTC» какой вывод обоснован?
    options:
      - NTC следует нагревать током измерения
      - Нагрев NTC в нижнем плече уменьшает выходное напряжение.
      - Изменение температуры не влияет на делитель
    answer: 1
    hint: >-
      Для NTC в нижнем плече Rntc=Rверх·Uвых/(Uвх−Uвых). Температуру найди по T=1/[1/T0+ln(R/R0)/β],
      затем вычти 273,15.
    explanation: >-
      Нагрев NTC в нижнем плече уменьшает выходное напряжение. Соберём термометр без
      микроконтроллера. NTC и постоянный резистор образуют делитель, а мультиметр показывает
      изменение напряжения при температуре. Ошибочные варианты: Изменение температуры не влияет на
      делитель; NTC следует нагревать током измерения. Они не учитывают описанный принцип.
    id: passives-ntc-thermometer-0
    lesson: ntc-thermometer
    difficulty: 1
  - type: numeric
    question: >-
      Ненагруженный делитель: Uвх = 5 В, R1 сверху = 10 кОм, R2 снизу = 7 кОм. Найди Uвых
      относительно GND.
