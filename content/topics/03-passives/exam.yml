  - type: single
    question: При разборе задачи «Потенциометры и подстроечные резисторы» какой вывод обоснован?
    options:
      - Потенциометр с тремя выводами работает как регулируемый делитель.
      - Сопротивление между крайними выводами меняется с ручкой
      - Потенциометр рассчитан на любой ток нагрузки
    answer: 0
    hint: >-
      На снятом питании найди крайние выводы: между ними сопротивление постоянно. Между движком и
      краем оно меняется при вращении.
    explanation: >-
      Потенциометр с тремя выводами работает как регулируемый делитель. Ручка регулятора меняет
      положение подвижного контакта. Потенциометр имеет два края резистивной дорожки и движок. Три
      вывода дают делитель, два — реостат; движок часто соединяют с используемым краем для защиты от
      потери контакта. Линейная характеристика меняется равномерно, логарифмическая удобна для
      громкости. Ошибочные варианты: Сопротивление между крайними выводами меняется с ручкой;
      Потенциометр рассчитан на любой ток нагрузки. Они не учитывают описанный принцип.
    id: passives-potentiometer-0
    lesson: potentiometer
    difficulty: 1
  - type: numeric
    question: >-
      Ненагруженный делитель: Uвх = 5 В, R1 сверху = 10 кОм, R2 снизу = 7 кОм. Найди Uвых
      относительно GND.
    answer: 2.0588235294117645
    unit: В
    tolerance_percent: 1
    hint: Uвых = Uвх·R2/(R1+R2); одинаковые приставки сопротивлений сокращаются. 1 кОм = 1000 Ом.
    explanation: 5 × 7/(10+7) = 2,05882 В.
