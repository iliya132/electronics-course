questions:
  # ───── Маркировка резисторов ─────
  - id: p-001
    lesson: resistor-marking
    difficulty: 1
    type: numeric
    formula:
      - "0 чёрный · 1 коричневый · 2 красный · 3 оранжевый · 4 жёлтый"
      - "5 зелёный · 6 синий · 7 фиолетовый · 8 серый · 9 белый"
      - "Номинал = (цифра 1, цифра 2) × 10^множитель"
      - "Допуск: золотая ±5 %, серебряная ±10 %"
    question: "Полосы резистора: оранжевая, оранжевая, красная, золотая. Найди номинал в килоомах."
    answer: 3.3
    unit: "кОм"
    tolerance_percent: 1
    explanation: "Оранжевый = 3, оранжевый = 3, красный = множитель ×100: 33 × 100 = 3300 Ом = 3,3 кОм. Золотая полоса — допуск ±5 %."
  - id: p-002
    lesson: resistor-marking
    difficulty: 1
    type: single
    question: "Что означает код 223 на SMD-резисторе?"
    options:
      - "22 кОм"
      - "223 Ом"
      - "2,2 кОм"
    answer: 0
    explanation: "Две первые цифры 22, третья — множитель 10³: 22 × 1000 = 22 кОм. Запись 2,2 кОм дал бы код 222, а 223 Ом — неправильное чтение кода как одного числа."
  - id: p-003
    lesson: resistor-marking
    difficulty: 2
    type: single
    question: "Расчёт даёт сопротивление 6,0 кОм. Какой номинал из ряда E12 ближе всего?"
    options:
      - "5,6 кОм"
      - "6,8 кОм"
      - "6,2 кОм"
    answer: 0
    explanation: "В ряду E12 рядом стоят 5,6 и 6,8 кОм. От 6,0 до 5,6 — 7 %, до 6,8 — 13 %, поэтому берут 5,6 кОм. Значение 6,2 кОм есть только в ряду E24."
  - id: p-004
    lesson: resistor-marking
    difficulty: 2
    type: numeric
    formula:
      - "R_max = R · (1 + δ)"
      - "δ — допуск (0,01 для ±1 %)"
    question: "Резистор 4,7 кОм с допуском ±1 %. Какое наибольшее сопротивление он может иметь? Ответ в омах."
    answer: 4747
    unit: "Ом"
    tolerance_percent: 0.5
    explanation: "4700 × 0,01 = 47 Ом, максимум 4700 + 47 = 4747 Ом."
  - id: p-005
    lesson: resistor-marking
    difficulty: 3
    type: single
    question: "Полосы: серая, красная, жёлтая, коричневая (последняя — допуск ±1 %). Каков номинал?"
    options:
      - "820 кОм ±1 %"
      - "82 кОм ±1 %"
      - "8,2 МОм ±1 %"
    answer: 0
    explanation: "Серый = 8, красный = 2, жёлтый = множитель 10⁴: 82 × 10 000 = 820 000 Ом = 820 кОм. Вариант 82 кОм получится, если не учесть множитель, а 8,2 МОм — если считать множитель на порядок больше."
  # ───── Мощность и типы резисторов ─────
  - id: p-006
    lesson: resistor-power-types
    difficulty: 1
    type: single
    question: "Какое соотношение между расчётной и номинальной мощностью резистора считают безопасным?"
    options:
      - "Расчётная не больше половины номинальной"
      - "Расчётная равна номинальной"
      - "Расчётная может быть вдвое больше номинальной"
    answer: 0
    explanation: "Практика требует запаса не менее двух. Работа на пределе греет резистор, он дрейфует и стареет, а превышение номинала приводит к перегреву."
  - id: p-007
    lesson: resistor-power-types
    difficulty: 2
    type: numeric
    formula:
      - "P = U² / R"
    question: "Резистор 330 Ом подключён к 12 В. Какая мощность на нём выделяется? Ответ в милливаттах."
    answer: 436
    unit: "мВт"
    tolerance_percent: 2
    explanation: "P = U² / R = 144 / 330 ≈ 0,436 Вт = 436 мВт. С запасом вдвое нужен резистор минимум на 0,87 Вт, то есть 1 Вт."
  - id: p-008
    lesson: resistor-power-types
    difficulty: 2
    type: numeric
    formula:
      - "P_доп = P_ном · (155 − T) / 85"
      - "до 70 °C — полный номинал, при 155 °C — ноль"
    question: "Резистор на 0,5 Вт работает при 105 °C. Какую мощность допускает кривая снижения? (до 70 °C — номинал, при 155 °C — ноль)"
    answer: 0.294
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P_доп = 0,5 × (155 − 105) / 85 = 0,5 × 50 / 85 ≈ 0,294 Вт."
  - id: p-009
    lesson: resistor-power-types
    difficulty: 2
    type: single
    question: "На резисторе рассеивается 0,06 Вт. Какой из SMD-корпусов минимально подходит с запасом вдвое? (0402 — 0,063 Вт, 0603 — 0,1 Вт, 0805 — 0,125 Вт, 1206 — 0,25 Вт)"
    options:
      - "0805"
      - "0402"
      - "0603"
    answer: 0
    explanation: "Нужно не меньше 0,06 × 2 = 0,12 Вт. 0805 даёт 0,125 Вт, остальные меньше: 0402 — 0,063 Вт, 0603 — 0,1 Вт."
  - id: p-010
    lesson: resistor-power-types
    difficulty: 3
    type: numeric
    formula:
      - "ΔR = R · TCR · ΔT"
      - "100 ppm/°C = 100·10⁻⁶ 1/°C"
    question: "Резистор 1 кОм имеет TCR 100 ppm/°C. На сколько ом изменится его сопротивление при нагреве на 60 °C?"
    answer: 6
    unit: "Ом"
    tolerance_percent: 2
    explanation: "ΔR = R × TCR × ΔT = 1000 × 100·10⁻⁶ × 60 = 6 Ом, то есть 0,6 %."
  # ───── Потенциометры ─────
  - id: p-011
    lesson: potentiometer
    difficulty: 1
    type: single
    question: "Что остаётся неизменным при вращении ручки потенциометра?"
    options:
      - "Сумма сопротивлений Ra и Rb, то есть сопротивление между крайними выводами"
      - "Сопротивление между движком и нижним выводом"
      - "Сопротивление между движком и верхним выводом"
    answer: 0
    explanation: "Дорожка между крайними выводами не меняется. Ra и Rb по отдельности меняются, но их сумма постоянна."
  - id: p-012
    lesson: potentiometer
    difficulty: 2
    type: numeric
    formula:
      - "Uвых = Uвх · доля пути"
    question: "Потенциометр 10 кОм (линейный) подключён к 3,3 В. Движок на 80 % пути от земли. Какое напряжение на движке без нагрузки?"
    answer: 2.64
    unit: "В"
    tolerance_percent: 2
    explanation: "Uвых = 3,3 × 0,8 = 2,64 В."
  - id: p-013
    lesson: potentiometer
    difficulty: 2
    type: single
    question: "Что означает маркировка «50K A» на потенциометре?"
    options:
      - "50 кОм, логарифмическая характеристика"
      - "50 кОм, линейная характеристика"
      - "5 кОм, логарифмическая характеристика"
    answer: 0
    explanation: "50K — полное сопротивление 50 кОм. Буква A означает логарифмическую зависимость, B — линейную."
  - id: p-014
    lesson: potentiometer
    difficulty: 3
    type: numeric
    formula:
      - "I = U / (R + R_реостата)"
      - "Ток минимален при максимальном сопротивлении реостата"
    question: "Реостат 0–470 Ом включён последовательно с резистором 100 Ом на 12 В. Каков наименьший ток в цепи?"
    answer: 21.05
    unit: "мА"
    tolerance_percent: 2
    explanation: "Наименьший ток при максимальном сопротивлении реостата: R = 100 + 470 = 570 Ом, I = 12 / 570 ≈ 21,05 мА. Наибольший при нуле реостата 120 мА."
  # ───── Роли резисторов ─────
  - id: p-015
    lesson: pullups-resistors-roles
    difficulty: 1
    type: single
    question: "Что делает резистор pull-down на цифровом входе?"
    options:
      - "Подтягивает вход к земле, чтобы в покое был низкий уровень"
      - "Подтягивает вход к питанию"
      - "Ограничивает ток светодиода"
    answer: 0
    explanation: "Pull-down соединяет вход с землёй через резистор. Подтяжка к питанию называется pull-up, а токоограничитель стоит в цепи нагрузки."
  - id: p-016
    lesson: pullups-resistors-roles
    difficulty: 2
    type: numeric
    formula:
      - "I = Vcc / R"
      - "В / кОм = мА; мА → мкА: × 1000"
    question: "Pull-up 22 кОм подключён к 3,3 В. Кнопка замыкает вход на землю. Какой ток течёт при нажатии? Ответ в микроамперах."
    answer: 150
    unit: "мкА"
    tolerance_percent: 2
    explanation: "I = 3,3 / 22 кОм = 0,15 мА = 150 мкА."
  - id: p-017
    lesson: pullups-resistors-roles
    difficulty: 2
    type: single
    question: "Резистор 0,1 Ом включён в минусовой провод аккумулятора, а напряжение на нём измеряет усилитель. Какую роль играет резистор?"
    options:
      - "Шунт для измерения тока"
      - "Подтяжка"
      - "Делитель напряжения"
    answer: 0
    explanation: "Очень малое сопротивление в силовой цепи с измерением падения напряжения на нём — типичный шунт. U = I·R пропорционально току."
  - id: p-018
    lesson: pullups-resistors-roles
    difficulty: 3
    type: single
    question: "К входу подключены одновременно pull-up 10 кОм к 3,3 В и pull-down 10 кОм к земле. Что на входе?"
    options:
      - "Около 1,65 В: неопределённый логический уровень"
      - "3,3 В, так как pull-up сильнее"
      - "0 В, так как земля сильнее"
    answer: 0
    explanation: "Два равных резистора образуют делитель, и на входе половина питания. Для цифровой логики это неопределённая зона. Подтяжка нужна одна."
  # ───── Предохранители ─────
  - id: p-019
    lesson: fuses-ptc
    difficulty: 1
    type: single
    question: "Плавкий предохранитель перегорел. Как правильно поступить?"
    options:
      - "Найти причину перегрузки и заменить предохранитель на такой же номинал"
      - "Поставить предохранитель большего номинала"
      - "Заменить перегоревший предохранитель проволокой"
    answer: 0
    explanation: "Предохранитель сработал не случайно. Больший номинал или проволока лишают цепь защиты и могут привести к пожару."
  - id: p-020
    lesson: fuses-ptc
    difficulty: 2
    type: numeric
    formula:
      - "I_предохранителя ≥ 1,25 · I_рабочий"
    question: "Нагрузка потребляет 1,6 А. Каков минимальный номинал плавкого предохранителя с запасом 1,25?"
    answer: 2
    unit: "А"
    tolerance_percent: 2
    explanation: "1,6 × 1,25 = 2,0 А."
  - id: p-021
    lesson: fuses-ptc
    difficulty: 2
    type: single
    question: "PTC-предохранитель в USB-цепи имеет I_hold = 0,75 А при 25 °C. Нагрузка потребляет 0,5 А. В корпусе жарко, и ток удержания снизился до 80 %. Будет ли он работать надёжно?"
    options:
      - "Да: 0,75 × 0,8 = 0,6 А больше рабочего тока 0,5 А"
      - "Нет: 0,6 А меньше 0,75 А"
      - "Нет: PTC в таком режиме обязательно срабатывает"
    answer: 0
    explanation: "Реальный ток удержания при жаре 0,6 А, а нагрузка берёт 0,5 А, запас остаётся. Сравнивать нужно именно рабочий ток с током удержания при нужной температуре."
  - id: p-022
    lesson: fuses-ptc
    difficulty: 3
    type: single
    question: "Почему плавкий предохранитель хуже защищает от перегрузки на 20–30 %, чем от короткого замыкания?"
    options:
      - "Нагрев пропорционален I²·t: при небольшой перегрузке вставка нагревается очень медленно"
      - "Предохранитель не реагирует на токи ниже номинала в 2 раза"
      - "При малой перегрузке сопротивление вставки падает"
    answer: 0
    explanation: "Время срабатывания обратно связано с I²: при 1,2× номинала оно минуты и даже бесконечность, а при КЗ — миллисекунды. Второй и третий варианты не соответствуют физике процесса."
  # ───── Термисторы и варисторы ─────
  - id: p-023
    lesson: thermistors-varistors
    difficulty: 1
    type: single
    question: "У NTC-термистора температурный коэффициент сопротивления…"
    options:
      - "Отрицательный: сопротивление падает при нагреве"
      - "Положительный: сопротивление растёт при нагреве"
      - "Равен нулю"
    answer: 0
    explanation: "Буква N означает Negative: с ростом температуры сопротивление уменьшается. Положительным коэффициентом обладают PTC."
  - id: p-024
    lesson: thermistors-varistors
    difficulty: 2
    type: numeric
    formula:
      - "R = R₀ · exp[β · (1/T − 1/T₀)]"
      - "R₀ = 10 кОм при T₀ = 298,15 K (25 °C), β = 3950 K"
      - "T (K) = t (°C) + 273,15"
    question: "Найди сопротивление NTC 10 кОм (β = 3950 K) при 75 °C. Ответ в килоомах."
    answer: 1.49
    unit: "кОм"
    tolerance_percent: 3
    explanation: "1/348,15 = 0,0028723; 1/298,15 = 0,0033540; разность −0,0004817; ×3950 = −1,903; exp(−1,903) = 0,1491; R = 1,49 кОм."
  - id: p-025
    lesson: thermistors-varistors
    difficulty: 2
    type: single
    question: "Как подключают варистор для защиты цепи от выбросов?"
    options:
      - "Параллельно защищаемой цепи, обычно после предохранителя"
      - "Последовательно с нагрузкой"
      - "Вместо предохранителя"
    answer: 0
    explanation: "Варистор шунтирует выброс, поэтому стоит параллельно. Последовательно он бы ограничивал рабочий ток. Заменить предохранитель он не может: при затянувшемся перенапряжении сам может сгореть."
  - id: p-026
    lesson: thermistors-varistors
    difficulty: 3
    type: numeric
    formula:
      - "R = R_цепи + R_NTC"
      - "I = U / R"
    question: "Блок питания 24 В, сопротивление цепи при включении 0,4 Ом. Последовательно включили холодный NTC 6 Ом. Каков начальный ток?"
    answer: 3.75
    unit: "А"
    tolerance_percent: 2
    explanation: "R = 0,4 + 6 = 6,4 Ом, I = 24 / 6,4 = 3,75 А. Без NTC было бы 60 А."
  # ───── Провода и разъёмы ─────
  - id: p-027
    lesson: wires-connectors
    difficulty: 1
    type: single
    question: "Какой провод толще: 18 AWG или 24 AWG?"
    options:
      - "18 AWG"
      - "24 AWG"
      - "Одинаковые"
    answer: 0
    explanation: "Чем меньше номер AWG, тем толще провод. 18 AWG около 0,82 мм², 24 AWG около 0,2 мм²."
  - id: p-028
    lesson: wires-connectors
    difficulty: 2
    type: numeric
    formula:
      - "R = ρ · 2L / S"
      - "ΔU = I · R"
      - "ρ меди = 0,0175 Ом·мм²/м"
    question: "Двухжильный кабель длиной 5 м, сечение жилы 1 мм², ток 5 А. Какое падение напряжения на кабеле (туда и обратно)?"
    answer: 0.875
    unit: "В"
    tolerance_percent: 3
    explanation: "R = 0,0175 × 2 × 5 / 1 = 0,175 Ом, ΔU = 5 × 0,175 = 0,875 В."
  - id: p-029
    lesson: wires-connectors
    difficulty: 2
    type: single
    question: "Какой разъём подходит для батареи с током нагрузки 20 А?"
    options:
      - "XT60"
      - "Dupont"
      - "JST-XH"
    answer: 0
    explanation: "XT60 рассчитан на токи до 60 А. Dupont и JST-XH рассчитаны на единицы ампер и при 20 А расплавятся."
  - id: p-030
    lesson: wires-connectors
    difficulty: 3
    type: numeric
    formula:
      - "P = I² · R"
    question: "Кабель имеет сопротивление 0,2 Ом, ток через него 3 А. Какая мощность выделяется в кабеле?"
    answer: 1.8
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P = I²R = 9 × 0,2 = 1,8 Вт."
  # ───── Проект «Термометр на NTC» ─────
  - id: p-031
    lesson: ntc-thermometer
    difficulty: 1
    type: single
    question: "К какому элементу делителя подключают вольтметр в проекте с NTC?"
    options:
      - "Параллельно нижнему резистору 10 кОм"
      - "Параллельно NTC"
      - "Последовательно с батареей"
    answer: 0
    explanation: "В расчётных формулах Uвых берут на нижнем резисторе. Если измерять на NTC, график будет развёрнут."
  - id: p-032
    lesson: ntc-thermometer
    difficulty: 2
    type: numeric
    formula:
      - "R_ntc = R · (Uвх / Uвых − 1)"
      - "R — нижний резистор"
    question: "Uвх = 3,00 В, нижний резистор 10 кОм, Uвых = 1,50 В. Найди R_ntc."
    answer: 10
    unit: "кОм"
    tolerance_percent: 2
    explanation: "R_ntc = 10 × (3,00 / 1,50 − 1) = 10 кОм. Это значение при 25 °C."
  - id: p-033
    lesson: ntc-thermometer
    difficulty: 2
    type: numeric
    formula:
      - "1/T = 1/T₀ + ln(R / R₀) / β"
      - "R₀ = 10 кОм при T₀ = 298,15 K (25 °C), β = 3950 K"
      - "T (K) = t (°C) + 273,15"
    question: "Сопротивление NTC 10 кОм (β = 3950 K) равно 3,59 кОм. Найди температуру в градусах Цельсия. Подсказка: ln 0,359 = −1,0244."
    answer: 50
    unit: "°C"
    tolerance_percent: 2
    explanation: "ln(0,359)/3950 = −0,0002593; 1/T = 0,0033540 − 0,0002593 = 0,0030947; T = 323,15 K = 50,0 °C."
  - id: p-034
    lesson: ntc-thermometer
    difficulty: 3
    type: single
    question: "Поменяли местами NTC и постоянный резистор: теперь NTC внизу, а вольтметр на нём. Что будет с Uвых при нагреве?"
    options:
      - "Уменьшится: сопротивление NTC падает, и его доля напряжения тоже"
      - "Увеличится"
      - "Не изменится"
    answer: 0
    explanation: "Теперь Uвых = Uвх · R_ntc / (R_ntc + R). При нагреве R_ntc падает, значит, падает и Uвых. При прежней схеме, наоборот, Uвых растёт."
