    question: При разборе задачи «Мощность и типы резисторов» какой вывод обоснован?
    options:
      - Запас по мощности позволяет превысить рабочее напряжение
      - Мощность и температурный режим проверяют отдельно от сопротивления.
      - Корпус любого производителя гарантирует одну мощность
    answer: 1
    hint: >-
      Вычисли потери, затем проверь номинальную мощность и температуру корпуса. Запас ×2 — начальная
      оценка, а не гарантия при любом охлаждении.
    explanation: >-
      Мощность и температурный режим проверяют отдельно от сопротивления. Два резистора одного
      номинала могут иметь разный размер и нагрев. Плёночные удобны для сигналов, проволочные — для
      больших потерь, но могут быть индуктивными. Размеры SMD 0402/0603/0805 не задают мощность без
      конкретного даташита. Допустимая мощность уменьшается с температурой согласно кривой derating.
      Ошибочные варианты: Корпус любого производителя гарантирует одну мощность; Запас по мощности
      позволяет превысить рабочее напряжение. Они не учитывают описанный принцип.
    id: passives-resistor-power-types-0
    lesson: resistor-power-types
    difficulty: 1
  - type: numeric
    question: >-
      Рассчитанные потери резистора 0,7 Вт. Какова минимальная номинальная мощность при запасе ровно
      ×2?
    answer: 1.4000000000000001
    unit: Вт
    tolerance_percent: 1
    hint: Pном ≥ 2·Pрасч — учебное правило запаса; реальный derating берут из даташита.
    explanation: 2×0,7 = 1,4 Вт.
    id: passives-resistor-power-types-1
    lesson: resistor-power-types
    difficulty: 1
