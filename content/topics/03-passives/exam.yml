    question: При разборе задачи «Провода, разъёмы, перемычки» какой вывод обоснован?
    options:
      - Для двухпроводного кабеля достаточно длины одной жилы
      - Любой разъём Dupont пригоден для силового мотора
      - Потери кабеля считают по обеим жилам замкнутого пути.
    answer: 2
    hint: >-
      Проверь ток разъёма, сечение провода, качество обжима и падение под нагрузкой. Название JST
      само по себе не определяет шаг, полярность и допустимый ток.
    explanation: >-
      Потери кабеля считают по обеим жилам замкнутого пути. На тонком длинном проводе мотор теряет
      напряжение. Сопротивление зависит от полного пути туда и обратно, а нагрев — от квадрата тока.
      AWG — система размеров с обратной нумерацией: меньший номер обычно означает более толстый
      провод. Dupont удобен для сигналов, но плох для больших токов. Ошибочные варианты: Для
      двухпроводного кабеля достаточно длины одной жилы; Любой разъём Dupont пригоден для силового
      мотора. Они не учитывают описанный принцип.
    id: passives-wires-connectors-0
    lesson: wires-connectors
    difficulty: 1
