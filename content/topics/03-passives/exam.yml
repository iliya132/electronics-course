    question: При разборе задачи «Маркировка резисторов» какой вывод обоснован?
    options:
      - 103 означает 103 Ом
      - Буква R всегда означает мегаомы
      - Последняя цифра стандартного трёхзначного SMD-кода задаёт множитель.
    answer: 2
    hint: >-
      Сначала определи систему маркировки, затем проверь мультиметром снятую деталь. Ряды
      E12/E24/E96 дают разную плотность номиналов и не заменяют чтение допуска.
    explanation: >-
      Последняя цифра стандартного трёхзначного SMD-кода задаёт множитель. На маленьком
      SMD-резисторе помещается всего несколько символов. В коде 103 первые две цифры значащие,
      третья задаёт степень десяти: 10 кОм. 4R7 означает 4,7 Ом; 1002 — 10 кОм. EIA-96 использует
      отдельную таблицу, поэтому 01C нельзя читать как обычные три цифры. Цветовые полосы кодируют
      цифры, множитель и допуск. Ошибочные варианты: 103 означает 103 Ом; Буква R всегда означает
      мегаомы. Они не учитывают описанный принцип.
    id: passives-resistor-marking-0
    lesson: resistor-marking
    difficulty: 1
  - type: numeric
    question: 'Расшифруй трёхзначный SMD-код 172: первые две цифры значащие, последняя — степень десяти.'
    answer: 1700
    unit: Ом
    tolerance_percent: 1
    hint: Код ABN означает (10A+B)·10ᴺ Ом. R в коде обозначает десятичную точку.
    explanation: "17 × 10² = 1\_700 Ом."
    id: passives-resistor-marking-1
