    question: При разборе задачи «Схема минимальной платы с МК» какой вывод обоснован?
    options:
      - Готовый радиомодуль можно окружить медью со всех сторон
      - Сброс и загрузку всегда можно добавить после изготовления платы
      - Модуль уменьшает сложность радиочасти, но не отменяет требований питания и антенны.
    answer: 2
    hint: >-
      Проверь каждый вывод питания и зарезервированные выводы, затем boot-уровни, доступ к прошивке
      и контрольные точки. Не копируй распиновку другого семейства.
    explanation: >-
      Модуль уменьшает сложность радиочасти, но не отменяет требований питания и антенны.
      Минимальная плата МК — это набор обязательных обеспечивающих узлов. Нужны питание и развязка,
      сброс, загрузка, тактирование по выбранному модулю, разъём отладки и безопасные интерфейсы.
      Готовый ESP32-модуль уже содержит часть высокочастотных узлов, но требует зоны антенны.
      Ошибочные варианты: Готовый радиомодуль можно окружить медью со всех сторон; Сброс и загрузку
      всегда можно добавить после изготовления платы. Они не учитывают описанный принцип.
    id: board-design-mcu-board-schematic-0
    lesson: mcu-board-schematic
    difficulty: 1
  - type: numeric
