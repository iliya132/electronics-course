    question: При разборе задачи «Шилд Arduino в KiCad» какой вывод обоснован?
    options:
      - Физическое совпадение гарантирует отсутствие конфликта выводов
      - Механическое соответствие шилда проверяют независимо от электрической схемы.
      - Все разъёмы Uno лежат на единой регулярной сетке
    answer: 1
    hint: >-
      Сначала проверь расположение разъёмов по официальным механическим данным Uno R3; шаг между
      группами не везде равен обычной сетке.
    explanation: >-
      Механическое соответствие шилда проверяют независимо от электрической схемы. Спроектируем
      простой шилд для Uno R3. Светодиоды, кнопка и I²C-разъём должны совпасть с механикой
      конкретной платы и не конфликтовать по выводам. Ошибочные варианты: Все разъёмы Uno лежат на
      единой регулярной сетке; Физическое совпадение гарантирует отсутствие конфликта выводов. Они
      не учитывают описанный принцип.
    id: board-design-arduino-shield-0
    lesson: arduino-shield
    difficulty: 1
