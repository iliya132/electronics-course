    question: При разборе задачи «Земля и возвратные токи» какой вывод обоснован?
    options:
      - Сплошной близкий возврат уменьшает петлю быстрого сигнала.
      - Земляная плоскость не несёт токов
      - Любое разрезание земли улучшает аналоговую точность
    answer: 0
    hint: >-
      Не разрывай плоскость под быстрыми линиями. Разделяй шумные токи размещением, а звезду
      применяй по конкретной низкочастотной задаче, не автоматически.
    explanation: >-
      Сплошной близкий возврат уменьшает петлю быстрого сигнала. Ток всегда возвращается к
      источнику, даже если обратный путь не нарисован явно. На высокой частоте путь стремится
      минимизировать импеданс и площадь петли, часто проходя под сигнальной дорожкой по сплошной
      плоскости. Разрез под быстрым сигналом заставляет возврат обходить препятствие и увеличивает
      излучение. Ошибочные варианты: Земляная плоскость не несёт токов; Любое разрезание земли
      улучшает аналоговую точность. Они не учитывают описанный принцип.
    id: board-design-ground-plane-0
    lesson: ground-plane
    difficulty: 1
