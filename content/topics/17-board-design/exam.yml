    question: При разборе задачи «Производство» какой вывод обоснован?
    options:
      - Проверять нужно именно экспортированные производственные файлы.
      - Файл проекта автоматически является готовым заказом для любого производителя
      - Поворот деталей не важен для сборки
    answer: 0
    hint: >-
      Просмотри выходные файлы независимым просмотрщиком и сравни число деталей, ориентацию и
      отверстия. Не делай заказ только по виду редактора.
    explanation: >-
      Проверять нужно именно экспортированные производственные файлы. Производителю нужны
      однозначные данные. Gerber описывает слои, сверловка — отверстия, BOM — компоненты,
      позиционный файл — координаты и ориентацию сборки. Допуски, минимальные зазоры, маска и
      доступность деталей зависят от конкретной технологии и заказа. Ошибочные варианты: Файл
      проекта автоматически является готовым заказом для любого производителя; Поворот деталей не
      важен для сборки. Они не учитывают описанный принцип.
    id: board-design-dfm-bom-order-0
    lesson: dfm-bom-order
    difficulty: 1
