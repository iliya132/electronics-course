  - type: single
    question: При разборе задачи «Правила хорошей схемы» какой вывод обоснован?
    options:
      - Две похожие надписи всегда означают одну электрическую цепь
      - Схема должна однозначно передавать электрические соединения и номиналы.
      - Красивое расположение заменяет правильные имена цепей
    answer: 1
    hint: >-
      Раздели схему на питание, контроллер, интерфейсы и нагрузку. Подпиши номиналы и не скрывай
      важную связь только похожим названием.
    explanation: >-
      Схема должна однозначно передавать электрические соединения и номиналы. Хорошую схему можно
      проверить без угадывания проводов. Сигналы удобно вести слева направо, питание сверху, землю
      снизу; названия цепей должны быть однозначны. R, C, L, D, Q, U, J, F, Y и TP обозначают разные
      классы компонентов, а номиналы и корпуса входят в документацию. Ошибочные варианты: Красивое
      расположение заменяет правильные имена цепей; Две похожие надписи всегда означают одну
      электрическую цепь. Они не учитывают описанный принцип.
    id: board-design-schematic-style-0
    lesson: schematic-style
    difficulty: 1
  - type: numeric
