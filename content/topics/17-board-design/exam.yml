    question: При разборе задачи «Трассировка» какой вывод обоснован?
    options:
      - DRC автоматически рассчитывает все реальные тепловые режимы
      - Ширину дорожки выбирают вместе с толщиной меди и допустимым нагревом.
      - Для любого слоя 1 А всегда требует ровно 0,3 мм
    answer: 1
    hint: >-
      Настрой ограничения производителя, размести развязку у выводов и минимизируй горячие петли до
      общей трассировки. Проверь зазоры, via и возвращающийся ток.
    explanation: >-
      Ширину дорожки выбирают вместе с толщиной меди и допустимым нагревом. Узкая дорожка и большая
      токовая петля создают нагрев и помехи. Ширина зависит от тока, толщины меди, допустимого
      нагрева, слоёв и охлаждения. Формула IPC-2221 — грубый ориентир, а не универсальная гарантия;
      фиксированное правило 1 А на 0,3 мм не подходит всем платам. Ошибочные варианты: Для любого
      слоя 1 А всегда требует ровно 0,3 мм; DRC автоматически рассчитывает все реальные тепловые
      режимы. Они не учитывают описанный принцип.
    id: board-design-pcb-layout-basics-0
    lesson: pcb-layout-basics
    difficulty: 1
  - type: numeric
    question: >-
      Оценка IPC-2221 для внешнего слоя: I=1,4 А, ΔT=10 °C, медь 35 мкм (1,378 mil). Найди ширину в
      мм при I=0,048·ΔT^0,44·A^0,725, A в mil².
    answer: 0.4777728449398405
    unit: мм
    tolerance_percent: 1
    hint: >-
      A=[I/(0,048·ΔT^0,44)]^(1/0,725); w=A/t. 1 mil=0,0254 мм. Это приближение, не универсальное
      правило разводки.
    explanation: '[1,4/(0,048×10^0,44)]^(1/0,725)/1,378×0,0254 = 0,477773 мм.'
    id: board-design-pcb-layout-basics-1
    lesson: pcb-layout-basics
    difficulty: 1
