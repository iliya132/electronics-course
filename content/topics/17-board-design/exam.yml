    explanation: >-
      Отладку новой платы начинают с питания и базовых сигналов. Новую плату включают постепенно.
      Сначала осмотр и проверка коротких замыканий, затем питание с ограничением тока, проверка
      линий, сброса и тактирования. Только после этого загружают простую диагностическую программу.
      Полная прикладная прошивка сразу затрудняет поиск причины. Ошибочные варианты: Новый прототип
      сразу включают от мощной батареи без ограничения; Любая ошибка загрузки доказывает
      неисправность микроконтроллера. Они не учитывают описанный принцип.
