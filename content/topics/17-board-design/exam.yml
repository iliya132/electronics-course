    question: При разборе задачи «Проект мини-платы ESP32» какой вывод обоснован?
    options:
      - Классический ESP32-WROOM требует USB-UART для обычной загрузки по USB.
      - У любого ESP32 есть одинаковый нативный USB
      - Антенный keepout является необязательным украшением
    answer: 0
    hint: >-
      Используй точный reference design выбранного модуля и USB-моста; не подключай D+/D− напрямую к
      классическому ESP32 без нативного USB.
    explanation: >-
      Классический ESP32-WROOM требует USB-UART для обычной загрузки по USB. Спроектируем
      минимальную плату с классическим ESP32-модулем. Включим USB-C питание, LDO 3,3 В, USB-UART,
      EN/BOOT и датчиковый разъём, сохранив антенный keepout. Ошибочные варианты: У любого ESP32
      есть одинаковый нативный USB; Антенный keepout является необязательным украшением. Они не
      учитывают описанный принцип.
    id: board-design-esp32-mini-schematic-0
    lesson: esp32-mini-schematic
    difficulty: 1
