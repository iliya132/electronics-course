    question: При разборе задачи «Корпуса и посадочные места» какой вывод обоснован?
    options:
      - Метрические и дюймовые коды SMD всегда равны
      - Тепловую площадку можно всегда оставить неподключённой
      - Название корпуса без размеров и варианта не гарантирует правильный футпринт.
    answer: 2
    hint: >-
      Сверь размер корпуса, шаг, номер первого вывода, exposed pad и рекомендуемый land pattern. Для
      ручной пайки выбирай доступный размер и проверь распечатку 1:1.
    explanation: >-
      Название корпуса без размеров и варианта не гарантирует правильный футпринт. Микросхема должна
      попасть выводами на площадки. THT проходит через отверстия, SMD монтируется на поверхности.
      Дюймовые 0402/0603/0805 нельзя путать с метрическими кодами. SOT-23, SOIC и QFN имеют разные
      шаги и требования, а теплоплощадка может быть электрическим выводом. Ошибочные варианты:
      Метрические и дюймовые коды SMD всегда равны; Тепловую площадку можно всегда оставить
      неподключённой. Они не учитывают описанный принцип.
    id: board-design-packages-footprints-0
    lesson: packages-footprints
    difficulty: 1
