  - type: single
    question: При разборе задачи «Как читать даташит» какой вывод обоснован?
    options:
      - Absolute Maximum задаёт рекомендуемый режим работы
      - Одинаковая маркировка разных изготовителей гарантирует одинаковую устойчивость
      - Типичное значение не является гарантированным пределом каждого экземпляра.
    answer: 2
    hint: >-
      Найди питание, распиновку, рабочие пределы, типовую схему и требования к конденсаторам. Запиши
      условия, при которых задан параметр.
    explanation: >-
      Типичное значение не является гарантированным пределом каждого экземпляра. Описание магазина
      не заменяет даташит изготовителя. Absolute Maximum Ratings — границы повреждения, Recommended
      Operating Conditions — рабочие условия. Таблицы гарантированных min/max важнее типичных
      графиков для расчёта худшего случая. Суффикс корпуса может менять распиновку и тепловые
      характеристики. Ошибочные варианты: Absolute Maximum задаёт рекомендуемый режим работы;
      Одинаковая маркировка разных изготовителей гарантирует одинаковую устойчивость. Они не
      учитывают описанный принцип.
    id: board-design-datasheet-reading-0
    lesson: datasheet-reading
    difficulty: 1
