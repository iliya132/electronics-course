    question: При разборе задачи «ЭМС и ESD (обзор)» какой вывод обоснован?
    options:
      - Большая ёмкость TVS всегда безвредна для USB
      - Эффективность ESD-защиты зависит от расположения и возвратного пути.
      - Любой TVS в любом месте гарантирует защиту всего устройства
    answer: 1
    hint: >-
      Размести защиту у разъёма до длинной трассы внутрь платы. Учебные проверки не заменяют
      испытаний ЭМС и электрической безопасности.
    explanation: >-
      Эффективность ESD-защиты зависит от расположения и возвратного пути. Кабели заносят выбросы и
      излучают помехи. ESD-защита должна перехватывать импульс у входа, а путь возврата — быть
      коротким. Малые петли, непрерывная земля, фильтрация и правильная развязка снижают источники
      помех. TVS выбирают также по ёмкости, чтобы не испортить быстрый интерфейс. Ошибочные
      варианты: Любой TVS в любом месте гарантирует защиту всего устройства; Большая ёмкость TVS
      всегда безвредна для USB. Они не учитывают описанный принцип.
    id: board-design-emc-esd-basics-0
    lesson: emc-esd-basics
    difficulty: 1
  - type: numeric
    question: Катушка 70 мкГн несёт ток 2 А. Найди энергию в микроджоулях.
    answer: 140
    unit: мкДж
    tolerance_percent: 1
    hint: E = LI²/2; L в Гн, I в А, E в Дж. Для мкГн энергия получится в мкДж.
    explanation: 70 × 2² / 2 = 140 мкДж.
    id: board-design-emc-esd-basics-1
    lesson: emc-esd-basics
    difficulty: 1
