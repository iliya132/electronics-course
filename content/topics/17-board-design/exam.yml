  - type: single
    question: 'При разборе задачи «KiCad: первый проект» какой вывод обоснован?'
    options:
      - Символ и футпринт связаны номерами выводов, но проверяются отдельно.
      - Футпринт автоматически верен, если совпало название компонента
      - ERC гарантирует физическую совместимость корпуса
    answer: 0
    hint: >-
      Для каждой детали сверь номер вывода символа с номером площадки футпринта и даташитом. Ошибку
      этой связи ERC может не заметить.
    explanation: >-
      Символ и футпринт связаны номерами выводов, но проверяются отдельно. Первый проект платы
      начинается со схемы, а не с дорожек. В KiCad размещают символы, соединяют цепи, назначают
      позиционные обозначения и футпринты, запускают ERC и передают данные в редактор платы. Символ
      показывает электрическую функцию, футпринт — реальные контактные площадки. Ошибочные варианты:
      Футпринт автоматически верен, если совпало название компонента; ERC гарантирует физическую
      совместимость корпуса. Они не учитывают описанный принцип.
    id: board-design-kicad-start-0
    lesson: kicad-start
    difficulty: 1
  - type: numeric
    question: Разъём имеет 8 контактов с шагом 2,54 мм. Каково расстояние между центрами крайних контактов?
    answer: 17.78
    unit: мм
    tolerance_percent: 1
    hint: Длина между крайними центрами = (N−1)·шаг. Габарит корпуса обычно больше.
    explanation: (8−1)×2,54 = 17,78 мм.
    id: board-design-kicad-start-1
    lesson: kicad-start
    difficulty: 1
