  - type: single
    question: При разборе задачи «Подготовка сигнала датчика» какой вывод обоснован?
    options:
      - Любой датчик можно напрямую подключить к любому АЦП
      - Сигнал должен физически укладываться в диапазон АЦП до оцифровки.
      - Функция map защищает вход от перенапряжения
    answer: 1
    hint: >-
      Проверь минимум и максимум сигнала до подключения АЦП. Ограничение, фильтрация и калибровка
      решают разные задачи.
    explanation: >-
      Сигнал должен физически укладываться в диапазон АЦП до оцифровки. АЦП не понимает
      отрицательные напряжения или слишком высокий уровень. Подготовка сигнала включает
      преобразование сопротивления в напряжение, смещение, усиление, буфер и фильтр. Нельзя
      исправить превышение входного диапазона только программным масштабированием. Ошибочные
      варианты: Функция map защищает вход от перенапряжения; Любой датчик можно напрямую подключить
      к любому АЦП. Они не учитывают описанный принцип.
    id: analog-sensor-conditioning-0
    lesson: sensor-conditioning
    difficulty: 1
