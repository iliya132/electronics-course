    question: При разборе задачи «Измерение тока» какой вывод обоснован?
    options:
      - Шунт не влияет на измеряемую цепь
      - Тонкие длинные измерительные дорожки должны нести весь силовой ток
      - Малое сопротивление шунта уменьшает потери, но усложняет измерение малого сигнала.
    answer: 2
    hint: >-
      Выбирай допуск, мощность и расположение шунта; не включай сопротивление силовых дорожек в
      измеряемое падение.
    explanation: >-
      Малое сопротивление шунта уменьшает потери, но усложняет измерение малого сигнала. Ток удобно
      измерить по падению на известном малом сопротивлении. Шунт даёт U=IR и теряет I²R мощности.
      Нижний шунт поднимает землю нагрузки, верхний сохраняет её, но требует усилителя с подходящим
      common-mode диапазоном. Для точности используют отдельные измерительные проводники Kelvin.
      Ошибочные варианты: Шунт не влияет на измеряемую цепь; Тонкие длинные измерительные дорожки
      должны нести весь силовой ток. Они не учитывают описанный принцип.
    id: analog-current-sense-0
    lesson: current-sense
    difficulty: 1
  - type: numeric
