  - type: single
    question: При разборе задачи «Компаратор и гистерезис (триггер Шмитта)» какой вывод обоснован?
    options:
      - Гистерезис означает один неизменный порог
      - Выход LM393 активно формирует высокий уровень без подтяжки
      - Гистерезис разделяет пороги включения и выключения.
    answer: 2
    hint: >-
      Плавно увеличивай и уменьшай вход, записывай оба порога. Проверь подтяжку и допустимый
      common-mode диапазон.
    explanation: >-
      Гистерезис разделяет пороги включения и выключения. Шум возле порога заставляет выход быстро
      переключаться. Компаратор сравнивает входы, а положительная обратная связь создаёт два порога.
      LM393 имеет открытый коллектор и требует подтяжки. Порог переключения зависит от предыдущего
      состояния и цепи обратной связи. Ошибочные варианты: Гистерезис означает один неизменный
      порог; Выход LM393 активно формирует высокий уровень без подтяжки. Они не учитывают описанный
      принцип.
    id: analog-comparator-hysteresis-0
    lesson: comparator-hysteresis
    difficulty: 1
  - type: numeric
    question: Верхний порог компаратора 2,7 В, нижний 1,5 В. Какова ширина гистерезиса?
    answer: 1.2000000000000002
    unit: В
    tolerance_percent: 1
    hint: ΔUгист = Uверх−Uниз. Внутри окна сохраняется предыдущее состояние.
    explanation: 2,7−1,5 = 1,2 В.
    id: analog-comparator-hysteresis-1
    lesson: comparator-hysteresis
    difficulty: 1
