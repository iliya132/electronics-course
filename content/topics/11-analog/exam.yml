    question: При разборе задачи «Таймер 555» какой вывод обоснован?
    options:
      - Выход 555 можно нагружать без проверки тока
      - Частота и заполнение 555 задаются времязадающими R и C.
      - Стандартная астабильная схема без диода даёт любое заполнение ниже 50 %
    answer: 1
    hint: >-
      Проверь распиновку, RESET, питание и развязку. Разные CMOS и биполярные варианты имеют разные
      пределы питания и выходного тока.
    explanation: >-
      Частота и заполнение 555 задаются времязадающими R и C. Мигалку можно собрать без программы.
      Таймер 555 переключается около одной и двух третей питания и управляет зарядом конденсатора
      через резисторы. В астабильной схеме tH=ln(2)(R1+R2)C, tL=ln(2)R2C; обычная схема даёт
      заполнение выше половины. Моностабильная формирует один импульс. Ошибочные варианты:
      Стандартная астабильная схема без диода даёт любое заполнение ниже 50 %; Выход 555 можно
      нагружать без проверки тока. Они не учитывают описанный принцип.
    id: analog-timer-555-0
    lesson: timer-555
    difficulty: 1
  - type: numeric
    question: 'Астабильный 555: R1 = 10 кОм, R2 = 70 кОм, C = 10 мкФ. Найди частоту.'
    answer: 0.9617966939259756
    unit: Гц
    tolerance_percent: 1
    hint: f = 1/[ln(2)·(R1+2R2)·C] ≈ 1,443/[(R1+2R2)C]. Сопротивления в Ом, C в Ф.
    explanation: 1/[ln(2)×(10000+2×70000)×10×10⁻⁶] = 0,961797 Гц.
    id: analog-timer-555-1
    lesson: timer-555
    difficulty: 1
