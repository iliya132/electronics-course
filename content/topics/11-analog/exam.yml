  - type: single
    question: При разборе задачи «Неинвертирующий и инвертирующий усилители» какой вывод обоснован?
    options:
      - Расчётное усиление реализуется только без ограничения входа и выхода.
      - Резисторы позволяют получить любой выход за пределами питания
      - Инвертирующая схема имеет положительное усиление
    answer: 0
    hint: >-
      Сначала рассчитай крайние значения выхода, затем проверь диапазон входов и запас до шин.
      Нельзя получить отрицательный выход от обычного ОУ с единственным положительным питанием без
      смещения.
    explanation: >-
      Расчётное усиление реализуется только без ограничения входа и выхода. Обратная связь позволяет
      точно задать усиление резисторами. У неинвертирующей схемы K=1+Rf/Rg; у инвертирующей
      K=−Rf/Rin, минус означает смену фазы. Выход ограничен питанием, полосой и скоростью
      нарастания. Для однополярного питания часто нужно смещение сигнала. Ошибочные варианты:
      Резисторы позволяют получить любой выход за пределами питания; Инвертирующая схема имеет
      положительное усиление. Они не учитывают описанный принцип.
    id: analog-non-inverting-inverting-0
    lesson: non-inverting-inverting
    difficulty: 1
