      обоснован?
    options:
      - Опора характеризуется точностью, дрейфом и рабочим режимом.
      - Любой источник питания является точной опорой
      - TL431 подключают поперёк питания без ограничения тока
    answer: 0
    hint: >-
      Проверь минимальный катодный ток, устойчивость с ёмкостью и рассеиваемую мощность. Не путай
      TL431 с произвольным стабилитроном без ограничителя.
    explanation: >-
      Опора характеризуется точностью, дрейфом и рабочим режимом. Точность вольтметра зависит от
      опорного напряжения. Источник опоры задаёт стабильный уровень, но имеет допуск, температурный
      дрейф, шум и требования к нагрузке. TL431 — регулируемый шунтирующий элемент с внутренней
      опорой около 2,495 В у классического варианта; ему нужен ток через внешний резистор. Ошибочные
      варианты: Любой источник питания является точной опорой; TL431 подключают поперёк питания без
      ограничения тока. Они не учитывают описанный принцип.
    id: analog-reference-voltage-0
    lesson: reference-voltage
    difficulty: 1
