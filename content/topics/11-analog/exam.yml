  - type: single
    question: При разборе задачи «Повторитель напряжения (буфер)» какой вывод обоснован?
    options:
      - Любой ОУ устойчив при единичном усилении
      - Повторитель разгружает источник, сохраняя напряжение в пределах своего режима.
      - Повторитель обязательно увеличивает напряжение в десять раз
    answer: 1
    hint: >-
      Проверь устойчивость ОУ при единичном усилении и ёмкостной нагрузке. Повторитель не повышает
      допустимое входное напряжение выше диапазона питания.
    explanation: >-
      Повторитель разгружает источник, сохраняя напряжение в пределах своего режима. Высокоомный
      делитель проседает при подключении нагрузки. Повторитель соединяет выход ОУ с инвертирующим
      входом и принимает сигнал на неинвертирующий. Усиление близко к единице, но входное
      сопротивление высокое, а выход способен отдавать больший ток в пределах спецификации.
      Ошибочные варианты: Повторитель обязательно увеличивает напряжение в десять раз; Любой ОУ
      устойчив при единичном усилении. Они не учитывают описанный принцип.
    id: analog-voltage-follower-0
    lesson: voltage-follower
    difficulty: 1
  - type: numeric
    question: >-
      Ненагруженный делитель: Uвх = 5 В, R1 сверху = 10 кОм, R2 снизу = 7 кОм. Найди Uвых
      относительно GND.
    answer: 2.0588235294117645
    unit: В
    tolerance_percent: 1
    hint: Uвых = Uвх·R2/(R1+R2); одинаковые приставки сопротивлений сокращаются. 1 кОм = 1000 Ом.
    explanation: 5 × 7/(10+7) = 2,05882 В.
    id: analog-voltage-follower-1
    lesson: voltage-follower
    difficulty: 1
