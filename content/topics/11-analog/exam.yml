    question: При разборе задачи «Амперметр на шунте» какой вывод обоснован?
    options:
      - Нулевое смещение и коэффициент усиления проверяют раздельно.
      - Одной калибровки нуля достаточно для любой точности
      - Любой ОУ способен измерить шунт около любой шины питания
    answer: 0
    hint: >-
      Калибруй ноль без нагрузки и масштаб по известному току. Для малого сигнала смещение ОУ может
      быть значительной частью результата.
    explanation: >-
      Нулевое смещение и коэффициент усиления проверяют раздельно. Сделаем измеритель небольшого
      тока по шунту и усилителю. Сравним выход с эталонным мультиметром и оценим нулевое смещение.
      Ошибочные варианты: Одной калибровки нуля достаточно для любой точности; Любой ОУ способен
      измерить шунт около любой шины питания. Они не учитывают описанный принцип.
    id: analog-shunt-ammeter-0
    lesson: shunt-ammeter
    difficulty: 1
