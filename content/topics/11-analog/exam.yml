id: exam-analog
topic: analog
pass_percent: 70
questions_per_attempt: 10
questions:
  - id: "an-001"
    lesson: "opamp-basics"
    difficulty: 1
    type: "single"
    question: "Что происходит с выходом ОУ без обратной связи при заметной разности входов?"
    options:
      - "Выход насыщается у одного из пределов питания"
      - "Выход равен нулю всегда"
      - "Выход равен среднему входу"
    answer: 0
    explanation: "Усиление огромно, выход прижимается к границе питания: ОУ работает как компаратор."
  - id: "an-002"
    lesson: "opamp-basics"
    difficulty: 2
    type: "single"
    question: "Чему равна разность V+ − V− в идеальном ОУ с отрицательной обратной связью?"
    options:
      - "Нулю"
      - "Напряжению питания"
      - "Бесконечности"
    answer: 0
    explanation: "При конечном выходе и бесконечном усилении разность стремится к нулю."
  - id: "an-003"
    lesson: "opamp-basics"
    difficulty: 2
    type: "numeric"
    formula:
      - "Uвх_разн = Uвых / A"
    question: "ОУ с A = 200 000, питание 0…3,3 В. При какой разности входов выход достигнет 3,3 В? Ответ в микровольтах."
    answer: 16.5
    unit: "мкВ"
    tolerance_percent: 3
    explanation: "3,3 / 200 000 = 16,5 мкВ."
  - id: "an-004"
    lesson: "opamp-basics"
    difficulty: 1
    type: "single"
    question: "Почему для питания 3,3 В выбирают ОУ rail-to-rail?"
    options:
      - "Он выдаёт сигнал почти до границ питания"
      - "Он мощнее"
      - "Он не требует питания"
    answer: 0
    explanation: "У обычного ОУ выход не доходит до шины питания на 1–1,5 В."
  - id: "an-005"
    lesson: "voltage-follower"
    difficulty: 1
    type: "single"
    question: "Какое усиление у повторителя напряжения?"
    options:
      - "Равно 1"
      - "Равно 10"
      - "Равно 0"
    answer: 0
    explanation: "V− = V+, и выход соединён с V−, поэтому Vвых = Vвх."
  - id: "an-006"
    lesson: "voltage-follower"
    difficulty: 2
    type: "numeric"
    formula:
      - "R2экв = R2 · Rн / (R2 + Rн)"
      - "Uвых = Uвх · R2экв / (R1 + R2экв)"
      - "Нагрузка Rн включена параллельно R2"
    question: "Делитель 47 кОм + 47 кОм от 5 В, нагрузка 47 кОм параллельно нижнему резистору. Напряжение на нагрузке без буфера? Ответ в вольтах."
    answer: 1.67
    unit: "В"
    tolerance_percent: 3
    explanation: "Нижнее плечо 47 ‖ 47 = 23,5 кОм; U = 5 · 23,5 / (47 + 23,5) = 1,67 В."
  - id: "an-007"
    lesson: "voltage-follower"
    difficulty: 2
    type: "single"
    question: "Зачем ставят 10–100 Ом последовательно с выходом ОУ при ёмкостной нагрузке?"
    options:
      - "Чтобы избежать возбуждения"
      - "Чтобы увеличить K"
      - "Чтобы снизить питание"
    answer: 0
    explanation: "Резистор отделяет выход от ёмкости и сохраняет запас по фазе."
  - id: "an-008"
    lesson: "voltage-follower"
    difficulty: 2
    type: "numeric"
    formula:
      - "U_ошибки = I_утечки · R_источника"
    question: "Утечка входа АЦП 2 мкА, сопротивление источника 10 кОм. Ошибка по напряжению в милливольтах?"
    answer: 20
    unit: "мВ"
    tolerance_percent: 3
    explanation: "2 мкА · 10 кОм = 20 мВ."
  - id: "an-009"
    lesson: "non-inverting-inverting"
    difficulty: 1
    type: "numeric"
    formula:
      - "K = 1 + Rf / Rg"
    question: "Неинвертирующий усилитель, Rf = 47 кОм, Rg = 4,7 кОм. Чему равно K? Ответ числом."
    answer: 11
    unit: "раз"
    tolerance_percent: 3
    explanation: "K = 1 + 47/4,7 = 11."
  - id: "an-010"
    lesson: "non-inverting-inverting"
    difficulty: 2
    type: "numeric"
    formula:
      - "K = −Rf / Rin"
    question: "Инвертирующий усилитель, Rin = 4,7 кОм, Rf = 47 кОм. Чему равно K (со знаком)?"
    answer: -10
    unit: "раз"
    tolerance_percent: 3
    explanation: "K = −Rf/Rin = −10."
  - id: "an-011"
    lesson: "non-inverting-inverting"
    difficulty: 2
    type: "single"
    question: "Что ограничивает выход усилителя при больших входных сигналах?"
    options:
      - "Напряжение питания"
      - "Сопротивление Rg"
      - "Усиление ОУ"
    answer: 0
    explanation: "Выход не может превысить диапазон питания: сигнал срезается."
  - id: "an-012"
    lesson: "non-inverting-inverting"
    difficulty: 2
    type: "numeric"
    formula:
      - "Uвых = K · Uвх"
      - "не больше напряжения питания"
    question: "Усилитель K = 21, вход 0,12 В, питание 3,3 В (идеальный rail-to-rail). Каков выход? Ответ в вольтах."
    answer: 2.52
    unit: "В"
    tolerance_percent: 3
    explanation: "21 · 0,12 = 2,52 В < 3,3 В."
  - id: "an-013"
    lesson: "comparator-hysteresis"
    difficulty: 1
    type: "single"
    question: "Чем гистерезис полезен в компараторе?"
    options:
      - "Не даёт выходу дребезжать у порога из-за шума"
      - "Увеличивает усиление"
      - "Снижает питание"
    answer: 0
    explanation: "Два разных порога переключения исключают мелкие переключения."
  - id: "an-014"
    lesson: "comparator-hysteresis"
    difficulty: 2
    type: "numeric"
    formula:
      - "ΔU = V_H · R1 / Rf"
    question: "V_H = 5 В, R1 = 4,7 кОм, Rf = 47 кОм. Гистерезис в милливольтах?"
    answer: 500
    unit: "мВ"
    tolerance_percent: 3
    explanation: "ΔU = 5 · 4,7/47 = 0,5 В."
