questions:
  - type: single
    question: При разборе задачи «Операционный усилитель» какой вывод обоснован?
    options:
      - Любые входы ОУ всегда имеют одинаковое напряжение
      - Rail-to-rail гарантирует идеальный выход при любой нагрузке
      - Равенство входных напряжений ОУ — следствие отрицательной обратной связи в линейном режиме.
    answer: 2
    hint: >-
      Проверь питание, common-mode диапазон и выходной swing. Rail-to-rail уточняет, какой вход или
      выход приближается к шинам, и при каких условиях.
    explanation: >-
      Равенство входных напряжений ОУ — следствие отрицательной обратной связи в линейном режиме.
      Слабое напряжение датчика нужно увеличить без сильной нагрузки на датчик. ОУ усиливает
      разность двух входов. При отрицательной обратной связи и линейном режиме входные напряжения
      близки, а входные токи малы в идеальной модели. Эти правила не действуют при насыщении,
      неправильном питании или выходе за входной диапазон. Ошибочные варианты: Любые входы ОУ всегда
      имеют одинаковое напряжение; Rail-to-rail гарантирует идеальный выход при любой нагрузке. Они
      не учитывают описанный принцип.
    id: analog-opamp-basics-0
    lesson: opamp-basics
    difficulty: 1
  - type: numeric
    question: 'Неинвертирующий ОУ: Rf = 70 кОм, Rg = 10 кОм. Найди усиление.'
    answer: 8
    unit: раз
    tolerance_percent: 1
    hint: K = 1+Rf/Rg при отрицательной обратной связи и отсутствии ограничения выхода.
    explanation: 1+70/10 = 8 раз.
    id: analog-opamp-basics-1
    lesson: opamp-basics
    difficulty: 1
