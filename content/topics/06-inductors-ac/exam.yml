id: exam-inductors-ac
topic: inductors-ac
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Катушка индуктивности ─────
  - id: i-001
    lesson: inductor-basics
    difficulty: 1
    type: single
    question: "В каких единицах измеряется индуктивность?"
    options:
      - "В генри (Гн)"
      - "В фарадах (Ф)"
      - "В омах (Ом)"
    answer: 0
    explanation: "Единица индуктивности — генри. Фарад — единица ёмкости, ом — сопротивления."
  - id: i-002
    lesson: inductor-basics
    difficulty: 1
    type: numeric
    formula:
      - "U = L · ΔI / Δt"
      - "L — в генри, Δt — в секундах"
    question: "Ток через катушку 2 мГн растёт на 0,1 А за 0,5 мс. Каково напряжение на катушке? Ответ в вольтах."
    answer: 0.4
    unit: "В"
    tolerance_percent: 2
    explanation: "U = L·ΔI/Δt = 0,002 × 0,1 / 0,0005 = 0,4 В."
  - id: i-003
    lesson: inductor-basics
    difficulty: 2
    type: numeric
    formula:
      - "E = L · I² / 2"
    question: "Какую энергию хранит катушка 47 мГн при токе 0,5 А? Ответ в миллиджоулях."
    answer: 5.88
    unit: "мДж"
    tolerance_percent: 2
    explanation: "E = L·I²/2 = 0,047 × 0,25 / 2 = 0,005875 Дж ≈ 5,88 мДж."
  - id: i-004
    lesson: inductor-basics
    difficulty: 2
    type: single
    question: "Через идеальную катушку течёт неизменный постоянный ток. Чему равно напряжение на ней?"
    options:
      - "Нулю"
      - "Напряжению источника"
      - "Зависит только от L"
    answer: 0
    explanation: "U = L·ΔI/Δt, а при постоянном токе ΔI = 0, значит, U = 0. Катушка ведёт себя как провод."
  - id: i-005
    lesson: inductor-basics
    difficulty: 3
    type: numeric
    formula:
      - "U = L · ΔI / Δt"
      - "L — в генри, Δt — в секундах"
    question: "Катушка 20 мГн, ток 0,1 А размыкается за 20 мкс. Какой выброс напряжения возникает? Ответ в вольтах."
    answer: 100
    unit: "В"
    tolerance_percent: 2
    explanation: "ΔI/Δt = 0,1 / 2·10⁻⁵ = 5000 А/с, U = 0,02 × 5000 = 100 В."
  # ───── RL-цепь ─────
  - id: i-006
    lesson: rl-circuit
    difficulty: 1
    type: numeric
    formula:
      - "τ = L / R"
      - "мГн / Ом = мс"
    question: "Найди постоянную времени RL-цепи при L = 10 мГн и R = 2 Ом. Ответ в миллисекундах."
    answer: 5
    unit: "мс"
    tolerance_percent: 2
    explanation: "τ = L/R = 10 мГн / 2 Ом = 5 мс."
  - id: i-007
    lesson: rl-circuit
    difficulty: 2
    type: numeric
    formula:
      - "I = E / R"
      - "в установившемся режиме катушка — просто провод"
    question: "Катушка реле имеет сопротивление 25 Ом и подключена к 12 В. Каков установившийся ток? Ответ в амперах."
    answer: 0.48
    unit: "А"
    tolerance_percent: 2
    explanation: "В установившемся режиме катушка — провод, I = E/R = 12/25 = 0,48 А."
  - id: i-008
    lesson: rl-circuit
    difficulty: 2
    type: numeric
    formula:
      - "ток достигает 63 % за τ, 95 % за 3τ"
    question: "τ RL-цепи равна 3 мс. Через какое время ток достигнет примерно 95 % установившегося значения? Ответ в миллисекундах."
    answer: 9
    unit: "мс"
    tolerance_percent: 3
    explanation: "95 % достигается за 3τ = 9 мс."
  - id: i-009
    lesson: rl-circuit
    difficulty: 3
    type: single
    question: "Защитный диод параллельно катушке реле по ошибке включён анодом к плюсу питания. Что произойдёт при включении?"
    options:
      - "Диод откроется и замкнёт источник накоротко"
      - "Реле будет работать как обычно"
      - "Реле отпустит медленнее"
    answer: 0
    explanation: "В неправильной полярности диод проводит ток в рабочем режиме и закорачивает питание через себя. Катод должен быть подключён к плюсу."
  # ───── Переменный ток ─────
  - id: i-010
    lesson: ac-basics
    difficulty: 1
    type: numeric
    formula:
      - "f = 1 / T"
    question: "Период колебаний 10 мс. Какова частота? Ответ в герцах."
    answer: 100
    unit: "Гц"
    tolerance_percent: 1
    explanation: "f = 1/T = 1/0,01 = 100 Гц."
  - id: i-011
    lesson: ac-basics
    difficulty: 1
    type: single
    question: "Сколько раз за секунду меняется полярность напряжения при частоте 60 Гц?"
    options:
      - "120 раз"
      - "60 раз"
      - "30 раз"
    answer: 0
    explanation: "В каждом периоде полярность меняется дважды: 2 × 60 = 120 раз."
  - id: i-012
    lesson: ac-basics
    difficulty: 2
    type: numeric
    formula:
      - "u = Um · sin(2π · f · t)"
      - "аргумент синуса в радианах: 2π рад = 360°"
    question: "Сигнал u = 3·sin(2π·500·t) В. Какое напряжение при t = 0,5 мс? Ответ в вольтах."
    answer: 3
    unit: "В"
    tolerance_percent: 2
    explanation: "Период 2 мс, значит, 0,5 мс — четверть периода: фаза π/2, sin = 1, u = 3 В."
  - id: i-013
    lesson: ac-basics
    difficulty: 2
    type: numeric
    formula:
      - "Δt = (φ / 360°) · T"
      - "T = 1 / f"
    question: "Два сигнала частотой 1 кГц сдвинуты по фазе на 45°. Какова разница по времени? Ответ в микросекундах."
    answer: 125
    unit: "мкс"
    tolerance_percent: 2
    explanation: "Δt = (45/360)·T = 0,125 × 1000 мкс = 125 мкс."
  - id: i-014
    lesson: ac-basics
    difficulty: 3
    type: numeric
    formula:
      - "u = Um · sin(2π · f · t)"
      - "аргумент синуса в радианах: 2π рад = 360°"
    question: "Сигнал u = 8·sin(2π·100·t) В. Какое напряжение при t = 1,25 мс? Ответ в вольтах."
    answer: 5.66
    unit: "В"
    tolerance_percent: 2
    explanation: "Фаза = 2π × 100 × 0,00125 = π/4, sin(π/4) = 0,7071, u = 8 × 0,7071 = 5,66 В."
  # ───── Действующее значение ─────
  - id: i-015
    lesson: rms-power
    difficulty: 1
    type: numeric
    formula:
      - "Uрмс = Um / √2 ≈ 0,707 · Um"
    question: "Амплитуда синусоиды 30 В. Каково её действующее значение? Ответ в вольтах."
    answer: 21.2
    unit: "В"
    tolerance_percent: 1
    explanation: "Uрмс = Um/√2 = 30 / 1,414 = 21,2 В."
  - id: i-016
    lesson: rms-power
    difficulty: 1
    type: single
    question: "Размах синусоиды 20 В. Какова её амплитуда?"
    options:
      - "10 В"
      - "20 В"
      - "40 В"
    answer: 0
    explanation: "Размах равен удвоенной амплитуде: Um = Uпп/2 = 10 В."
  - id: i-017
    lesson: rms-power
    difficulty: 2
    type: numeric
    formula:
      - "P = Uрмс² / R"
    question: "На резистор 18 Ом подано 9 В RMS. Какая средняя мощность? Ответ в ваттах."
    answer: 4.5
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P = Uрмс²/R = 81/18 = 4,5 Вт."
  - id: i-018
    lesson: rms-power
    difficulty: 2
    type: numeric
    formula:
      - "Uпп = 2 · Um"
      - "Uрмс = Um / √2"
    question: "Осциллограф показывает размах синусоиды 24 В. Каково действующее значение? Ответ в вольтах."
    answer: 8.49
    unit: "В"
    tolerance_percent: 2
    explanation: "Um = 24/2 = 12 В, Uрмс = 12/1,414 = 8,49 В."
  - id: i-019
    lesson: rms-power
    difficulty: 3
    type: single
    question: "После выпрямления адаптера 12 В RMS ставят сглаживающий конденсатор. Какое минимальное стандартное рабочее напряжение разумно выбрать?"
    options:
      - "25 В"
      - "16 В"
      - "12 В"
    answer: 0
    explanation: "Пик около 17 В (минус падение на диодах, но на холостом ходу напряжение выше). 16 В — запаса нет, 12 В ниже пика. Берут 25 В."
  # ───── Трансформатор ─────
  - id: i-020
    lesson: transformer
    difficulty: 1
    type: single
    question: "Можно ли подключить трансформатор к батарейке постоянного напряжения?"
    options:
      - "Нельзя: нужен переменный ток, обмотка перегреется"
      - "Можно, он будет работать как обычно"
      - "Можно, но вторичная обмотка даст двойное напряжение"
    answer: 0
    explanation: "Для наведения ЭДС поток должен меняться. На постоянном токе обмотка с малым сопротивлением просто перегреется."
  - id: i-021
    lesson: transformer
    difficulty: 2
    type: numeric
    formula:
      - "U₂ = U₁ · N₂ / N₁"
    question: "N1 = 1200 витков, N2 = 60 витков, U1 = 120 В. Найди U2. Ответ в вольтах."
    answer: 6
    unit: "В"
    tolerance_percent: 2
    explanation: "U2 = U1·N2/N1 = 120 × 60 / 1200 = 6 В."
  - id: i-022
    lesson: transformer
    difficulty: 2
    type: numeric
    formula:
      - "S = U · I (в ВА)"
    question: "Вторичная обмотка отдаёт 9 В при токе 1,5 А. Какова мощность в вольт-амперах?"
    answer: 13.5
    unit: "ВА"
    tolerance_percent: 2
    explanation: "S = U·I = 9 × 1,5 = 13,5 ВА."
  - id: i-023
    lesson: transformer
    difficulty: 2
    type: numeric
    formula:
      - "P = U₁ · I₁"
      - "I₁ = P / U₁"
    question: "Идеальный трансформатор отдаёт 13,5 Вт. Первичная обмотка питается от 100 В. Каков ток первичной обмотки? Ответ в амперах."
    answer: 0.135
    unit: "А"
    tolerance_percent: 2
    explanation: "I1 = P/U1 = 13,5 / 100 = 0,135 А."
  - id: i-024
    lesson: transformer
    difficulty: 3
    type: numeric
    formula:
      - "r = (U₀ − U) / I"
    question: "Адаптер на холостом ходу даёт 17 В, а при токе 1 А — 12 В. Каково эквивалентное сопротивление его обмоток? Ответ в омах."
    answer: 5
    unit: "Ом"
    tolerance_percent: 2
    explanation: "Просадка 17 − 12 = 5 В при токе 1 А, значит, r = 5 / 1 = 5 Ом."
  # ───── Ферритовые бусины ─────
  - id: i-025
    lesson: ferrite-beads
    difficulty: 1
    type: single
    question: "Как ферритовая бусина влияет на постоянный ток в цепи питания?"
    options:
      - "Почти не влияет: сопротивление доли ома"
      - "Полностью блокирует"
      - "Превращает его в переменный"
    answer: 0
    explanation: "На постоянном токе бусина имеет малое сопротивление (DCR), поэтому питание проходит почти без потерь."
  - id: i-026
    lesson: ferrite-beads
    difficulty: 2
    type: numeric
    formula:
      - "ΔU = I · DCR"
    question: "Через бусину с DCR 0,25 Ом течёт 0,3 А. Какое падение напряжения на ней? Ответ в милливольтах."
    answer: 75
    unit: "мВ"
    tolerance_percent: 2
    explanation: "ΔU = I·DCR = 0,3 × 0,25 = 0,075 В = 75 мВ."
  - id: i-027
    lesson: ferrite-beads
    difficulty: 2
    type: numeric
    formula:
      - "P = I² · DCR"
    question: "Сколько мощности теряется в бусине с DCR 0,1 Ом при токе 0,6 А? Ответ в милливаттах."
    answer: 36
    unit: "мВт"
    tolerance_percent: 2
    explanation: "P = I²·DCR = 0,36 × 0,1 = 0,036 Вт = 36 мВт."
  - id: i-028
    lesson: ferrite-beads
    difficulty: 3
    type: single
    question: "Что делает синфазный дроссель с синфазной помехой?"
    options:
      - "Даёт для неё большое сопротивление и подавляет её"
      - "Пропускает её без изменений"
      - "Усиливает её"
    answer: 0
    explanation: "Для синфазной помехи поля обмоток складываются, и дроссель сильно сопротивляется. Дифференциальный сигнал проходит свободно."
  # ───── LC-резонанс ─────
  - id: i-029
    lesson: lc-resonance
    difficulty: 1
    type: single
    question: "Индуктивность и ёмкость контура увеличили в 4 раза каждую. Как изменилась резонансная частота?"
    options:
      - "Уменьшилась в 4 раза"
      - "Уменьшилась в 16 раз"
      - "Не изменилась"
    answer: 0
    explanation: "L·C выросло в 16 раз, а корень из него — в 4 раза. Частота обратно пропорциональна корню: упала в 4 раза."
  - id: i-030
    lesson: lc-resonance
    difficulty: 2
    type: numeric
    formula:
      - "f₀ = 1 / (2π · √(L · C))"
      - "L — в генри, C — в фарадах"
    question: "L = 100 мкГн, C = 1 нФ. Найди резонансную частоту в килогерцах."
    answer: 503
    unit: "кГц"
    tolerance_percent: 2
    explanation: "L·C = 10⁻⁴ × 10⁻⁹ = 10⁻¹³, корень 3,162·10⁻⁷, f = 1/(2π × 3,162·10⁻⁷) ≈ 5,03·10⁵ Гц = 503 кГц."
  - id: i-031
    lesson: lc-resonance
    difficulty: 2
    type: numeric
    formula:
      - "Δf = f₀ / Q"
    question: "Резонансная частота контура 1 МГц, добротность 50. Какова ширина полосы? Ответ в килогерцах."
    answer: 20
    unit: "кГц"
    tolerance_percent: 2
    explanation: "Δf = f₀/Q = 1000 кГц / 50 = 20 кГц."
  - id: i-032
    lesson: lc-resonance
    difficulty: 3
    type: single
    question: "Как связана добротность контура с остротой резонанса?"
    options:
      - "Чем выше добротность, тем уже и острее резонансный пик"
      - "Чем выше добротность, тем шире пик"
      - "Добротность не связана с формой пика"
    answer: 0
    explanation: "Δf = f₀/Q: при большей добротности полоса уже, значит, резонанс острее."
  # ───── Проект: измерения на AC-адаптере ─────
  - id: i-033
    lesson: ac-adapter-lab
    difficulty: 1
    type: numeric
    formula:
      - "Um = √2 · Uрмс ≈ 1,414 · Uрмс"
    question: "Мультиметр в режиме V~ показал 11,5 В. Каково пиковое напряжение? Ответ в вольтах."
    answer: 16.3
    unit: "В"
    tolerance_percent: 1
    explanation: "Um = √2 × 11,5 = 16,26 В ≈ 16,3 В."
  - id: i-034
    lesson: ac-adapter-lab
    difficulty: 2
    type: numeric
    formula:
      - "r = R · (U₀ − U) / U"
      - "все напряжения в RMS"
    question: "Адаптер без нагрузки даёт 14,8 В, а с резистором 22 Ом — 12,6 В. Найди его внутреннее сопротивление. Ответ в омах."
    answer: 3.84
    unit: "Ом"
    tolerance_percent: 3
    explanation: "r = R·(U₀ − U)/U = 22 × 2,2 / 12,6 = 3,84 Ом."
  - id: i-035
    lesson: ac-adapter-lab
    difficulty: 2
    type: single
    question: "Мультиметр в режиме DC на выходе AC-адаптера показывает почти 0 В. Почему?"
    options:
      - "Среднее значение синусоиды равно нулю, а для AC нужен режим V~"
      - "Адаптер неисправен"
      - "Мультиметр показывает пиковое значение"
    answer: 0
    explanation: "Положительные и отрицательные полупериоды компенсируют друг друга, постоянная составляющая равна нулю. Переменное напряжение измеряют в режиме V~."
