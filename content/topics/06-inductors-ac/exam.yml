    question: При разборе задачи «Трансформатор» какой вывод обоснован?
    options:
      - Постоянный ток можно подавать на любую обмотку без ограничения
      - Обычный трансформатор рассчитан на переменное магнитное поле.
      - Сеть безопасно подключать к открытой макетке
    answer: 1
    hint: >-
      Используй только готовый изолированный низковольтный AC-адаптер. Сравни напряжение без
      нагрузки и под допустимой нагрузкой без вскрытия корпуса.
    explanation: >-
      Обычный трансформатор рассчитан на переменное магнитное поле. Низковольтный AC-адаптер
      передаёт энергию через магнитное поле. Отношение напряжений идеального трансформатора равно
      отношению витков. Изоляция обмоток обеспечивает гальваническое разделение; реальный выход
      проседает из-за потерь, а холостой ток не равен нулю. Постоянное питание обычного
      трансформатора опасно насыщением и нагревом. Ошибочные варианты: Сеть безопасно подключать к
      открытой макетке; Постоянный ток можно подавать на любую обмотку без ограничения. Они не
      учитывают описанный принцип.
    id: inductors-ac-transformer-0
    lesson: transformer
    difficulty: 1
  - type: numeric
    question: >-
      На первичной обмотке идеального учебного трансформатора 12 В AC, N1/N2 = 7. Найди вторичное
      RMS.
    answer: 1.7142857142857142
    unit: В
    tolerance_percent: 1
    hint: >-
      U2/U1 = N2/N1 для идеального трансформатора. Все напряжения одной формы и одного вида:
      например, RMS.
    explanation: 12/7 = 1,71429 В.
    id: inductors-ac-transformer-1
    lesson: transformer
    difficulty: 1
