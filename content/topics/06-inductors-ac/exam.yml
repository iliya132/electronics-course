    question: При разборе задачи «LC-контур» какой вывод обоснован?
    options:
      - Увеличение ёмкости увеличивает частоту LC
      - В реальном контуре без внешней энергии колебания бесконечны
      - Резонансная частота зависит от произведения L и C.
    answer: 2
    hint: >-
      При моделировании добавь сопротивления и нагрузку. Для фильтра питания слишком высокая
      добротность может дать звон и перенапряжение.
    explanation: >-
      Резонансная частота зависит от произведения L и C. Катушка и конденсатор могут обмениваться
      энергией. При резонансе f0=1/(2π√LC) реактивные эффекты компенсируются в соответствующей
      схеме. Добротность характеризует потери и ширину резонанса; реальная нагрузка и сопротивления
      ограничивают рост амплитуды. Ошибочные варианты: Увеличение ёмкости увеличивает частоту LC; В
      реальном контуре без внешней энергии колебания бесконечны. Они не учитывают описанный принцип.
    id: inductors-ac-lc-resonance-0
    lesson: lc-resonance
    difficulty: 1
  - type: numeric
    question: L = 700 мкГн, C = 100 нФ. Найди частоту идеального LC-контура в килогерцах.
    answer: 19.022654130042064
    unit: кГц
    tolerance_percent: 1
    hint: f0 = 1/(2π√(LC)); L в Гн, C в Ф. Сопротивления и нагрузка меняют добротность.
    explanation: 1/(2π√(700×10⁻⁶ × 100×10⁻⁹))/1000 = 19,0227 кГц.
    id: inductors-ac-lc-resonance-1
    lesson: lc-resonance
    difficulty: 1
