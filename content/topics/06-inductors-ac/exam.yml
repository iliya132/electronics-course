  - type: single
    question: При разборе задачи «Катушка индуктивности» какой вывод обоснован?
    options:
      - Катушка не может проводить постоянный ток
      - При размыкании ток обязан сразу исчезнуть без выброса
      - Индуктивность препятствует резкому изменению тока, а не самому постоянному току.
    answer: 2
    hint: >-
      Для переключаемой катушки заранее обеспечь путь тока выключения. Проверяй ток насыщения и
      сопротивление обмотки, а не только индуктивность.
    explanation: >-
      Индуктивность препятствует резкому изменению тока, а не самому постоянному току. При
      размыкании реле возникает выброс напряжения. Катушка запасает энергию магнитного поля и
      препятствует быстрому изменению тока: U=L·dI/dt. Энергия равна LI²/2. При разрыве пути катушка
      создаёт напряжение, стремясь сохранить ток; реальный сердечник может насыщаться. Ошибочные
      варианты: Катушка не может проводить постоянный ток; При размыкании ток обязан сразу исчезнуть
      без выброса. Они не учитывают описанный принцип.
    id: inductors-ac-inductor-basics-0
    lesson: inductor-basics
    difficulty: 1
  - type: numeric
    question: Катушка 70 мкГн несёт ток 2 А. Найди энергию в микроджоулях.
    answer: 140
    unit: мкДж
    tolerance_percent: 1
    hint: E = LI²/2; L в Гн, I в А, E в Дж. Для мкГн энергия получится в мкДж.
    explanation: 70 × 2² / 2 = 140 мкДж.
    id: inductors-ac-inductor-basics-1
    lesson: inductor-basics
    difficulty: 1
