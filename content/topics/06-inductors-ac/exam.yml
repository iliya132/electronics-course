    question: При разборе задачи «Действующее значение (RMS)» какой вывод обоснован?
    options:
      - Любой сигнал имеет RMS равный пику делённому на √2
      - RMS является средним знаковым напряжением синусоиды
      - Формула Uпик/√2 применима к синусоиде, а не любой форме.
    answer: 2
    hint: >-
      Сравни тип прибора и форму сигнала. Для прямоугольных импульсов не дели пик на √2
      автоматически.
    explanation: >-
      Формула Uпик/√2 применима к синусоиде, а не любой форме. Резистор можно нагреть переменным и
      постоянным током одинаково. RMS выбирает такое эквивалентное постоянное значение по средней
      мощности. Для синусоиды Urms=Uпик/√2, но для других форм нужна их собственная формула или True
      RMS-прибор с подходящей полосой. Ошибочные варианты: Любой сигнал имеет RMS равный пику
      делённому на √2; RMS является средним знаковым напряжением синусоиды. Они не учитывают
      описанный принцип.
    id: inductors-ac-rms-power-0
    lesson: rms-power
    difficulty: 1
  - type: numeric
    question: Синусоида имеет RMS 7 В. Найди пиковое напряжение.
    answer: 9.899494936611665
    unit: В
    tolerance_percent: 1
    hint: Uпик = √2·Urms только для синусоиды; размах равен 2Uпик.
    explanation: 7 × √2 = 9,89949 В.
    id: inductors-ac-rms-power-1
    lesson: rms-power
    difficulty: 1
