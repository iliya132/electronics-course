    question: При разборе задачи «Низковольтный AC-адаптер» какой вывод обоснован?
    options:
      - Для измерения нужно вскрыть сетевой адаптер
      - Пиковое напряжение синусоиды выше её RMS в √2 раза.
      - Выход 12 В AC никогда не бывает выше 12 В мгновенно
    answer: 1
    hint: Измеряй мультиметром в режиме AC V и сравни с пиком синусоиды по формуле.
    explanation: >-
      Пиковое напряжение синусоиды выше её RMS в √2 раза. Проверим разницу между RMS и пиковым
      напряжением на безопасном AC-источнике. Работа ограничивается доступным низковольтным выходом
      готового адаптера. Ошибочные варианты: Выход 12 В AC никогда не бывает выше 12 В мгновенно;
      Для измерения нужно вскрыть сетевой адаптер. Они не учитывают описанный принцип.
    id: inductors-ac-ac-adapter-lab-0
    lesson: ac-adapter-lab
    difficulty: 1
