    question: При разборе задачи «Ферритовые бусины и дроссели» какой вывод обоснован?
    options:
      - Феррит выбирают по частоте помехи и току, а не одной надписи импеданса.
      - Импеданс бусины одинаков на всех частотах
      - Любой дроссель полностью эквивалентен ферритовой бусине
    answer: 0
    hint: >-
      Смотри график Z(f), сопротивление DC, допустимый ток и снижение импеданса под током. Добавляй
      конденсаторы так, чтобы не получить нежелательный резонанс.
    explanation: >-
      Феррит выбирают по частоте помехи и току, а не одной надписи импеданса. Шум цифровой части
      может попадать в питание датчика. Ферритовая бусина имеет малое сопротивление на DC и больший
      импеданс на высокой частоте, часто с потерями, гасящими помеху. Дроссель и бусина не
      взаимозаменяемы: у них разные частотные свойства и насыщение. Ошибочные варианты: Импеданс
      бусины одинаков на всех частотах; Любой дроссель полностью эквивалентен ферритовой бусине. Они
      не учитывают описанный принцип.
    id: inductors-ac-ferrite-beads-0
    lesson: ferrite-beads
    difficulty: 1
