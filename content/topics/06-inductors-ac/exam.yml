  - type: single
    question: При разборе задачи «RL-цепь» какой вывод обоснован?
    options:
      - Защитный диод ускоряет спад тока при любых условиях
      - Увеличение L при том же R замедляет изменение тока.
      - Постоянная времени RL равна R/L
    answer: 1
    hint: >-
      Сопоставь время включения с τ и установившийся ток с U/R. Для реального реле учитывай
      сопротивление провода и механику.
    explanation: >-
      Увеличение L при том же R замедляет изменение тока. Ток обмотки растёт постепенно после
      включения. В последовательной RL-цепи i(t)=U/R·(1−exp(−tR/L)); постоянная времени τ=L/R. После
      отключения путь разряда определяет скорость спада. Защитный диод уменьшает выброс, но обычно
      замедляет отпускание реле. Ошибочные варианты: Постоянная времени RL равна R/L; Защитный диод
      ускоряет спад тока при любых условиях. Они не учитывают описанный принцип.
    id: inductors-ac-rl-circuit-0
    lesson: rl-circuit
    difficulty: 1
  - type: numeric
    question: L = 70 мГн, R = 100 Ом. Найди τ в миллисекундах.
    answer: 0.7
    unit: мс
    tolerance_percent: 1
    hint: τ = L/R; L в Гн, R в Ом, τ в с. Миллигенри = 10⁻³ Гн.
    explanation: 70/100 = 0,7 мс.
    id: inductors-ac-rl-circuit-1
    lesson: rl-circuit
    difficulty: 1
