  - type: single
    question: При разборе задачи «Переменный ток» какой вывод обоснован?
    options:
      - Частота обратно пропорциональна периоду.
      - Удвоение периода удваивает частоту
      - Размах синусоиды равен её амплитуде
    answer: 0
    hint: >-
      На осциллограмме измеряй период между одинаковыми точками соседних циклов. Не путай амплитуду
      от среднего уровня с размахом пик–пик.
    explanation: >-
      Частота обратно пропорциональна периоду. Один и тот же сигнал может меняться медленно или
      быстро. Период T — время повторения, частота f=1/T. Синусоида описывается U=A·sin(2πft+φ), где
      A — амплитуда, φ — фаза. Фаза сравнивает положение колебаний одинаковой частоты. Ошибочные
      варианты: Удвоение периода удваивает частоту; Размах синусоиды равен её амплитуде. Они не
      учитывают описанный принцип.
    id: inductors-ac-ac-basics-0
    lesson: ac-basics
    difficulty: 1
  - type: numeric
    question: Частота сигнала 350 Гц. Чему равен период в миллисекундах?
    answer: 2.857142857142857
    unit: мс
    tolerance_percent: 1
    hint: T = 1/f; T в с, f в Гц. Для миллисекунд умножь результат на 1000.
    explanation: 1000/350 = 2,85714 мс.
    id: inductors-ac-ac-basics-1
    lesson: ac-basics
    difficulty: 1
