id: exam-diodes
topic: diodes
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Диод: основы ─────
  - id: d-001
    lesson: diode-basics
    difficulty: 1
    type: single
    question: "Диод подключили анодом к «+», катодом к «−» источника через резистор. Что происходит?"
    options:
      - "Диод открыт, ток идёт, на нём остаётся около 0,7 В (кремний)"
      - "Диод закрыт, ток почти нулевой"
      - "Диод пробивается и сгорает"
    answer: 0
    explanation: "Это прямое включение: диод проводит, а на кремниевом диоде остаётся около 0,6–0,7 В."
  - id: d-002
    lesson: diode-basics
    difficulty: 1
    type: numeric
    question: "Кремниевый диод (0,7 В) проводит ток 0,5 А. Сколько ватт он рассеивает?"
    answer: 0.35
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P = Vf·I = 0,7 × 0,5 = 0,35 Вт."
  - id: d-003
    lesson: diode-basics
    difficulty: 2
    type: single
    question: "Мультиметр в режиме проверки диодов: красный щуп на анод, чёрный на катод. Что покажет исправный кремниевый диод?"
    options:
      - "Около 0,5–0,7 В"
      - "OL (бесконечность)"
      - "0 В"
    answer: 0
    explanation: "В прямом включении прибор показывает прямое падение 0,5–0,7 В. При обратном подключении щупов будет «OL»."
  - id: d-004
    lesson: diode-basics
    difficulty: 2
    type: single
    question: "Почему значение 0,7 В нельзя считать жёстким порогом для любого диода?"
    options:
      - "Прямое падение зависит от тока и температуры, а 0,7 В — грубое приближение для кремния"
      - "Диод вообще не имеет падения напряжения"
      - "У всех диодов оно одинаково и равно 0,7 В"
    answer: 0
    explanation: "Ток диода растёт экспоненциально с напряжением, поэтому падение немного зависит от тока и температуры."
  # ───── Светодиод ─────
  - id: d-005
    lesson: led
    difficulty: 1
    type: numeric
    question: "Красный светодиод (Vf = 2,0 В), питание 5 В, нужен ток 10 мА. Какой резистор нужен? Ответ в омах."
    answer: 300
    unit: "Ом"
    tolerance_percent: 2
    explanation: "R = (5 − 2,0) / 0,01 = 300 Ом."
  - id: d-006
    lesson: led
    difficulty: 1
    type: single
    question: "Почему светодиод нельзя подключать к источнику без резистора?"
    options:
      - "Ток через открытый светодиод ничем не ограничен и он быстро перегорит"
      - "Без резистора он светит тусклее"
      - "Светодиод не работает на постоянном токе"
    answer: 0
    explanation: "Выше порога ток светодиода растёт очень круто. Ограничивает его только внешний резистор."
  - id: d-007
    lesson: led
    difficulty: 2
    type: numeric
    question: "Светодиод Vf = 2,0 В питается от 3,3 В, ток 5 мА. Найди резистор в омах."
    answer: 260
    unit: "Ом"
    tolerance_percent: 2
    explanation: "R = (3,3 − 2,0) / 0,005 = 260 Ом. На практике берут ближайший номинал 270 Ом."
  - id: d-008
    lesson: led
    difficulty: 3
    type: numeric
    question: "Светодиод Vf = 2,0 В питается от 12 В, ток 20 мА. Какую мощность рассеивает резистор в ваттах?"
    answer: 0.2
    unit: "Вт"
    tolerance_percent: 3
    explanation: "R = (12 − 2) / 0,02 = 500 Ом. P = I²·R = 0,0004 × 500 = 0,2 Вт. Резистор на 0,25 Вт работает почти на пределе, лучше взять на 0,5 Вт."
  # ───── Шоттки и стабилитрон ─────
  - id: d-009
    lesson: schottky-zener
    difficulty: 1
    type: single
    question: "Чем диод Шоттки отличается от кремниевого выпрямительного диода?"
    options:
      - "Меньшее прямое падение (около 0,3–0,45 В) и быстрое переключение, но больший обратный ток"
      - "Большее прямое падение и меньший обратный ток"
      - "Он проводит ток в обе стороны"
    answer: 0
    explanation: "Шоттки теряет меньше на прямом токе, но имеет бо́льшую утечку и обычно меньшее обратное напряжение."
  - id: d-010
    lesson: schottky-zener
    difficulty: 1
    type: single
    question: "В каком включении стабилитрон держит напряжение стабилизации?"
    options:
      - "В обратном: катодом к «+» через резистор, в режиме пробоя"
      - "В прямом, как обычный диод"
      - "Только без резистора"
    answer: 0
    explanation: "Рабочий режим стабилитрона — обратный пробой, и ток в нём всегда ограничивают резистором."
  - id: d-011
    lesson: schottky-zener
    difficulty: 2
    type: numeric
    question: "Параметрический стабилизатор: Uвх = 12 В, стабилитрон 5,1 В, R = 330 Ом, нагрузки нет. Какой ток течёт через стабилитрон? Ответ в миллиамперах."
    answer: 20.9
    unit: "мА"
    tolerance_percent: 3
    explanation: "I = (12 − 5,1) / 330 = 6,9 / 330 = 0,0209 А = 20,9 мА."
  - id: d-012
    lesson: schottky-zener
    difficulty: 3
    type: numeric
    question: "Для стабилизатора из предыдущей схемы (Iz = 20,9 мА, Uz = 5,1 В) найди мощность стабилитрона в ваттах."
    answer: 0.107
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = Uz·Iz = 5,1 × 0,0209 = 0,107 Вт. Для стабилитрона на 0,5 Вт запас достаточный."
  # ───── Выпрямление ─────
  - id: d-013
    lesson: rectifier-half-full
    difficulty: 1
    type: single
    question: "Что происходит с отрицательными полуволнами в однополупериодном выпрямителе?"
    options:
      - "Диод закрыт, ток через нагрузку не идёт"
      - "Они переворачиваются и идут в нагрузку"
      - "Они усиливаются"
    answer: 0
    explanation: "В отрицательный полупериод диод находится в обратном включении и не проводит."
  - id: d-014
    lesson: rectifier-half-full
    difficulty: 1
    type: numeric
    question: "Частота сети 50 Гц. Какова частота пульсаций на выходе двухполупериодного выпрямителя? Ответ в герцах."
    answer: 100
    unit: "Гц"
    tolerance_percent: 1
    explanation: "Горбов вдвое больше, чем периодов входного сигнала: 2 × 50 = 100 Гц."
  - id: d-015
    lesson: rectifier-half-full
    difficulty: 2
    type: numeric
    question: "Синусоида с амплитудой 12 В, двухполупериодное выпрямление (диоды идеальные). Каково среднее значение? Ответ в вольтах."
    answer: 7.64
    unit: "В"
    tolerance_percent: 2
    explanation: "Uср = 2Um/π = 24/3,1416 = 7,64 В."
  - id: d-016
    lesson: rectifier-half-full
    difficulty: 2
    type: numeric
    question: "Пик синусоиды 10 В, однополупериодное выпрямление, диод идеальный. Каково среднее значение? Ответ в вольтах."
    answer: 3.18
    unit: "В"
    tolerance_percent: 2
    explanation: "Uср = Um/π = 10/3,1416 = 3,18 В."
  # ───── Диодный мост ─────
  - id: d-017
    lesson: diode-bridge
    difficulty: 1
    type: single
    question: "В какой-то момент вход A моста положителен относительно B. Какая пара диодов проводит ток?"
    options:
      - "Диагональная пара: от A к плюсовому выходу и от минусового выхода к B"
      - "Все четыре диода одновременно"
      - "Только диод, ближайший к входу A"
    answer: 0
    explanation: "В каждый полупериод открыта диагональная пара диодов, а другая пара закрыта."
  - id: d-018
    lesson: diode-bridge
    difficulty: 2
    type: numeric
    question: "Адаптер 12 В RMS, мост на кремниевых диодах (0,7 В на диод). Каков пик выходного напряжения без конденсатора? Ответ в вольтах."
    answer: 15.57
    unit: "В"
    tolerance_percent: 2
    explanation: "Um = 12 × 1,414 = 16,97 В; минус 2 × 0,7 = 1,4 В даёт 15,57 В."
  - id: d-019
    lesson: diode-bridge
    difficulty: 2
    type: numeric
    question: "Адаптер 9 В RMS, мост кремниевый. Каков пик выхода моста? Ответ в вольтах."
    answer: 11.33
    unit: "В"
    tolerance_percent: 2
    explanation: "9 × 1,414 = 12,73 В; минус 1,4 В даёт 11,33 В."
  - id: d-020
    lesson: diode-bridge
    difficulty: 2
    type: single
    question: "Какое обратное напряжение должен выдерживать мост при входе 12 В RMS (пик 17 В)?"
    options:
      - "С запасом больше 17 В, например мост на 50–100 В"
      - "Не менее 12 В — столько, сколько RMS"
      - "Любое, ограничения нет"
    answer: 0
    explanation: "Закрытый диод видит почти амплитудное значение входа, а не действующее. Нужен запас."
  # ───── Сглаживающий конденсатор ─────
  - id: d-021
    lesson: filter-capacitor
    difficulty: 2
    type: numeric
    question: "Мост, нагрузка 0,2 А, конденсатор 2200 мкФ, частота пульсаций 100 Гц. Найди размах пульсаций по формуле ΔU = I/(f·C). Ответ в вольтах."
    answer: 0.91
    unit: "В"
    tolerance_percent: 3
    explanation: "ΔU = 0,2 / (100 × 0,0022) = 0,909 В."
  - id: d-022
    lesson: filter-capacitor
    difficulty: 2
    type: numeric
    question: "Блок питания на мосту отдаёт 0,4 А, пульсации 100 Гц, допустимый размах 0,8 В. Какая минимальная ёмкость нужна? Ответ в микрофарадах."
    answer: 5000
    unit: "мкФ"
    tolerance_percent: 3
    explanation: "C = I/(f·ΔU) = 0,4/(100 × 0,8) = 0,005 Ф = 5000 мкФ."
  - id: d-023
    lesson: filter-capacitor
    difficulty: 1
    type: single
    question: "Во сколько раз изменятся пульсации, если вдвое увеличить ёмкость фильтра при том же токе?"
    options:
      - "Уменьшатся вдвое"
      - "Увеличатся вдвое"
      - "Не изменятся"
    answer: 0
    explanation: "ΔU = I/(f·C): ёмкость в знаменателе, поэтому вдвое больше C даёт вдвое меньшие пульсации."
  - id: d-024
    lesson: filter-capacitor
    difficulty: 2
    type: single
    question: "Пик на выходе моста 15,6 В. Какой электролит по напряжению выбрать?"
    options:
      - "25 В: запас около 1,5 раза"
      - "16 В: почти впритык"
      - "6,3 В"
    answer: 0
    explanation: "15,6 × 1,5 ≈ 23 В, поэтому берут 25 В. 16 В — слишком малый запас."
  - id: d-025
    lesson: filter-capacitor
    difficulty: 3
    type: single
    question: "Почему ток через диоды моста с большим конденсатором течёт узкими импульсами в несколько раз больше тока нагрузки?"
    options:
      - "Диоды открыты только около пика, и за это короткое время надо вернуть весь заряд, ушедший в нагрузку"
      - "Конденсатор вырабатывает дополнительный ток"
      - "Из-за утечки конденсатора"
    answer: 0
    explanation: "Среднее значение тока равно току нагрузки, но проводят диоды малую долю периода, поэтому пик намного выше среднего."
  # ───── Переполюсовка ─────
  - id: d-026
    lesson: reverse-polarity
    difficulty: 1
    type: numeric
    question: "Диод Шоттки (Vf = 0,35 В) стоит последовательно в шине при токе 0,6 А. Сколько ватт он рассеивает?"
    answer: 0.21
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = Vf·I = 0,35 × 0,6 = 0,21 Вт."
  - id: d-027
    lesson: reverse-polarity
    difficulty: 2
    type: numeric
    question: "P-MOSFET с Rds(on) = 25 мОм стоит в шине при токе 3 А. Сколько ватт он рассеивает?"
    answer: 0.225
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = I²·R = 9 × 0,025 = 0,225 Вт."
  - id: d-028
    lesson: reverse-polarity
    difficulty: 2
    type: single
    question: "P-MOSFET защищает плюсовую шину от переполюсовки. Как он должен быть включён?"
    options:
      - "Сток ко входу, исток к нагрузке, затвор на минус питания"
      - "Исток ко входу, сток к нагрузке, затвор на плюс питания"
      - "Затвор остаётся неподключённым"
    answer: 0
    explanation: "Затвор на земле, исток поднимается до напряжения питания, Vgs отрицательно, и транзистор открывается."
  - id: d-029
    lesson: reverse-polarity
    difficulty: 2
    type: single
    question: "Зачем нужен предохранитель при защите «диод параллельно питанию»?"
    options:
      - "При переполюсовке диод замыкает вход, и предохранитель обрывает ток"
      - "Чтобы уменьшить пульсации"
      - "Чтобы повысить напряжение"
    answer: 0
    explanation: "Диод намеренно создаёт короткое замыкание, а предохранитель перегорает и отключает плату."
  # ───── Обратный диод и TVS ─────
  - id: d-030
    lesson: flyback-tvs
    difficulty: 2
    type: numeric
    question: "Катушка 50 мГн, ток 0,1 А прерывается за 50 мкс. Какое напряжение возникает на катушке по U = L·dI/dt? Ответ в вольтах."
    answer: 100
    unit: "В"
    tolerance_percent: 3
    explanation: "U = 0,05 × 0,1 / 0,00005 = 100 В."
  - id: d-031
    lesson: flyback-tvs
    difficulty: 1
    type: single
    question: "Как включают обратный диод на катушке реле, подключённой между +12 В и ключом на землю?"
    options:
      - "Параллельно катушке, катодом к +12 В"
      - "Параллельно катушке, анодом к +12 В"
      - "Последовательно с катушкой"
    answer: 0
    explanation: "В нормальном режиме диод закрыт. После выключения ток катушки замыкается через него."
  - id: d-032
    lesson: flyback-tvs
    difficulty: 2
    type: numeric
    question: "Катушка реле питается от 12 В, обратный диод имеет Vf = 0,7 В. Какое наибольшее напряжение окажется на ключе после выключения? Ответ в вольтах."
    answer: 12.7
    unit: "В"
    tolerance_percent: 2
    explanation: "Напряжение ограничено Uпит + Vf = 12,7 В."
  - id: d-033
    lesson: flyback-tvs
    difficulty: 2
    type: single
    question: "Чем TVS-диод отличается от стабилитрона?"
    options:
      - "Рассчитан на короткие мощные импульсы и не предназначен постоянно держать напряжение"
      - "Это просто другое название стабилитрона"
      - "Работает только в прямом включении"
    answer: 0
    explanation: "TVS гасит редкие импульсы в сотни ватт. При длительной перегрузке он перегреется."
  # ───── Диодное ИЛИ ─────
  - id: d-034
    lesson: diode-logic-or
    difficulty: 2
    type: numeric
    question: "Адаптер 9,0 В и USB 5,0 В объединены двумя диодами Шоттки (Vf = 0,3 В). Какое напряжение получит нагрузка? Ответ в вольтах."
    answer: 8.7
    unit: "В"
    tolerance_percent: 2
    explanation: "Берётся большее напряжение минус Vf: 9,0 − 0,3 = 8,7 В."
  - id: d-035
    lesson: diode-logic-or
    difficulty: 1
    type: single
    question: "Зачем в линии USB ставят диод, если плату питают и от внешнего источника?"
    options:
      - "Чтобы внешнее напряжение не попало обратно в порт компьютера"
      - "Чтобы повысить напряжение USB"
      - "Чтобы уменьшить ток"
    answer: 0
    explanation: "Диод закрыт, когда внешнее напряжение выше, и порт USB не получает напряжения от платы."
  - id: d-036
    lesson: diode-logic-or
    difficulty: 3
    type: single
    question: "Когда MOSFET-ИЛИ лучше диодов Шоттки?"
    options:
      - "Когда нужна минимальная просадка и нагрев при большом токе"
      - "Когда нужна максимальная простота схемы"
      - "Когда источник один"
    answer: 0
    explanation: "Потеря MOSFET равна I²·Rds(on), то есть единицы милливатт, а у Шоттки Vf·I."
  # ───── Проект: выпрямитель ─────
  - id: d-037
    lesson: bridge-supply
    difficulty: 2
    type: numeric
    question: "Адаптер без нагрузки показывает 10,2 В RMS, мост кремниевый. Каков пик выхода моста? Ответ в вольтах."
    answer: 13.02
    unit: "В"
    tolerance_percent: 2
    explanation: "Um = 10,2 × 1,414 = 14,42 В; минус 1,4 В даёт 13,02 В."
  - id: d-038
    lesson: bridge-supply
    difficulty: 1
    type: single
    question: "Почему для проекта подходит именно AC-адаптер, а не DC?"
    options:
      - "Мост выпрямляет переменное напряжение: на постоянном нечего выпрямлять"
      - "DC-адаптер всегда слабее"
      - "Мост работает только от батарей"
    answer: 0
    explanation: "Мост нужен, чтобы превратить переменное напряжение в постоянное. Если адаптер уже выдаёт DC, выпрямление не требуется."
  - id: d-039
    lesson: bridge-supply
    difficulty: 3
    type: numeric
    question: "Размах пульсаций пилообразной формы равен 0,6 В от пика до пика. Какое действующее значение (RMS) покажет мультиметр в режиме V~? Ответ в вольтах."
    answer: 0.173
    unit: "В"
    tolerance_percent: 5
    explanation: "Для пилы Uрмс = ΔU/(2√3) = 0,6 / 3,464 = 0,173 В."
  - id: d-040
    lesson: bridge-supply
    difficulty: 2
    type: single
    question: "Выход моста с конденсатором оказался ниже расчёта на 1–2 В. Что наиболее вероятно?"
    options:
      - "Трансформаторный адаптер проседает под нагрузкой"
      - "Мост не работает"
      - "Конденсатор слишком большой"
    answer: 0
    explanation: "Небольшие трансформаторные адаптеры имеют заметное выходное сопротивление: напряжение под нагрузкой ниже холостого."
  # ───── Проект: защита ─────
  - id: d-041
    lesson: reverse-protect-test
    difficulty: 2
    type: numeric
    question: "Для диода: Uбат = 6,00 В, Uнагр = 5,35 В, R = 33 Ом. Найди потери на диоде в милливаттах."
    answer: 105
    unit: "мВт"
    tolerance_percent: 5
    explanation: "ΔU = 0,65 В, I = 5,35/33 = 0,162 А, P = 0,65 × 0,162 = 0,105 Вт ≈ 105 мВт."
  - id: d-042
    lesson: reverse-protect-test
    difficulty: 3
    type: single
    question: "В схеме с P-MOSFET нагрузка получает на 0,65 В меньше батареи, как у кремниевого диода. Что вероятнее всего?"
    options:
      - "Канал не открылся (затвор не на земле), и работает только внутренний диод транзистора"
      - "Транзистор работает идеально"
      - "Батарея разряжена"
    answer: 0
