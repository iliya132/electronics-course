    question: При разборе задачи «Защита от переполюсовки» какой вывод обоснован?
    options:
      - Параллельный диод безопасен без ограничения тока
      - Встроенный диод MOSFET можно игнорировать
      - Шунтирующая защита диодом должна иметь согласованное ограничение или предохранитель.
    answer: 2
    hint: >-
      Проверяй защиту от источника с ограничением тока. Перед переворотом полярности отключай
      питание; не испытывай неизвестную схему на мощной батарее.
    explanation: >-
      Шунтирующая защита диодом должна иметь согласованное ограничение или предохранитель.
      Перепутанные клеммы могут уничтожить плату. Последовательный диод блокирует обратное питание
      ценой падения напряжения. Шунтирующий диод требует согласованного предохранителя. P-MOSFET
      может уменьшить потери, но ориентация встроенного диода и ограничение Ugs критичны. Ошибочные
      варианты: Параллельный диод безопасен без ограничения тока; Встроенный диод MOSFET можно
      игнорировать. Они не учитывают описанный принцип.
    id: diodes-reverse-polarity-0
    lesson: reverse-polarity
