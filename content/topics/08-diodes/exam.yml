    question: При разборе задачи «Диод Шоттки и стабилитрон» какой вывод обоснован?
    options:
      - Стабилитрон требует ограничения тока и проверки мощности.
      - Стабилитрон можно подключить прямо к идеальному источнику любого напряжения
      - Шоттки всегда имеет нулевую утечку
    answer: 0
    hint: >-
      В стабилизаторе на стабилитроне считай ток резистора как сумму тока нагрузки и стабилитрона.
      Проверь крайние входные напряжения.
    explanation: >-
      Стабилитрон требует ограничения тока и проверки мощности. Для защиты питания часто выбирают
      диод Шоттки. У него обычно меньшее прямое падение, но больше обратная утечка и свои
      ограничения напряжения. Стабилитрон работает в обратном пробое при ограниченном токе; резистор
      должен обеспечивать ток стабилизации без превышения мощности при малой нагрузке. Ошибочные
      варианты: Стабилитрон можно подключить прямо к идеальному источнику любого напряжения; Шоттки
      всегда имеет нулевую утечку. Они не учитывают описанный принцип.
    id: diodes-schottky-zener-0
    lesson: schottky-zener
    difficulty: 1
