    question: При разборе задачи «Выпрямление» какой вывод обоснован?
    options:
      - Выпрямитель без конденсатора даёт идеально постоянное напряжение
      - Среднее выпрямленного сигнала всегда равно его пику
      - Двухполупериодное выпрямление удваивает частоту пульсаций синусоидального входа.
    answer: 2
    hint: >-
      Отличай среднее, RMS и пик. Мультиметры в разных режимах могут показывать разные
      характеристики одного сигнала.
    explanation: >-
      Двухполупериодное выпрямление удваивает частоту пульсаций синусоидального входа. Переменное
      напряжение нужно превратить в однополярное. Однополупериодный выпрямитель пропускает одну
      половину синусоиды, двухполупериодный использует обе. Без фильтра выход пульсирует; среднее
      идеального двухполупериодного сигнала равно 2Uпик/π, но действующее значение считают отдельно.
      Ошибочные варианты: Выпрямитель без конденсатора даёт идеально постоянное напряжение; Среднее
      выпрямленного сигнала всегда равно его пику. Они не учитывают описанный принцип.
    id: diodes-rectifier-half-full-0
    lesson: rectifier-half-full
    difficulty: 1
  - type: numeric
    question: Синусоида имеет RMS 7 В. Найди пиковое напряжение.
    answer: 9.899494936611665
    unit: В
    tolerance_percent: 1
    hint: Uпик = √2·Urms только для синусоиды; размах равен 2Uпик.
    explanation: 7 × √2 = 9,89949 В.
    id: diodes-rectifier-half-full-1
    lesson: rectifier-half-full
    difficulty: 1
