    question: При разборе задачи «Диодный мост» какой вывод обоснован?
    options:
      - После моста пик всегда равен RMS входа
      - В проводящем пути моста последовательно находятся два диода.
      - В каждом полупериоде проводят все четыре диода
    answer: 1
    hint: >-
      Проверь маркировку моста и полярность конденсатора. Пиковое выходное напряжение может быть
      заметно выше численного RMS адаптера.
    explanation: >-
      В проводящем пути моста последовательно находятся два диода. Четыре диода направляют ток через
      нагрузку в одну сторону. В каждый полупериод проводят два диагонально расположенных диода, а
      другая пара закрыта. Падение учитывает оба проводящих перехода. Входы помечены AC, выходы —
      плюс и минус. Ошибочные варианты: В каждом полупериоде проводят все четыре диода; После моста
      пик всегда равен RMS входа. Они не учитывают описанный принцип.
    id: diodes-diode-bridge-0
    lesson: diode-bridge
    difficulty: 1
  - type: numeric
