    question: При разборе задачи «Диодное ИЛИ и выбор источника питания» какой вывод обоснован?
    options:
      - Диодное OR отделяет источники друг от друга ценой падения напряжения.
      - Два выхода USB безопасно соединять напрямую всегда
      - Идеальный диод обязательно имеет ровно нулевые потери
    answer: 0
    hint: >-
      Сравни источники по напряжению и допустимости обратного тока. Не соединяй два регулируемых
      выхода напрямую без разрешения документации.
    explanation: >-
      Диодное OR отделяет источники друг от друга ценой падения напряжения. Устройство может
      получать питание от двух источников. Диодное OR пропускает ток от более высокого источника и
      препятствует обратному току в другой. Падение напряжения и нагрев ограничивают применение.
      MOSFET-контроллер идеального диода снижает потери, но сложнее простого соединения. Ошибочные
      варианты: Два выхода USB безопасно соединять напрямую всегда; Идеальный диод обязательно имеет
      ровно нулевые потери. Они не учитывают описанный принцип.
    id: diodes-diode-logic-or-0
    lesson: diode-logic-or
    difficulty: 1
