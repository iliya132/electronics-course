    question: При разборе задачи «Мост и сглаживающий конденсатор» какой вывод обоснован?
    options:
      - Конденсатор после моста выбирают только по RMS входа
      - Полярность электролита не имеет значения
      - После моста с конденсатором напряжение близко к пику входа минус два падения.
    answer: 2
    hint: Измеряй DC и пульсации раздельно. Проверяй заряд конденсатора перед перестановкой проводов.
    explanation: >-
      После моста с конденсатором напряжение близко к пику входа минус два падения. Соберём
      низковольтный выпрямитель на готовом мосте. Сравним напряжение без нагрузки и с резистором, а
      также влияние накопительного конденсатора. Ошибочные варианты: Конденсатор после моста
      выбирают только по RMS входа; Полярность электролита не имеет значения. Они не учитывают
      описанный принцип.
    id: diodes-bridge-supply-0
    lesson: bridge-supply
    difficulty: 1
