  - type: single
    question: При разборе задачи «Светодиод и ограничительный резистор» какой вывод обоснован?
    options:
      - Один общий резистор одинаково задаёт ток всех каналов RGB
      - Светодиоду нужен резистор или другой ограничитель тока.
      - Светодиод сам точно ограничивает ток
    answer: 1
    hint: >-
      Возьми Vf из документации при выбранном токе, рассчитай R и округли вверх. После сборки измерь
      напряжение на резисторе и вычисли фактический ток.
    explanation: >-
      Светодиоду нужен резистор или другой ограничитель тока. Светодиод без ограничения тока быстро
      повреждается. Цвет связан с материалом и прямым падением: красный обычно имеет меньшее Vf, чем
      синий или белый. Анод подключают к более положительному потенциалу через ограничение тока. RGB
      содержит несколько излучателей; каждому нужен свой расчёт. Ошибочные варианты: Светодиод сам
      точно ограничивает ток; Один общий резистор одинаково задаёт ток всех каналов RGB. Они не
      учитывают описанный принцип.
    id: diodes-led-0
    lesson: led
    difficulty: 1
  - type: numeric
    question: 'Красный LED: Vf = 2 В при 10 мА, питание 10 В. Найди расчётный резистор до округления.'
    answer: 800
    unit: Ом
    tolerance_percent: 1
    hint: R = (Uпит−Vf)/I; I подставляют в А. После расчёта выбирают E12 вверх и проверяют мощность.
    explanation: (10−2)/0,01 = 800 Ом.
    id: diodes-led-1
    lesson: led
    difficulty: 1
