    question: При разборе задачи «Диод» какой вывод обоснован?
    options:
      - Кремниевый диод всегда имеет ровно 0,700 В
      - Обычный диод безопасно работает при любом обратном напряжении
      - Падение диода зависит от тока и температуры.
    answer: 2
    hint: >-
      В режиме проверки диодов сравни прямое и обратное включение снятой детали. Затем проверь
      допустимый ток, обратное напряжение и тепловой режим.
    explanation: >-
      Падение диода зависит от тока и температуры. Диод проводит ток значительно легче в одном
      направлении. Прямое смещение уменьшает барьер p–n перехода, обратное — увеличивает. Значение
      0,7 В — грубое приближение для кремния, а не жёсткий порог: ток экспоненциально зависит от
      напряжения и температуры. Обратный пробой обычного диода может быть разрушительным. Ошибочные
      варианты: Кремниевый диод всегда имеет ровно 0,700 В; Обычный диод безопасно работает при
      любом обратном напряжении. Они не учитывают описанный принцип.
    id: diodes-diode-basics-0
    lesson: diode-basics
    difficulty: 1
  - type: numeric
