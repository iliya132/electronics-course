    question: При разборе задачи «Сглаживающий конденсатор» какой вывод обоснован?
    options:
      - Пульсации уменьшаются с ёмкостью и увеличиваются с током нагрузки.
      - Большая ёмкость всегда уменьшает пиковый ток диодов
      - Частота пульсаций моста равна частоте входной синусоиды
    answer: 0
    hint: >-
      Выбирай ёмкость, напряжение, ESR и ток пульсаций. При первом включении учитывай зарядный
      бросок тока.
    explanation: >-
      Пульсации уменьшаются с ёмкостью и увеличиваются с током нагрузки. Между вершинами
      выпрямленного сигнала нагрузку питает конденсатор. Он заряжается около пиков, затем
      разряжается до следующего. При малых пульсациях ΔU≈I/(fпульсC). Через диоды идут короткие
      зарядные импульсы, поэтому их пиковый ток выше среднего тока нагрузки. Ошибочные варианты:
      Большая ёмкость всегда уменьшает пиковый ток диодов; Частота пульсаций моста равна частоте
      входной синусоиды. Они не учитывают описанный принцип.
    id: diodes-filter-capacitor-0
    lesson: filter-capacitor
    difficulty: 1
