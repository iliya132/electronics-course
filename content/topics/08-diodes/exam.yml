    question: При разборе задачи «Защитный (обратный) диод и TVS» какой вывод обоснован?
    options:
      - Любой TVS гарантирует напряжение ниже порога любого МК
      - Защитный диод при включённом реле должен быть закрыт.
      - Обратный диод ставят проводящим поперёк питания катушки
    answer: 1
    hint: >-
      Сравни рабочее напряжение, напряжение ограничения TVS и допустимое напряжение ключа.
      Минимизируй петлю выброса и проверь полярность защитного диода.
    explanation: >-
      Защитный диод при включённом реле должен быть закрыт. Выключение реле оставляет энергию в
      магнитном поле. Обратный диод рядом с катушкой создаёт замкнутый путь тока после отключения
      ключа: катод к плюсу питания, анод к стороне ключа. TVS ограничивает более высокое напряжение
      и может ускорить спад, но должен выдержать импульс. Ошибочные варианты: Обратный диод ставят
      проводящим поперёк питания катушки; Любой TVS гарантирует напряжение ниже порога любого МК.
      Они не учитывают описанный принцип.
    id: diodes-flyback-tvs-0
    lesson: flyback-tvs
    difficulty: 1
  - type: numeric
