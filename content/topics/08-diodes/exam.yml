    question: При разборе задачи «Сравнение защиты от переполюсовки» какой вывод обоснован?
    options:
      - Переполюсовку лучше испытывать сразу от аккумулятора
      - Потери защиты оценивают по измеренным падению и току.
      - Малое сопротивление канала гарантировано при любом Ugs
    answer: 1
    hint: >-
      Испытание обратной полярностью допустимо только после проверки схемы и с ограниченным током
      источника.
    explanation: >-
      Потери защиты оценивают по измеренным падению и току. Сравним потери двух способов защиты при
      одинаковой нагрузке. Последовательный Шоттки прост, а правильно включённый P-MOSFET снижает
      падение. Ошибочные варианты: Малое сопротивление канала гарантировано при любом Ugs;
      Переполюсовку лучше испытывать сразу от аккумулятора. Они не учитывают описанный принцип.
    id: diodes-reverse-protect-test-0
    lesson: reverse-protect-test
    difficulty: 1
