    unit: Ом
    tolerance_percent: 1
    hint: I = U/Rнагрузки; r = (E−U)/I. Напряжения в В, сопротивления в Ом, ток в А.
    explanation: (1,5−1,36) / (1,36/10) = 1,02941 Ом.
