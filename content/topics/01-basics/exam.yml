  - type: single
    question: При разборе задачи «Закон Ома» какой вывод обоснован?
    options:
      - При большем сопротивлении ток всегда больше
      - Закон Ома с постоянным R точно описывает любой диод
      - При неизменном напряжении удвоение сопротивления уменьшает ток вдвое.
    answer: 2
    hint: >-
      Посчитай ток до сборки, затем измерь напряжение на известном резисторе и вычисли I. Не
      переноси линейную модель на диод без проверки.
    explanation: >-
      При неизменном напряжении удвоение сопротивления уменьшает ток вдвое. Замена резистора меняет
      яркость индикатора. Для омического резистора ток пропорционален напряжению и обратно
      пропорционален сопротивлению. Из I=U/R получают U=IR и R=U/I. Прямая ВАХ проходит через начало
      координат; её наклон равен проводимости 1/R. Ошибочные варианты: При большем сопротивлении ток
      всегда больше; Закон Ома с постоянным R точно описывает любой диод. Они не учитывают описанный
      принцип.
    id: basics-ohm-law-0
    lesson: ohm-law
    difficulty: 1
  - type: numeric
    question: U = 9 В, R = 700 Ом. Найди ток в миллиамперах.
    answer: 12.857142857142858
    unit: мА
    tolerance_percent: 1
    hint: I = U/R; U в В, R в Ом, I в А. 1 мА = 0,001 А.
    explanation: 9/700 × 1000 = 12,8571 мА.
    id: basics-ohm-law-1
    lesson: ohm-law
    difficulty: 1
