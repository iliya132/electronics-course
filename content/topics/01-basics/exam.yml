  - id: basics-exam-021
    lesson: charge-current
    difficulty: 1
    type: single
    question: Какое изменение при неизменном токе удвоит прошедший заряд?
    answer: 0
    explanation: >-
      Q = I·t: при постоянном I заряд пропорционален времени. Перестановка щупов и смена единиц
      заряд не увеличивают.
    options:
      - Удвоить время
      - Поменять щупы
      - Записать ток в миллиамперах
  - id: basics-exam-022
    lesson: charge-current
    difficulty: 1
    type: multi
    question: Какие записи соответствуют определению тока?
    answer:
      - 0
      - 2
    explanation: I = Q/t, поэтому 1 А = 1 Кл/с. Ампер-час является зарядом, не током.
    options:
      - I = Q/t
      - А·ч — единица тока
      - 1 А = 1 Кл/с
  - id: basics-exam-023
    lesson: voltage
    difficulty: 2
    type: single
    question: Как измерить напряжение между двумя выводами резистора?
    answer: 1
    explanation: >-
      Вольтметр подключают параллельно участку. Включение в разрыв относится к амперметру; один щуп
      не задаёт разность.
    options:
      - Включить V-метр в разрыв
      - Коснуться щупами обоих выводов в режиме V
      - Подключить только красный щуп
  - id: basics-exam-024
    lesson: voltage
    difficulty: 2
    type: multi
    question: Что справедливо для обозначения GND на батарейном устройстве?
    answer:
      - 0
      - 1
    explanation: GND задаёт ноль отсчёта и часто общий возврат. Связи с землёй здания может не быть.
    options:
      - Это выбранная точка отсчёта
      - Часто это общий провод
      - Всегда соединено с землёй здания
  - id: basics-exam-025
    lesson: charge-current
    difficulty: 3
    type: single
    question: Провод при исправной работе не расходуется, потому что…
    answer: 2
    explanation: >-
      Носители заряда уже находятся в металле и движутся в цепи. Металл не сгорает при нормальном
      токе.
    options:
      - Заряд не движется
      - Батарея постоянно восстанавливает металл
      - Носители заряда движутся в существующем проводнике
  - id: basics-exam-026
    lesson: voltage
    difficulty: 1
    type: single
    question: При нулевой разности потенциалов двух щупов исправный вольтметр покажет…
    answer: 0
    explanation: >-
      Показание определяется разностью потенциалов. Наличие батареи поблизости не меняет равенство
      потенциалов щупов.
    options:
      - 0 В
      - Напряжение всей батареи
      - Бесконечное напряжение
