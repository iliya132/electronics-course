    question: При разборе задачи «Мощность и энергия» какой вывод обоснован?
    options:
      - Любой резистор выдержит мощность при правильном номинале
      - Одинаковое сопротивление не означает одинаковую допустимую мощность.
      - Ватт и ватт-час измеряют одну величину
    answer: 1
    hint: >-
      Проверь мощность резистора и запас по нагреву. Для аккумулятора оцени энергию по среднему
      напряжению, а не только по ампер-часам.
    explanation: >-
      Одинаковое сопротивление не означает одинаковую допустимую мощность. Маленький резистор может
      сгореть даже при правильном сопротивлении. Мощность — скорость преобразования энергии, а
      энергия — накопленное количество. При постоянном режиме E=Pt; один ватт-час равен 3600
      джоулям. Для резистора P=UI=I²R=U²/R. Ошибочные варианты: Ватт и ватт-час измеряют одну
      величину; Любой резистор выдержит мощность при правильном номинале. Они не учитывают описанный
      принцип.
    id: basics-power-energy-0
    lesson: power-energy
    difficulty: 1
