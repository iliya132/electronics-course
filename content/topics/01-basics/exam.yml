      - 2
    hint: 'Отметь два утверждения: физический принцип и способ его проверки.'
    explanation: >-
      Верны физический принцип и описанный способ проверки. Приставка меняет масштаб единицы, а не
      физическую величину. Перед подстановкой переведи величины в согласованные единицы. После
      расчёта оцени порядок: ток светодиода обычно выражают в миллиамперах, а не десятках ампер.
      Ошибочные предположения противоречат этим условиям: м и М обозначают одинаковый множитель; 4,7
      кОм равны 4,7 Ом.
