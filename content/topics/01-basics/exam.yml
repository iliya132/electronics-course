    question: При разборе задачи «Сопротивление» какой вывод обоснован?
    options:
      - При прочих равных сопротивление растёт с длиной и уменьшается с сечением.
      - Удвоение сечения удваивает сопротивление
      - Сопротивление провода не зависит от длины
    answer: 0
    hint: >-
      Измеряй сопротивление только при снятом питании. Вычти сопротивление щупов при измерении малых
      значений. Для кабеля туда и обратно учитывай длину обоих проводников.
    explanation: >-
      При прочих равных сопротивление растёт с длиной и уменьшается с сечением. Длинный тонкий
      провод может заметно греться. Сопротивление описывает ограничение тока; оно зависит от
      материала, длины, сечения и температуры. Проводники имеют много подвижных носителей, изоляторы
      — мало; в полупроводнике проводимость сильно зависит от примесей и условий. Ошибочные
      варианты: Удвоение сечения удваивает сопротивление; Сопротивление провода не зависит от длины.
      Они не учитывают описанный принцип.
    id: basics-resistance-0
    lesson: resistance
    difficulty: 1
  - type: numeric
    question: 'Медный провод: ρ = 0,0175 Ом·мм²/м, длина 14 м, сечение 0.5 мм². Найди R (одного проводника).'
    answer: 0.49000000000000005
    unit: Ом
    tolerance_percent: 1
    hint: R = ρL/S; ρ — удельное сопротивление в Ом·мм²/м, L — длина в м, S — сечение в мм².
    explanation: 0,0175 × 14 / 0,5 = 0,49 Ом.
