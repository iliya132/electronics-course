id: exam-basics
topic: basics
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Заряд и ток ─────
  - id: b-001
    lesson: charge-current
    difficulty: 1
    type: single
    question: "Что движется в металлическом проводе, когда по нему идёт электрический ток?"
    options:
      - "Свободные электроны"
      - "Атомы металла, которые выходят из провода"
      - "Протоны из ядер атомов"
    answer: 0
    explanation: "В металле подвижные носители заряда — свободные электроны. Атомы металла стоят в решётке и по проводу не бегут. Протоны сидят в ядрах и тоже не покидают их."
  - id: b-002
    lesson: charge-current
    difficulty: 1
    type: numeric
    formula:
      - "I = Q / t"
      - "Q — заряд (Кл), t — время (с)"
    question: "За 8 секунд через сечение провода прошёл заряд 12 Кл. Найди силу тока."
    answer: 1.5
    unit: "А"
    tolerance_percent: 1
    explanation: "I = Q / t = 12 / 8 = 1,5 А. Результат 96 А получится, если заряд умножить на время, а 0,67 А — если поделить время на заряд."
  - id: b-003
    lesson: charge-current
    difficulty: 2
    type: numeric
    formula:
      - "t = C / I"
      - "C — ёмкость (мА·ч), I — ток (мА)"
    question: "Фонарик потребляет ток 400 мА. Ёмкость батарейки 3200 мА·ч. На сколько часов её хватит в идеальном случае?"
    answer: 8
    unit: "ч"
    tolerance_percent: 1
    explanation: "t = C / I = 3200 / 400 = 8 ч. Единицы согласованы (мА·ч и мА), поэтому переводить ничего не нужно. Ответ 8000 получится, если перемножить числа."
  - id: b-004
    lesson: charge-current
    difficulty: 2
    type: single
    question: "Почему на схемах стрелку тока рисуют от «плюса» к «минусу», хотя в металле электроны движутся в обратную сторону?"
    options:
      - "Это историческая договорённость, и она не влияет на результаты расчётов"
      - "Учёные ошиблись, и расчёты приходится корректировать вручную"
      - "В проводах движутся протоны, а не электроны"
    answer: 0
    explanation: "Направление тока условились считать по движению положительных зарядов ещё до открытия электрона. Любой расчёт даёт верный результат при условии, что все пользуются одним соглашением. В металле протоны не движутся, а корректировать расчёты не нужно."
  - id: b-005
    lesson: charge-current
    difficulty: 3
    type: numeric
    formula:
      - "I = C / t"
      - "время переведи в часы (1 сутки = 24 ч)"
    question: "Датчик, питаемый аккумулятором на 1800 мА·ч, проработал ровно 25 суток подряд. Каков его средний ток?"
    answer: 3
    unit: "мА"
    tolerance_percent: 2
    explanation: "25 суток = 25 × 24 = 600 ч. I = C / t = 1800 / 600 = 3 мА. Если время не перевести в часы и поделить на 25, получится 72 мА, а это ошибка на порядок величины."
  # ───── Напряжение ─────
  - id: b-006
    lesson: voltage
    difficulty: 1
    type: single
    question: "Что означает напряжение 12 В между двумя точками цепи?"
    options:
      - "Каждый кулон заряда, проходя между ними, получает или отдаёт 12 Дж энергии"
      - "В цепи течёт ток 12 А"
      - "Между точками находится заряд 12 Кл"
    answer: 0
    explanation: "1 В = 1 Дж/Кл, поэтому 12 В означает 12 Дж на каждый кулон. Ток 12 А зависит ещё и от сопротивления. Заряд в Кл измеряет другую величину."
  - id: b-007
    lesson: voltage
    difficulty: 1
    type: numeric
    formula:
      - "U_AB = φ_A − φ_B"
    question: "Потенциал точки A равен 9 В, потенциал точки B равен 2,5 В (оба относительно земли). Найди U_AB."
    answer: 6.5
    unit: "В"
    tolerance_percent: 1
    explanation: "U_AB = φ_A − φ_B = 9 − 2,5 = 6,5 В. Сумма потенциалов (11,5 В) не имеет физического смысла: напряжение — это разность."
  - id: b-008
    lesson: voltage
    difficulty: 2
    type: single
    question: "Красный щуп вольтметра стоит на точке с потенциалом 1 В, чёрный — на точке с потенциалом 4 В. Что покажет прибор?"
    options:
      - "+3 В"
      - "−3 В"
      - "5 В"
    answer: 1
    explanation: "Прибор показывает φ(красный) − φ(чёрный) = 1 − 4 = −3 В. Знак «минус» означает, что красный щуп стоит на точке с меньшим потенциалом. Ответ 5 В получится, если потенциалы сложить."
  - id: b-009
    lesson: voltage
    difficulty: 2
    type: multi
    question: "Выбери все верные утверждения о «земле» (GND) на схеме."
    options:
      - "Это точка, потенциал которой принят за ноль"
      - "Сдвиг земли в другую точку меняет напряжения между всеми точками"
      - "Потенциал точки относительно земли может быть отрицательным"
      - "Напряжение между двумя точками не зависит от того, где выбрана земля"
    answer: [0, 2, 3]
    explanation: "Верны первое, третье и четвёртое. Второе неверно: при сдвиге земли меняются потенциалы, но разности потенциалов — напряжения — остаются прежними."
  - id: b-010
    lesson: voltage
    difficulty: 3
    type: numeric
    formula:
      - "U = A / Q"
      - "A — энергия (Дж), Q — заряд (Кл)"
    question: "Заряд 0,5 Кл прошёл через участок цепи, и при этом выделилось 6 Дж энергии. Каково напряжение на этом участке?"
    answer: 12
    unit: "В"
    tolerance_percent: 1
    explanation: "U = A / Q = 6 / 0,5 = 12 В. Если умножить, получится 3 В, но тогда единица оказалась бы Дж·Кл, а не В."
  - id: b-011
    lesson: voltage
    difficulty: 2
    type: single
    question: "Батарейка имеет ЭДС 1,5 В, но под нагрузкой на её клеммах 1,4 В. Где «потерялись» 0,1 В?"
    options:
      - "Упали на внутреннем сопротивлении самой батарейки"
      - "Вольтметр показывает меньше, чем есть на самом деле"
      - "Ушли на провода вольтметра"
    answer: 0
    explanation: "Через батарейку течёт тот же ток, что и через нагрузку, и часть напряжения падает на её внутреннем сопротивлении. Вольтметр при этом показывает верное напряжение на клеммах. Сопротивление щупов вольтметра ничтожно по сравнению с его собственным сопротивлением."
  # ───── Сопротивление ─────
  - id: b-012
    lesson: resistance
    difficulty: 1
    type: single
    question: "Из-за чего металлический провод имеет сопротивление?"
    options:
      - "Электроны сталкиваются с ионами кристаллической решётки и отдают им энергию"
      - "Электроны накапливаются в проводе и мешают друг другу пройти"
      - "Провод содержит в себе лишний заряд"
    answer: 0
    explanation: "Столкновения электронов с ионами решётки и есть причина сопротивления и нагрева. Электроны не накапливаются в проводе, а лишний заряд в нейтральном проводнике отсутствует."
  - id: b-013
    lesson: resistance
    difficulty: 1
    type: numeric
    formula:
      - "R = ρ · L / S"
      - "ρ — удельное сопротивление (Ом·мм²/м), L — длина (м), S — сечение (мм²)"
    question: "Найди сопротивление медного провода длиной 20 м и сечением 1 мм² (ρ = 0,0175 Ом·мм²/м)."
    answer: 0.35
    unit: "Ом"
    tolerance_percent: 3
    explanation: "R = ρ · L / S = 0,0175 × 20 / 1 = 0,35 Ом."
  - id: b-014
    lesson: resistance
    difficulty: 2
    type: single
    question: "Провод удлинили втрое и одновременно заменили на такой же материал с втрое большей площадью сечения. Как изменилось сопротивление?"
    options:
      - "Выросло втрое"
      - "Не изменилось"
      - "Уменьшилось втрое"
    answer: 1
    explanation: "В формуле R = ρ·L / S длина и сечение выросли в одно и то же число раз, и они сокращаются. Вариант «выросло втрое» учитывает только длину, а «уменьшилось» — только сечение."
  - id: b-015
    lesson: resistance
    difficulty: 2
    type: numeric
    formula:
      - "R = ρ · L / S"
      - "ρ — удельное сопротивление (Ом·мм²/м), L — длина (м), S — сечение (мм²)"
    question: "Нагревательная спираль из нихрома: ρ = 1,1 Ом·мм²/м, длина 2 м, сечение 0,2 мм². Найди сопротивление."
    answer: 11
    unit: "Ом"
    tolerance_percent: 2
    explanation: "R = 1,1 × 2 / 0,2 = 2,2 / 0,2 = 11 Ом."
  - id: b-016
    lesson: resistance
    difficulty: 3
    type: single
    question: "Взяли провод того же материала и той же длины, но с вдвое большим диаметром. Как изменилось сопротивление?"
    options:
      - "Уменьшилось вдвое"
      - "Уменьшилось вчетверо"
      - "Выросло вдвое"
    answer: 1
    explanation: "Площадь круга пропорциональна квадрату диаметра, поэтому сечение выросло вчетверо, а сопротивление упало вчетверо. Ответ «вдвое» учитывает диаметр, но не его квадрат."
  # ───── Закон Ома ─────
  - id: b-017
    lesson: ohm-law
    difficulty: 1
    type: numeric
    formula:
      - "U = I · R"
      - "мА × кОм = В"
    question: "Через резистор 1 кОм течёт ток 5 мА. Какое напряжение на резисторе?"
    answer: 5
    unit: "В"
    tolerance_percent: 1
    explanation: "U = I · R = 0,005 × 1000 = 5 В. Или сразу в согласованных единицах: мА × кОм = В, 5 × 1 = 5."
  - id: b-018
    lesson: ohm-law
    difficulty: 1
    type: numeric
    formula:
      - "R = U / I"
      - "ток в амперах"
    question: "При напряжении 6 В через резистор течёт ток 20 мА. Каково его сопротивление?"
    answer: 300
    unit: "Ом"
    tolerance_percent: 1
    explanation: "R = U / I = 6 / 0,02 = 300 Ом. Если не перевести миллиамперы в амперы, получится 0,3, и это неверно по порядку величины."
  - id: b-019
    lesson: ohm-law
    difficulty: 2
    type: single
    question: "ВАХ резистора A — прямая, вдвое более крутая, чем ВАХ резистора B. Как соотносятся их сопротивления?"
    options:
      - "R_A вдвое меньше R_B"
      - "R_A вдвое больше R_B"
      - "R_A равно R_B"
    answer: 0
    explanation: "При одном напряжении ток через A вдвое больше, значит, A вдвое легче пропускает ток, и его сопротивление вдвое меньше."
  - id: b-020
    lesson: ohm-law
    difficulty: 2
    type: numeric
    formula:
      - "R = U / I, затем I = U / R"
      - "Или пропорция: ток растёт во столько же раз, во сколько напряжение"
    question: "К резистору приложили 3 В, и по нему пошёл ток 15 мА. Какой ток пойдёт при 7,5 В?"
    answer: 37.5
    unit: "мА"
    tolerance_percent: 2
    explanation: "Напряжение выросло в 7,5 / 3 = 2,5 раза, значит, ток тоже вырос в 2,5 раза: 15 × 2,5 = 37,5 мА. Проверка: R = 3 / 0,015 = 200 Ом, I = 7,5 / 200 = 0,0375 А."
  - id: b-021
    lesson: ohm-law
    difficulty: 3
    type: multi
    question: "У каких элементов вольт-амперная характеристика при постоянной температуре — прямая линия через ноль?"
    options:
      - "У резистора"
      - "У нити лампы накаливания"
      - "У светодиода"
      - "У медного провода"
    answer: [0, 3]
    explanation: "Линейны резистор и медный провод при постоянной температуре. У лампы накаливания сопротивление растёт по мере нагрева нити, а у светодиода ток растёт с напряжением гораздо быстрее, чем пропорционально."
  # ───── Мощность и энергия ─────
  - id: b-022
    lesson: power-energy
    difficulty: 1
    type: numeric
    formula:
      - "P = U · I"
    question: "Электромотор работает от 12 В и потребляет ток 2 А. Какова его мощность?"
    answer: 24
    unit: "Вт"
    tolerance_percent: 1
    explanation: "P = U · I = 12 × 2 = 24 Вт."
  - id: b-023
    lesson: power-energy
    difficulty: 2
    type: numeric
    formula:
      - "P = U² / R"
    question: "На резистор 150 Ом подано 3 В. Сколько мощности на нём выделяется? Ответ в милливаттах."
    answer: 60
    unit: "мВт"
    tolerance_percent: 2
    explanation: "P = U² / R = 9 / 150 = 0,06 Вт = 60 мВт. Это существенно меньше 250 мВт резистора 1/4 Вт, нагрев будет небольшой."
  - id: b-024
    lesson: power-energy
    difficulty: 2
    type: single
    question: "Ток через резистор вырос втрое, сопротивление не менялось. Как изменилась выделяемая мощность?"
    options:
      - "Выросла втрое"
      - "Выросла в 9 раз"
      - "Выросла в 6 раз"
    answer: 1
    explanation: "P = I²·R, а ток в формуле стоит в квадрате: 3² = 9. Вариант «втрое» забывает про квадрат, а «в 6 раз» — это 3 × 2, то есть сложили показатель степени с множителем."
  - id: b-025
    lesson: power-energy
    difficulty: 2
    type: numeric
    formula:
      - "E = U · C"
      - "C — ёмкость (А·ч), E — энергия (Вт·ч)"
    question: "Повербанк 3,7 В с ёмкостью 10 А·ч (10 000 мА·ч). Сколько энергии он хранит?"
    answer: 37
    unit: "Вт·ч"
    tolerance_percent: 1
    explanation: "E = U · C = 3,7 × 10 = 37 Вт·ч."
  - id: b-026
    lesson: power-energy
    difficulty: 3
    type: numeric
    formula:
      - "R = U² / P"
    question: "Резистор 0,5 Вт подключают к 24 В. Какое сопротивление нужно взять, чтобы выделялось не больше 0,25 Вт (запас вдвое)? Ответ в килоомах."
    answer: 2.304
    unit: "кОм"
    tolerance_percent: 2
    explanation: "R = U² / P = 576 / 0,25 = 2304 Ом = 2,304 кОм. Если брать 0,5 Вт вместо 0,25, сопротивление выйдет вдвое меньшим, а запас пропадёт."
  # ───── Единицы и приставки ─────
  - id: b-027
    lesson: units-prefixes
    difficulty: 1
    type: numeric
    formula:
      - "милли (м) = 10⁻³ · микро (мк) = 10⁻⁶ · кило (к) = 10³"
      - "Ступень вверх (мкА → мА → А): ÷ 1000. Ступень вниз: × 1000"
    question: "Переведи 47 мкА в миллиамперы."
    answer: 0.047
    unit: "мА"
    tolerance_percent: 1
    explanation: "Микро = 10⁻⁶, милли = 10⁻³. Переход вверх на одну ступень делит число на 1000: 47 / 1000 = 0,047 мА."
  - id: b-028
    lesson: units-prefixes
    difficulty: 1
    type: single
    question: "Что означает буква n в записи 100n рядом с конденсатором?"
    options:
      - "нано (10⁻⁹)"
      - "микро (10⁻⁶)"
      - "пико (10⁻¹²)"
    answer: 0
    explanation: "n — нано. 100n означает 100 нФ. Микро записывают буквой u, пико — буквой p."
  - id: b-029
    lesson: units-prefixes
    difficulty: 2
    type: numeric
    formula:
      - "I = U / R"
      - "В / кОм = мА"
      - "мА → мкА: × 1000"
    question: "Резистор 22 кОм подключён к 3,3 В. Найди ток в микроамперах."
    answer: 150
    unit: "мкА"
    tolerance_percent: 2
    explanation: "3,3 В / 22 кОм = 0,15 мА = 150 мкА. Проверка в омах: 3,3 / 22 000 = 0,00015 А."
  - id: b-030
    lesson: units-prefixes
    difficulty: 2
    type: single
    question: "Как расшифровать маркировку резистора 6k8?"
    options:
      - "6,8 кОм"
      - "68 кОм"
      - "6,8 МОм"
    answer: 0
    explanation: "Буква k стоит на месте запятой: 6,8 кОм. 68 кОм писали бы 68k, а 6,8 МОм — 6M8."
  - id: b-031
    lesson: units-prefixes
    difficulty: 3
    type: numeric
    formula:
      - "P = I² · R"
      - "мА² · кОм = мВт"
    question: "Через резистор 4,7 кОм течёт ток 2 мА. Какая мощность выделяется на нём? Ответ в милливаттах."
    answer: 18.8
    unit: "мВт"
    tolerance_percent: 2
    explanation: "В согласованных единицах мА² × кОм = мВт: 2² × 4,7 = 4 × 4,7 = 18,8 мВт."
  # ───── Проект: внутреннее сопротивление ─────
  - id: b-032
    lesson: battery-internal-r
    difficulty: 1
    type: single
    question: "Как правильно подключить вольтметр, чтобы измерить напряжение на клеммах батарейки?"
    options:
      - "Параллельно клеммам, красным щупом к «плюсу»"
      - "Последовательно, разорвав провод от батарейки"
      - "Красным щупом к «плюсу», чёрный оставить свободным"
    answer: 0
    explanation: "Напряжение измеряют между двумя точками, поэтому нужны оба щупа и параллельное подключение. Разрыв цепи и свободный второй щуп не дадут нужного показания."
  - id: b-033
    lesson: battery-internal-r
    difficulty: 2
    type: numeric
    formula:
      - "r = R · (E − U) / U"
      - "E — без нагрузки, U — под нагрузкой, R — сопротивление нагрузки"
    question: "У батарейки E = 1,50 В без нагрузки. С резистором 10 Ом напряжение на клеммах 1,41 В. Найди внутреннее сопротивление."
    answer: 0.64
    unit: "Ом"
    tolerance_percent: 3
    explanation: "r = R · (E − U) / U = 10 × 0,09 / 1,41 ≈ 0,638 Ом. Через ток: I = 1,41 / 10 = 0,141 А, r = 0,09 / 0,141 ≈ 0,638 Ом."
  - id: b-034
    lesson: battery-internal-r
    difficulty: 2
    type: single
    question: "Почему в проекте напряжение E надо измерять до подключения нагрузки, а не после?"
    options:
      - "После нагрузки батарейка успевает просесть и нагреться, и результат занижен"
      - "Вольтметр нельзя подключать после резистора"
      - "Резистор меняет полярность батарейки"
    answer: 0
    explanation: "Под нагрузкой батарейка слегка разряжается, поэтому E, измеренное позже, будет меньше настоящего, а r получится заниженным или даже отрицательным. К полярности и вольтметру этот эффект отношения не имеет."
  - id: b-035
    lesson: battery-internal-r
    difficulty: 3
    type: single
