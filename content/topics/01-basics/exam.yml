  - type: single
    question: При разборе задачи «Внутреннее сопротивление батарейки» какой вывод обоснован?
    options:
      - Внутреннее сопротивление измеряют прямым коротким замыканием
      - Напряжение без нагрузки полностью характеризует батарейку
      - Внутреннее сопротивление проявляется просадкой напряжения под нагрузкой.
    answer: 2
    hint: >-
      Запиши напряжение без нагрузки и под нагрузкой сразу после подключения. Используй одну и ту же
      нагрузку для сравнения батареек.
    explanation: >-
      Внутреннее сопротивление проявляется просадкой напряжения под нагрузкой. Старая батарейка
      показывает нормальное напряжение без нагрузки, но фонарик тусклый. Измерим просадку на
      известном резисторе и оценим внутреннее сопротивление эквивалентной модели. Ошибочные
      варианты: Внутреннее сопротивление измеряют прямым коротким замыканием; Напряжение без
      нагрузки полностью характеризует батарейку. Они не учитывают описанный принцип.
    id: basics-battery-internal-r-0
    lesson: battery-internal-r
    difficulty: 1
  - type: numeric
    question: 'AA без нагрузки: 1,5 В. На резисторе 10 Ом: 1,36 В. Оцени внутреннее сопротивление.'
