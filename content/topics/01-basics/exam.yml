  - type: single
    question: При разборе задачи «Единицы СИ и приставки» какой вывод обоснован?
    options:
      - Приставка меняет масштаб единицы, а не физическую величину.
      - м и М обозначают одинаковый множитель
      - 4,7 кОм равны 4,7 Ом
    answer: 0
    hint: >-
      Перед подстановкой переведи величины в согласованные единицы. После расчёта оцени порядок: ток
      светодиода обычно выражают в миллиамперах, а не десятках ампер.
    explanation: >-
      Приставка меняет масштаб единицы, а не физическую величину. Ошибку в тысячу раз часто создаёт
      одна буква. Милли — 10⁻³, микро — 10⁻⁶, нано — 10⁻⁹, пико — 10⁻¹², кило — 10³, мега — 10⁶.
      Инженерная запись использует степени, кратные трём; регистр буквы важен. Ошибочные варианты: м
      и М обозначают одинаковый множитель; 4,7 кОм равны 4,7 Ом. Они не учитывают описанный принцип.
    id: basics-units-prefixes-0
    lesson: units-prefixes
    difficulty: 1
  - type: numeric
    question: Переведи 0,007 А в миллиамперы.
    answer: 7
    unit: мА
    tolerance_percent: 1
    hint: 1 А = 1000 мА; приставка милли означает 10⁻³.
    explanation: 0,007 × 1000 = 7 мА.
    id: basics-units-prefixes-1
    lesson: units-prefixes
    difficulty: 1
