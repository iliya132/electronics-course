  - type: single
    question: При разборе задачи «Напряжение» какой вывод обоснован?
    options:
      - GND всегда является заземлением здания
      - Напряжение измеряется между двумя точками.
      - Один щуп всегда достаточен для измерения
    answer: 1
    hint: >-
      Подключай вольтметр параллельно участку и выбирай гнездо V. Токовое гнездо для такого
      подключения недопустимо.
    explanation: >-
      Напряжение измеряется между двумя точками. Вольтметру нужны два щупа. Напряжение является
      разностью потенциалов двух точек, а знак зависит от порядка вычитания. Ошибочные варианты:
      Один щуп всегда достаточен для измерения; GND всегда является заземлением здания. Они не
      учитывают описанный принцип.
    id: basics-voltage-0
    lesson: voltage
    difficulty: 1
  - type: numeric
    question: >-
      Ненагруженный делитель: Uвх = 5 В, R1 сверху = 10 кОм, R2 снизу = 7 кОм. Найди Uвых
      относительно GND.
    answer: 2.0588235294117645
    unit: В
    tolerance_percent: 1
    hint: Uвых = Uвх·R2/(R1+R2); одинаковые приставки сопротивлений сокращаются. 1 кОм = 1000 Ом.
    explanation: 5 × 7/(10+7) = 2,05882 В.
