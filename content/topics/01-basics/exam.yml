    question: При разборе задачи «Заряд и ток» какой вывод обоснован?
    options:
      - Ампер-час является единицей напряжения
      - Электроны превращаются в свет и исчезают
      - Ток характеризует перенос заряда за время.
    answer: 2
    hint: >-
      Сравни одинаковые нагрузки при разных доступных ёмкостях. Для постоянного тока время оценивают
      отношением ёмкости к току.
    explanation: >-
      Ток характеризует перенос заряда за время. Фонарик расходует энергию источника. Заряд уже есть
      в проводниках; сила тока показывает скорость его переноса через сечение. Ошибочные варианты:
      Ампер-час является единицей напряжения; Электроны превращаются в свет и исчезают. Они не
      учитывают описанный принцип.
    id: basics-charge-current-0
    lesson: charge-current
    difficulty: 1
