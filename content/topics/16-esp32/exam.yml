    question: При разборе задачи «АЦП и ШИМ (LEDC)» какой вывод обоснован?
    options:
      - Любой код ESP32 точно равен code×3,3/4095
      - ADC2 классического ESP32 всегда доступен при Wi-Fi
      - АЦП ESP32 требует учёта диапазона, калибровки и совместного использования периферии.
    answer: 2
    hint: >-
      Для датчика во время Wi-Fi выбирай совместимый ADC1 и проверяй диапазон. Используй
      калиброванное измерение напряжения, если API его поддерживает.
    explanation: >-
      АЦП ESP32 требует учёта диапазона, калибровки и совместного использования периферии. 12-битный
      код ESP32 не гарантирует идеальную линейность. Диапазон АЦП зависит от ослабления и
      калибровки; в классическом ESP32 ADC2 конфликтует с Wi-Fi. LEDC формирует ШИМ, причём высокая
      частота ограничивает доступную разрядность. В Arduino-ESP32 3.x ledcAttach и ledcWrite
      работают с выводами. Ошибочные варианты: Любой код ESP32 точно равен code×3,3/4095; ADC2
      классического ESP32 всегда доступен при Wi-Fi. Они не учитывают описанный принцип.
    id: esp32-esp32-adc-pwm-0
    lesson: esp32-adc-pwm
    difficulty: 1
