    tolerance_percent: 1
    hint: >-
      Iср = (Iакт·tакт+Iсон·tсон)/T. Токи всей платы, включая стабилизатор и датчики, считают
      вместе.
    explanation: '[80×7+0,01×(600−7)]/600 = 0,943217 мА.'
