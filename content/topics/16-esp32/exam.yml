      - Показание медленного мультиметра всегда равно точному среднему
      - Ток DevKit во сне может быть значительно выше тока самого ESP32.
      - Светодиод питания не влияет на ток сна
    answer: 1
    hint: >-
      Используй измеритель, способный увидеть и микроамперы сна, и импульсы активности; один предел
      мультиметра может исказить питание.
    explanation: >-
      Ток DevKit во сне может быть значительно выше тока самого ESP32. Измерим, сколько энергии
      тратит периодически просыпающийся датчик. Сравним расчёт по фазам с измерением всей платы.
      Ошибочные варианты: Светодиод питания не влияет на ток сна; Показание медленного мультиметра
      всегда равно точному среднему. Они не учитывают описанный принцип.
    id: esp32-sleepy-sensor-0
    lesson: sleepy-sensor
    difficulty: 1
