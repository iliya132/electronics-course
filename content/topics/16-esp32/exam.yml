    question: При разборе задачи «GPIO ESP32» какой вывод обоснован?
    options:
      - У классического ESP32 GPIO34–39 не работают выходами и не имеют программной подтяжки.
      - GPIO34 подходит для управления LED как выход
      - Выводы flash свободны для любой пользовательской нагрузки
    answer: 0
    hint: >-
      Для первого датчика выбирай свободный обычный GPIO, проверь распиновку своего модуля. Не
      подавай 5 В и не меняй boot-уровни внешней схемой случайно.
    explanation: >-
      У классического ESP32 GPIO34–39 не работают выходами и не имеют программной подтяжки. Выводы
      классического ESP32 имеют ограничения запуска и встроенной памяти. GPIO34–39 — только входы
      без внутренних pull-up/down; GPIO6–11 обычно заняты flash в WROOM. Strapping 0, 2, 5, 12, 15
      считываются при сбросе. Названия и ограничения других семейств отличаются. Ошибочные варианты:
      GPIO34 подходит для управления LED как выход; Выводы flash свободны для любой пользовательской
      нагрузки. Они не учитывают описанный принцип.
    id: esp32-esp32-gpio-0
    lesson: esp32-gpio
    difficulty: 1
