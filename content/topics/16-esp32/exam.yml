    question: При разборе задачи «Семейство ESP32» какой вывод обоснован?
    options:
      - Все ESP32 имеют одинаковые GPIO и Bluetooth Classic
      - USB-разъём всегда означает одинаковый нативный USB
      - Распиновка и периферия одного ESP32-семейства не переносятся автоматически на другое.
    answer: 2
    hint: >-
      Выбирай плату по интерфейсам, количеству выводов, питанию и поддержке ядром. Антенна модуля
      требует свободной зоны без металла и меди по рекомендациям изготовителя.
    explanation: >-
      Распиновка и периферия одного ESP32-семейства не переносятся автоматически на другое. Название
      ESP32 охватывает несколько разных семейств. Классический ESP32 использует Xtensa и
      поддерживает Wi-Fi с Bluetooth Classic/LE; S2 не имеет Bluetooth, S3 ориентирован на
      дополнительные вычислительные возможности и USB, C3/C6 используют RISC-V и иной набор
      периферии. Возможности радио и USB проверяют по точной модели; цены зависят от поставки.
      Ошибочные варианты: Все ESP32 имеют одинаковые GPIO и Bluetooth Classic; USB-разъём всегда
      означает одинаковый нативный USB. Они не учитывают описанный принцип.
    id: esp32-esp32-intro-0
    lesson: esp32-intro
    difficulty: 1
