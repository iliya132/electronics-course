    question: При разборе задачи «Питание ESP32» какой вывод обоснован?
    options:
      - Любая Li-ion напрямую безопасно питает вывод 3V3
      - Питание ESP32 проектируют с учётом пиков радио и всей платы.
      - Средний ток Serial-монитора описывает худший режим Wi-Fi
    answer: 1
    hint: >-
      Измеряй 3,3 В у модуля при передаче, проверяй запас источника и температуру. Для батареи
      отдельно учитывай ток покоя стабилизатора.
    explanation: >-
      Питание ESP32 проектируют с учётом пиков радио и всей платы. Wi-Fi передаёт короткими мощными
      импульсами. Линия 3,3 В должна выдерживать пиковый ток, а проводка и развязка — ограничивать
      просадку. Ток платы отличается от тока одного чипа; LDO, LED и USB-UART продолжают
      потребление. AMS1117 на некоторых DevKit не подходит для эффективного сна или полного разряда
      Li-ion. Ошибочные варианты: Средний ток Serial-монитора описывает худший режим Wi-Fi; Любая
      Li-ion напрямую безопасно питает вывод 3V3. Они не учитывают описанный принцип.
    id: esp32-esp32-power-0
    lesson: esp32-power
    difficulty: 1
