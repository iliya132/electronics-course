    question: При разборе задачи «Bluetooth LE» какой вывод обоснован?
    options:
      - Любое рекламное сообщение автоматически содержит все характеристики
      - UUID является паролем шифрования
      - Реклама BLE и обмен GATT являются разными этапами работы.
    answer: 2
    hint: >-
      Сначала проверь рекламу, затем сервис и характеристику через диагностическое приложение. Не
      передавай чувствительные данные без нужного сопряжения и защиты.
    explanation: >-
      Реклама BLE и обмен GATT являются разными этапами работы. Телефон может читать небольшие
      данные без Wi-Fi. BLE-реклама сообщает о присутствии устройства, а GATT описывает сервисы и
      характеристики. Характеристику можно читать, записывать или получать уведомления, если
      свойства и разрешения это допускают. UUID идентифицирует назначение. Ошибочные варианты: Любое
      рекламное сообщение автоматически содержит все характеристики; UUID является паролем
      шифрования. Они не учитывают описанный принцип.
    id: esp32-ble-0
    lesson: ble
