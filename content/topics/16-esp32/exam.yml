    question: При разборе задачи «Wi-Fi» какой вывод обоснован?
    options:
      - Длительные блокировки не влияют на ответы веб-сервера
      - STA подключается к сети, AP создаёт точку доступа.
      - IP платы всегда неизменен без настройки
    answer: 1
    hint: >-
      Обрабатывай отсутствие сети, ограничивай время ожидания и выводи локальный IP. Не публикуй
      учебный сервер напрямую в интернет.
    explanation: >-
      STA подключается к сети, AP создаёт точку доступа. Браузер может читать показания датчика
      через локальную сеть. В STA плата подключается к роутеру, в AP создаёт собственную сеть.
      Веб-сервер принимает HTTP-запрос и возвращает HTML или JSON; датчик лучше опрашивать по
      расписанию, а не блокировать обработчик долгими задержками. Ошибочные варианты: IP платы
      всегда неизменен без настройки; Длительные блокировки не влияют на ответы веб-сервера. Они не
      учитывают описанный принцип.
    id: esp32-esp32-wifi-0
    lesson: esp32-wifi
    difficulty: 1
