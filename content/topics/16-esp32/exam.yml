    question: При разборе задачи «DevKit изнутри» какой вывод обоснован?
    options:
      - Кнопки EN и BOOT полностью взаимозаменяемы
      - USB-UART сам хранит основную прошивку ESP32
      - Автозагрузка согласует импульсы сброса и выбор boot-режима.
    answer: 2
    hint: >-
      При сбое загрузки проверь питание, UART, EN и GPIO0 по схеме своей платы. Сильная внешняя
      нагрузка на boot-выводе может мешать запуску.
    explanation: >-
      Автозагрузка согласует импульсы сброса и выбор boot-режима. DevKit содержит больше, чем
      радиомодуль. USB-UART формирует последовательный канал, LDO — питание, DTR/RTS через
      транзисторную схему управляют EN и GPIO0 для загрузки. Кнопка EN сбрасывает, BOOT задаёт режим
      при старте. RC на EN формирует задержку. Ошибочные варианты: Кнопки EN и BOOT полностью
      взаимозаменяемы; USB-UART сам хранит основную прошивку ESP32. Они не учитывают описанный
      принцип.
    id: esp32-esp32-dev-board-0
    lesson: esp32-dev-board
    difficulty: 1
