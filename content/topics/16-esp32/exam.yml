    question: При разборе задачи «MQTT» какой вывод обоснован?
    options:
      - MQTT разделяет издателя, брокер и подписчиков.
      - Подписчик обязан напрямую подключаться к каждому датчику
      - QoS 1 гарантирует отсутствие повторных сообщений
    answer: 0
    hint: >-
      Используй уникальный client ID и понятные топики. Вне изолированной учебной сети настрой
      аутентификацию и TLS; не помещай секреты в публикуемый код.
    explanation: >-
      MQTT разделяет издателя, брокер и подписчиков. Датчик и панель не обязаны знать адреса друг
      друга. MQTT-брокер принимает публикации по топикам и отправляет их подписчикам. QoS задаёт
      гарантии доставки протокола; retained хранит последнее сообщение, а LWT сообщает о неожиданном
      отключении. Повторная доставка требует аккуратной обработки. Ошибочные варианты: Подписчик
      обязан напрямую подключаться к каждому датчику; QoS 1 гарантирует отсутствие повторных
      сообщений. Они не учитывают описанный принцип.
    id: esp32-mqtt-0
    lesson: mqtt
    difficulty: 1
  - type: numeric
