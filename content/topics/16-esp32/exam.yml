    question: При разборе задачи «Энергосбережение» какой вывод обоснован?
    options:
      - Средний ток равен только току сна
      - Краткая активная фаза может определять большую часть расхода энергии.
      - После deep sleep обычная RAM всегда сохраняется
    answer: 1
    hint: >-
      Измерь отдельно сон и активность. Для 80 мА в течение 3 с из 600 с и сна 0,01 мА среднее
      ≈0,40995 мА, до учёта регулятора и датчика.
    explanation: >-
      Краткая активная фаза может определять большую часть расхода энергии. Батарейному датчику не
      нужно работать непрерывно. Deep sleep отключает большую часть чипа, а пробуждение обычно
      запускает программу заново. RTC-память может сохранить небольшое состояние. Средний ток
      зависит от длительности подключения к сети и всего оборудования на плате. Ошибочные варианты:
      После deep sleep обычная RAM всегда сохраняется; Средний ток равен только току сна. Они не
      учитывают описанный принцип.
    id: esp32-deep-sleep-0
    lesson: deep-sleep
    difficulty: 1
  - type: numeric
    question: 'Цикл 600 с: активный ток 80 мА длится 7 с, остальное время сон 0,01 мА. Найди средний ток.'
