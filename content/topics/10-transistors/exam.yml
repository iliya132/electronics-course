    question: >-
      При разборе задачи «P-MOSFET как защита от переполюсовки и выбор питания (power path)» какой
      вывод обоснован?
    options:
      - Сток и исток всегда можно поменять без последствий
      - Любой один P-MOSFET реализует безопасный power-path двух источников
      - Ориентация встроенного диода определяет поведение защиты до открытия канала.
    answer: 2
    hint: >-
      Сверь топологию с проверенной схемой, ограничь допустимое Vgs и учти поведение при обратном
      подключении и внешнем питании выхода.
    explanation: >-
      Ориентация встроенного диода определяет поведение защиты до открытия канала. Падение обычного
      диода может быть слишком большим. P-MOSFET используют в защите с ориентацией встроенного
      диода, позволяющей первоначальное питание в правильной полярности. После открытия ток проходит
      каналом с малыми потерями. Для выбора двух источников может требоваться отдельный контроллер
      обратного тока. Ошибочные варианты: Сток и исток всегда можно поменять без последствий; Любой
      один P-MOSFET реализует безопасный power-path двух источников. Они не учитывают описанный
      принцип.
    id: transistors-pmos-ideal-diode-0
