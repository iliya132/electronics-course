    question: При разборе задачи «Ключ для реле или мотора» какой вывод обоснован?
    options:
      - Диод добавляют только после появления искры
      - Нагрузку реле подключают прямо к GPIO
      - Защитный диод должен быть подключён до первого выключения катушки.
    answer: 2
    hint: >-
      Выбирай нагрузку по известному пусковому току и ограничивай источник. Управляющая часть и
      силовая часть имеют общий GND, если нет изоляции.
    explanation: >-
      Защитный диод должен быть подключён до первого выключения катушки. Включим маленький мотор или
      реле внешним ключом. Сравним управляющий ток и нагрев, а затем убедимся в наличии пути тока
      выключения. Ошибочные варианты: Диод добавляют только после появления искры; Нагрузку реле
      подключают прямо к GPIO. Они не учитывают описанный принцип.
    id: transistors-motor-relay-driver-0
    lesson: motor-relay-driver
    difficulty: 1
