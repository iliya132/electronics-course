id: exam-transistors
topic: transistors
pass_percent: 70
questions_per_attempt: 10
questions:
  - id: "tr-001"
    lesson: "transistor-idea"
    difficulty: 1
    type: "single"
    question: "Чем в целом отличается транзистор-ключ от усилителя?"
    options:
      - "Ключ либо полностью закрыт, либо полностью открыт, усилитель работает в промежуточном режиме"
      - "Ключ создаёт энергию, а усилитель нет"
      - "Ключ работает только на переменном токе"
    answer: 0
    explanation: "В режиме ключа транзистор или заперт, или насыщен. В усилителе ток плавно следует за управляющим сигналом."
  - id: "tr-002"
    lesson: "transistor-idea"
    difficulty: 1
    type: "single"
    question: "Как называется вывод BJT, которым управляют током?"
    options:
      - "База"
      - "Сток"
      - "Исток"
    answer: 0
    explanation: "У BJT выводы — база, коллектор, эмиттер; управляющий вывод — база."
  - id: "tr-003"
    lesson: "transistor-idea"
    difficulty: 2
    type: "single"
    question: "Почему затвор MOSFET в установившемся режиме почти не потребляет ток?"
    options:
      - "Он изолирован от канала слоем диэлектрика"
      - "Он подключён к земле"
      - "Он сделан из металла с малым сопротивлением"
    answer: 0
    explanation: "Затвор — это обкладка конденсатора; постоянный ток через диэлектрик не течёт."
  - id: "tr-004"
    lesson: "transistor-idea"
    difficulty: 1
    type: "numeric"
    question: "Нагрузке нужно 240 мА, вывод МК отдаёт не более 8 мА. Во сколько раз ток нагрузки больше? Ответ числом."
    answer: 30
    unit: "раз"
    tolerance_percent: 2
    explanation: "240 / 8 = 30. Нужен транзисторный ключ."
  - id: "tr-005"
    lesson: "transistor-idea"
    difficulty: 2
    type: "single"
    question: "Радиатор TO-220 у MOSFET обычно электрически соединён с..."
    options:
      - "Стоком"
      - "Затвором"
      - "Никуда не подключён"
    answer: 0
    explanation: "Металлическая площадка корпуса у большинства MOSFET — это сток; при общем радиаторе нужна изоляция."
  - id: "tr-006"
    lesson: "bjt-switch"
    difficulty: 1
    type: "numeric"
    question: "Ток нагрузки NPN-ключа 150 мА. Какой ток базы по правилу Iк/10? Ответ в миллиамперах."
    answer: 15
    unit: "мА"
    tolerance_percent: 2
    explanation: "150 / 10 = 15 мА."
  - id: "tr-007"
    lesson: "bjt-switch"
    difficulty: 2
    type: "numeric"
    question: "Ключ управляется от 5 В, ток базы нужен 4 мА. Найди Rб (Uбэ = 0,7 В). Ответ в омах."
    answer: 1075
    unit: "Ом"
    tolerance_percent: 3
    explanation: "(5 − 0,7) / 0,004 = 1075 Ом; из E24 берут 1 кОм."
  - id: "tr-008"
    lesson: "bjt-switch"
    difficulty: 1
    type: "single"
    question: "Чему примерно равно Uкэ насыщенного ключа?"
    options:
      - "0,1–0,3 В"
      - "5 В"
      - "0,7 В всегда, не зависит от режима"
    answer: 0
    explanation: "В насыщении коллектор почти замыкается на эмиттер; Uкэ(нас) малое."
  - id: "tr-009"
    lesson: "bjt-switch"
    difficulty: 2
    type: "single"
    question: "Что делает резистор 10 кОм между базой и эмиттером?"
    options:
      - "Не даёт ключу открыться наводками при отключённом управлении"
      - "Ограничивает ток нагрузки"
      - "Увеличивает β"
    answer: 0
    explanation: "При плавающей базе наводки создают ток; резистор держит базу на нуле."
  - id: "tr-010"
    lesson: "bjt-switch"
    difficulty: 2
    type: "numeric"
    question: "Насыщенный NPN-ключ: Uкэ = 0,25 В, ток 0,4 А. Какая мощность в транзисторе? Ответ в милливаттах."
    answer: 100
    unit: "мВт"
    tolerance_percent: 3
    explanation: "0,25 × 0,4 = 0,1 Вт = 100 мВт."
  - id: "tr-011"
    lesson: "mosfet-switch"
    difficulty: 1
    type: "single"
    question: "Что такое логический MOSFET?"
    options:
      - "MOSFET с гарантированным малым Rds(on) при Uзи 4,5 или 2,5 В"
      - "MOSFET, который можно включить без затвора"
      - "MOSFET только для цифровых схем"
    answer: 0
    explanation: "Логический уровень означает, что транзистор полностью открывается от напряжения МК."
  - id: "tr-012"
    lesson: "mosfet-switch"
    difficulty: 1
    type: "numeric"
    question: "Rds(on) = 0,06 Ом, ток 2,5 А. Какая мощность выделяется на ключе? Ответ в ваттах."
    answer: 0.375
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = 2,5² × 0,06 = 6,25 × 0,06 = 0,375 Вт."
  - id: "tr-013"
    lesson: "mosfet-switch"
    difficulty: 2
    type: "numeric"
    question: "Подтяжка затвора 47 кОм, на затворе 5 В. Какой ток идёт через неё? Ответ в микроамперах."
    answer: 106
    unit: "мкА"
    tolerance_percent: 3
    explanation: "5 / 47 000 = 0,000106 А = 106 мкА."
  - id: "tr-014"
    lesson: "mosfet-switch"
    difficulty: 2
    type: "single"
    question: "Почему обычный (не логический) MOSFET с Rds(on) при 10 В плохо подходит для вывода 3,3 В?"
    options:
      - "Откроется лишь частично, Rds(on) будет намного выше и ключ нагреется"
      - "Он сгорит от 3,3 В"
      - "Он вообще не открывается"
    answer: 0
    explanation: "Rds(on) растёт при снижении Uзи, и при 3,3 В оно может быть в разы выше паспортного."
  - id: "tr-015"
    lesson: "mosfet-switch"
    difficulty: 1
    type: "single"
    question: "Что нельзя превышать на затворе MOSFET?"
    options:
      - "Предельное Uзи, обычно ±20 В"
      - "Нулевое напряжение"
      - "Ток стока ниже 1 мкА"
    answer: 0
    explanation: "Превышение Uзи пробивает изолятор затвора, и MOSFET выходит из строя."
  - id: "tr-016"
    lesson: "low-high-side"
    difficulty: 1
    type: "single"
    question: "Где расположен нижний ключ?"
    options:
      - "Между нагрузкой и землёй"
      - "Между источником питания и нагрузкой"
      - "Параллельно нагрузке"
    answer: 0
    explanation: "Нижний ключ размыкает цепь со стороны земли."
  - id: "tr-017"
    lesson: "low-high-side"
    difficulty: 2
    type: "numeric"
    question: "P-MOSFET в плюсе 24 В, затвор подключён к земле. Чему равно Uзи? Ответ в вольтах."
    answer: -24
    unit: "В"
    tolerance_percent: 2
    explanation: "Uзи = 0 − 24 = −24 В; это больше типичного предела ±20 В."
  - id: "tr-018"
    lesson: "low-high-side"
    difficulty: 2
    type: "single"
    question: "Почему верхний N-MOSFET напрямую от МК 3,3 В не работает при нагрузке на землю?"
    options:
      - "Исток поднимается к напряжению питания, Uзи падает ниже порога"
      - "Затвор не принимает 3,3 В"
      - "Транзистор пропускает ток в обратную сторону"
    answer: 0
    explanation: "Uзи = Uзатвора − Uистока; чтобы ключ был открыт, исток не должен уходить к шине."
  - id: "tr-019"
    lesson: "low-high-side"
    difficulty: 3
    type: "numeric"
    question: "Rпу = 22 кОм, ёмкость затвора 2 нФ. Постоянная времени закрытия, мкс."
    answer: 44
    unit: "мкс"
    tolerance_percent: 3
    explanation: "τ = 22 000 × 2·10⁻⁹ = 44 мкс."
  - id: "tr-020"
    lesson: "inductive-loads"
    difficulty: 1
    type: "numeric"
    question: "Катушка реле 12 В, 240 Ом. Какой ток она потребляет? Ответ в миллиамперах."
    answer: 50
    unit: "мА"
    tolerance_percent: 2
    explanation: "12 / 240 = 0,05 А = 50 мА."
  - id: "tr-021"
    lesson: "inductive-loads"
    difficulty: 1
    type: "single"
    question: "Как включается обратный диод на катушке реле, питаемой плюсом?"
    options:
      - "Параллельно катушке катодом к плюсу"
      - "Последовательно катушке"
      - "Параллельно катушке анодом к плюсу"
    answer: 0
    explanation: "В рабочем режиме диод заперт, при выключении замыкает ток катушки."
  - id: "tr-022"
    lesson: "inductive-loads"
    difficulty: 2
    type: "numeric"
    question: "Мотор работает при 0,4 А, пусковой ток в 5 раз больше. Какой ток должен выдерживать ключ? Ответ в амперах."
    answer: 2
    unit: "А"
    tolerance_percent: 3
    explanation: "0,4 × 5 = 2 А; берут ключ с запасом."
  - id: "tr-023"
    lesson: "inductive-loads"
    difficulty: 2
    type: "numeric"
    question: "ШИМ на 12 В, скважность 25 %. Среднее напряжение, В."
    answer: 3
    unit: "В"
    tolerance_percent: 2
    explanation: "0,25 × 12 = 3 В."
  - id: "tr-024"
    lesson: "h-bridge"
    difficulty: 1
    type: "single"
    question: "Какая пара ключей в мосте даёт сквозной ток?"
    options:
      - "Верхний и нижний ключи одной стойки"
      - "Верхние ключи двух стоек"
      - "Диагональные ключи"
    answer: 0
    explanation: "Верхний и нижний ключи одной стойки замыкают питание на землю."
  - id: "tr-025"
    lesson: "h-bridge"
    difficulty: 2
    type: "numeric"
    question: "Мост из двух MOSFET по 0,2 Ом, питание 12 В. Сквозной ток без учёта источника, А."
    answer: 30
    unit: "А"
    tolerance_percent: 3
    explanation: "12 / 0,4 = 30 А."
  - id: "tr-026"
    lesson: "h-bridge"
    difficulty: 2
    type: "numeric"
    question: "Мотор 3 А, драйвер с общим сопротивлением 0,09 Ом. Падение на драйвере, В."
    answer: 0.27
    unit: "В"
    tolerance_percent: 3
    explanation: "3 × 0,09 = 0,27 В."
  - id: "tr-027"
    lesson: "h-bridge"
    difficulty: 2
    type: "single"
    question: "Что означает режим торможения моста при включении A и B?"
    options:
      - "Оба вывода мотора подключены к плюсу, мотор тормозит накоротко"
      - "Мотор вращается быстрее"
      - "Мотор отключается от питания полностью"
    answer: 0
    explanation: "Оба вывода на одном потенциале замыкают ЭДС мотора, и он быстро тормозит."
  - id: "tr-028"
    lesson: "pmos-ideal-diode"
    difficulty: 1
    type: "single"
    question: "Как подключают P-MOSFET для защиты от переполюсовки?"
    options:
      - "Сток к батарее, исток к нагрузке, затвор на землю"
      - "Исток к батарее, сток к нагрузке, затвор к плюсу"
      - "Параллельно нагрузке"
    answer: 0
    explanation: "Тогда корпусной диод пропускает ток к нагрузке, а затвор открывает канал."
  - id: "tr-029"
    lesson: "pmos-ideal-diode"
    difficulty: 2
    type: "numeric"
    question: "Rds(on) = 20 мОм, ток 4 А. Падение на защите, мВ."
    answer: 80
    unit: "мВ"
    tolerance_percent: 3
    explanation: "4 × 0,02 = 0,08 В."
  - id: "tr-030"
    lesson: "pmos-ideal-diode"
    difficulty: 2
    type: "numeric"
    question: "Диод Шоттки 0,4 В при 3 А. Какая мощность в нём? Ответ в ваттах."
    answer: 1.2
    unit: "Вт"
    tolerance_percent: 3
    explanation: "0,4 × 3 = 1,2 Вт."
  - id: "tr-031"
    lesson: "pmos-ideal-diode"
    difficulty: 2
    type: "single"
    question: "Что происходит при перевёрнутой батарее в схеме с P-MOSFET?"
    options:
      - "Uзи равно нулю, канал закрыт, нагрузка защищена"
      - "Транзистор открывается"
      - "Диод пропускает ток в нагрузку"
    answer: 0
    explanation: "Исток и затвор оба на нуле, поэтому ключ закрыт."
  - id: "tr-032"
    lesson: "amplifier-basics"
    difficulty: 2
    type: "numeric"
    question: "Iэ = 0,5 мА. Чему равно rэ ≈ 25 мВ / Iэ? Ответ в омах."
    answer: 50
    unit: "Ом"
    tolerance_percent: 3
    explanation: "0,025 / 0,0005 = 50 Ом."
  - id: "tr-033"
    lesson: "amplifier-basics"
    difficulty: 2
    type: "numeric"
    question: "Rк = 10 кОм, Rэ = 1 кОм без шунта. Каково усиление по модулю?"
    answer: 10
    unit: "раз"
    tolerance_percent: 3
    explanation: "|Av| = Rк / Rэ = 10."
  - id: "tr-034"
    lesson: "amplifier-basics"
    difficulty: 1
    type: "single"
    question: "Что такое рабочая точка усилителя?"
    options:
      - "Постоянные токи и напряжения каскада без сигнала"
      - "Точка на плате, где паяется транзистор"
      - "Максимальное напряжение выхода"
    answer: 0
    explanation: "Сигнал колеблется вокруг рабочей точки, она задаётся делителем и Rэ."
  - id: "tr-035"
    lesson: "night-light"
    difficulty: 2
    type: "numeric"
    question: "В ночнике Rверх = 40 кОм, Rldr = 20 кОм, питание 12 В. Uз, В."
    answer: 4
    unit: "В"
    tolerance_percent: 3
    explanation: "12 × 20 / 60 = 4 В."
  - id: "tr-036"
    lesson: "night-light"
    difficulty: 1
    type: "single"
    question: "Почему ночник мигает на пороге при освещении ленты на фоторезистор?"
    options:
      - "Оптическая обратная связь: свет ленты уменьшает сопротивление фоторезистора"
      - "Лента слишком мощная"
      - "Затвор перегрелся"
    answer: 0
    explanation: "Лента освещает датчик, Uз падает, лента гаснет, датчик снова темнеет."
  - id: "tr-037"
    lesson: "night-light"
    difficulty: 2
    type: "single"
    question: "В какое плечо делителя нужно поставить фоторезистор, чтобы лента включалась в темноте?"
    options:
      - "В нижнее, между затвором и землёй"
      - "В верхнее, между плюсом и затвором"
      - "Параллельно ленте"
    answer: 0
    explanation: "В темноте Rldr растёт, и напряжение на нём (затворе) растёт."
  - id: "tr-038"
    lesson: "motor-relay-driver"
    difficulty: 2
    type: "numeric"
    question: "Падение на L298N 1,6 В, питание 12 В. Напряжение на моторе, В."
    answer: 10.4
    unit: "В"
    tolerance_percent: 2
    explanation: "12 − 1,6 = 10,4 В."
  - id: "tr-039"
    lesson: "motor-relay-driver"
    difficulty: 1
    type: "single"
    question: "Почему реле не подходит для регулировки скорости ШИМ?"
    options:
      - "Оно механическое и не рассчитано на частые переключения"
      - "Реле не пропускает ток"
      - "Оно требует 220 В"
    answer: 0
    explanation: "Контакты реле износятся за считанные минуты при частотах ШИМ."
  - id: "tr-040"
    lesson: "motor-relay-driver"
    difficulty: 2
    type: "numeric"
    question: "Rds(on) = 30 мОм, ток вентилятора 0,3 А. Потери на ключе, мВт."
    answer: 2.7
    unit: "мВт"
    tolerance_percent: 4
    explanation: "0,3² × 0,03 = 0,0027 Вт = 2,7 мВт."
