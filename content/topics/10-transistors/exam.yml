    question: При разборе задачи «Индуктивные нагрузки» какой вывод обоснован?
    options:
      - Реле и мотор не создают выбросов при выключении
      - Драйвер мотора проверяют по пусковому и стопорному току.
      - Достаточно измерить только холостой ток мотора
    answer: 1
    hint: >-
      Выбирай драйвер по пусковому и стопорному току. Размещай защиту рядом с нагрузкой или силовой
      петлёй и разделяй шумное питание от сигнального.
    explanation: >-
      Драйвер мотора проверяют по пусковому и стопорному току. Мотор и реле не являются чистыми
      резисторами. Индуктивность сохраняет ток после выключения, а мотор при запуске может
      потреблять большой стопорный ток. Защитный диод или драйвер задаёт путь тока. ШИМ меняет
      среднюю энергию, но ключ должен выдерживать пиковые значения. Ошибочные варианты: Достаточно
      измерить только холостой ток мотора; Реле и мотор не создают выбросов при выключении. Они не
      учитывают описанный принцип.
    id: transistors-inductive-loads-0
    lesson: inductive-loads
    difficulty: 1
