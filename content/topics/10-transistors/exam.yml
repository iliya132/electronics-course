    question: При разборе задачи «Нижний и верхний ключ» какой вывод обоснован?
    options:
      - Затвор всегда оценивают только относительно земли
      - Верхний N-MOSFET полностью открывается обычными 3,3 В при высоком истоке
      - Управление MOSFET определяется Vgs относительно истока.
    answer: 2
    hint: >-
      Проверяй напряжение именно между затвором и истоком, а не относительно GND. Избегай обратного
      питания нагрузки через её сигнальные выводы.
    explanation: >-
      Управление MOSFET определяется Vgs относительно истока. Иногда нагрузка должна сохранять
      прямую связь с землёй. Нижний N-MOSFET разрывает возврат, верхний ключ разрывает плюс.
      P-канальный верхний ключ открывается отрицательным Vgs; для верхнего N-канального обычно нужен
      драйвер выше потенциала истока. Ошибочные варианты: Затвор всегда оценивают только
      относительно земли; Верхний N-MOSFET полностью открывается обычными 3,3 В при высоком истоке.
      Они не учитывают описанный принцип.
    id: transistors-low-high-side-0
    lesson: low-high-side
    difficulty: 1
