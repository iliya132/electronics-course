    question: При разборе задачи «Биполярный NPN как ключ» какой вывод обоснован?
    options:
      - Базу подключают к GPIO без резистора
      - Расчёт насыщенного ключа опирается на принудительный коэффициент и ограничения GPIO.
      - Типичный hFE гарантирован при любых токах и насыщении
    answer: 1
    hint: >-
      Считай резистор базы по напряжению управления и Vbe; измерь Vce под нагрузкой. У катушки
      обязательно добавь защитный диод.
    explanation: >-
      Расчёт насыщенного ключа опирается на принудительный коэффициент и ограничения GPIO. GPIO не
      должен напрямую питать реле. NPN в нижнем ключе принимает ток нагрузки через коллектор;
      эмиттер идёт к GND, база получает ограниченный ток через резистор. Для насыщения выбирают
      принудительный Ic/Ib, например 10, и проверяют способность GPIO дать Ib. Типичный hFE
      усилительного режима не гарантирует насыщение. Ошибочные варианты: Типичный hFE гарантирован
      при любых токах и насыщении; Базу подключают к GPIO без резистора. Они не учитывают описанный
      принцип.
    id: transistors-bjt-switch-0
    lesson: bjt-switch
    difficulty: 1
  - type: numeric
    question: >-
      NPN-ключ: Ic = 70 мА, принудительный коэффициент Ic/Ib = 10, GPIO = 3,3 В, Vbe = 0,7 В. Найди
      Rб.
    answer: 371.42857142857133
    unit: Ом
    tolerance_percent: 1
    hint: Ib = Ic/βforced; Rб = (Uупр−Vbe)/Ib. βforced = 10 задан моделью насыщения, не типичным hFE.
    explanation: (3,3−0,7)/(70/1000/10) = 371,429 Ом.
    id: transistors-bjt-switch-1
    lesson: bjt-switch
    difficulty: 1
