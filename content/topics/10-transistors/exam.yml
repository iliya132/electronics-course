    question: При разборе задачи «Транзисторный усилитель (обзор)» какой вывод обоснован?
    options:
      - Усилитель с общим эмиттером всегда сохраняет фазу
      - Рабочая точка нужна для усиления без отсечки и насыщения.
      - Ключевой режим автоматически обеспечивает линейное усиление
    answer: 1
    hint: >-
      Проверь DC-режим до подачи сигнала. Если форма обрезана, уменьшай вход или меняй смещение; для
      точного усиления часто удобнее ОУ.
    explanation: >-
      Рабочая точка нужна для усиления без отсечки и насыщения. Чтобы увеличить небольшой сигнал,
      транзистор удерживают в промежуточном режиме. Рабочая точка задаёт ток и напряжение без
      сигнала, оставляя запас до насыщения и отсечки. Усилитель с общим эмиттером инвертирует
      сигнал; эмиттерная обратная связь повышает стабильность ценой усиления. Ошибочные варианты:
      Ключевой режим автоматически обеспечивает линейное усиление; Усилитель с общим эмиттером
      всегда сохраняет фазу. Они не учитывают описанный принцип.
    id: transistors-amplifier-basics-0
    lesson: amplifier-basics
    difficulty: 1
  - type: numeric
