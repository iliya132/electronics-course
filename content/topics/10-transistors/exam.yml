    question: При разборе задачи «Ночник на фоторезисторе» какой вывод обоснован?
    options:
      - Промежуточное открытие MOSFET может сильно греть ключ.
      - Любое свечение LED означает безопасный режим мощной ленты
      - Vgs(th) определяет безопасную мощность ключа
    answer: 0
    hint: >-
      Сначала проверь напряжение затвора при свете и темноте. Для мощной ленты добавь компаратор с
      гистерезисом и подходящий драйвер.
    explanation: >-
      Промежуточное открытие MOSFET может сильно греть ключ. Сделаем ночник, реагирующий на
      освещение. Фоторезистор меняет сопротивление, делитель управляет ключом; прямое управление
      может дать плавный переход и нагрев MOSFET, поэтому начинать нужно с малой нагрузки. Ошибочные
      варианты: Любое свечение LED означает безопасный режим мощной ленты; Vgs(th) определяет
      безопасную мощность ключа. Они не учитывают описанный принцип.
    id: transistors-night-light-0
    lesson: night-light
    difficulty: 1
  - type: numeric
