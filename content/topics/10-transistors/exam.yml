    question: При разборе задачи «H-мост» какой вывод обоснован?
    options:
      - Одновременное включение верхнего и нижнего ключа одной стойки опасно.
      - Для реверса включают все четыре ключа
      - Торможение и свободный ход являются одним режимом
    answer: 0
    hint: >-
      Используй готовый драйвер с подходящими токами и защитой, например TB6612 или DRV8833. Проверь
      таблицу входов: торможение отличается от свободного хода.
    explanation: >-
      Одновременное включение верхнего и нижнего ключа одной стойки опасно. Чтобы мотор вращался в
      обе стороны, меняют полярность на его выводах. H-мост содержит четыре ключа. Противоположные
      диагонали задают направления; два ключа одной стойки создают короткое замыкание питания. Между
      переключениями требуется dead time, а ток имеет пути рециркуляции. Ошибочные варианты: Для
      реверса включают все четыре ключа; Торможение и свободный ход являются одним режимом. Они не
      учитывают описанный принцип.
    id: transistors-h-bridge-0
    lesson: h-bridge
    difficulty: 1
