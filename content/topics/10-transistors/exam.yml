    question: При разборе задачи «Идея транзистора» какой вывод обоснован?
    options:
      - Транзистор создаёт мощность из управляющего сигнала
      - У всех TO-92 одинакова распиновка
      - Транзистор управляет энергией внешнего источника, а не создаёт её.
    answer: 2
    hint: >-
      Начинай с точной маркировки и распиновки. Аналогия крана описывает управление потоком, но не
      заменяет электрическую модель и тепловой расчёт.
    explanation: >-
      Транзистор управляет энергией внешнего источника, а не создаёт её. Малый управляющий сигнал
      должен включить более мощную нагрузку. Транзистор может работать ключом или усилителем. BJT
      имеет базу, коллектор и эмиттер; MOSFET — затвор, сток и исток. Выводы и внутренние диоды
      зависят от типа, корпуса и изготовителя. Ошибочные варианты: Транзистор создаёт мощность из
      управляющего сигнала; У всех TO-92 одинакова распиновка. Они не учитывают описанный принцип.
    id: transistors-transistor-idea-0
    lesson: transistor-idea
    difficulty: 1
