    question: При разборе задачи «N-MOSFET как ключ» какой вывод обоснован?
    options:
      - Порог Vgs(th) не гарантирует малое сопротивление полностью открытого ключа.
      - Logic-level означает пригодность при любом напряжении GPIO
      - Нулевой постоянный ток затвора означает отсутствие переключательных потерь
    answer: 0
    hint: >-
      Поставь резистор затвора и подтяжку к истоку, проверь распиновку и нагрев. Для 3,3 В выбирай
      транзистор с нормированным сопротивлением при 2,5 или 3,3 В.
    explanation: >-
      Порог Vgs(th) не гарантирует малое сопротивление полностью открытого ключа. MOSFET может
      включать амперную нагрузку при малом постоянном токе затвора. Но Vgs(th) означает лишь начало
      проводимости при малом токе. Для ключа нужно гарантированное Rds(on) при доступном Vgs.
      IRLZ44N нельзя автоматически считать полностью открытым от 3,3 В без соответствующей гарантии
      даташита. Ошибочные варианты: Logic-level означает пригодность при любом напряжении GPIO;
      Нулевой постоянный ток затвора означает отсутствие переключательных потерь. Они не учитывают
      описанный принцип.
    id: transistors-mosfet-switch-0
    lesson: mosfet-switch
    difficulty: 1
  - type: numeric
    question: >-
      Ключ имеет гарантированное Rds(on) = 0,05 Ом при заданном Ugs. Ток 1,4 А. Найди статические
      потери.
    answer: 0.09800000000000003
    unit: Вт
    tolerance_percent: 1
    hint: >-
      Pпроводимости = I²Rds(on); отдельно учитывают переключения, нагрев и зависимость сопротивления
      от Ugs.
    explanation: 1,4²×0,05 = 0,098 Вт.
    id: transistors-mosfet-switch-1
    lesson: mosfet-switch
    difficulty: 1
