  - type: single
    question: При разборе задачи «Ёмкость и ток» какой вывод обоснован?
    options:
      - Преобразователь сохраняет одинаковый ток на входе и выходе
      - При разных напряжениях входа и выхода время считают через баланс энергии.
      - Ёмкость автоматически равна максимально допустимому току
    answer: 1
    hint: >-
      Используй среднее напряжение и реально доступную ёмкость, затем сравни оценку с измерением. Не
      умножай ёмкость на КПД без учёта разных напряжений сторон преобразователя.
    explanation: >-
      При разных напряжениях входа и выхода время считают через баланс энергии. Аккумулятор большой
      ёмкости не обязательно отдаёт большой ток. Ампер-часы характеризуют заряд при заданном режиме,
      C-rate — относительный ток. При преобразовании напряжения время удобнее считать по энергии:
      t≈η·Uакк·C/Pнагрузки. Собственный ток платы и отключение по напряжению уменьшают доступное
      время. Ошибочные варианты: Ёмкость автоматически равна максимально допустимому току;
      Преобразователь сохраняет одинаковый ток на входе и выходе. Они не учитывают описанный
      принцип.
    id: sources-capacity-crate-0
    lesson: capacity-crate
    difficulty: 1
  - type: numeric
    question: Ёмкость аккумулятора 2 А·ч. Какой ток соответствует 0,7C?
    answer: 1.4000000000000001
    unit: А
    tolerance_percent: 1
    hint: >-
      I = Cном·k, где Cном в А·ч, k — численное значение C-rate в 1/ч. Допустимость тока определяет
      изготовитель.
    explanation: 2 × 0,7 = 1,4 А.
    id: sources-capacity-crate-1
    lesson: capacity-crate
    difficulty: 1
