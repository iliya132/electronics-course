  - type: single
    question: При разборе задачи «Li-ion безопасно» какой вывод обоснован?
    options:
      - Плата защиты не заменяет контроллер заряда.
      - Защита позволяет зарядить любую химию одним напряжением
      - Повреждённую оболочку элемента можно игнорировать
    answer: 0
    hint: >-
      Используй неповреждённый защищённый элемент в держателе. Перед подключением проверь
      полярность, химию и маркировку платы защиты; не паяй прямо к корпусу банки.
    explanation: >-
      Плата защиты не заменяет контроллер заряда. Короткое замыкание аккумулятора может вызвать
      сильный нагрев. Li-ion требует совместимого контроллера заряда и защиты от переразряда,
      перегрузки и короткого замыкания. Для распространённой химии зарядное ограничение часто 4,2 В,
      но его нельзя переносить на LiFePO4 и другие варианты. Защита и зарядник выполняют разные
      функции. Ошибочные варианты: Защита позволяет зарядить любую химию одним напряжением;
      Повреждённую оболочку элемента можно игнорировать. Они не учитывают описанный принцип.
    id: sources-li-ion-safety-0
    lesson: li-ion-safety
    difficulty: 1
