    question: При разборе задачи «Наблюдение заряда Li-ion» какой вывод обоснован?
    options:
      - Заряд можно оставлять без наблюдения рядом с горючими материалами
      - Можно перепутать B и OUT у модуля защиты
      - Для опыта нужна совместимая защищённая ячейка и проверенный зарядный модуль.
    answer: 2
    hint: >-
      Подключай нагрузку после завершения измерения заряда. Входной ток USB не равен току
      аккумулятора при дополнительных потребителях.
    explanation: >-
      Для опыта нужна совместимая защищённая ячейка и проверенный зарядный модуль. Проверим профиль
      заряда готовым модулем без самостоятельной сборки зарядной микросхемы. Наблюдаем переход от
      ограничения тока к ограничению напряжения и нагрев. Ошибочные варианты: Заряд можно оставлять
      без наблюдения рядом с горючими материалами; Можно перепутать B и OUT у модуля защиты. Они не
      учитывают описанный принцип.
    id: sources-liion-charger-module-0
    lesson: liion-charger-module
    difficulty: 1
