    question: При разборе задачи «USB-питание» какой вывод обоснован?
    options:
      - CC1 и CC2 нужно закоротить между собой
      - USB-C потребитель должен учитывать согласованный или объявленный ток.
      - Любой USB-C разъём автоматически выдаёт 20 В
    answer: 1
    hint: >-
      Не соединяй CC1 с CC2. Проверь объявленный ток, кабель, полярность и падение под нагрузкой; не
      считай 3 А гарантированными для любого порта.
    explanation: >-
      USB-C потребитель должен учитывать согласованный или объявленный ток. Наличие разъёма USB-C не
      означает право потреблять любой ток. Базовое питание VBUS обычно 5 В; доступный ток зависит от
      режима и объявления источника. У простого USB-C потребителя ставят отдельные Rd около 5,1 кОм
      на CC1 и CC2 к GND. Более высокое напряжение требует согласования, например PD. Ошибочные
      варианты: Любой USB-C разъём автоматически выдаёт 20 В; CC1 и CC2 нужно закоротить между
      собой. Они не учитывают описанный принцип.
    id: sources-usb-power-0
    lesson: usb-power
    difficulty: 1
  - type: numeric
