id: exam-sources
topic: sources
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── Батареи и аккумуляторы ─────
  - id: s-001
    lesson: battery-types
    difficulty: 1
    type: single
    question: "Каково номинальное напряжение одного NiMH-аккумулятора типоразмера AA?"
    options:
      - "1,2 В"
      - "1,5 В"
      - "3,7 В"
    answer: 0
    explanation: "У NiMH номинал 1,2 В. 1,5 В — у щелочной батарейки, 3,7 В — у литий-ионного элемента."
  - id: s-002
    lesson: battery-types
    difficulty: 1
    type: numeric
    question: "Три Li-ion элемента по 3,7 В соединены последовательно. Каково номинальное напряжение батареи?"
    answer: 11.1
    unit: "В"
    tolerance_percent: 1
    explanation: "При последовательном соединении напряжения складываются: 3 × 3,7 = 11,1 В."
  - id: s-003
    lesson: battery-types
    difficulty: 2
    type: numeric
    question: "Батарея 2S3P из элементов 3,7 В и 3000 мА·ч. Какова её ёмкость?"
    answer: 9000
    unit: "мА·ч"
    tolerance_percent: 1
    explanation: "Параллельных цепочек три, ёмкости складываются: 3 × 3000 = 9000 мА·ч. Напряжение 2 × 3,7 = 7,4 В."
  - id: s-004
    lesson: battery-types
    difficulty: 2
    type: single
    question: "Какая химия имеет почти плоскую кривую разряда около 3,3 В и ресурс более 2000 циклов?"
    options:
      - "LiFePO4"
      - "Щелочная"
      - "Солевая"
    answer: 0
    explanation: "LiFePO4 держит напряжение около 3,2–3,3 В почти до конца разряда и выдерживает тысячи циклов. Щелочная и солевая — одноразовые, а их напряжение плавно падает."
  - id: s-005
    lesson: battery-types
    difficulty: 3
    type: numeric
    question: "Батарея 4S2P собрана из элементов 3,7 В и 2500 мА·ч. Сколько энергии она хранит?"
    answer: 74
    unit: "Вт·ч"
    tolerance_percent: 1
    explanation: "Напряжение 4 × 3,7 = 14,8 В, ёмкость 2 × 2,5 = 5 А·ч. E = 14,8 × 5 = 74 Вт·ч. Проверка: 8 элементов по 9,25 Вт·ч дают 74 Вт·ч."
  # ───── Ёмкость и ток ─────
  - id: s-006
    lesson: capacity-crate
    difficulty: 1
    type: numeric
    question: "Элемент 2400 мА·ч разряжают током 1,2 А. Каков C-rate?"
    answer: 0.5
    unit: "C"
    tolerance_percent: 2
    explanation: "C-rate = I / C = 1,2 А / 2,4 А·ч = 0,5C."
  - id: s-007
    lesson: capacity-crate
    difficulty: 2
    type: numeric
    question: "Какой ток соответствует 3C для элемента 2000 мА·ч?"
    answer: 6
    unit: "А"
    tolerance_percent: 2
    explanation: "3C означает ток в три раза больше ёмкости в А·ч: 3 × 2 = 6 А."
  - id: s-008
    lesson: capacity-crate
    difficulty: 2
    type: numeric
    question: "Устройство потребляет 50 мА. Батарея 1500 мА·ч, но реально доступно 80 % ёмкости. На сколько часов хватит?"
    answer: 24
    unit: "ч"
    tolerance_percent: 2
    explanation: "Доступно 1500 × 0,8 = 1200 мА·ч, t = 1200 / 50 = 24 ч."
  - id: s-009
    lesson: capacity-crate
    difficulty: 3
    type: numeric
    question: "Нагрузка 5 В и 100 мА питается через повышающий преобразователь с КПД 90 % от аккумулятора 3,7 В. Какой ток отдаёт аккумулятор? Ответ в миллиамперах."
    answer: 150
    unit: "мА"
    tolerance_percent: 2
    explanation: "P = 5 × 0,1 = 0,5 Вт. От батареи P_бат = 0,5 / 0,9 = 0,556 Вт, ток 0,556 / 3,7 ≈ 0,150 А = 150 мА."
  - id: s-010
    lesson: capacity-crate
    difficulty: 2
    type: single
    question: "Как влияет сильный мороз на доступную ёмкость аккумулятора?"
    options:
      - "Ёмкость заметно падает"
      - "Ёмкость растёт"
      - "Не влияет"
    answer: 0
    explanation: "При низких температурах химические процессы замедляются, и внутреннее сопротивление растёт, поэтому доступная ёмкость уменьшается на десятки процентов."
  # ───── Безопасность Li-ion ─────
  - id: s-011
    lesson: li-ion-safety
    difficulty: 1
    type: single
    question: "Каково максимальное напряжение заряда одного литий-ионного элемента?"
    options:
      - "4,2 В"
      - "3,0 В"
      - "5,0 В"
    answer: 0
    explanation: "Полный заряд Li-ion — 4,2 В. 3,0 В — нижняя граница разряда. Заряжать до 5 В нельзя."
  - id: s-012
    lesson: li-ion-safety
    difficulty: 2
    type: numeric
    question: "До какого напряжения заряжают батарею 2S из Li-ion?"
    answer: 8.4
    unit: "В"
    tolerance_percent: 1
    explanation: "2 × 4,2 = 8,4 В."
  - id: s-013
    lesson: li-ion-safety
    difficulty: 2
    type: single
    question: "Какой вывод микросхемы DW01 отключает заряд при перезаряде?"
    options:
      - "OC"
      - "OD"
      - "GND"
    answer: 0
    explanation: "OC (overcharge) управляет ключом заряда, OD (overdischarge) отключает разряд при переразряде, перегрузке и КЗ."
  - id: s-014
    lesson: li-ion-safety
    difficulty: 3
    type: single
    question: "Лабораторный блок питания установлен на 4,2 В без ограничения тока. Почему опасно так заряжать глубоко разряженный элемент?"
    options:
      - "В начале разница напряжений мала, но ток ограничен только малыми сопротивлениями, и может быть очень большим"
      - "Блок питания не умеет выдавать 4,2 В"
      - "Элемент заряжается слишком медленно и теряет ёмкость"
    answer: 0
    explanation: "Правильный заряд идёт с ограничением тока (CC). Без него ток определяется внутренним сопротивлением и проводами и может достигать десятков ампер, нагрев вызывает разрушение. Скорость заряда тут не основная проблема."
  # ───── TP4056 ─────
  - id: s-015
    lesson: tp4056
    difficulty: 1
    type: single
    question: "Как называется этап заряда с постоянным напряжением 4,2 В?"
    options:
      - "CV"
      - "CC"
      - "BMS"
    answer: 0
    explanation: "CV — Constant Voltage. На нём напряжение зафиксировано, а ток падает. CC — этап постоянного тока."
  - id: s-016
    lesson: tp4056
    difficulty: 2
    type: numeric
    question: "Подбери Rprog для TP4056 на ток заряда 0,4 А. Ответ в килоомах."
    answer: 3
    unit: "кОм"
    tolerance_percent: 2
    explanation: "Rprog = 1200 / 0,4 = 3000 Ом = 3 кОм."
  - id: s-017
    lesson: tp4056
    difficulty: 2
    type: numeric
    question: "Rprog у модуля TP4056 равен 3 кОм. Каков ток заряда на этапе CC? Ответ в миллиамперах."
    answer: 400
    unit: "мА"
    tolerance_percent: 3
    explanation: "I = 1200 / 3000 = 0,4 А = 400 мА."
  - id: s-018
    lesson: tp4056
    difficulty: 3
    type: numeric
    question: "TP4056 питается от 5 В, аккумулятор имеет 3,4 В, ток заряда 0,5 А. Сколько тепла выделяется в микросхеме?"
    answer: 0.8
    unit: "Вт"
    tolerance_percent: 2
    explanation: "P = (Uвх − Uбат) · I = (5 − 3,4) × 0,5 = 0,8 Вт."
  - id: s-019
    lesson: tp4056
    difficulty: 2
    type: single
    question: "Почему на этапе CV ток заряда постепенно падает?"
    options:
      - "Напряжение аккумулятора приближается к 4,2 В, и разность с источником становится малой"
      - "Контроллер специально уменьшает ток, чтобы сэкономить энергию"
      - "Аккумулятор теряет ёмкость"
    answer: 0
    explanation: "На этапе CV контроллер удерживает 4,2 В, а аккумулятор заряжен уже почти до такого напряжения: ток через внутреннее сопротивление сам убывает."
  # ───── Питание от USB ─────
  - id: s-020
    lesson: usb-power
    difficulty: 1
    type: single
    question: "Какое напряжение даёт обычный порт USB (без Power Delivery)?"
    options:
      - "5 В"
      - "3,3 В"
      - "12 В"
    answer: 0
    explanation: "Стандартное напряжение USB — 5 В (допуск 4,75–5,25 В). Другие напряжения согласуются лишь протоколом PD."
  - id: s-021
    lesson: usb-power
    difficulty: 2
    type: numeric
    question: "Источник USB-C пропускает через линию CC ток 80 мкА. Какое напряжение получится на резисторе Rd = 5,1 кОм?"
    answer: 0.41
    unit: "В"
    tolerance_percent: 3
    explanation: "U = 80 мкА × 5,1 кОм = 0,408 В ≈ 0,41 В. Это уровень «стандартная мощность»."
  - id: s-022
    lesson: usb-power
    difficulty: 2
    type: single
    question: "Плата с гнездом USB-C не имеет резисторов на CC1 и CC2. Что произойдёт при подключении к зарядке кабелем C–C?"
    options:
      - "Источник не включит питание на VBUS"
      - "Плата получит 20 В"
      - "Плата заработает, но на половину мощности"
    answer: 0
    explanation: "Без Rd источник не видит приёмник, и VBUS остаётся без напряжения. 20 В без договорённости по PD не выдаётся."
  - id: s-023
    lesson: usb-power
    difficulty: 3
    type: numeric
    question: "Кабель USB длиной 1,5 м имеет жилы питания 28 AWG (0,08 мм²). Ток 0,8 А. Какое падение напряжения на кабеле (туда и обратно)?"
    answer: 0.53
    unit: "В"
    tolerance_percent: 3
    explanation: "R = 0,0175 × 2 × 1,5 / 0,08 = 0,656 Ом, ΔU = 0,8 × 0,656 = 0,525 В ≈ 0,53 В."
  - id: s-024
    lesson: usb-power
    difficulty: 2
    type: single
    question: "Какой ток может отдавать зарядный порт стандарта BC1.2 (выделенный зарядный порт)?"
    options:
      - "До 1,5 А"
      - "100 мА"
      - "До 10 А"
    answer: 0
    explanation: "Выделенные зарядные порты BC1.2 дают до 1,5 А. 100 мА — ограничение USB 2.0 до согласования."
  # ───── Бюджет питания ─────
  - id: s-025
    lesson: power-budget
    difficulty: 1
    type: single
    question: "По какому току выбирают мощность блока питания и стабилизатора?"
    options:
      - "По пиковому току с запасом"
      - "По среднему току"
      - "По току сна"
    answer: 0
    explanation: "Источник должен выдержать самый тяжёлый момент. Средний ток нужен для расчёта времени работы батареи."
  - id: s-026
    lesson: power-budget
    difficulty: 2
    type: numeric
    question: "Суммарный пиковый ток устройства 0,45 А. Какой ток должен выдерживать источник с запасом 30 %?"
    answer: 0.585
    unit: "А"
    tolerance_percent: 2
    explanation: "0,45 × 1,3 = 0,585 А. Практически берут источник на 1 А."
  - id: s-027
    lesson: power-budget
    difficulty: 2
    type: numeric
    question: "Устройство каждые 5 с просыпается на 0,5 с с током 200 мА, остальные 4,5 с спит с током 0,2 мА. Каков средний ток?"
    answer: 20.18
    unit: "мА"
    tolerance_percent: 2
    explanation: "(200 × 0,5 + 0,2 × 4,5) / 5 = (100 + 0,9) / 5 = 20,18 мА."
  - id: s-028
    lesson: power-budget
    difficulty: 3
    type: numeric
    question: "Батарея 1000 мА·ч, доступно 80 %. Средний ток устройства 4 мА. Сколько суток оно проработает?"
    answer: 8.33
    unit: "сут"
    tolerance_percent: 2
    explanation: "800 мА·ч / 4 мА = 200 ч = 8,33 суток."
  # ───── Проект: зарядка 18650 ─────
  - id: s-029
    lesson: liion-charger-module
    difficulty: 1
    type: single
    question: "Как включают амперметр, чтобы измерить ток заряда аккумулятора?"
    options:
      - "В разрыв плюсового провода, последовательно с аккумулятором"
      - "Параллельно аккумулятору"
      - "Параллельно USB-разъёму"
    answer: 0
    explanation: "Ток измеряют, пропуская его через прибор, поэтому амперметр включают в разрыв цепи. Параллельное включение — короткое замыкание."
  - id: s-030
    lesson: liion-charger-module
    difficulty: 2
    type: numeric
    question: "Rprog модуля равен 2,4 кОм. При каком токе CV заряд будет считаться оконченным? Ответ в миллиамперах."
    answer: 50
    unit: "мА"
    tolerance_percent: 3
    explanation: "Ток CC = 1200 / 2400 = 0,5 А. Заряд оканчивается при 1/10 этого тока: 50 мА."
  - id: s-031
    lesson: liion-charger-module
    difficulty: 3
    type: single
    question: "Зелёный светодиод на модуле не загорается более 4 часов заряда. Что проверить в первую очередь?"
    options:
      - "Не подключена ли нагрузка параллельно аккумулятору и нет ли плохого контакта"
      - "Яркость освещения в комнате"
      - "Название производителя модуля"
    answer: 0
    explanation: "Нагрузка, подключённая к аккумулятору во время заряда, не даёт току упасть до 1/10, и контроллер не считает заряд оконченным. Плохой контакт тоже мешает завершению."
