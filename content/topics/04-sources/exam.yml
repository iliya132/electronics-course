questions:
  - type: single
    question: При разборе задачи «Батареи и аккумуляторы» какой вывод обоснован?
    options:
      - Любой элемент 18650 имеет встроенную защиту
      - Щелочную AA заряжают зарядником Li-ion
      - Одинаковый корпус не означает одинаковое напряжение и способ зарядки.
    answer: 2
    hint: >-
      Сверяй химию, диапазон напряжений, допустимый ток и зарядник по маркировке производителя.
      Первичные батарейки не заряжай.
    explanation: >-
      Одинаковый корпус не означает одинаковое напряжение и способ зарядки. Одинаковые по размеру
      элементы могут иметь несовместимую химию. Щелочная AA обычно маркируется 1,5 В, NiMH — 1,2 В,
      Li-ion — около 3,6–3,7 В, LiFePO4 — около 3,2 В. Это номинальные значения, не неизменный
      выход. 18650 задаёт типоразмер, но не гарантирует химию или наличие защиты. Ошибочные
      варианты: Любой элемент 18650 имеет встроенную защиту; Щелочную AA заряжают зарядником Li-ion.
      Они не учитывают описанный принцип.
    id: sources-battery-types-0
    lesson: battery-types
    difficulty: 1
  - type: numeric
    question: 'Идеальная батарея: 3.7 В, 3,5 А·ч. Оцени запас энергии.'
    answer: 12.950000000000001
    unit: Вт·ч
    tolerance_percent: 1
    hint: E ≈ U·C; C — зарядовая ёмкость в А·ч, U — среднее напряжение в В, E — энергия в Вт·ч.
    explanation: 3,7 × 3,5 = 12,95 Вт·ч.
    id: sources-battery-types-1
    lesson: battery-types
    difficulty: 1
