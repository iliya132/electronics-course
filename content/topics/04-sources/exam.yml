  - type: single
    question: 'При разборе задачи «Зарядка Li-ion: CC/CV» какой вывод обоснован?'
    options:
      - TP4056 повышает напряжение до 5 В для нагрузки
      - Любой TP4056-модуль содержит защиту и power-path
      - TP4056 заряжает одну совместимую ячейку по CC/CV и рассеивает тепло.
    answer: 2
    hint: >-
      Проверь наличие DW01 и двойного MOSFET у защищённого варианта. Зарядник TP4056 не обеспечивает
      полноценное распределение питания при одновременной нагрузке; нагрузка может мешать завершению
      заряда.
    explanation: >-
      TP4056 заряжает одну совместимую ячейку по CC/CV и рассеивает тепло. В начале зарядки ток
      почти постоянен, а ближе к концу уменьшается. В режиме CC контроллер ограничивает ток; в CV
      удерживает предельное напряжение. TP4056 — линейный зарядник одной совместимой Li-ion ячейки.
      Rprog задаёт ток, а разность входа и батареи превращается в тепло. Не каждый модуль содержит
      защиту. Ошибочные варианты: TP4056 повышает напряжение до 5 В для нагрузки; Любой
      TP4056-модуль содержит защиту и power-path. Они не учитывают описанный принцип.
    id: sources-tp4056-0
    lesson: tp4056
    difficulty: 1
  - type: numeric
