  - type: single
    question: При разборе задачи «ФВЧ на RC» какой вывод обоснован?
    options:
      - RC-ФВЧ подавляет DC и низкие частоты, а не высокие.
      - ФВЧ передаёт постоянное напряжение без изменения
      - После разделительной C не нужен резистор смещения
    answer: 0
    hint: >-
      Обеспечь входу путь DC-смещения. Выбери срез ниже нижней полезной частоты и проверь
      установление после включения.
    explanation: >-
      RC-ФВЧ подавляет DC и низкие частоты, а не высокие. Постоянное смещение мешает следующему
      усилителю. Последовательная C и резистор к земле образуют ФВЧ с выходом на R. Низкие частоты
      ослабляются, высокие в идеале проходят. На скачок напряжения возникает импульс с
      экспоненциальным спадом. Ошибочные варианты: ФВЧ передаёт постоянное напряжение без изменения;
      После разделительной C не нужен резистор смещения. Они не учитывают описанный принцип.
    id: filters-rc-highpass-0
    lesson: rc-highpass
    difficulty: 1
  - type: numeric
