    question: При разборе задачи «Входной фильтр питания платы» какой вывод обоснован?
    options:
      - Фильтрация шума и ограничение выбросов выполняют разные компоненты.
      - TVS полностью заменяет RC-фильтр
      - Длинный путь к земле улучшает ESD-защиту
    answer: 0
    hint: >-
      Размещай защиту у разъёма и направляй импульсный ток в предназначенный возврат. Согласуй
      фильтр с входной динамикой преобразователя.
    explanation: >-
      Фильтрация шума и ограничение выбросов выполняют разные компоненты. Помеха может войти через
      кабель питания. На входе платы встречаются защита от выброса TVS, предохранитель, бусина и
      конденсаторы. TVS ограничивает выброс, а фильтр ослабляет спектральные составляющие; это
      разные задачи. Пути больших импульсных токов должны быть короткими. Ошибочные варианты: TVS
      полностью заменяет RC-фильтр; Длинный путь к земле улучшает ESD-защиту. Они не учитывают
      описанный принцип.
    id: filters-emi-input-filter-0
    lesson: emi-input-filter
    difficulty: 1
