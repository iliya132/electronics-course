  - type: single
    question: При разборе задачи «АЧХ, децибелы и частота среза» какой вывод обоснован?
    options:
      - −3 дБ означает уменьшение напряжения ровно вдвое
      - Декада означает прибавление десяти герц
      - Децибелы выражают отношение, а не самостоятельное напряжение.
    answer: 2
    hint: >-
      Сравни вход и выход на одной частоте и в одном режиме нагрузки. На уровне −3,01 дБ амплитуда
      около 0,707 исходной, мощность при том же сопротивлении — половина.
    explanation: >-
      Децибелы выражают отношение, а не самостоятельное напряжение. Один фильтр по-разному
      пропускает низкие и высокие частоты. АЧХ показывает отношение амплитуд от частоты. Децибелы
      превращают произведения усилений в суммы. Логарифмическая шкала выделяет одинаковые отношения
      частот: декада — изменение в десять раз. Ошибочные варианты: −3 дБ означает уменьшение
      напряжения ровно вдвое; Декада означает прибавление десяти герц. Они не учитывают описанный
      принцип.
    id: filters-frequency-response-0
    lesson: frequency-response
    difficulty: 1
  - type: numeric
    question: Отношение амплитуд при одинаковых импедансах равно 7. Найди усиление в децибелах.
    answer: 16.901960800285135
    unit: дБ
    tolerance_percent: 1
    hint: KдБ = 20 log10(Uвых/Uвх) для сравнения амплитуд при одинаковых импедансах.
    explanation: 20 log10(7) = 16,902 дБ.
    id: filters-frequency-response-1
    lesson: frequency-response
    difficulty: 1
