    question: При разборе задачи «Измеряем АЧХ RC-фильтра» какой вывод обоснован?
    options:
      - Во всех опытах можно считать вход неизменным без измерения
      - Любой мультиметр точно измеряет аудиочастоты
      - АЧХ измеряют как отношение выхода к фактическому входу на каждой частоте.
    answer: 2
    hint: >-
      Используй чистую синусоиду и прибор с известной полосой. Не считай падение усиления на высокой
      частоте свойством фильтра, пока не проверен измеритель.
    explanation: >-
      АЧХ измеряют как отношение выхода к фактическому входу на каждой частоте. Измерим, как
      RC-фильтр меняет амплитуду синусоиды. Аудиовыход или генератор создаёт сигнал, а два
      последовательных измерения сравнивают вход и выход. Ошибочные варианты: Во всех опытах можно
      считать вход неизменным без измерения; Любой мультиметр точно измеряет аудиочастоты. Они не
      учитывают описанный принцип.
    id: filters-phone-bode-0
