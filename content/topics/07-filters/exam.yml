  - type: single
    question: При разборе задачи «ФНЧ на RC» какой вывод обоснован?
    options:
      - Можно бесконечно сглаживать сигнал без задержки
      - RC-ФНЧ сглаживает высокочастотные изменения, замедляя полезный переход.
      - Выход ФНЧ снимается только с последовательного резистора
    answer: 1
    hint: >-
      Учитывай сопротивление источника и входное сопротивление нагрузки. Чем ниже срез, тем
      медленнее выход реагирует на полезное изменение.
    explanation: >-
      RC-ФНЧ сглаживает высокочастотные изменения, замедляя полезный переход. Датчик выдаёт полезный
      медленный сигнал и высокочастотный шум. Последовательный R и конденсатор C к земле образуют
      ФНЧ, если выход снять с C. На частоте среза fc=1/(2πRC) амплитуда падает до 1/√2; далеко выше
      — примерно на 20 дБ при росте частоты в десять раз. Ошибочные варианты: Выход ФНЧ снимается
      только с последовательного резистора; Можно бесконечно сглаживать сигнал без задержки. Они не
      учитывают описанный принцип.
    id: filters-rc-lowpass-0
    lesson: rc-lowpass
    difficulty: 1
  - type: numeric
    question: 'RC-фильтр: R = 7 кОм, C = 100 нФ. Найди частоту среза.'
    answer: 227.36420441699335
    unit: Гц
    tolerance_percent: 1
    hint: fc = 1/(2πRC); R в Ом, C в Ф. Нано = 10⁻⁹. На fc амплитуда 1/√2, примерно −3,01 дБ.
    explanation: 1/(2π × 7000 × 100×10⁻⁹) = 227,364 Гц.
    id: filters-rc-lowpass-1
    lesson: rc-lowpass
    difficulty: 1
