  - type: single
    question: При разборе задачи «ШИМ → аналоговое напряжение через ФНЧ» какой вывод обоснован?
    options:
      - Среднее ШИМ является постоянным напряжением без фильтра
      - Чем больше RC, тем быстрее устанавливается выход
      - Сглаживание ШИМ требует компромисса между пульсациями и скоростью.
    answer: 2
    hint: >-
      Проверь пульсации и время установления, а не только среднее мультиметра. При 5 В, 1 кГц и RC=1
      мс формула даёт около 1,225 В размаха, что может быть слишком много.
    explanation: >-
      Сглаживание ШИМ требует компромисса между пульсациями и скоростью. Цифровой вывод можно
      использовать как грубый источник аналогового уровня. ШИМ меняет долю высокого состояния;
      RC-ФНЧ выделяет среднее. Пульсации уменьшаются при более высокой частоте ШИМ или большей RC,
      но большая RC замедляет реакцию. Для 50 % заполнения размах установившихся пульсаций
      U·tanh[T/(4RC)]. Ошибочные варианты: Среднее ШИМ является постоянным напряжением без фильтра;
      Чем больше RC, тем быстрее устанавливается выход. Они не учитывают описанный принцип.
    id: filters-pwm-dac-0
    lesson: pwm-dac
    difficulty: 1
  - type: numeric
    question: Идеальный ШИМ 0…5 В имеет заполнение 35 %. Найди среднее напряжение.
    answer: 1.75
    unit: В
    tolerance_percent: 1
    hint: Uср = Uhigh·D при низком уровне 0 В. D = tимп/T — заполнение; скважность равна 1/D.
    explanation: 5 × 35/100 = 1,75 В.
    id: filters-pwm-dac-1
    lesson: pwm-dac
    difficulty: 1
