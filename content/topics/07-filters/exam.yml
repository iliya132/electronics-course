id: exam-filters
topic: filters
pass_percent: 70
questions_per_attempt: 10
questions:
  # ───── АЧХ и децибелы ─────
  - id: f-001
    lesson: frequency-response
    difficulty: 1
    type: numeric
    formula:
      - "дБ = 20 · lg(Uвых / Uвх)"
      - "×10 = 20 дБ, ×2 ≈ 6 дБ, ×0,707 = −3 дБ"
    question: "Напряжение на выходе в 1000 раз больше, чем на входе. Сколько это децибел?"
    answer: 60
    unit: "дБ"
    tolerance_percent: 2
    explanation: "дБ = 20·lg(1000) = 20 × 3 = 60 дБ."
  - id: f-002
    lesson: frequency-response
    difficulty: 1
    type: single
    question: "Во сколько раз изменяется напряжение при усилении −3 дБ?"
    options:
      - "Уменьшается до 0,707 от исходного"
      - "Уменьшается вдвое"
      - "Уменьшается в 3 раза"
    answer: 0
    explanation: "−3 дБ по напряжению — это 10^(−3/20) ≈ 0,707. Вдвое — это −6 дБ."
  - id: f-003
    lesson: frequency-response
    difficulty: 2
    type: numeric
    formula:
      - "дБ = 20 · lg(Uвых / Uвх)"
      - "×10 = 20 дБ, ×2 ≈ 6 дБ, ×0,707 = −3 дБ"
    question: "Напряжение уменьшилось в 100 раз. Сколько это децибел? Ответ со знаком."
    answer: -40
    unit: "дБ"
    tolerance_percent: 2
    explanation: "20·lg(0,01) = 20 × (−2) = −40 дБ."
  - id: f-004
    lesson: frequency-response
    difficulty: 2
    type: numeric
    formula:
      - "ФНЧ первого порядка выше fc: −20 дБ на каждую декаду (рост частоты в 10 раз)"
    question: "ФНЧ первого порядка имеет fc = 2 кГц. Каково ослабление на 20 кГц (в 10 раз выше fc)? Ответ в децибелах со знаком."
    answer: -20
    unit: "дБ"
    tolerance_percent: 3
    explanation: "На декаду выше fc ослабление около −20 дБ (точнее −20,04 дБ)."
  - id: f-005
    lesson: frequency-response
    difficulty: 3
    type: numeric
    formula:
      - "|H| = 1 / √(1 + (f / fc)²)"
      - "дБ = 20 · lg|H|"
    question: "ФНЧ с fc = 1 кГц. Каково ослабление на частоте 3 кГц? Ответ в децибелах со знаком."
    answer: -10
    unit: "дБ"
    tolerance_percent: 3
    explanation: "|H| = 1/√(1 + 9) = 0,316, 20·lg(0,316) = −10 дБ."
  # ───── RC-фильтр низких частот ─────
  - id: f-006
    lesson: rc-lowpass
    difficulty: 1
    type: numeric
    formula:
      - "fc = 1 / (2π · R · C)"
    question: "Найди частоту среза RC-фильтра с R = 2,2 кОм и C = 33 нФ. Ответ в герцах."
    answer: 2192
    unit: "Гц"
    tolerance_percent: 2
    explanation: "fc = 1/(2π × 2200 × 33·10⁻⁹) = 1/(4,56·10⁻⁴) ≈ 2192 Гц."
  - id: f-007
    lesson: rc-lowpass
    difficulty: 2
    type: numeric
    formula:
      - "R = 1 / (2π · fc · C)"
    question: "Нужна fc = 5 кГц при C = 10 нФ. Какое сопротивление R нужно? Ответ в омах."
    answer: 3183
    unit: "Ом"
    tolerance_percent: 2
    explanation: "R = 1/(2π·fc·C) = 1/(2π × 5000 × 10⁻⁸) = 3183 Ом. Ближайший стандартный — 3,3 кОм."
  - id: f-008
    lesson: rc-lowpass
    difficulty: 2
    type: single
    question: "Какой должна быть нагрузка на выходе RC-фильтра низких частот?"
    options:
      - "Сопротивление минимум в 10 раз больше R фильтра"
      - "Намного меньше R фильтра"
      - "Равной R фильтра"
    answer: 0
    explanation: "Нагрузка подключается параллельно конденсатору и добавляется к R. Высокоомная нагрузка почти не меняет фильтр."
  - id: f-009
    lesson: rc-lowpass
    difficulty: 2
    type: numeric
    formula:
      - "τ = R · C"
      - "кОм · мкФ = мс"
    question: "R = 47 кОм, C = 0,22 мкФ. Найди постоянную времени τ в миллисекундах."
    answer: 10.34
    unit: "мс"
    tolerance_percent: 2
    explanation: "кОм × мкФ = мс: 47 × 0,22 = 10,34 мс."
  - id: f-010
    lesson: rc-lowpass
    difficulty: 3
    type: numeric
    formula:
      - "ФНЧ первого порядка выше fc: −20 дБ на каждую декаду (рост частоты в 10 раз)"
    question: "ФНЧ с fc = 1 кГц. Каково ослабление на 20 кГц? Ответ в децибелах со знаком."
    answer: -26
    unit: "дБ"
    tolerance_percent: 3
    explanation: "|H| = 1/√(1 + 400) = 0,0499, 20·lg(0,0499) = −26 дБ."
  # ───── RC-фильтр высоких частот ─────
  - id: f-011
    lesson: rc-highpass
    difficulty: 1
    type: single
    question: "Какой элемент стоит последовательно в сигнальной цепи фильтра высоких частот?"
    options:
      - "Конденсатор"
      - "Резистор"
      - "Диод"
    answer: 0
    explanation: "В ФВЧ конденсатор включён последовательно в сигнал, резистор — на землю."
  - id: f-012
    lesson: rc-highpass
    difficulty: 2
    type: numeric
    formula:
      - "fc = 1 / (2π · R · C)"
    question: "ФВЧ: R = 100 кОм, C = 10 нФ. Найди частоту среза в герцах."
    answer: 159.2
    unit: "Гц"
    tolerance_percent: 2
    explanation: "RC = 10⁵ × 10⁻⁸ = 10⁻³ с, fc = 1/(2π·10⁻³) = 159,2 Гц."
  - id: f-013
    lesson: rc-highpass
    difficulty: 2
    type: numeric
    formula:
      - "U = U₀ · e^(−t/τ)"
      - "τ = R · C"
    question: "ФВЧ с τ = 5 мс. На вход подан импульс 3 В длительностью 5 мс. Каково напряжение на выходе в конце импульса? Ответ в вольтах."
    answer: 1.1
    unit: "В"
    tolerance_percent: 3
    explanation: "U = 3·e^(−5/5) = 3 × 0,368 = 1,10 В."
  - id: f-014
    lesson: rc-highpass
    difficulty: 2
    type: numeric
    formula:
      - "ФВЧ первого порядка ниже fc: −20 дБ на каждую декаду (падение частоты в 10 раз)"
    question: "ФВЧ с fc = 1 кГц. Каково ослабление на частоте 10 Гц (в 100 раз ниже fc)? Ответ в децибелах со знаком."
    answer: -40
    unit: "дБ"
    tolerance_percent: 3
    explanation: "Две декады ниже fc — по −20 дБ каждая: −40 дБ."
  - id: f-015
    lesson: rc-highpass
    difficulty: 3
    type: single
    question: "При каком условии ФВЧ выдаёт короткие пики на фронтах прямоугольного сигнала («дифференцирует»)?"
    options:
      - "τ = R·C много меньше длительности импульса"
      - "τ много больше длительности импульса"
      - "R равно нулю"
    answer: 0
    explanation: "Если τ мало, выход после скачка быстро спадает к нулю, остаются только пики на фронтах. При большом τ форма почти сохраняется."
  # ───── ШИМ и аналоговое напряжение ─────
  - id: f-016
    lesson: pwm-dac
    difficulty: 1
    type: numeric
    formula:
      - "Uср = D · U"
    question: "ШИМ 3,3 В с коэффициентом заполнения 60 %. Каково среднее напряжение? Ответ в вольтах."
    answer: 1.98
    unit: "В"
    tolerance_percent: 2
    explanation: "Uср = D·U = 0,6 × 3,3 = 1,98 В."
  - id: f-017
    lesson: pwm-dac
    difficulty: 2
    type: numeric
    formula:
      - "ΔU ≈ U · D · (1 − D) / (f · R · C)"
    question: "ШИМ 3,3 В, f = 2 кГц, D = 50 %, RC = 20 мс. Каков размах пульсаций? Ответ в милливольтах."
    answer: 20.6
    unit: "мВ"
    tolerance_percent: 3
    explanation: "ΔU = U·D(1−D)/(f·RC) = 3,3 × 0,25 / (2000 × 0,02) = 0,825 / 40 = 0,0206 В = 20,6 мВ."
  - id: f-018
    lesson: pwm-dac
    difficulty: 2
    type: numeric
    formula:
      - "R · C = U · D · (1 − D) / (f · ΔU)"
    question: "ШИМ 5 В, частота 980 Гц, D = 50 %. Какое RC нужно, чтобы пульсации не превышали 10 мВ? Ответ в миллисекундах."
    answer: 127.6
    unit: "мс"
    tolerance_percent: 3
    explanation: "RC = U·0,25 / (f·ΔU) = 1,25 / (980 × 0,01) = 0,1276 с = 127,6 мс."
  - id: f-019
    lesson: pwm-dac
    difficulty: 2
    type: single
    question: "RC фильтра ШИМ равно 100 мс. За какое примерно время выход установится на 95 %?"
    options:
      - "300 мс"
      - "100 мс"
      - "30 мс"
    answer: 0
    explanation: "95 % достигается за 3τ = 3 × 100 мс = 300 мс."
  - id: f-020
    lesson: pwm-dac
    difficulty: 3
    type: single
    question: "Частоту ШИМ повысили в 4 раза, RC не менялось. Как изменились пульсации?"
    options:
      - "Уменьшились в 4 раза"
      - "Увеличились в 4 раза"
      - "Не изменились"
    answer: 0
    explanation: "ΔU ∝ 1/(f·RC): при f в 4 раза больше пульсации в 4 раза меньше. Скорость реакции при этом не меняется."
  # ───── LC и π-фильтры ─────
  - id: f-021
    lesson: lc-pi-filter
    difficulty: 1
    type: numeric
    formula:
      - "fc = 1 / (2π · √(L · C))"
    question: "Найди частоту среза LC-фильтра с L = 47 мкГн и C = 10 мкФ. Ответ в килогерцах."
    answer: 7.34
    unit: "кГц"
    tolerance_percent: 2
    explanation: "L·C = 4,7·10⁻¹⁰, корень 2,168·10⁻⁵, fc = 1/(2π × 2,168·10⁻⁵) = 7342 Гц ≈ 7,34 кГц."
  - id: f-022
    lesson: lc-pi-filter
    difficulty: 2
    type: numeric
    formula:
      - "LC-фильтр выше fc: −40 дБ на каждую декаду"
    question: "Идеальный LC-фильтр. Каково ослабление на частоте в 10 раз выше fc? Ответ в децибелах со знаком."
    answer: -40
    unit: "дБ"
    tolerance_percent: 3
    explanation: "Наклон LC-фильтра 40 дБ на декаду."
  - id: f-023
    lesson: lc-pi-filter
    difficulty: 2
    type: numeric
    formula:
      - "Z₀ = √(L / C)"
    question: "Найди характеристическое сопротивление Z₀ = √(L/C) для L = 4,7 мкГн и C = 10 мкФ. Ответ в омах."
    answer: 0.69
    unit: "Ом"
    tolerance_percent: 3
    explanation: "L/C = 4,7·10⁻⁶ / 10⁻⁵ = 0,47, √0,47 = 0,686 Ом."
  - id: f-024
    lesson: lc-pi-filter
    difficulty: 2
    type: single
    question: "К чему приводит высокая добротность LC-фильтра питания?"
    options:
      - "К резонансному пику и «звону» на частоте среза"
      - "К подавлению шума на всех частотах"
      - "К увеличению постоянного напряжения"
    answer: 0
    explanation: "При малых потерях на fc возникает пик усиления и затухающие колебания после скачка тока. Поэтому фильтр демпфируют."
  - id: f-025
    lesson: lc-pi-filter
    difficulty: 3
    type: numeric
    formula:
      - "−40 дБ на декаду: fc = f / 10^(A / 40)"
      - "A — нужное ослабление в дБ"
    question: "Нужно ослабить шум 200 кГц минимум на 40 дБ LC-фильтром второго порядка (40 дБ на декаду). Какая максимальная fc допустима? Ответ в килогерцах."
    answer: 20
    unit: "кГц"
    tolerance_percent: 3
    explanation: "40 дБ — это одна декада: fc = 200 / 10 = 20 кГц."
  # ───── Входной фильтр питания ─────
  - id: f-026
    lesson: emi-input-filter
    difficulty: 1
    type: single
    question: "Какой элемент ставят первым после разъёма на входе питания платы?"
    options:
      - "Предохранитель"
      - "Стабилизатор"
      - "Конденсатор 100 нФ"
    answer: 0
    explanation: "Сначала идёт защита от КЗ (предохранитель или PTC), потом остальные элементы."
  - id: f-027
    lesson: emi-input-filter
    difficulty: 2
    type: numeric
    formula:
      - "P = I² · DCR"
    question: "Через бусину с DCR 0,12 Ом течёт ток 1,2 А. Какая мощность теряется в ней? Ответ в милливаттах."
    answer: 173
    unit: "мВт"
    tolerance_percent: 2
    explanation: "P = I²·DCR = 1,44 × 0,12 = 0,173 Вт = 173 мВт."
  - id: f-028
    lesson: emi-input-filter
    difficulty: 2
    type: single
    question: "Рабочее напряжение линии до 28,8 В. Какое напряжение закрывания (standoff) TVS выберешь из ряда 24 В, 30 В, 33 В?"
    options:
      - "30 В"
      - "24 В"
      - "33 В"
    answer: 0
    explanation: "Standoff должен быть выше максимального рабочего напряжения. 24 В ниже 28,8 В, а 33 В даёт лишний запас и более высокое ограничение, поэтому берут ближайшее подходящее — 30 В."
  # ───── Проект: АЧХ смартфоном ─────
  - id: f-029
    lesson: phone-bode
    difficulty: 1
    type: numeric
    formula:
      - "K = 20 · lg(Uвых / Uвх)"
    question: "Uвх = 1,0 В, Uвых = 0,5 В. Каково усиление в децибелах (со знаком)?"
    answer: -6.02
    unit: "дБ"
    tolerance_percent: 3
    explanation: "20·lg(0,5) = −6,02 дБ."
  - id: f-030
    lesson: phone-bode
    difficulty: 2
    type: single
    question: "Почему Uвх измеряют заново на каждой частоте при построении АЧХ?"
    options:
      - "Выходное напряжение генератора может зависеть от частоты"
      - "Мультиметр показывает только одну частоту за раз"
      - "Потому что напряжение батареи меняется"
    answer: 0
    explanation: "Выход смартфона неравномерен по частоте, и усиление фильтра определяют как отношение Uвых/Uвх на одной и той же частоте."
  - id: f-031
    lesson: phone-bode
    difficulty: 2
    type: numeric
    formula:
      - "отклонение = |измерено − расчёт| / расчёт · 100 %"
    question: "По измерениям усиление −3 дБ получилось на 150 Гц, расчётная fc = 159 Гц. На сколько процентов результат отличается от расчёта?"
    answer: 5.7
    unit: "%"
    tolerance_percent: 5
    explanation: "|150 − 159| / 159 = 0,057, то есть 5,7 %. Для допусков резистора и конденсатора ±5 % это нормально."
