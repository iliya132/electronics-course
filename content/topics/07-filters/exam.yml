  - type: single
    question: При разборе задачи «LC и π-фильтры питания» какой вывод обоснован?
    options:
      - Нагрузка не меняет резонансное поведение
      - LC-фильтр способен звенеть и требует оценки демпфирования.
      - Любой LC-фильтр только ослабляет на любой частоте
    answer: 1
    hint: >-
      Проверяй ступенчатую нагрузку и отсутствие звона. Частота 1/(2π√LC) — ориентир, а реальная
      передаточная функция зависит от сопротивлений.
    explanation: >-
      LC-фильтр способен звенеть и требует оценки демпфирования. Питание аналоговой части
      чувствительно к импульсным помехам. LC-фильтр объединяет последовательный дроссель и
      шунтирующий конденсатор, а π-фильтр добавляет ёмкость перед дросселем. Резонанс может усилить
      отдельные частоты, поэтому учитывают ESR, нагрузку и демпфирование. Ошибочные варианты: Любой
      LC-фильтр только ослабляет на любой частоте; Нагрузка не меняет резонансное поведение. Они не
      учитывают описанный принцип.
    id: filters-lc-pi-filter-0
    lesson: lc-pi-filter
    difficulty: 1
  - type: numeric
    question: L = 700 мкГн, C = 100 нФ. Найди частоту идеального LC-контура в килогерцах.
    answer: 19.022654130042064
    unit: кГц
    tolerance_percent: 1
    hint: f0 = 1/(2π√(LC)); L в Гн, C в Ф. Сопротивления и нагрузка меняют добротность.
    explanation: 1/(2π√(700×10⁻⁶ × 100×10⁻⁹))/1000 = 19,0227 кГц.
    id: filters-lc-pi-filter-1
    lesson: lc-pi-filter
    difficulty: 1
