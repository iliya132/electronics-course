  - type: single
    question: При разборе задачи «Регулируемый стабилизатор LM317» какой вывод обоснован?
    options:
      - Ток ADJ и минимальная нагрузка никогда не важны
      - LM317 в стандартной схеме не регулирует выход ниже своего опорного напряжения.
      - LM317 всегда даёт выход от нуля
    answer: 1
    hint: >-
      Проверь минимальную нагрузку, dropout и защиту по типовой схеме изготовителя. Не ожидай
      регулируемый ноль в стандартной схеме.
    explanation: >-
      LM317 в стандартной схеме не регулирует выход ниже своего опорного напряжения. Выход LM317
      задают два резистора обратной связи. Между OUT и ADJ поддерживается около 1,25 В; ток через R1
      создаёт падение на R2. Точный результат содержит вклад Iadj·R2. Потенциометр подключают с
      защитой от обрыва движка; при больших ёмкостях могут потребоваться защитные диоды. Ошибочные
      варианты: LM317 всегда даёт выход от нуля; Ток ADJ и минимальная нагрузка никогда не важны.
      Они не учитывают описанный принцип.
    id: power-adjustable-lm317-0
    lesson: adjustable-lm317
    difficulty: 1
  - type: numeric
    question: 'LM317: R1 = 240 Ом, R2 = 840 Ом. Найди выход, пренебрегая Iadj.'
    answer: 5.625
    unit: В
    tolerance_percent: 1
    hint: >-
      Uвых ≈ 1,25(1+R2/R1). Точная формула добавляет Iadj·R2; нужен достаточный вход и минимальная
      нагрузка.
    explanation: 1,25×(1+840/240) = 5,625 В.
    id: power-adjustable-lm317-1
    lesson: adjustable-lm317
    difficulty: 1
  - type: numeric
