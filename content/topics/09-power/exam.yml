  - type: single
    question: При разборе задачи «Линейный стабилизатор (78xx)» какой вывод обоснован?
    options:
      - КПД линейного стабилизатора растёт при любом росте входа
      - Потери линейного стабилизатора равны примерно разности напряжений, умноженной на ток.
      - 7805 является повышающим преобразователем
    answer: 1
    hint: >-
      Рассчитай потери до включения. Подключи рекомендуемые входной и выходной конденсаторы и
      проверь тепловой режим.
    explanation: >-
      Потери линейного стабилизатора равны примерно разности напряжений, умноженной на ток. Линейный
      стабилизатор превращает лишнее напряжение в тепло. У 7805 требуется заметный запас входа,
      примерно несколько вольт в зависимости от условий. КПД без тока покоя близок к Uвых/Uвх.
      Большая разница напряжений при большом токе быстро увеличивает нагрев. Ошибочные варианты:
      7805 является повышающим преобразователем; КПД линейного стабилизатора растёт при любом росте
      входа. Они не учитывают описанный принцип.
    id: power-linear-regulator-0
    lesson: linear-regulator
    difficulty: 1
