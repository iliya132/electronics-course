    question: При разборе задачи «Повышающий (boost) и buck-boost» какой вывод обоснован?
    options:
      - Boost создаёт дополнительную энергию без роста входного тока
      - Отключённый boost всегда полностью изолирует выход
      - Повышение напряжения требует большего входного тока при той же мощности.
    answer: 2
    hint: >-
      Оцени входной ток через Pвых/(ηUвх). Проверь защиту: у обычного boost выход может быть связан
      с входом через диод даже при выключении.
    explanation: >-
      Повышение напряжения требует большего входного тока при той же мощности. Одна ячейка может
      питать устройство с более высоким напряжением. В boost катушка запасает энергию при включённом
      ключе и передаёт её на выход после выключения. Идеально Uвых=Uвх/(1−D); входной ток выше
      выходного при повышении напряжения. Buck-boost может поддерживать выход по обе стороны
      входного. Ошибочные варианты: Boost создаёт дополнительную энергию без роста входного тока;
      Отключённый boost всегда полностью изолирует выход. Они не учитывают описанный принцип.
    id: power-boost-buckboost-0
    lesson: boost-buckboost
