    question: При разборе задачи «Понижающий импульсный (buck)» какой вывод обоснован?
    options:
      - Идеальное соотношение buck справедливо при непрерывном токе и пренебрежении потерями.
      - Buck в обычной схеме повышает входное напряжение
      - Средний ток дросселя всегда равен пиковому
    answer: 0
    hint: >-
      Проверь ток насыщения дросселя с учётом половины пульсаций, токи конденсаторов и размещение
      горячей петли. Измеряй пульсации коротким щупом.
    explanation: >-
      Идеальное соотношение buck справедливо при непрерывном токе и пренебрежении потерями.
      Импульсный ключ передаёт энергию порциями в дроссель. Во включённой фазе ток L растёт, в
      выключенной продолжает течь через диод или синхронный ключ. В идеальном непрерывном режиме
      Uвых=D·Uвх; ΔI=(Uвх−Uвых)D/(Lf). Контур обратной связи поддерживает заданный выход. Ошибочные
      варианты: Buck в обычной схеме повышает входное напряжение; Средний ток дросселя всегда равен
      пиковому. Они не учитывают описанный принцип.
    id: power-buck-0
    lesson: buck
    difficulty: 1
  - type: numeric
