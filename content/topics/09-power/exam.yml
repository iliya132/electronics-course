  - type: single
    question: При разборе задачи «Зачем стабилизатор» какой вывод обоснован?
    options:
      - Стабилизатор всегда выдаёт номинал даже при недостаточном входе
      - PSRR одинаков на всех частотах
      - Стабилизация работает только внутри допустимого режима входа, тока и температуры.
    answer: 2
    hint: >-
      Задай диапазон входа, выход, средний и пиковый ток. Проверь, что минимальный вход позволяет
      регулирование.
    explanation: >-
      Стабилизация работает только внутри допустимого режима входа, тока и температуры. Напряжение
      батареи меняется по мере разряда. Стабилизатор поддерживает выход в заданном диапазоне при
      допустимых входе, нагрузке и температуре. PSRR описывает подавление входных пульсаций и
      зависит от частоты. Dropout — необходимый запас входа, а шум и переходная реакция — отдельные
      параметры. Ошибочные варианты: Стабилизатор всегда выдаёт номинал даже при недостаточном
      входе; PSRR одинаков на всех частотах. Они не учитывают описанный принцип.
    id: power-why-regulators-0
    lesson: why-regulators
    difficulty: 1
  - type: numeric
