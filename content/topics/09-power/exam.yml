  - id: "pw-043"
    lesson: "lm317-bench"
    difficulty: 2
    type: "numeric"
    question: "R1 = 240 Ом, измеренное R2 = 1000 Ом. Каково расчётное выходное напряжение? Ответ в вольтах."
    answer: 6.46
