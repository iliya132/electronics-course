    question: При разборе задачи «Нагрев и теплоотвод» какой вывод обоснован?
    options:
      - Предел тока гарантирует отсутствие перегрева при любом входе
      - Температура корпуса всегда равна температуре кристалла
      - Тепловое сопротивление применимо только к указанным условиям монтажа.
    answer: 2
    hint: >-
      Считай худший вход и ток при максимальной температуре воздуха. Сопоставляй расчёт с
      температурой корпуса, помня, что кристалл горячее.
    explanation: >-
      Тепловое сопротивление применимо только к указанным условиям монтажа. Допустимый ток
      микросхемы не гарантирует работу без радиатора. Температура кристалла зависит от потерь и
      теплового пути к воздуху. θJA зависит от меди платы, корпуса и условий обдува; θJC описывает
      другой участок пути. Тепловая защита — аварийная функция, не нормальный рабочий режим.
      Ошибочные варианты: Предел тока гарантирует отсутствие перегрева при любом входе; Температура
      корпуса всегда равна температуре кристалла. Они не учитывают описанный принцип.
    id: power-thermal-design-0
    lesson: thermal-design
    difficulty: 1
  - type: numeric
    question: Потери 0,7 Вт, θJA = 60 °C/Вт, воздух 25 °C. Оцени температуру кристалла.
    answer: 67
    unit: °C
    tolerance_percent: 1
    hint: Tj ≈ Ta+P·θJA. θJA зависит от платы и охлаждения; оценка не заменяет измерение.
    explanation: 25+0,7×60 = 67 °C.
    id: power-thermal-design-1
