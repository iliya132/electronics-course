      Выбор преобразователя учитывает диапазон входа, КПД, шум и ток покоя. Выбор питания зависит от
      всей системы. LDO прост и обычно малошумен, buck эффективнее при большой разнице напряжений.
      Для чувствительного аналога можно использовать buck, затем LDO с запасом dropout. Для батареи
      важны ток покоя и весь диапазон разряда, а не только КПД при максимальном токе. Ошибочные
      варианты: Лучший КПД на максимальном токе гарантирует лучший срок сна; Для любого питания 3,3
      В достаточно AMS1117. Они не учитывают описанный принцип.
