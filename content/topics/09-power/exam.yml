  - type: single
    question: При разборе задачи «LDO (AMS1117, LD1117, AP2112, MCP1700)» какой вывод обоснован?
    options:
      - Выходной конденсатор и его ESR должны соответствовать конкретному LDO.
      - Все LDO устойчивы с любым конденсатором
      - AMS1117 гарантирует 3,3 В от разряженной одиночной Li-ion
    answer: 0
    hint: >-
      Проверь точного изготовителя и суффикс. Для питания от Li-ion до конца разряда обычный LDO 3,3
      В может перестать регулировать; иногда нужен buck-boost.
    explanation: >-
      Выходной конденсатор и его ESR должны соответствовать конкретному LDO. Для питания 3,3 В от 5
      В часто используют LDO. Малый dropout помогает при близких напряжениях, но зависит от тока.
      AMS1117, AP2112 и MCP1700 различаются по току, dropout, току покоя и требованиям к C/ESR. Один
      и тот же корпус не означает одинаковую распиновку. Ошибочные варианты: Все LDO устойчивы с
      любым конденсатором; AMS1117 гарантирует 3,3 В от разряженной одиночной Li-ion. Они не
      учитывают описанный принцип.
    id: power-ldo-0
    lesson: ldo
    difficulty: 1
