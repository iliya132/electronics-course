id: exam-power
topic: power
pass_percent: 70
questions_per_attempt: 10
questions:
  - id: "pw-001"
    lesson: "why-regulators"
    difficulty: 1
    type: "single"
    question: "Почему резисторный делитель нельзя использовать как источник питания для микроконтроллера с переменным током потребления?"
    options:
      - "Напряжение на выходе делителя зависит от тока нагрузки и проседает"
      - "Делитель не пропускает постоянный ток"
      - "Делитель всегда даёт 0 В"
    answer: 0
    explanation: "Нагрузка подключена параллельно нижнему резистору и меняет коэффициент деления. Для питания нужен стабилизатор."
  - id: "pw-002"
    lesson: "why-regulators"
    difficulty: 2
    type: "numeric"
    question: "Пульсации на входе стабилизатора 2 В размахом, PSRR на этой частоте 60 дБ. Какой размах пульсаций на выходе? Ответ в милливольтах."
    answer: 2
    unit: "мВ"
    tolerance_percent: 3
    explanation: "60 дБ по напряжению — ослабление в 1000 раз: 2 В / 1000 = 2 мВ."
  - id: "pw-003"
    lesson: "why-regulators"
    difficulty: 2
    type: "numeric"
    question: "Делитель из двух резисторов по 2 кОм питается от 12 В (без нагрузки на выходе 6 В). К нижнему резистору подключили нагрузку 2 кОм. Какое напряжение стало на выходе? Ответ в вольтах."
    answer: 4
    unit: "В"
    tolerance_percent: 2
    explanation: "R2 ∥ Rн = 1 кОм. U = 12 × 1 / (2 + 1) = 4 В."
  - id: "pw-004"
    lesson: "why-regulators"
    difficulty: 1
    type: "single"
    question: "Какой параметр стабилизатора показывает минимальную разницу между входом и выходом, при которой он ещё держит выход?"
    options:
      - "Dropout"
      - "PSRR"
      - "Ток покоя"
    answer: 0
    explanation: "Dropout — минимальная разность Uвх − Uвых."
  - id: "pw-005"
    lesson: "linear-regulator"
    difficulty: 1
    type: "numeric"
    question: "7805 питается от 10 В и отдаёт 0,25 А при 5 В. Сколько ватт он рассеивает?"
    answer: 1.25
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = (10 − 5) × 0,25 = 1,25 Вт."
  - id: "pw-006"
    lesson: "linear-regulator"
    difficulty: 1
    type: "numeric"
    question: "Линейный стабилизатор снижает 8 В до 5 В. Каков примерный КПД? Ответ в процентах."
    answer: 62.5
    unit: "%"
    tolerance_percent: 3
    explanation: "КПД ≈ Uвых/Uвх = 5/8 = 0,625."
  - id: "pw-007"
    lesson: "linear-regulator"
    difficulty: 1
    type: "single"
    question: "Почему на входе 7805 нужно не менее 7 В, чтобы получить 5 В?"
    options:
      - "Dropout 7805 около 2 В: Uвх ≥ Uвых + 2 В"
      - "Так записано в стандарте USB"
      - "Из-за пульсаций сети 50 Гц"
    answer: 0
    explanation: "Проходной транзистор требует запаса напряжения около 2 В, иначе выход не держится."
  - id: "pw-008"
    lesson: "linear-regulator"
    difficulty: 2
    type: "single"
    question: "Какое утверждение о линейном стабилизаторе верно?"
    options:
      - "Весь избыток напряжения превращается в тепло на проходном транзисторе"
      - "Он повышает напряжение с малыми потерями"
      - "Его КПД растёт с ростом входного напряжения"
    answer: 0
    explanation: "Потери P = (Uвх − Uвых)·I. С ростом входа они растут, а КПД падает. Повышать напряжение линейный стабилизатор не умеет."
  - id: "pw-009"
    lesson: "ldo"
    difficulty: 1
    type: "numeric"
    question: "LDO 3,3 В питается от 5 В и отдаёт 0,3 А. Сколько ватт он рассеивает?"
    answer: 0.51
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = (5 − 3,3) × 0,3 = 0,51 Вт."
  - id: "pw-010"
    lesson: "ldo"
    difficulty: 2
    type: "single"
    question: "Почему при замене танталового конденсатора на керамический выход AMS1117 может «звенеть»?"
    options:
      - "ESR керамики слишком мал для устойчивости этого стабилизатора"
      - "Керамика имеет слишком высокое напряжение"
      - "Стабилизатор не любит постоянный ток"
    answer: 0
    explanation: "Контур обратной связи AMS1117 рассчитан на выходной конденсатор с заметным ESR."
  - id: "pw-011"
    lesson: "ldo"
    difficulty: 3
    type: "numeric"
    question: "Батарея 500 мА·ч, LDO имеет ток покоя 0,02 мА, схема в сне потребляет 0,03 мА. На сколько суток хватит батареи? Ответ округли до целого."
    answer: 417
    unit: "сут"
    tolerance_percent: 3
    explanation: "Общий ток 0,05 мА. 500 / 0,05 = 10 000 ч = 416,7 суток."
  - id: "pw-012"
    lesson: "ldo"
    difficulty: 1
    type: "single"
    question: "Какой LDO лучше для устройства от Li-ion, которое должно работать как можно дольше в режиме сна?"
    options:
      - "С малым током покоя (микроамперы) и малым dropout"
      - "С током покоя 5 мА"
      - "С максимальным током 5 А"
    answer: 0
    explanation: "В сне ток нагрузки мал, и ток покоя стабилизатора определяет время работы."
  - id: "pw-013"
    lesson: "thermal-design"
    difficulty: 1
    type: "numeric"
    question: "LDO в корпусе с θJA = 90 °C/Вт рассеивает 0,8 Вт при температуре воздуха 25 °C. Какова температура кристалла? Ответ в градусах Цельсия."
    answer: 97
    unit: "°C"
    tolerance_percent: 2
    explanation: "Tj = 25 + 0,8 × 90 = 97 °C."
  - id: "pw-014"
    lesson: "thermal-design"
    difficulty: 2
    type: "numeric"
    question: "Какова допустимая мощность корпуса с θJA = 85 °C/Вт при Tj max = 125 °C и Ta = 40 °C? Ответ в ваттах."
    answer: 1
    unit: "Вт"
    tolerance_percent: 3
    explanation: "Pmax = (125 − 40) / 85 = 1,0 Вт."
  - id: "pw-015"
    lesson: "thermal-design"
    difficulty: 3
    type: "numeric"
    question: "TO-220: P = 2 Вт, Ta = 25 °C, Tj max = 125 °C, θJC = 5, θCS = 1 °C/Вт. Каким должно быть максимальное θSA радиатора? Ответ в °C/Вт."
    answer: 44
    unit: "°C/Вт"
    tolerance_percent: 3
    explanation: "100 / 2 = 50 °C/Вт; минус 5 и 1 даёт 44 °C/Вт."
  - id: "pw-016"
    lesson: "thermal-design"
    difficulty: 2
    type: "single"
    question: "Что происходит при превышении максимальной температуры кристалла стабилизатора?"
    options:
      - "Срабатывает тепловая защита, а при длительном перегреве деталь выходит из строя"
      - "Стабилизатор начинает повышать напряжение"
      - "Ничего"
    answer: 0
    explanation: "Выше Tj max стабилизатор отключается тепловой защитой, длительный перегрев приводит к деградации."
  - id: "pw-017"
    lesson: "adjustable-lm317"
    difficulty: 1
    type: "numeric"
    question: "R1 = 240 Ом, R2 = 480 Ом. Каков выход LM317? Ответ в вольтах."
    answer: 3.75
    unit: "В"
    tolerance_percent: 2
    explanation: "1,25 × (1 + 480/240) = 3,75 В."
  - id: "pw-018"
    lesson: "adjustable-lm317"
    difficulty: 2
    type: "numeric"
    question: "R1 = 240 Ом, нужно 12 В. Найди R2 в омах."
    answer: 2064
    unit: "Ом"
    tolerance_percent: 2
    explanation: "12 / 1,25 = 9,6; 9,6 − 1 = 8,6; 240 × 8,6 = 2064 Ом."
  - id: "pw-019"
    lesson: "adjustable-lm317"
    difficulty: 2
    type: "single"
    question: "Какое минимальное входное напряжение нужно LM317 для выхода 12 В (dropout 2 В)?"
    options:
      - "14 В"
      - "12 В"
      - "10 В"
    answer: 0
    explanation: "Uвх ≥ Uвых + dropout = 12 + 2 = 14 В."
  - id: "pw-020"
    lesson: "adjustable-lm317"
    difficulty: 2
    type: "single"
    question: "Почему R1 в схеме LM317 не делают 10 кОм?"
    options:
      - "Ток через R1 будет слишком мал (0,125 мА) и ниже минимальной нагрузки"
      - "Тогда выход станет выше 1,25 В навсегда"
      - "Потому что 10 кОм нельзя купить"
    answer: 0
    explanation: "1,25 В / 10 кОм = 0,125 мА, а LM317 нужна минимальная нагрузка 3,5–10 мА."
  - id: "pw-021"
    lesson: "buck"
    difficulty: 1
    type: "numeric"
    question: "Вход 12 В, выход 3,3 В. Каково заполнение D идеального buck? Ответ в долях единицы."
    answer: 0.275
    unit: "ед."
    tolerance_percent: 3
    explanation: "D = 3,3 / 12 = 0,275."
  - id: "pw-022"
    lesson: "buck"
    difficulty: 2
    type: "numeric"
    question: "Вход 24 В, выход 5 В (D = 0,208), L = 68 мкГн, f = 300 кГц. Найди пульсации тока дросселя. Ответ в амперах."
    answer: 0.194
    unit: "А"
    tolerance_percent: 3
    explanation: "ΔI = (24 − 5) × 0,208 / (68·10⁻⁶ × 300·10³) = 3,958 / 20,4 = 0,194 А."
  - id: "pw-023"
    lesson: "buck"
    difficulty: 3
    type: "numeric"
    question: "Нужны пульсации 0,4 А при 12 → 5 В и f = 250 кГц (D = 0,417). Какая индуктивность нужна? Ответ в микрогенри."
    answer: 29
    unit: "мкГн"
    tolerance_percent: 3
    explanation: "L = 7 × 0,417 / (250·10³ × 0,4) = 2,917 / 100 000 = 29,2 мкГн."
  - id: "pw-024"
    lesson: "buck"
    difficulty: 2
    type: "numeric"
    question: "Buck с КПД 85 % отдаёт 10 Вт. Сколько ватт тепла выделяется в самом преобразователе?"
    answer: 1.76
    unit: "Вт"
    tolerance_percent: 3
    explanation: "Pвх = 10 / 0,85 = 11,76 Вт; потери 1,76 Вт."
  - id: "pw-025"
    lesson: "boost-buckboost"
    difficulty: 1
    type: "numeric"
    question: "Boost повышает 5 В до 12 В. Каково заполнение D идеального преобразователя? Ответ в долях единицы."
    answer: 0.583
    unit: "ед."
    tolerance_percent: 3
    explanation: "D = 1 − 5/12 = 0,583."
  - id: "pw-026"
    lesson: "boost-buckboost"
    difficulty: 2
    type: "numeric"
    question: "Boost 3,7 В → 5 В, нагрузка 1 А, КПД 90 %. Какой ток течёт от батареи? Ответ в амперах."
    answer: 1.5
    unit: "А"
    tolerance_percent: 3
    explanation: "Pвых = 5 Вт, Pвх = 5,556 Вт, Iвх = 5,556 / 3,7 = 1,50 А."
  - id: "pw-027"
    lesson: "boost-buckboost"
    difficulty: 2
    type: "single"
    question: "Какой преобразователь нужен для получения 3,3 В от Li-ion (3,0–4,2 В) во всём диапазоне?"
    options:
      - "Buck-boost"
      - "Только boost"
      - "Только buck"
    answer: 0
    explanation: "Вход бывает и выше, и ниже 3,3 В, поэтому нужен buck-boost."
  - id: "pw-028"
    lesson: "boost-buckboost"
    difficulty: 3
    type: "single"
    question: "Почему boost не защищает нагрузку от короткого замыкания на выходе?"
    options:
      - "Путь вход — дроссель — диод — выход остаётся замкнутым"
      - "Диод в boost отсутствует"
      - "Ключ всегда открыт"
    answer: 0
    explanation: "Даже при закрытом ключе ток идёт от источника через дроссель и диод."
  - id: "pw-029"
    lesson: "choose-regulator"
    difficulty: 1
    type: "numeric"
    question: "Нужно получить 5 В при 0,5 А от входа 9 В. Сколько ватт тепла выделит линейный стабилизатор?"
    answer: 2
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = (9 − 5) × 0,5 = 2 Вт."
  - id: "pw-030"
    lesson: "choose-regulator"
    difficulty: 1
    type: "single"
    question: "Нужно получить 5 В при токе 1 А от 12 В. Что разумнее?"
    options:
      - "Buck: линейный выделил бы 7 Вт"
      - "Линейный 7805 без радиатора"
      - "Резисторный делитель"
    answer: 0
    explanation: "Линейный потеряет (12 − 5)·1 = 7 Вт, buck с КПД около 90 % — около 0,6 Вт."
  - id: "pw-031"
    lesson: "choose-regulator"
    difficulty: 2
    type: "numeric"
    question: "LDO с dropout 0,25 В держит 3,3 В. При каком минимальном напряжении батареи это работает? Ответ в вольтах."
    answer: 3.55
    unit: "В"
    tolerance_percent: 2
    explanation: "3,3 + 0,25 = 3,55 В."
  - id: "pw-032"
    lesson: "choose-regulator"
    difficulty: 2
    type: "single"
    question: "Как получить чистое питание для малошумящего датчика от 12 В?"
    options:
      - "Buck понижает до 5 В, затем LDO даёт чистые 3,3 В"
      - "Питать датчик прямо от buck"
      - "Питать датчик через резистор"
    answer: 0
    explanation: "LDO после buck подавляет высокочастотную рябь импульсного преобразователя."
  - id: "pw-033"
    lesson: "switching-practical"
    difficulty: 2
    type: "numeric"
    question: "Для buck с Iвых = 1,5 А и ΔI = 0,5 А какой минимальный ток насыщения нужен с запасом 20 %? Ответ в амперах."
    answer: 2.1
    unit: "А"
    tolerance_percent: 3
    explanation: "Пик 1,5 + 0,25 = 1,75 А; × 1,2 = 2,1 А."
  - id: "pw-034"
    lesson: "switching-practical"
    difficulty: 3
    type: "numeric"
    question: "ΔI = 0,2 А, f = 1 МГц, C = 10 мкФ (ESR не учитываем). Каковы пульсации выходного напряжения? Ответ в милливольтах."
    answer: 2.5
    unit: "мВ"
    tolerance_percent: 5
    explanation: "ΔU = 0,2 / (8 × 10⁶ × 10·10⁻⁶) = 0,2 / 80 = 2,5 мВ."
  - id: "pw-035"
    lesson: "switching-practical"
    difficulty: 2
    type: "single"
    question: "Как правильно измерять рябь на выходе импульсного преобразователя?"
    options:
      - "Пружинным наконечником заземления у выходного конденсатора"
      - "Длинным заземляющим проводом щупа"
      - "Только мультиметром в режиме V="
    answer: 0
    explanation: "Длинный провод земли ловит наводки и показывает ложные выбросы."
  - id: "pw-036"
    lesson: "power-sequencing-pg"
    difficulty: 2
    type: "numeric"
    question: "C = 470 мкФ, выход 3,3 В, мягкий старт 5 мс. Каков ток зарядки конденсатора? Ответ в амперах."
    answer: 0.31
    unit: "А"
    tolerance_percent: 3
    explanation: "I = 470·10⁻⁶ × 3,3 / 5·10⁻³ = 0,31 А."
  - id: "pw-037"
    lesson: "power-sequencing-pg"
    difficulty: 3
    type: "numeric"
    question: "Порог EN = 1,2 В, R2 = 47 кОм, R1 = 130 кОм. При каком входном напряжении включится преобразователь? Ответ в вольтах."
    answer: 4.52
    unit: "В"
    tolerance_percent: 2
    explanation: "1,2 × (1 + 130/47) = 1,2 × 3,766 = 4,52 В."
  - id: "pw-038"
    lesson: "power-sequencing-pg"
    difficulty: 1
    type: "single"
    question: "Что означает сигнал PG?"
    options:
      - "Выходное напряжение дошло до нормы"
      - "Преобразователь выключен"
      - "Входное напряжение слишком высокое"
    answer: 0
    explanation: "PG (Power Good) сообщает, что выход в норме."
  - id: "pw-039"
    lesson: "linear-supply"
    difficulty: 2
    type: "numeric"
    question: "Блок питания: ток 0,5 А, C1 = 2200 мкФ, частота пульсаций 100 Гц. Каков размах пульсаций на C1 по формуле? Ответ в вольтах."
    answer: 2.27
    unit: "В"
    tolerance_percent: 3
    explanation: "ΔU = 0,5 / (100 × 0,0022) = 2,27 В."
  - id: "pw-040"
    lesson: "linear-supply"
    difficulty: 2
    type: "numeric"
    question: "7805: среднее напряжение на C1 12 В, выход 5 В, ток 0,2 А. Сколько ватт рассеивает стабилизатор?"
    answer: 1.4
    unit: "Вт"
    tolerance_percent: 3
    explanation: "P = (12 − 5) × 0,2 = 1,4 Вт."
  - id: "pw-041"
    lesson: "linear-supply"
    difficulty: 2
    type: "single"
    question: "На C1 дно пилы опустилось ниже 7 В, а выход 7805 стал «дышать». Что произошло?"
    options:
      - "7805 вышел из стабилизации из-за недостаточного входа"
      - "Радиатор слишком большой"
      - "Мост заработал как однополупериодный навсегда"
    answer: 0
    explanation: "При входе ниже Uвых + dropout стабилизатор не держит выход, и пульсации проходят."
  - id: "pw-042"
