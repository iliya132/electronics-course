    question: "Почему движок потенциометра соединяют с одним из крайних выводов?"
    options:
      - "Чтобы при плохом контакте движка ADJ не остался без цепи и выход не вырос"
      - "Чтобы увеличить сопротивление"
      - "Чтобы потенциометр работал как конденсатор"
    answer: 0
    explanation: "При обрыве движка вывод ADJ «висит в воздухе», и выходное напряжение растёт почти до входного."
  - id: "pw-045"
    lesson: "buck-vs-linear"
    difficulty: 2
    type: "numeric"
    question: "Buck: Uвх = 12 В, Iвх = 0,30 А, Uвых = 5 В, Iвых = 0,65 А. Найди КПД в процентах."
    answer: 90.3
    unit: "%"
    tolerance_percent: 3
    explanation: "Pвых = 3,25 Вт, Pвх = 3,6 Вт, η = 0,903."
  - id: "pw-046"
    lesson: "buck-vs-linear"
    difficulty: 2
    type: "single"
    question: "Почему входной ток buck 12 → 5 В меньше его выходного тока?"
    options:
      - "Мощность почти сохраняется, а входное напряжение выше"
      - "Buck создаёт дополнительный ток"
      - "Из-за потерь в проводах"
    answer: 0
    explanation: "Pвх ≈ Pвых/η: при понижении напряжения ток от источника меньше выходного."
  - id: "pw-047"
    lesson: "buck-vs-linear"
    difficulty: 2
    type: "numeric"
    question: "Линейный стабилизатор снижает 15 В до 5 В. Каков примерный КПД? Ответ в процентах."
    answer: 33.3
    unit: "%"
    tolerance_percent: 3
    explanation: "5 / 15 = 0,333."
  - id: "pw-048"
    lesson: "mini-powerbank"
    difficulty: 2
    type: "numeric"
    question: "Ячейка 3000 мА·ч (3,7 В), КПД boost 85 %. Сколько мА·ч отдаст повербанк при 5 В?"
    answer: 1887
