- id: charge
  term: заряд
  definition: Физическая величина, характеризующая электрическое взаимодействие частиц; измеряется в кулонах.
- id: current
  term: ток
  definition: Заряд, проходящий через поперечное сечение проводника за единицу времени; I = Q/t.
- id: voltage
  term: напряжение
  definition: Разность потенциалов между двумя точками; работа электрического поля на единицу заряда.
- id: potential
  term: потенциал
  definition: Потенциальная энергия единичного положительного заряда относительно выбранного нуля.
- id: ground
  term: земля
  definition: Общий узел или точка отсчёта GND на схеме; не обязательно защитное заземление здания.
- id: emf
  term: ЭДС
  definition: Работа сторонних сил внутри источника на единицу заряда.
- id: ampere
  term: ампер
  definition: 'Единица силы тока: один кулон в секунду.'
- id: volt
  term: вольт
  definition: 'Единица напряжения: один джоуль на кулон.'
- id: ohm
  term: ом
  definition: 'Единица сопротивления: один вольт на ампер.'
- id: resistance
  term: сопротивление
  definition: >-
    Отношение напряжения к току для данного режима; у омического резистора постоянно при постоянной
    температуре.
- id: power
  term: мощность
  definition: Скорость передачи энергии; в цепи постоянного тока P = UI, измеряется в ваттах.
- id: energy
  term: энергия
  definition: Величина, характеризующая возможность совершить работу; джоули и ватт-часы — единицы энергии.
- id: short-circuit
  term: короткое замыкание
  definition: Соединение узлов через слишком малое сопротивление, способное вызвать опасный ток.
- id: series
  term: последовательное соединение
  definition: Соединение элементов в одной ветви, через них проходит одинаковый ток.
- id: parallel
  term: параллельное соединение
  definition: Элементы соединены между одной парой узлов, напряжение на них одинаково.
- id: divider
  term: делитель
  definition: Два сопротивления, между которыми получают часть входного напряжения; нагрузка меняет результат.
- id: multimeter
  term: мультиметр
  definition: >-
    Измерительный прибор с режимами напряжения, тока, сопротивления и другими; подключение зависит
    от режима.
- id: breadboard
  term: макетная плата
  definition: Беспаечная плата с группами соединённых контактов; соединения нужно проверять по структуре шин.
- id: resistor
  term: резистор
  definition: Компонент с заданным сопротивлением; ограничивает ток, делит напряжение, задаёт режим.
- id: tolerance
  term: допуск
  definition: Разрешённое отклонение параметра от указанного номинала.
- id: potentiometer
  term: потенциометр
  definition: Резистивный элемент с подвижным контактом; может работать как регулируемый делитель.
- id: pullup
  term: подтяжка
  definition: Резистор, задающий определённый логический уровень, когда активный источник сигнала отключён.
- id: shunt
  term: шунт
  definition: Небольшое сопротивление для измерения тока по падению напряжения.
- id: fuse
  term: предохранитель
  definition: Компонент, разрывающий цепь при перегрузке с учётом тока и времени.
- id: ptc
  term: PTC
  definition: >-
    Материал с положительным температурным коэффициентом сопротивления; применяется в
    самовосстанавливающейся защите.
- id: ntc
  term: NTC
  definition: Термистор, сопротивление которого обычно уменьшается при нагреве.
- id: capacity
  term: ёмкость аккумулятора
  definition: Количество отдаваемого заряда при указанных условиях; обычно выражается в А·ч.
- id: crate
  term: C-rate
  definition: Ток заряда или разряда, выраженный относительно номинальной ёмкости аккумулятора.
- id: cc-cv
  term: CC/CV
  definition: >-
    Заряд сначала при ограниченном токе, затем при ограниченном напряжении; нужен совместимый с
    химией контроллер.
- id: capacitor
  term: конденсатор
  definition: Компонент, накапливающий заряд и энергию электрического поля; Q = CU.
- id: farad
  term: фарад
  definition: 'Единица электрической ёмкости: один кулон на вольт.'
- id: tau
  term: постоянная времени
  definition: Характерное время экспоненциального переходного процесса; для RC равно RC, для RL равно L/R.
- id: esr
  term: ESR
  definition: Эквивалентное последовательное сопротивление конденсатора, создающее потери и нагрев.
- id: decoupling
  term: развязка питания
  definition: Локальный запас заряда около потребителя для уменьшения изменений питания при импульсах тока.
- id: inductor
  term: дроссель
  definition: >-
    Индуктивный компонент, накапливающий энергию магнитного поля и препятствующий быстрому изменению
    тока.
- id: henry
  term: генри
  definition: Единица индуктивности; один вольт при изменении тока на один ампер в секунду.
- id: frequency
  term: частота
  definition: Количество повторений периодического процесса за секунду, измеряется в герцах.
- id: rms
  term: действующее значение
  definition: Значение постоянного сигнала, которое даёт такую же среднюю мощность на резисторе.
- id: transformer
  term: трансформатор
  definition: Магнитно связанные обмотки, передающие переменную энергию и изменяющие напряжение.
- id: ferrite
  term: ферритовая бусина
  definition: Компонент с зависящим от частоты импедансом для подавления высокочастотных помех.
- id: resonance
  term: резонанс
  definition: Рост отклика около собственной частоты системы обмена энергией.
- id: cutoff
  term: частота среза
  definition: >-
    Для фильтра первого порядка частота, на которой амплитуда падает до 1/√2 от уровня полосы
    пропускания.
- id: decibel
  term: децибел
  definition: Логарифмическая мера отношения; для амплитуд при одинаковых импедансах 20 log10 отношения.
- id: diode
  term: диод
  definition: Полупроводниковый компонент с резко различающейся проводимостью при прямом и обратном смещении.
- id: led
  term: светодиод
  definition: Диод, излучающий свет при прямом токе; требует ограничения тока.
- id: zener
  term: стабилитрон
  definition: Диод, предназначенный для работы в области обратного пробоя при ограниченном токе.
- id: tvs
  term: TVS
  definition: >-
    Защитный диод для ограничения кратковременных выбросов напряжения в пределах его импульсных
    характеристик.
- id: bridge
  term: диодный мост
  definition: Четыре диода, направляющие ток нагрузки одинаково в оба полупериода входного сигнала.
- id: ripple
  term: пульсации
  definition: Периодическая переменная составляющая выходного напряжения источника.
- id: dropout
  term: dropout
  definition: >-
    Минимальная разность входного и выходного напряжений, необходимая линейному стабилизатору в
    заданном режиме.
- id: ldo
  term: LDO
  definition: Линейный стабилизатор с малым требуемым запасом входного напряжения при заданном токе.
- id: buck
  term: buck
  definition: Понижающий импульсный преобразователь; в идеальном непрерывном режиме Uвых = D·Uвх.
- id: boost
  term: boost
  definition: Повышающий импульсный преобразователь; в идеальной модели Uвых = Uвх/(1−D).
- id: efficiency
  term: КПД
  definition: Отношение полезной выходной мощности к входной.
- id: bjt
  term: биполярный транзистор
  definition: Транзистор с выводами база, коллектор, эмиттер; в ключевом режиме требуется расчёт тока базы.
- id: mosfet
  term: MOSFET
  definition: >-
    Полевой транзистор с изолированным затвором; проводимость канала зависит от напряжения
    затвор–исток.
- id: gate
  term: затвор
  definition: Управляющий вывод полевого транзистора; имеет ёмкость и требует перезаряда при переключении.
- id: flyback
  term: защитный диод
  definition: Диод, создающий путь для тока индуктивной нагрузки при отключении ключа.
- id: hbridge
  term: H-мост
  definition: >-
    Четыре ключа для смены направления тока в нагрузке; одновременное включение одной стойки
    вызывает сквозной ток.
- id: opamp
  term: операционный усилитель
  definition: >-
    Дифференциальный усилитель с большим усилением без обратной связи; обычно используется с
    отрицательной обратной связью.
- id: feedback
  term: обратная связь
  definition: Возврат части выходного сигнала на вход для изменения поведения системы.
- id: comparator
  term: компаратор
  definition: Устройство, сравнивающее два напряжения и формирующее логическое состояние.
- id: hysteresis
  term: гистерезис
  definition: Разные пороги переключения при росте и снижении входного сигнала.
- id: adc
  term: АЦП
  definition: 'Аналого-цифровой преобразователь: сопоставляет входному напряжению дискретный цифровой код.'
- id: lsb
  term: LSB
  definition: Младший значащий разряд; шаг идеального n-битного АЦП равен Uref/2ⁿ.
- id: pwm
  term: ШИМ
  definition: Импульсный сигнал с регулируемой длительностью высокого уровня; заполнение D = tимп/T.
- id: bit
  term: бит
  definition: Двоичный разряд, принимающий значение ноль или один.
- id: byte
  term: байт
  definition: Группа из восьми битов; беззнаковое значение от нуля до 255.
- id: gpio
  term: GPIO
  definition: >-
    Программно настраиваемый цифровой вход или выход микроконтроллера с ограничениями конкретного
    вывода.
- id: open-drain
  term: открытый сток
  definition: Выход, который активно тянет линию вниз, а верхний уровень создаёт внешняя подтяжка.
- id: schmitt
  term: триггер Шмитта
  definition: Логический вход с гистерезисом для устойчивого переключения медленных или шумных сигналов.
- id: optocoupler
  term: оптопара
  definition: Передаёт сигнал светом между электрически изолированными частями при соблюдении условий монтажа.
- id: mcu
  term: микроконтроллер
  definition: Микросхема с вычислительным ядром, памятью и периферией для управления устройством.
- id: flash
  term: Flash
  definition: Энергонезависимая память программы и данных с ограниченным ресурсом перезаписи.
- id: ram
  term: RAM
  definition: Оперативная память для текущих данных, обычно теряющая содержимое без питания.
- id: crystal
  term: кварц
  definition: Резонатор для задания стабильной частоты; нагрузочную ёмкость выбирают по документации.
- id: reset
  term: сброс
  definition: Перевод микроконтроллера в начальное состояние.
- id: interrupt
  term: прерывание
  definition: Событие, временно переключающее процессор на обработчик.
- id: uart
  term: UART
  definition: Асинхронный последовательный интерфейс с согласованной скоростью, стартовыми и стоповыми битами.
- id: i2c
  term: I²C
  definition: Двухпроводная шина SDA/SCL с адресацией и выходами открытого стока; нужны подтяжки.
- id: spi
  term: SPI
  definition: Синхронная последовательная шина с тактовым сигналом и выбором ведомого устройства.
- id: mqtt
  term: MQTT
  definition: Протокол обмена сообщениями через брокер по именованным топикам.
- id: ble
  term: BLE
  definition: >-
    Bluetooth Low Energy — беспроводная технология с сервисами и характеристиками для обмена
    данными.
- id: deep-sleep
  term: deep sleep
  definition: >-
    Режим глубокого сна микроконтроллера; условия пробуждения и сохранность памяти зависят от
    семейства.
- id: datasheet
  term: даташит
  definition: >-
    Документация изготовителя с распиновкой, условиями применения и гарантированными
    характеристиками.
- id: footprint
  term: футпринт
  definition: Посадочное место компонента на печатной плате с площадками и механическими размерами.
- id: erc
  term: ERC
  definition: Проверка электрических правил принципиальной схемы.
- id: drc
  term: DRC
  definition: Проверка геометрических правил платы, например зазоров и ширины дорожек.
- id: bom
  term: BOM
  definition: Перечень компонентов с номиналами, корпусами и точными обозначениями для закупки и сборки.
- id: esd
  term: ESD
  definition: Электростатический разряд, способный повредить полупроводники.
- id: emc
  term: ЭМС
  definition: Способность устройства работать в электромагнитной среде и не создавать недопустимых помех.
