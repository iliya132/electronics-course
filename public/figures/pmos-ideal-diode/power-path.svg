<text x="240" y="97" text-anchor="middle" font-size="14" font-weight="400" fill="currentColor"><tspan x="240" dy="0">идеальный</tspan><tspan x="240" dy="16.8">диод</tspan></text>
<path d="M300 100L440 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M60 210L180 210" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="180" y="180" width="120" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="240" y="207" text-anchor="middle" font-size="14" font-weight="400" fill="currentColor"><tspan x="240" dy="0">идеальный</tspan><tspan x="240" dy="16.8">диод</tspan></text>
<path d="M300 210L440 210" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
