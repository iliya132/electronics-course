<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img">
<title>Выбор источника питания USB или батарея</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<path d="M60 100L180 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
