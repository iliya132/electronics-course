<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" role="img">
<title>Выходное сопротивление генератора 50 Ом и нагрузка</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="20" y="40" width="190" height="80" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="20" y="40" width="190" height="80" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="115" y="76.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="115" dy="0">Генератор</tspan><tspan x="115" dy="16.8">внутри 50 Ом</tspan></text>
<rect x="300" y="40" width="190" height="80" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="300" y="40" width="190" height="80" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="395" y="76.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="395" dy="0">Вход осциллографа</tspan><tspan x="395" dy="16.8">1 МОм (Hi-Z)</tspan></text>
<rect x="20" y="150" width="190" height="80" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="20" y="150" width="190" height="80" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="115" y="186.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="115" dy="0">Генератор</tspan><tspan x="115" dy="16.8">внутри 50 Ом</tspan></text>
<rect x="300" y="150" width="190" height="80" rx="8" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="300" y="150" width="190" height="80" rx="8" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.2"/>
<text x="395" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="395" dy="0">Нагрузка 50 Ом</tspan></text>
<line x1="210" y1="80" x2="291" y2="80" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M300 80L291 75.05L291 84.95Z" fill="currentColor" stroke="none"/>
<text x="255" y="72" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="255" dy="0">на нагрузке U</tspan></text>
<line x1="210" y1="190" x2="291" y2="190" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M300 190L291 185.05L291 194.95Z" fill="currentColor" stroke="none"/>
<text x="255" y="182" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="255" dy="0">на нагрузке U / 2</tspan></text>
<text x="520" y="78" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="520" dy="0">Нагрузка много больше 50 Ом:</tspan><tspan x="520" dy="15.6">на выходе почти всё напряжение.</tspan></text>
<text x="520" y="188" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="520" dy="0">Нагрузка равна 50 Ом:</tspan><tspan x="520" dy="15.6">делитель, остаётся половина.</tspan></text>
</g></svg>
