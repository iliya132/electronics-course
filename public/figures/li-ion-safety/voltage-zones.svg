<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img">
<title>Допустимые напряжения элемента Li-ion</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="200" y="40" width="60" height="35" rx="0" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="276" y="62.5" text-anchor="start" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="276" dy="0">опасность: перезаряд</tspan></text>
<rect x="200" y="80" width="60" height="120" rx="0" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="276" y="145" text-anchor="start" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="276" dy="0">рабочая область</tspan></text>
<rect x="200" y="200" width="60" height="50" rx="0" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="276" y="230" text-anchor="start" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="276" dy="0">нельзя разряжать</tspan></text>
<rect x="200" y="250" width="60" height="50" rx="0" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.35"/>
<text x="276" y="280" text-anchor="start" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="276" dy="0">опасность: глубокий разряд</tspan></text>
<line x1="200" y1="40" x2="200" y2="300" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="192" y1="80" x2="206" y2="80" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="186" y="85" text-anchor="end" font-size="12" font-weight="700" fill="currentColor"><tspan x="186" dy="0">4,2 В: полный заряд</tspan></text>
<line x1="192" y1="130" x2="206" y2="130" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="186" y="135" text-anchor="end" font-size="12" font-weight="700" fill="currentColor"><tspan x="186" dy="0">3,7 В: номинал</tspan></text>
<line x1="192" y1="200" x2="206" y2="200" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="186" y="205" text-anchor="end" font-size="12" font-weight="700" fill="currentColor"><tspan x="186" dy="0">3,0 В: порог</tspan></text>
<line x1="192" y1="250" x2="206" y2="250" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="186" y="255" text-anchor="end" font-size="12" font-weight="700" fill="currentColor"><tspan x="186" dy="0">2,5 В: защита</tspan></text>
<text x="200" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="200" dy="0">Напряжение одного элемента</tspan></text>
</g></svg>
