<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img">
<title>Линейный и импульсный стабилизатор</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Линейный и импульсный: сравнение</tspan></text>
<rect x="8" y="40" width="464" height="30" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--border, #e3e6ea)" stroke-width="1.2"/>
<text x="12" y="60" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="12" dy="0"></tspan></text>
<text x="138" y="60" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="138" dy="0">Линейный (LDO, 78xx)</tspan></text>
<text x="318" y="60" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="318" dy="0">Импульсный (buck)</tspan></text>
<line x1="8" y1="106" x2="472" y2="106" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="96" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">КПД</tspan></text>
<text x="138" y="96" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">≈ Uвых/Uвх (часто 40–70 %)</tspan></text>
<text x="318" y="96" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">85–95 %</tspan></text>
<line x1="8" y1="134" x2="472" y2="134" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="124" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">Шум на выходе</tspan></text>
<text x="138" y="124" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">очень малый</tspan></text>
<text x="318" y="124" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">есть ВЧ-рябь</tspan></text>
<line x1="8" y1="162" x2="472" y2="162" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="152" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">Повышение Uвых</tspan></text>
<text x="138" y="152" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">невозможно</tspan></text>
<text x="318" y="152" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">возможно (boost)</tspan></text>
<line x1="8" y1="190" x2="472" y2="190" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="180" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">Детали вокруг</tspan></text>
<text x="138" y="180" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">2 конденсатора</tspan></text>
<text x="318" y="180" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">дроссель, диод, 2 C</tspan></text>
<line x1="8" y1="218" x2="472" y2="218" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="208" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">Цена и размер</tspan></text>
<text x="138" y="208" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">меньше (при малой P)</tspan></text>
<text x="318" y="208" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">выше / больше</tspan></text>
<line x1="8" y1="246" x2="472" y2="246" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="12" y="236" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="12" dy="0">Тепло</tspan></text>
<text x="138" y="236" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="138" dy="0">сильно растёт с P</tspan></text>
<text x="318" y="236" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="318" dy="0">малое</tspan></text>
<text x="240" y="264" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Выбор зависит от разницы напряжений, тока и требований к шуму</tspan></text>
</g></svg>
