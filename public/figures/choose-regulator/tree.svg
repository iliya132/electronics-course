<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img">
<title>Дерево выбора стабилизатора</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="150" y="14" width="180" height="40" rx="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="240" y="38" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Uвх всегда выше Uвых?</tspan></text>
<line x1="150" y1="34" x2="79" y2="34" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M70 34L79 38.95L79 29.05Z" fill="currentColor" stroke="none"/>
<text x="110" y="28" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="110" dy="0">нет</tspan></text>
<rect x="8" y="14" width="62" height="40" rx="8" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.2"/>
<text x="39" y="30.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--bad, #b3261e)"><tspan x="39" dy="0">boost /</tspan></text>
<text x="39" y="45.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--bad, #b3261e)"><tspan x="39" dy="0">buck-boost</tspan></text>
<line x1="240" y1="54" x2="240" y2="75" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M240 84L244.95 75L235.05 75Z" fill="currentColor" stroke="none"/>
<text x="250" y="74" text-anchor="start" font-size="11" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="250" dy="0">да</tspan></text>
<rect x="135" y="84" width="210" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="240" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor"><tspan x="240" dy="0">(Uвх − Uвых)·I меньше ≈ 0,5 Вт?</tspan></text>
<line x1="135" y1="106" x2="89" y2="106" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M80 106L89 110.95L89 101.05Z" fill="currentColor" stroke="none"/>
<text x="108" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="108" dy="0">да</tspan></text>
<rect x="8" y="84" width="72" height="44" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="44" y="102.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--accent, #2457d6)"><tspan x="44" dy="0">линейный</tspan></text>
<text x="44" y="117.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--accent, #2457d6)"><tspan x="44" dy="0">(LDO)</tspan></text>
<line x1="240" y1="128" x2="240" y2="151" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M240 160L244.95 151L235.05 151Z" fill="currentColor" stroke="none"/>
<text x="250" y="150" text-anchor="start" font-size="11" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="250" dy="0">нет</tspan></text>
<rect x="180" y="160" width="120" height="36" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="240" y="182" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="240" dy="0">buck</tspan></text>
<line x1="240" y1="196" x2="240" y2="215" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M240 224L244.95 215L235.05 215Z" fill="currentColor" stroke="none"/>
<rect x="110" y="224" width="260" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="240" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Нужен малый шум (АЦП, радио)?</tspan></text>
<line x1="370" y1="246" x2="401" y2="246" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M410 246L401 241.05L401 250.95Z" fill="currentColor" stroke="none"/>
<text x="390" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="390" dy="0">да</tspan></text>
<rect x="410" y="224" width="66" height="44" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="443" y="242.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ok, #1a7f4b)"><tspan x="443" dy="0">buck +</tspan></text>
<text x="443" y="257.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--ok, #1a7f4b)"><tspan x="443" dy="0">LDO</tspan></text>
<line x1="110" y1="246" x2="79" y2="246" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M70 246L79 250.95L79 241.05Z" fill="currentColor" stroke="none"/>
<text x="90" y="240" text-anchor="middle" font-size="11" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="90" dy="0">нет</tspan></text>
<rect x="8" y="224" width="62" height="44" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="39" y="242.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--warn, #9a6700)"><tspan x="39" dy="0">только</tspan></text>
<text x="39" y="257.5" text-anchor="middle" font-size="12" font-weight="400" fill="var(--warn, #9a6700)"><tspan x="39" dy="0">buck</tspan></text>
<text x="240" y="306" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Грубая схема: окончательный выбор делают по даташитам и цене</tspan></text>
</g></svg>
