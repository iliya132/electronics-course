<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img">
<title>Скорость обмена и время передачи (10 бит на байт)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="360" dy="0">Скорость обмена и время передачи (10 бит на байт)</tspan></text>
<rect x="20" y="42" width="680" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Скорость, бод</tspan></text>
<text x="233.58" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="233.58" dy="0">Байт/с</tspan></text>
<text x="391.72" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="391.72" dy="0">1 байт</tspan></text>
<text x="549.86" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="549.86" dy="0">100 байт</tspan></text>
<line x1="20" y1="76" x2="700" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">9600</tspan></text>
<text x="233.58" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.58" dy="0">960</tspan></text>
<text x="391.72" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="391.72" dy="0">1,04 мс</tspan></text>
<text x="549.86" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="549.86" dy="0">104 мс</tspan></text>
<line x1="20" y1="110" x2="700" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">57600</tspan></text>
<text x="233.58" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.58" dy="0">5760</tspan></text>
<text x="391.72" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="391.72" dy="0">174 мкс</tspan></text>
<text x="549.86" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="549.86" dy="0">17,4 мс</tspan></text>
<line x1="20" y1="144" x2="700" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">115200</tspan></text>
<text x="233.58" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.58" dy="0">11520</tspan></text>
<text x="391.72" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="391.72" dy="0">86,8 мкс</tspan></text>
<text x="549.86" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="549.86" dy="0">8,7 мс</tspan></text>
</g></svg>
