<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Синфазный дроссель</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Две обмотки на общем сердечнике</tspan></text>
<path d="M20 80L190 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(240 80) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-50 0H-24c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0H50"/></g>
<path d="M290 80L460 80" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M20 150L190 150" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(240 150) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-50 0H-24c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0H50"/></g>
<path d="M290 150L460 150" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200" y1="102" x2="280" y2="102" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<line x1="200" y1="128" x2="280" y2="128" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<text x="240" y="120" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">сердечник</tspan></text>
<line x1="70" y1="62" x2="121" y2="62" stroke="var(--ok, #1a7f4b)" stroke-width="3" stroke-linecap="round"/>
<path d="M130 62L121 57.05L121 66.95Z" fill="var(--ok, #1a7f4b)" stroke="none"/>
<line x1="130" y1="168" x2="79" y2="168" stroke="var(--ok, #1a7f4b)" stroke-width="3" stroke-linecap="round"/>
<path d="M70 168L79 172.95L79 163.05Z" fill="var(--ok, #1a7f4b)" stroke="none"/>
<text x="20" y="200" text-anchor="start" font-size="12" font-weight="600" fill="var(--ok, #1a7f4b)"><tspan x="20" dy="0">Сигнал (дифференциальный ток): токи в обмотках</tspan><tspan x="20" dy="14.399999999999999">противоположны, поля вычитаются, дроссель проходим</tspan></text>
<line x1="350" y1="62" x2="401" y2="62" stroke="var(--bad, #b3261e)" stroke-width="3" stroke-linecap="round"/>
<path d="M410 62L401 57.05L401 66.95Z" fill="var(--bad, #b3261e)" stroke="none"/>
<line x1="350" y1="168" x2="401" y2="168" stroke="var(--bad, #b3261e)" stroke-width="3" stroke-linecap="round"/>
<path d="M410 168L401 163.05L401 172.95Z" fill="var(--bad, #b3261e)" stroke="none"/>
<text x="20" y="244" text-anchor="start" font-size="12" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="20" dy="0">Синфазная помеха: токи в обмотках в одну сторону,</tspan><tspan x="20" dy="14.399999999999999">поля складываются, дроссель даёт большое сопротивление</tspan></text>
</g></svg>
