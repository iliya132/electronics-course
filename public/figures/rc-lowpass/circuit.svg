<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img">
<title>RC-фильтр низких частот</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<circle cx="40" cy="100" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="40" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="40" dy="0">вход</tspan></text>
<path d="M45 100L90 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(130 100) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-24M24 0H40"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="130" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="130" dy="0">R 1 кОм</tspan></text>
<path d="M170 100L300 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="260" cy="100" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<path d="M260 100L260 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(260 150) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 0H-5M-5 -18V18M5 -18V18M5 0H30"/></g>
<text x="284" y="148" text-anchor="start" font-size="16" font-weight="600" fill="currentColor"><tspan x="284" dy="0">C 100 нФ</tspan></text>
<path d="M260 180L260 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(260 200)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M0 0V10M-16 10H16M-10 17H10M-4 24H4"/></g>
<circle cx="304" cy="100" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="304" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="304" dy="0">выход</tspan></text>
<text x="20" y="160" text-anchor="start" font-size="12" font-weight="600" fill="var(--ok, #1a7f4b)"><tspan x="20" dy="0">низкие частоты:</tspan><tspan x="20" dy="14.399999999999999">Xc велико — сигнал</tspan><tspan x="20" dy="14.399999999999999">проходит на выход</tspan></text>
<text x="340" y="160" text-anchor="start" font-size="12" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="340" dy="0">высокие частоты:</tspan><tspan x="340" dy="14.399999999999999">Xc мало — сигнал</tspan><tspan x="340" dy="14.399999999999999">уходит на землю</tspan></text>
<text x="240" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="240" dy="0">fc = 1 / (2π·R·C) = 1,59 кГц</tspan></text>
</g></svg>
