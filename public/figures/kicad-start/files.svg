<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img">
<title>Файлы проекта KiCad</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="360" dy="0">Файлы проекта KiCad</tspan></text>
<rect x="20" y="42" width="680" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Файл</tspan></text>
<text x="300" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="300" dy="0">Что хранит</tspan></text>
<line x1="20" y1="76" x2="700" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">.kicad_pro</tspan></text>
<text x="300" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="300" dy="0">настройки проекта</tspan></text>
<line x1="20" y1="110" x2="700" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">.kicad_sch</tspan></text>
<text x="300" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="300" dy="0">принципиальная схема</tspan></text>
<line x1="20" y1="144" x2="700" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">.kicad_pcb</tspan></text>
<text x="300" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="300" dy="0">печатная плата</tspan></text>
<line x1="20" y1="178" x2="700" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">*-gerber.zip</tspan></text>
<text x="300" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="300" dy="0">файлы для производства</tspan></text>
<line x1="20" y1="212" x2="700" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">sym-lib-table, fp-lib-table</tspan></text>
<text x="300" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="300" dy="0">таблицы библиотек символов и футпринтов</tspan></text>
</g></svg>
