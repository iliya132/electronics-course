<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img">
<title>Упрощённая схема зарядного модуля на TP4056</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Модуль TP4056: вход USB 5 В, выход к аккумулятору</tspan></text>
<circle cx="28" cy="70" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="40" y="62" text-anchor="start" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="40" dy="0">USB 5 В</tspan></text>
<path d="M33 70L140 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="140" y="50" width="150" height="150" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
<text x="215" y="78" text-anchor="middle" font-size="17" font-weight="700" fill="currentColor"><tspan x="215" dy="0">TP4056</tspan></text>
<text x="215" y="98" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="215" dy="0">линейный контроллер</tspan><tspan x="215" dy="14.399999999999999">заряда CC/CV</tspan></text>
<text x="150" y="66" text-anchor="start" font-size="11" font-weight="700" fill="currentColor"><tspan x="150" dy="0">IN</tspan></text>
<text x="270" y="66" text-anchor="end" font-size="11" font-weight="700" fill="currentColor"><tspan x="270" dy="0">BAT</tspan></text>
<text x="150" y="190" text-anchor="start" font-size="11" font-weight="700" fill="currentColor"><tspan x="150" dy="0">GND</tspan></text>
<text x="262" y="190" text-anchor="end" font-size="11" font-weight="700" fill="currentColor"><tspan x="262" dy="0">PROG</tspan></text>
<path d="M290 70L400 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="405" cy="70" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="420" y="62" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="420" dy="0">B+</tspan></text>
<path d="M250 200L250 230" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(250 262) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-32 0H-24M24 0H32"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="276" y="260" text-anchor="start" font-size="16" font-weight="600" fill="currentColor"><tspan x="276" dy="0">Rprog</tspan></text>
<text x="276" y="278" text-anchor="start" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="276" dy="0">1,2 кОм = 1 А</tspan></text>
<path d="M250 294L250 300" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(250 300)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M0 0V10M-16 10H16M-10 17H10M-4 24H4"/></g>
<circle cx="34" cy="250" r="6" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2"/>
<text x="48" y="255" text-anchor="start" font-size="12" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="48" dy="0">CHRG, красный: идёт заряд</tspan></text>
<circle cx="34" cy="280" r="6" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2"/>
<text x="48" y="285" text-anchor="start" font-size="12" font-weight="600" fill="var(--ok, #1a7f4b)"><tspan x="48" dy="0">STDBY, зелёный: заряд окончен</tspan></text>
</g></svg>
