<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 234" role="img">
<title>АЦП ESP32: ослабление и рабочий диапазон (по документации ESP-IDF)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="390" dy="0">АЦП ESP32: ослабление и рабочий диапазон (по документации ESP-IDF)</tspan></text>
<rect x="20" y="42" width="740" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Ослабление</tspan></text>
<text x="221.04" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="221.04" dy="0">Рабочий диапазон</tspan></text>
<text x="510.61" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="510.61" dy="0">Шаг (12 бит)</tspan></text>
<line x1="20" y1="76" x2="760" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0 дБ</tspan></text>
<text x="221.04" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="221.04" dy="0">≈ 0,10…0,95 В</tspan></text>
<text x="510.61" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="510.61" dy="0">≈ 0,23 мВ</tspan></text>
<line x1="20" y1="110" x2="760" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">2,5 дБ</tspan></text>
<text x="221.04" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="221.04" dy="0">≈ 0,10…1,25 В</tspan></text>
<text x="510.61" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="510.61" dy="0">≈ 0,31 мВ</tspan></text>
<line x1="20" y1="144" x2="760" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">6 дБ</tspan></text>
<text x="221.04" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="221.04" dy="0">≈ 0,15…1,75 В</tspan></text>
<text x="510.61" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="510.61" dy="0">≈ 0,43 мВ</tspan></text>
<line x1="20" y1="178" x2="760" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">11 дБ</tspan></text>
<text x="221.04" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="221.04" dy="0">≈ 0,15…2,45 В</tspan></text>
<text x="510.61" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="510.61" dy="0">≈ 0,60 мВ</tspan></text>
</g></svg>
