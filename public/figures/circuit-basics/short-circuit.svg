<text x="250" y="270" text-anchor="start" font-size="14" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="250" dy="0">ток огромный: 5 А и выше</tspan><tspan x="250" dy="16.8">ограничен лишь r батарейки</tspan></text>
<line x1="240" y1="44" x2="240" y2="300" stroke="var(--border, #e3e6ea)" stroke-width="1.5" stroke-linecap="round"/>
