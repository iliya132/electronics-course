<text x="250" y="28" text-anchor="start" font-size="15" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="250" dy="0">Короткое замыкание</tspan></text>
<g transform="translate(280 160) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-6M-6 -18V18M6 -9V9M6 0H40"/><path d="M-20 -22h8M-16 -26v8" stroke-width="1.5"/></g>
