<line x1="310" y1="64" x2="374" y2="64" stroke="var(--bad, #b3261e)" stroke-width="5" stroke-linecap="round"/>
<path d="M388 64L374 56.3L374 71.7Z" fill="var(--bad, #b3261e)" stroke="none"/>
