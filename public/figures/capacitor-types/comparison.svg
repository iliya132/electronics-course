<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img">
<title>Сравнение типов конденсаторов</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="4" y="6" width="472" height="30" rx="4" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="1.5"/>
<text x="8" y="26" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="8" dy="0">Тип</tspan></text>
<text x="132" y="26" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="132" dy="0">Ёмкость</tspan></text>
<text x="238" y="26" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238" dy="0">Полярн.</tspan></text>
<text x="292" y="26" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="292" dy="0">Главное</tspan></text>
<rect x="4" y="44" width="472" height="50" rx="4" fill="none" stroke="var(--border, #e3e6ea)" stroke-width="1"/>
<text x="8" y="66" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="8" dy="0">Керамика (MLCC)</tspan></text>
<text x="132" y="66" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="132" dy="0">1 пФ – 100 мкФ</tspan></text>
<text x="238" y="66" text-anchor="start" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="238" dy="0">нет</tspan></text>
<text x="292" y="64" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">малый ESR</tspan></text>
<text x="292" y="80" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">для развязки, C падает</tspan></text>
<rect x="4" y="100" width="472" height="50" rx="4" fill="none" stroke="var(--border, #e3e6ea)" stroke-width="1"/>
<text x="8" y="122" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="8" dy="0">Алюм. электролит</tspan></text>
<text x="132" y="122" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="132" dy="0">1 – 10 000 мкФ</tspan></text>
<text x="238" y="122" text-anchor="start" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="238" dy="0">да</tspan></text>
<text x="292" y="120" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">большая ёмкость</tspan></text>
<text x="292" y="136" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">ESR выше, старение</tspan></text>
<rect x="4" y="156" width="472" height="50" rx="4" fill="none" stroke="var(--border, #e3e6ea)" stroke-width="1"/>
<text x="8" y="178" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="8" dy="0">Тантал</tspan></text>
<text x="132" y="178" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="132" dy="0">1 – 470 мкФ</tspan></text>
<text x="238" y="178" text-anchor="start" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="238" dy="0">да</tspan></text>
<text x="292" y="176" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">компактный</tspan></text>
<text x="292" y="192" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">боится перенапряжения</tspan></text>
<rect x="4" y="212" width="472" height="50" rx="4" fill="none" stroke="var(--border, #e3e6ea)" stroke-width="1"/>
<text x="8" y="234" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="8" dy="0">Плёночный</tspan></text>
<text x="132" y="234" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="132" dy="0">100 пФ – 10 мкФ</tspan></text>
<text x="238" y="234" text-anchor="start" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="238" dy="0">нет</tspan></text>
<text x="292" y="232" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">точный</tspan></text>
<text x="292" y="248" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">стабильный, фильтры, аудио</tspan></text>
<rect x="4" y="268" width="472" height="50" rx="4" fill="none" stroke="var(--border, #e3e6ea)" stroke-width="1"/>
<text x="8" y="290" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="8" dy="0">Ионистор</tspan></text>
<text x="132" y="290" text-anchor="start" font-size="12" font-weight="400" fill="currentColor"><tspan x="132" dy="0">0,1 – 100 Ф</tspan></text>
<text x="238" y="290" text-anchor="start" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="238" dy="0">да</tspan></text>
<text x="292" y="288" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">2,7 В</tspan></text>
<text x="292" y="304" text-anchor="start" font-size="11.5" font-weight="400" fill="currentColor"><tspan x="292" dy="0">резервное питание, ESR велик</tspan></text>
</g></svg>
