<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img">
<title>Расшифровка UART 9600 бод: байты 0x48 (H) и 0x69 (i)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<path d="M70 50L99.17 50L99.17 90L215.83 90L215.83 50L245 50L245 90L303.33 90L303.33 50L332.5 50L332.5 90L361.67 90L361.67 50L420 50L420 90L449.17 90L449.17 50L478.33 50L478.33 90L536.67 90L536.67 50L565.83 50L565.83 90L595 90L595 50L653.33 50L653.33 90L682.5 90L682.5 50L770 50" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="58" y="78" text-anchor="end" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="58" dy="0">TX</tspan></text>
<rect x="99.17" y="110" width="291.67" height="30" rx="4" fill="var(--ok, #1a7f4b)" stroke="var(--ok, #1a7f4b)" stroke-width="2" opacity="0.25"/>
<text x="245" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="245" dy="0">0x48  'H'</tspan></text>
<rect x="420" y="110" width="291.67" height="30" rx="4" fill="var(--ok, #1a7f4b)" stroke="var(--ok, #1a7f4b)" stroke-width="2" opacity="0.25"/>
<text x="565.83" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="565.83" dy="0">0x69  'i'</tspan></text>
<text x="70" y="190" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="70" dy="0">ширина бита 104 мкс при 9600 бод; весь кадр 10 бит ≈ 1,04 мс</tspan></text>
<text x="70" y="215" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="70" dy="0">декодер анализатора показывает байты и ошибки кадра (framing error) прямо над сигналом</tspan></text>
</g></svg>
