<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" role="img">
<title>Топики метеостанции</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="380" dy="0">Топики метеостанции</tspan></text>
<rect x="20" y="42" width="720" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Топик</tspan></text>
<text x="278.43" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="278.43" dy="0">Пример значения</tspan></text>
<text x="560.17" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="560.17" dy="0">Период</tspan></text>
<line x1="20" y1="76" x2="740" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">weather/temp</tspan></text>
<text x="278.43" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="278.43" dy="0">23.4</tspan></text>
<text x="560.17" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="560.17" dy="0">30 с</tspan></text>
<line x1="20" y1="110" x2="740" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">weather/hum</tspan></text>
<text x="278.43" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="278.43" dy="0">48</tspan></text>
<text x="560.17" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="560.17" dy="0">30 с</tspan></text>
<line x1="20" y1="144" x2="740" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">weather/press</tspan></text>
<text x="278.43" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="278.43" dy="0">1012</tspan></text>
<text x="560.17" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="560.17" dy="0">30 с</tspan></text>
<line x1="20" y1="178" x2="740" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">weather/status</tspan></text>
<text x="278.43" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="278.43" dy="0">online / offline (LWT)</tspan></text>
<text x="560.17" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="560.17" dy="0">при подключении</tspan></text>
</g></svg>
