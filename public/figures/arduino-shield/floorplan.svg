<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 737 600" role="img">
<title>Шилд для Arduino Uno: контур 68,6 × 53,3 мм и расположение узлов</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="60" y="50" width="617.4" height="479.7" rx="4" fill="var(--surface, #f6f7f9)" stroke="currentColor" stroke-width="2.6"/>
<rect x="96" y="86" width="540" height="36" rx="3" fill="var(--muted, #5b6573)" stroke="var(--muted, #5b6573)" stroke-width="2" opacity="0.18"/>
