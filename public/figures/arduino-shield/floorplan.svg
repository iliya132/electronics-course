<text x="366" y="478" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="366" dy="0">ряд гнёзд питания и A0–A5</tspan></text>
<rect x="132" y="176" width="126" height="72" rx="3" fill="var(--ok, #1a7f4b)" stroke="var(--ok, #1a7f4b)" stroke-width="2" opacity="0.18"/>
<rect x="132" y="176" width="126" height="72" rx="3" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2"/>
<text x="195" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="195" dy="0">3 светодиода</tspan></text>
<rect x="294" y="176" width="90" height="72" rx="3" fill="var(--warn, #9a6700)" stroke="var(--warn, #9a6700)" stroke-width="2" opacity="0.18"/>
<rect x="294" y="176" width="90" height="72" rx="3" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2"/>
<text x="339" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="339" dy="0">кнопка</tspan></text>
<rect x="420" y="176" width="180" height="72" rx="3" fill="var(--accent, #2457d6)" stroke="var(--accent, #2457d6)" stroke-width="2" opacity="0.18"/>
