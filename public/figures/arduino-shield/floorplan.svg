<text x="366" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="366" dy="0">ряд гнёзд D0–D13 (шаг 2,54 мм)</tspan></text>
<rect x="96" y="455" width="540" height="36" rx="3" fill="var(--muted, #5b6573)" stroke="var(--muted, #5b6573)" stroke-width="2" opacity="0.18"/>
