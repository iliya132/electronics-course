<text x="510" y="217" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="510" dy="0">разъём I²C-датчика</tspan></text>
<rect x="132" y="302" width="468" height="72" rx="3" fill="var(--muted, #5b6573)" stroke="var(--muted, #5b6573)" stroke-width="2" opacity="0.18"/>
<rect x="132" y="302" width="468" height="72" rx="3" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="366" y="343" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor"><tspan x="366" dy="0">шины питания 5 В и земля, резисторы</tspan></text>
<text x="368.7" y="557.7" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="368.7" dy="0">68,6 мм</tspan></text>
