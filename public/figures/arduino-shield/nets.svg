<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 268" role="img">
<title>Цепи шилда и их параметры</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="460" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="460" dy="0">Цепи шилда и их параметры</tspan></text>
<rect x="20" y="42" width="880" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Цепь</tspan></text>
<text x="281.56" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="281.56" dy="0">Вывод Uno</tspan></text>
<text x="460.54" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="460.54" dy="0">Параметры</tspan></text>
<line x1="20" y1="76" x2="900" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">LED_R, LED_Y, LED_G</tspan></text>
<text x="281.56" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="281.56" dy="0">D10, D9, D8</tspan></text>
<text x="460.54" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="460.54" dy="0">резисторы 330 Ом, ток ≈ 9 мА, дорожка 0,25 мм</tspan></text>
<line x1="20" y1="110" x2="900" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">BTN</tspan></text>
<text x="281.56" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="281.56" dy="0">D2 (INT0)</tspan></text>
<text x="460.54" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="460.54" dy="0">подтяжка INPUT_PULLUP, дорожка 0,25 мм</tspan></text>
<line x1="20" y1="144" x2="900" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">SDA, SCL</tspan></text>
<text x="281.56" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="281.56" dy="0">A4, A5</tspan></text>
<text x="460.54" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="460.54" dy="0">подтяжки 4,7 кОм к 5 В, дорожка 0,25 мм</tspan></text>
<line x1="20" y1="178" x2="900" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">+5V</tspan></text>
<text x="281.56" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="281.56" dy="0">гнездо 5V</tspan></text>
<text x="460.54" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="460.54" dy="0">дорожка 0,5 мм, развязка 100 нФ</tspan></text>
<line x1="20" y1="212" x2="900" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">GND</tspan></text>
<text x="281.56" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="281.56" dy="0">гнёзда GND</tspan></text>
<text x="460.54" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="460.54" dy="0">сплошная заливка на обоих слоях</tspan></text>
</g></svg>
