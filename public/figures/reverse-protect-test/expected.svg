<text x="129" y="95.64" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="129" dy="0">105 мВт</tspan></text>
<text x="129" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="129" dy="0">1N4007</tspan></text>
<text x="129" y="268" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="129" dy="0">0,65 В · 0,16 А</tspan></text>
<rect x="214" y="167.72" width="70" height="62.28" rx="3" fill="var(--warn, #9a6700)" stroke="var(--warn, #9a6700)" stroke-width="2"/>
<text x="249" y="159.72" text-anchor="middle" font-size="14" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="249" dy="0">52 мВт</tspan></text>
<text x="249" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="249" dy="0">1N5819</tspan></text>
<text x="249" y="268" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="249" dy="0">0,30 В · 0,17 А</tspan></text>
<rect x="334" y="223.52" width="70" height="6.48" rx="3" fill="var(--accent, #2457d6)" stroke="var(--accent, #2457d6)" stroke-width="2"/>
