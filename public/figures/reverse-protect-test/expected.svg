<text x="62" y="52" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="62" dy="0">Pпотерь</tspan></text>
<text x="240" y="286" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Vf постоянно; Rds(on) ≈ 0,17 Ом при Vgs = −6 В (приблизительно)</tspan></text>
