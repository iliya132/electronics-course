<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" role="img">
<title>Расчёты для модуля: вход 12 В → выход 5 В, 1 А</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Расчёты для модуля: вход 12 В → выход 5 В, 1 А</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Величина</tspan></text>
<text x="291.57" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="291.57" dy="0">Формула</tspan></text>
<text x="613.71" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="613.71" dy="0">Значение</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Скважность</tspan></text>
<text x="291.57" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">D = Uвых/Uвх</tspan></text>
<text x="613.71" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="613.71" dy="0">0,417</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Пульсации тока дросселя</tspan></text>
<text x="291.57" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">ΔI = (Uвх − Uвых)·D/(L·f)</tspan></text>
<text x="613.71" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="613.71" dy="0">0,59 А</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Потери в диоде</tspan></text>
<text x="291.57" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">P = Vf·I·(1 − D)</tspan></text>
<text x="613.71" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="613.71" dy="0">0,26 Вт</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Сопротивление подстроечника</tspan></text>
<text x="291.57" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">R2 = R1·(Uвых/1,23 − 1)</tspan></text>
<text x="613.71" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="613.71" dy="0">3,07 кОм при R1 = 1 кОм</tspan></text>
</g></svg>
