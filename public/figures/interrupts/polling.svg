<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img">
<title>Поймает ли программа импульс длиной 10 мкс</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="380" dy="0">Поймает ли программа импульс длиной 10 мкс</tspan></text>
<text x="180" y="65" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="180" dy="0">опрос, цикл 1 мс</tspan></text>
<rect x="190" y="48" width="4.2" height="24" rx="4" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="202.2" y="65" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="202.2" dy="0">≈ 1 %</tspan></text>
<text x="180" y="105" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="180" dy="0">опрос, цикл 100 мкс</tspan></text>
<rect x="190" y="88" width="42" height="24" rx="4" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="240" y="105" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="240" dy="0">≈ 10 %</tspan></text>
<text x="180" y="145" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="180" dy="0">опрос, цикл 10 мкс</tspan></text>
<rect x="190" y="128" width="420" height="24" rx="4" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="618" y="145" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="618" dy="0">≈ 100 % (едва)</tspan></text>
<text x="180" y="185" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="180" dy="0">прерывание</tspan></text>
<rect x="190" y="168" width="420" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="618" y="185" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="618" dy="0">100 %</tspan></text>
</g></svg>
