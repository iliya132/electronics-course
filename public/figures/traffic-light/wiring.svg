<rect x="570" y="140" width="190" height="60" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="570" y="140" width="190" height="60" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="665" y="167.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="665" dy="0">кнопка пешехода</tspan><tspan x="665" dy="14.399999999999999">D2 — GND, INPUT_PULLUP</tspan></text>
<line x1="300" y1="142.4" x2="189.75" y2="93.64" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M181.52 90L187.75 98.17L191.75 89.11Z" fill="currentColor" stroke="none"/>
<line x1="300" y1="171.83" x2="228.96" y2="165" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M220 164.13L228.48 169.92L229.43 160.07Z" fill="currentColor" stroke="none"/>
<line x1="300" y1="201.25" x2="228.73" y2="219.07" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M220 221.25L229.93 223.87L227.53 214.26Z" fill="currentColor" stroke="none"/>
<line x1="570" y1="173.39" x2="478.99" y2="176.64" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M470 176.96L479.17 181.59L478.82 171.7Z" fill="currentColor" stroke="none"/>
<text x="30" y="320" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">ток каждого светодиода ≈ (5 − 2)/330 ≈ 9 мА; горит один из трёх одновременно</tspan></text>
