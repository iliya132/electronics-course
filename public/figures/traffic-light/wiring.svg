<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" role="img">
<title>Схема светофора с кнопкой пешехода</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="300" y="90" width="170" height="180" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="300" y="90" width="170" height="180" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="385" y="153.8" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor"><tspan x="385" dy="0">Arduino Uno</tspan><tspan x="385" dy="15.6">D10 → красный</tspan><tspan x="385" dy="15.6">D9 → жёлтый</tspan><tspan x="385" dy="15.6">D8 → зелёный</tspan><tspan x="385" dy="15.6">D2 ← кнопка</tspan></text>
<rect x="30" y="40" width="190" height="50" rx="8" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="40" width="190" height="50" rx="8" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.2"/>
<text x="125" y="70" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="125" dy="0">LED красный + 330 Ом → GND</tspan></text>
<rect x="30" y="130" width="190" height="50" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="130" width="190" height="50" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="125" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="125" dy="0">LED жёлтый + 330 Ом → GND</tspan></text>
<rect x="30" y="220" width="190" height="50" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="220" width="190" height="50" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
