<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img">
<title>Алгоритм подавления дребезга без delay()</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="20" y="110" width="150" height="60" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="20" y="110" width="150" height="60" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="95" y="136.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="95" dy="0">читаем кнопку</tspan><tspan x="95" dy="16.8">digitalRead</tspan></text>
<rect x="220" y="110" width="150" height="60" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="220" y="110" width="150" height="60" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="295" y="136.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="295" dy="0">значение</tspan><tspan x="295" dy="16.8">изменилось?</tspan></text>
<rect x="420" y="110" width="150" height="60" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="420" y="110" width="150" height="60" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="495" y="136.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="495" dy="0">запоминаем</tspan><tspan x="495" dy="16.8">время millis()</tspan></text>
<rect x="610" y="110" width="130" height="60" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="610" y="110" width="130" height="60" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="675" y="136.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="675" dy="0">прошло ≥ 30 мс</tspan><tspan x="675" dy="16.8">→ принять</tspan></text>
<line x1="170" y1="140" x2="211" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M220 140L211 135.05L211 144.95Z" fill="currentColor" stroke="none"/>
<line x1="370" y1="140" x2="411" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M420 140L411 135.05L411 144.95Z" fill="currentColor" stroke="none"/>
<text x="395" y="132" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="395" dy="0">да</tspan></text>
<line x1="570" y1="140" x2="601" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M610 140L601 135.05L601 144.95Z" fill="currentColor" stroke="none"/>
<text x="20" y="240" text-anchor="start" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="20" dy="0">если значение не менялось дольше 30 мс — это устойчивое состояние кнопки</tspan></text>
</g></svg>
