<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 234" role="img">
<title>Автопрограммирование: DTR и RTS → EN и GPIO0</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="370" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="370" dy="0">Автопрограммирование: DTR и RTS → EN и GPIO0</tspan></text>
<rect x="20" y="42" width="700" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">DTR</tspan></text>
<text x="108.77" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="108.77" dy="0">RTS</tspan></text>
<text x="189.54" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="189.54" dy="0">EN</tspan></text>
<text x="270.31" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="270.31" dy="0">GPIO0</tspan></text>
<text x="378" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="378" dy="0">Результат</tspan></text>
<line x1="20" y1="76" x2="720" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1</tspan></text>
<text x="108.77" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="108.77" dy="0">1</tspan></text>
<text x="189.54" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="189.54" dy="0">1</tspan></text>
<text x="270.31" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.31" dy="0">1</tspan></text>
<text x="378" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="378" dy="0">обычная работа</tspan></text>
<line x1="20" y1="110" x2="720" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0</tspan></text>
<text x="108.77" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="108.77" dy="0">0</tspan></text>
<text x="189.54" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="189.54" dy="0">1</tspan></text>
<text x="270.31" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.31" dy="0">1</tspan></text>
<text x="378" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="378" dy="0">обычная работа</tspan></text>
<line x1="20" y1="144" x2="720" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1</tspan></text>
<text x="108.77" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="108.77" dy="0">0</tspan></text>
<text x="189.54" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="189.54" dy="0">0</tspan></text>
<text x="270.31" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.31" dy="0">1</tspan></text>
<text x="378" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="378" dy="0">сброс (EN в нуле)</tspan></text>
<line x1="20" y1="178" x2="720" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0</tspan></text>
<text x="108.77" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="108.77" dy="0">1</tspan></text>
<text x="189.54" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="189.54" dy="0">1</tspan></text>
<text x="270.31" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.31" dy="0">0</tspan></text>
<text x="378" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="378" dy="0">GPIO0 в нуле — режим загрузки</tspan></text>
</g></svg>
