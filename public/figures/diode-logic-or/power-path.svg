<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
<title>Диодное ИЛИ: выбор источника питания</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<circle cx="24" cy="70" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="24" y="52" text-anchor="start" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="24" dy="0">USB 5 В</tspan></text>
<circle cx="24" cy="190" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="24" y="172" text-anchor="start" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="24" dy="0">внешнее 5–12 В</tspan></text>
<path d="M28 70L100 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(140 70) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-10M10 0H40M10 -14V14"/><path d="M-10 -14L10 0L-10 14Z"/></g>
<text x="140" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="140" dy="0">D1</tspan></text>
<path d="M180 70L270 70L270 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M28 190L100 190" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(140 190) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-10M10 0H40M10 -14V14"/><path d="M-10 -14L10 0L-10 14Z"/></g>
<text x="140" y="166" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="140" dy="0">D2</tspan></text>
<path d="M180 190L270 190L270 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="270" cy="130" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<path d="M270 130L350 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="350" y="100" width="100" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="400" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="400" dy="0">нагрузка</tspan></text>
<text x="400" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="400" dy="0">≈ Uмакс − Vf</tspan></text>
<text x="240" y="244" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Открыт диод источника с большим напряжением, диод второго</tspan></text>
<text x="240" y="262" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">закрыт обратным напряжением: источники не текут друг в друга.</tspan></text>
