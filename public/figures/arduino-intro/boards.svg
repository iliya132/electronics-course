<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" role="img">
<title>Популярные платы Arduino</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="400" dy="0">Популярные платы Arduino</tspan></text>
<rect x="20" y="42" width="760" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Плата</tspan></text>
<text x="143.15" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="143.15" dy="0">МК</tspan></text>
<text x="338.91" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="338.91" dy="0">Выводы</tspan></text>
<text x="523.15" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="523.15" dy="0">Особенность</tspan></text>
<line x1="20" y1="76" x2="780" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Uno</tspan></text>
<text x="143.15" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="143.15" dy="0">ATmega328P, 16 МГц</tspan></text>
<text x="338.91" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="338.91" dy="0">14 цифр., 6 аналог.</tspan></text>
<text x="523.15" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="523.15" dy="0">эталон, разъём питания, USB-B</tspan></text>
<line x1="20" y1="110" x2="780" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Nano</tspan></text>
<text x="143.15" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="143.15" dy="0">ATmega328P, 16 МГц</tspan></text>
<text x="338.91" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="338.91" dy="0">14 цифр., 8 аналог.</tspan></text>
<text x="523.15" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="523.15" dy="0">мини-формат, CH340, на макетку</tspan></text>
<line x1="20" y1="144" x2="780" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Mega 2560</tspan></text>
<text x="143.15" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="143.15" dy="0">ATmega2560, 16 МГц</tspan></text>
<text x="338.91" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="338.91" dy="0">54 цифр., 16 аналог.</tspan></text>
<text x="523.15" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="523.15" dy="0">256 КБ Flash, 4 UART</tspan></text>
<line x1="20" y1="178" x2="780" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Pro Mini</tspan></text>
<text x="143.15" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="143.15" dy="0">ATmega328P, 8 или 16 МГц</tspan></text>
<text x="338.91" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="338.91" dy="0">14 цифр., 6 аналог.</tspan></text>
<text x="523.15" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="523.15" dy="0">без USB, 3,3 или 5 В, экономичная</tspan></text>
</g></svg>
