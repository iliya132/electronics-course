<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img">
<title>Операционный усилитель: символ и внутренние блоки</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<path d="M120 75L120 165L200 120Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="80" y1="98" x2="120" y2="98" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="80" y1="142" x2="120" y2="142" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="200" y1="120" x2="240" y2="120" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="128" y="103" text-anchor="start" font-size="18" font-weight="700" fill="currentColor"><tspan x="128" dy="0">−</tspan></text>
<text x="128" y="147" text-anchor="start" font-size="18" font-weight="700" fill="currentColor"><tspan x="128" dy="0">+</tspan></text>
<line x1="156" y1="95" x2="156" y2="60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="156" y1="145" x2="156" y2="180" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="60" y="92" text-anchor="end" font-size="14" font-weight="700" fill="currentColor"><tspan x="60" dy="0">IN−</tspan></text>
<text x="60" y="146" text-anchor="end" font-size="14" font-weight="700" fill="currentColor"><tspan x="60" dy="0">IN+</tspan></text>
<text x="256" y="114" text-anchor="start" font-size="14" font-weight="700" fill="currentColor"><tspan x="256" dy="0">OUT</tspan></text>
<text x="156" y="52" text-anchor="middle" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="156" dy="0">V+</tspan></text>
<text x="156" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="156" dy="0">V−</tspan></text>
<text x="30" y="250" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">Vвых = A · (V+ − V−), A = 10⁵ и больше,</tspan><tspan x="30" dy="15.6">но не выше напряжения питания</tspan></text>
<rect x="380" y="70" width="90" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="425" y="102" text-anchor="middle" font-size="12" font-weight="400" fill="currentColor"><tspan x="425" dy="0">входной</tspan><tspan x="425" dy="14.399999999999999">дифф. каскад</tspan></text>
<rect x="500" y="70" width="90" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="545" y="102" text-anchor="middle" font-size="12" font-weight="400" fill="currentColor"><tspan x="545" dy="0">усилитель</tspan><tspan x="545" dy="14.399999999999999">напряжения</tspan></text>
<rect x="620" y="70" width="90" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="665" y="102" text-anchor="middle" font-size="12" font-weight="400" fill="currentColor"><tspan x="665" dy="0">выходной</tspan><tspan x="665" dy="14.399999999999999">каскад</tspan></text>
<line x1="470" y1="105" x2="492" y2="105" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M500 105L492 100.6L492 109.4Z" fill="currentColor" stroke="none"/>
<line x1="590" y1="105" x2="612" y2="105" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<path d="M620 105L612 100.6L612 109.4Z" fill="currentColor" stroke="none"/>
<text x="374" y="98" text-anchor="end" font-size="12" font-weight="700" fill="currentColor"><tspan x="374" dy="0">IN−</tspan><tspan x="374" dy="14.399999999999999">IN+</tspan></text>
<text x="714" y="90" text-anchor="start" font-size="12" font-weight="700" fill="currentColor"><tspan x="714" dy="0">OUT</tspan></text>
<text x="380" y="180" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="380" dy="0">на входе — разность напряжений,</tspan><tspan x="380" dy="14.399999999999999">на выходе — сильно усиленная копия</tspan></text>
</g></svg>
