<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Токи в узле</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<path d="M50 130L240 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 30L240 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 130L430 130" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M240 130L240 240" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="240" cy="130" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<line x1="113" y1="130" x2="137" y2="130" stroke="var(--ok, #1a7f4b)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M147 130L137 124.5L137 135.5Z" fill="var(--ok, #1a7f4b)" stroke="none"/>
<text x="130" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="130" dy="0">5 мА</tspan></text>
<line x1="240" y1="63" x2="240" y2="87" stroke="var(--ok, #1a7f4b)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M240 97L245.5 87L234.5 87Z" fill="var(--ok, #1a7f4b)" stroke="none"/>
<text x="252" y="85" text-anchor="start" font-size="16" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="252" dy="0">3 мА</tspan></text>
<line x1="323" y1="130" x2="347" y2="130" stroke="var(--bad, #b3261e)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M357 130L347 124.5L347 135.5Z" fill="var(--bad, #b3261e)" stroke="none"/>
<text x="340" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="340" dy="0">6 мА</tspan></text>
<line x1="240" y1="173" x2="240" y2="197" stroke="var(--bad, #b3261e)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M240 207L245.5 197L234.5 197Z" fill="var(--bad, #b3261e)" stroke="none"/>
<text x="252" y="195" text-anchor="start" font-size="16" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="252" dy="0">2 мА</tspan></text>
<text x="24" y="26" text-anchor="start" font-size="13" font-weight="600" fill="var(--ok, #1a7f4b)"><tspan x="24" dy="0">зелёные стрелки: токи входят в узел</tspan></text>
<text x="24" y="46" text-anchor="start" font-size="13" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="24" dy="0">красные стрелки: токи выходят из узла</tspan></text>
<text x="240" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Входит 5 + 3 = 8 мА, выходит 6 + 2 = 8 мА</tspan></text>
</g></svg>
