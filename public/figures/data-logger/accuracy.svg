<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" role="img">
<title>Бюджет погрешности измерения тока (шунт 0,1 Ом, INA219)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Бюджет погрешности измерения тока (шунт 0,1 Ом, INA219)</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Источник ошибки</tspan></text>
<text x="291.57" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="291.57" dy="0">Вклад</tspan></text>
<text x="555.14" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="555.14" dy="0">Как уменьшить</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Допуск шунта 1 %</tspan></text>
<text x="291.57" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">±1 % показания</tspan></text>
<text x="555.14" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="555.14" dy="0">калибровка по эталону</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Усиление и смещение INA219</tspan></text>
<text x="291.57" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">±0,5 % и ±0,1 мВ ≈ ±1 мА</tspan></text>
<text x="555.14" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="555.14" dy="0">калибровка двумя точками</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Шаг по току</tspan></text>
<text x="291.57" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">0,1 мА</tspan></text>
<text x="555.14" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="555.14" dy="0">достаточно для токов 10 мА и выше</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Температура</tspan></text>
<text x="291.57" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">±0,2 % на 10 °C</tspan></text>
<text x="555.14" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="555.14" dy="0">стабильный режим, прогрев</tspan></text>
</g></svg>
