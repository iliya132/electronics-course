<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Максимальный ток разных источников USB</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Сколько тока может дать источник</tspan></text>
<text x="178" y="63" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB 2.0 до настройки</tspan></text>
<rect x="188" y="44" width="5.2" height="26" rx="4" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="199.2" y="63" text-anchor="start" font-size="13" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="199.2" dy="0">0,1 А</tspan></text>
<text x="178" y="97" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB 2.0</tspan></text>
<rect x="188" y="78" width="26" height="26" rx="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="220" y="97" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="220" dy="0">0,5 А</tspan></text>
<text x="178" y="131" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB 3.x</tspan></text>
<rect x="188" y="112" width="46.8" height="26" rx="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="240.8" y="131" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="240.8" dy="0">0,9 А</tspan></text>
<text x="178" y="165" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">зарядный порт BC1.2</tspan></text>
<rect x="188" y="146" width="78" height="26" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="272" y="165" text-anchor="start" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="272" dy="0">1,5 А</tspan></text>
<text x="178" y="199" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB-C 1,5 А</tspan></text>
<rect x="188" y="180" width="78" height="26" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="272" y="199" text-anchor="start" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="272" dy="0">1,5 А</tspan></text>
<text x="178" y="233" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB-C 3 А</tspan></text>
<rect x="188" y="214" width="156" height="26" rx="4" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="350" y="233" text-anchor="start" font-size="13" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="350" dy="0">3 А</tspan></text>
<text x="178" y="267" text-anchor="end" font-size="12" font-weight="400" fill="currentColor"><tspan x="178" dy="0">USB PD 5 А (20 В)</tspan></text>
<rect x="188" y="248" width="260" height="26" rx="4" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.8"/>
<text x="454" y="267" text-anchor="start" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="454" dy="0">5 А</tspan></text>
</g></svg>
