<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img">
<title>Типичный вход питания от USB на своей плате</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Цепочка защиты по пути питания</tspan></text>
<rect x="8" y="64" width="80" height="64" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
<text x="48" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor"><tspan x="48" dy="0">USB-C</tspan><tspan x="48" dy="14.399999999999999">разъём</tspan></text>
<line x1="88" y1="96" x2="94" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M102 96L94 91.6L94 100.4Z" fill="currentColor" stroke="none"/>
<rect x="102" y="64" width="80" height="64" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.5"/>
<text x="142" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="142" dy="0">Rd на CC</tspan><tspan x="142" dy="14.399999999999999">5,1 кОм</tspan></text>
<line x1="182" y1="96" x2="188" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M196 96L188 91.6L188 100.4Z" fill="currentColor" stroke="none"/>
<rect x="196" y="64" width="80" height="64" rx="8" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.5"/>
<text x="236" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="236" dy="0">PTC</tspan><tspan x="236" dy="14.399999999999999">F1</tspan></text>
<line x1="276" y1="96" x2="282" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M290 96L282 91.6L282 100.4Z" fill="currentColor" stroke="none"/>
<rect x="290" y="64" width="80" height="64" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.5"/>
<text x="330" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="330" dy="0">TVS</tspan><tspan x="330" dy="14.399999999999999">защита</tspan></text>
<line x1="370" y1="96" x2="376" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M384 96L376 91.6L376 100.4Z" fill="currentColor" stroke="none"/>
<rect x="384" y="64" width="80" height="64" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.5"/>
<text x="424" y="92" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="424" dy="0">LDO/DC-DC</tspan><tspan x="424" dy="14.399999999999999">3,3 В</tspan></text>
<text x="240" y="168" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Rd — сообщает источнику, что на плате приёмник</tspan></text>
<text x="240" y="190" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">PTC и TVS защищают от перегрузки и выбросов</tspan></text>
</g></svg>
