<text x="80" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="80" dy="0">адаптер</tspan></text>
<text x="80" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="80" dy="0">AC 12 В</tspan><tspan x="80" dy="14.399999999999999">(заводской)</tspan></text>
<path d="M140 105L190 105" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
