<text x="230" y="75" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="230" dy="0">F 1 А</tspan></text>
<path d="M270 105L360 105L360 135" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
