<text x="384" y="173" text-anchor="start" font-size="16" font-weight="600" fill="currentColor"><tspan x="384" dy="0">33 Ом</tspan></text>
<path d="M360 215L360 250L160 250L160 165L140 165" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
