<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img">
<title>Потенциал вдоль цепи</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="currentColor"><tspan x="240" dy="0">Потенциал вдоль цепи</tspan></text>
<line x1="66" y1="282" x2="462" y2="282" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="287" text-anchor="end" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="58" dy="0">0</tspan></text>
<line x1="66" y1="219.14" x2="462" y2="219.14" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="224.14" text-anchor="end" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="58" dy="0">3</tspan></text>
<line x1="66" y1="156.29" x2="462" y2="156.29" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="161.29" text-anchor="end" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="58" dy="0">6</tspan></text>
<line x1="66" y1="93.43" x2="462" y2="93.43" stroke="var(--border, #e3e6ea)" stroke-width="1" stroke-linecap="round"/>
<text x="58" y="98.43" text-anchor="end" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="58" dy="0">9</tspan></text>
<line x1="66" y1="62" x2="66" y2="282" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
<line x1="66" y1="282" x2="462" y2="282" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
<text x="264" y="328" text-anchor="middle" font-size="15" font-weight="400" fill="currentColor"><tspan x="264" dy="0">путь заряда по цепи →</tspan></text>
<text x="66" y="50" text-anchor="start" font-size="15" font-weight="400" fill="currentColor"><tspan x="66" dy="0">потенциал, В</tspan></text>
<path d="M66 282L165 93.43L214.5 93.43L412.5 282L462 282" fill="none" stroke="var(--accent, #2457d6)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="75.9" y="173.05" text-anchor="start" font-size="14" font-weight="400" fill="var(--ok, #1a7f4b)"><tspan x="75.9" dy="0">батарейка:</tspan><tspan x="75.9" dy="16.8">«подъём» на 9 В</tspan></text>
<text x="226.38" y="106" text-anchor="start" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="226.38" dy="0">провод: потенциал не меняется</tspan></text>
<text x="318.45" y="189.81" text-anchor="start" font-size="14" font-weight="400" fill="var(--bad, #b3261e)"><tspan x="318.45" dy="0">нагрузка:</tspan><tspan x="318.45" dy="16.8">«спуск» на 9 В</tspan></text>
<text x="417.45" y="258.95" text-anchor="start" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="417.45" dy="0">провод</tspan></text>
</g></svg>
