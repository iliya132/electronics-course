<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
<title>Вольтметр подключён параллельно лампе</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<g transform="translate(120 140) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-6M-6 -18V18M6 -9V9M6 0H40"/><path d="M-20 -22h8M-16 -26v8" stroke-width="1.5"/></g>
<text x="92" y="138" text-anchor="end" font-size="16" font-weight="600" fill="currentColor"><tspan x="92" dy="0">батарейка</tspan></text>
<g transform="translate(270 140) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-16M16 0H40"/><circle r="16"/><path d="M-11 -11L11 11M-11 11L11 -11"/></g>
<text x="240" y="138" text-anchor="end" font-size="16" font-weight="600" fill="currentColor"><tspan x="240" dy="0">лампа</tspan></text>
