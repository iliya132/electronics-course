<path d="M270 100L360 100" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M270 180L360 180" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(360 140) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-18M18 0H40"/><circle r="18" stroke="var(--accent, #2457d6)"/></g>
<text x="360" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="360" dy="0">V</tspan></text>
