<circle cx="270" cy="180" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<text x="388" y="100" text-anchor="start" font-size="14" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="388" dy="0">красный</tspan><tspan x="388" dy="16.8">щуп (+)</tspan></text>
