<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 200" role="img">
<title>Значение характеристики температуры (little-endian)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="370" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="370" dy="0">Значение характеристики температуры (little-endian)</tspan></text>
<rect x="20" y="42" width="700" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Температура</tspan></text>
<text x="238" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238" dy="0">Целое (×100)</tspan></text>
<text x="448" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="448" dy="0">Байты в nRF Connect</tspan></text>
<line x1="20" y1="76" x2="720" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">18,00 °C</tspan></text>
<text x="238" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="238" dy="0">1800</tspan></text>
<text x="448" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="448" dy="0">0x0807</tspan></text>
<line x1="20" y1="110" x2="720" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">23,45 °C</tspan></text>
<text x="238" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="238" dy="0">2345</tspan></text>
<text x="448" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="448" dy="0">0x2909</tspan></text>
<line x1="20" y1="144" x2="720" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">26,00 °C</tspan></text>
<text x="238" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="238" dy="0">2600</tspan></text>
<text x="448" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="448" dy="0">0x280A</tspan></text>
