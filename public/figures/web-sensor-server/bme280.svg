<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" role="img">
<title>Датчик BME280 и ожидаемая точность</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="350" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="350" dy="0">Датчик BME280 и ожидаемая точность</tspan></text>
<rect x="20" y="42" width="660" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Величина</tspan></text>
<text x="248" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="248" dy="0">Диапазон</tspan></text>
<text x="499.43" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="499.43" dy="0">Погрешность</tspan></text>
<line x1="20" y1="76" x2="680" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Температура</tspan></text>
<text x="248" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="248" dy="0">−40…+85 °C</tspan></text>
<text x="499.43" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.43" dy="0">±1 °C</tspan></text>
<line x1="20" y1="110" x2="680" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Влажность</tspan></text>
<text x="248" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="248" dy="0">0…100 %</tspan></text>
<text x="499.43" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.43" dy="0">±3 %</tspan></text>
<line x1="20" y1="144" x2="680" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Давление</tspan></text>
<text x="248" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="248" dy="0">300…1100 гПа</tspan></text>
<text x="499.43" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.43" dy="0">±1 гПа</tspan></text>
</g></svg>
