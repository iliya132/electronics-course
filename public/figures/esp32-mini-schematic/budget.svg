<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 234" role="img">
<title>Бюджет питания мини-платы</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="410" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="410" dy="0">Бюджет питания мини-платы</tspan></text>
<rect x="20" y="42" width="780" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Блок</tspan></text>
<text x="229.29" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="229.29" dy="0">Среднее</tspan></text>
<text x="355.1" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="355.1" dy="0">Пик</tspan></text>
<text x="480.9" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="480.9" dy="0">Комментарий</tspan></text>
<line x1="20" y1="76" x2="800" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">ESP32-C3 (Wi-Fi)</tspan></text>
<text x="229.29" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="229.29" dy="0">80 мА</tspan></text>
<text x="355.1" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="355.1" dy="0">350 мА</tspan></text>
<text x="480.9" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="480.9" dy="0">пики передачи</tspan></text>
<line x1="20" y1="110" x2="800" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Датчик BME280</tspan></text>
<text x="229.29" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="229.29" dy="0">0,004 мА</tspan></text>
<text x="355.1" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="355.1" dy="0">0,7 мА</tspan></text>
<text x="480.9" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="480.9" dy="0">ничтожно</tspan></text>
<line x1="20" y1="144" x2="800" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Светодиоды</tspan></text>
<text x="229.29" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="229.29" dy="0">5 мА</tspan></text>
<text x="355.1" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="355.1" dy="0">10 мА</tspan></text>
<text x="480.9" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="480.9" dy="0">через 150 Ом при 3,3 В</tspan></text>
<line x1="20" y1="178" x2="800" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Итого</tspan></text>
<text x="229.29" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="229.29" dy="0">≈ 85 мА</tspan></text>
<text x="355.1" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="355.1" dy="0">≈ 360 мА</tspan></text>
<text x="480.9" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="480.9" dy="0">с запасом 30 %: 470 мА → LDO 600 мА</tspan></text>
</g></svg>
