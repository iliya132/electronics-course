<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" role="img">
<title>Что где искать и расчётные ориентиры (учебные числа)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Что где искать и расчётные ориентиры (учебные числа)</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Узел</tspan></text>
<text x="301.33" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="301.33" dy="0">Роль</tspan></text>
<text x="574.67" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="574.67" dy="0">Ориентир</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Мост и накопительный конденсатор</tspan></text>
<text x="301.33" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="301.33" dy="0">выпрямление и запас энергии</tspan></text>
<text x="574.67" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">пик 230 В ·√2 ≈ 325 В</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Пульсации на конденсаторе</tspan></text>
<text x="301.33" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="301.33" dy="0">ΔU ≈ I/(2·f·C)</tspan></text>
<text x="574.67" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">20 мА, 50 Гц, 10 мкФ: ≈ 20 В</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Трансформатор</tspan></text>
<text x="301.33" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="301.33" dy="0">передача энергии, изоляция</tspan></text>
<text x="574.67" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">витки определяют 5 В на выходе</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">TL431 + оптопара</tspan></text>
<text x="301.33" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="301.33" dy="0">обратная связь через барьер</tspan></text>
<text x="574.67" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">Uвых = 2,495·(1 + R1/R2)</tspan></text>
</g></svg>
