<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 234" role="img">
<title>Типичные ошибки компиляции</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="400" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="400" dy="0">Типичные ошибки компиляции</tspan></text>
<rect x="20" y="42" width="760" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Сообщение</tspan></text>
<text x="290.07" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="290.07" dy="0">Причина</tspan></text>
<text x="499.72" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="499.72" dy="0">Что сделать</tspan></text>
<line x1="20" y1="76" x2="780" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">expected ';' before '}'</tspan></text>
<text x="290.07" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="290.07" dy="0">нет точки с запятой</tspan></text>
<text x="499.72" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.72" dy="0">поставить ; в конце команды</tspan></text>
<line x1="20" y1="110" x2="780" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">'Led' was not declared</tspan></text>
<text x="290.07" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="290.07" dy="0">ошибка в имени или регистре</tspan></text>
<text x="499.72" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.72" dy="0">проверить написание</tspan></text>
<line x1="20" y1="144" x2="780" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">expected '}' at end of input</tspan></text>
<text x="290.07" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="290.07" dy="0">не хватает закрывающей скобки</tspan></text>
<text x="499.72" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.72" dy="0">сверить { и }</tspan></text>
<line x1="20" y1="178" x2="780" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">no matching function for call</tspan></text>
<text x="290.07" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="290.07" dy="0">неверные аргументы функции</tspan></text>
<text x="499.72" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="499.72" dy="0">сверить аргументы с документацией</tspan></text>
</g></svg>
