<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img">
<title>Структура программы Arduino</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="30" y="120" width="130" height="56" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="120" width="130" height="56" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="95" y="144.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="95" dy="0">включение</tspan><tspan x="95" dy="16.8">или сброс</tspan></text>
<rect x="220" y="120" width="150" height="56" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="220" y="120" width="150" height="56" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="295" y="144.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="295" dy="0">setup()</tspan><tspan x="295" dy="16.8">выполняется один раз</tspan></text>
<rect x="430" y="120" width="180" height="56" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="430" y="120" width="180" height="56" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="520" y="144.6" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="520" dy="0">loop()</tspan><tspan x="520" dy="16.8">повторяется бесконечно</tspan></text>
<line x1="520" y1="120" x2="520" y2="80" stroke="var(--ok, #1a7f4b)" stroke-width="2" stroke-linecap="round"/>
<line x1="520" y1="80" x2="600" y2="80" stroke="var(--ok, #1a7f4b)" stroke-width="2" stroke-linecap="round"/>
<line x1="600" y1="80" x2="600" y2="120" stroke="var(--ok, #1a7f4b)" stroke-width="2" stroke-linecap="round"/>
<line x1="160" y1="148" x2="211" y2="148" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M220 148L211 143.05L211 152.95Z" fill="currentColor" stroke="none"/>
<line x1="370" y1="148" x2="421" y2="148" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M430 148L421 143.05L421 152.95Z" fill="currentColor" stroke="none"/>
<text x="440" y="70" text-anchor="start" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="440" dy="0">снова и снова</tspan></text>
<text x="30" y="240" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">в setup() настраивают выводы; в loop() — основная работа</tspan></text>
</g></svg>
