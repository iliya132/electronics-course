<text x="124" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="124" dy="0">V~</tspan></text>
<text x="179.7" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="179.7" dy="0">Ω ·))</tspan></text>
<text x="182.89" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="182.89" dy="0">A</tspan></text>
