<text x="58" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="58" dy="0">10A</tspan></text>
<circle cx="96" cy="262" r="12" fill="none" stroke="var(--bad, #b3261e)" stroke-width="3"/>
