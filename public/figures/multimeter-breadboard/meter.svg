<text x="96" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="96" dy="0">mA</tspan></text>
<circle cx="134" cy="262" r="12" fill="none" stroke="var(--accent, #2457d6)" stroke-width="3"/>
<circle cx="134" cy="262" r="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2"/>
<text x="134" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="134" dy="0">VΩ</tspan></text>
<circle cx="172" cy="262" r="12" fill="none" stroke="currentColor" stroke-width="3"/>
<circle cx="172" cy="262" r="4" fill="currentColor" stroke="none" stroke-width="2"/>
<text x="172" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="172" dy="0">COM</tspan></text>
<text x="240" y="44" text-anchor="start" font-size="14" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Куда вставлять красный щуп:</tspan></text>
<text x="244" y="76" text-anchor="start" font-size="13" font-weight="600" fill="currentColor"><tspan x="244" dy="0">COM: всегда чёрный щуп</tspan></text>
<text x="244" y="110" text-anchor="start" font-size="13" font-weight="600" fill="var(--accent, #2457d6)"><tspan x="244" dy="0">VΩ: красный (U, R, прозвонка)</tspan></text>
<text x="244" y="144" text-anchor="start" font-size="13" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="244" dy="0">mA: красный для малых токов</tspan></text>
<text x="244" y="178" text-anchor="start" font-size="13" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="244" dy="0">10A: красный для больших токов</tspan></text>
<text x="240" y="262" text-anchor="start" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Токовые гнёзда (mA и 10A)</tspan><tspan x="240" dy="15.6">защищены предохранителем и</tspan><tspan x="240" dy="15.6">имеют почти нулевое</tspan><tspan x="240" dy="15.6">сопротивление.</tspan></text>
