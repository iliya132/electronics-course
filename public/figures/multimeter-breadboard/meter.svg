<text x="65.11" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="65.11" dy="0">OFF</tspan></text>
<circle cx="58" cy="262" r="12" fill="none" stroke="var(--bad, #b3261e)" stroke-width="3"/>
