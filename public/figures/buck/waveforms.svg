<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img">
<title>Работа buck: SW и ток дросселя</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="70" y="40" text-anchor="start" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="70" dy="0">Напряжение на SW (12 В или 0 В)</tspan></text>
<line x1="70" y1="52" x2="70" y2="136" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
<line x1="70" y1="136" x2="460" y2="136" stroke="var(--muted, #5b6573)" stroke-width="1.2" stroke-linecap="round"/>
<path d="M70 136L70 52L124.17 52L124.17 136L200 136L200 136L200 52L254.17 52L254.17 136L330 136L330 136L330 52L384.17 52L384.17 136L460 136" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64" y="56" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="64" dy="0">12</tspan></text>
<text x="64" y="140" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="64" dy="0">0</tspan></text>
<line x1="70" y1="101" x2="460" y2="101" stroke="var(--ok, #1a7f4b)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="460" y="96" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="460" dy="0">среднее 5 В</tspan></text>
<text x="70" y="174" text-anchor="start" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="70" dy="0">Ток дросселя (среднее 1 А, пульсации ≈ 0,29 А)</tspan></text>
<line x1="70" y1="188" x2="70" y2="278" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
<line x1="70" y1="233" x2="460" y2="233" stroke="var(--ok, #1a7f4b)" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="7 5"/>
<path d="M70 249.41L124.17 216.59L200 249.41L200 249.41L254.17 216.59L330 249.41L330 249.41L384.17 216.59L460 249.41" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
<text x="64" y="259.5" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="64" dy="0">0,8</tspan></text>
<text x="64" y="237" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="64" dy="0">1</tspan></text>
<text x="64" y="214.5" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="64" dy="0">1,2</tspan></text>
<text x="460" y="227" text-anchor="end" font-size="11" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="460" dy="0">Iвых = 1 А</tspan></text>
<line x1="70" y1="278" x2="460" y2="278" stroke="var(--muted, #5b6573)" stroke-width="1.2" stroke-linecap="round"/>
<text x="70" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="70" dy="0">0</tspan></text>
<text x="200" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="200" dy="0">10</tspan></text>
<text x="330" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="330" dy="0">20</tspan></text>
<text x="460" y="306" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="460" dy="0">30</tspan></text>
<text x="460" y="322" text-anchor="end" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="460" dy="0">время, мкс (f = 100 кГц, L = 100 мкГн, D = 42 %)</tspan></text>
</g></svg>
