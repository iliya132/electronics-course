<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 302" role="img">
<title>Выводы ATmega328P-PU, которые нужны в проекте</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="390" dy="0">Выводы ATmega328P-PU, которые нужны в проекте</tspan></text>
<rect x="20" y="42" width="740" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Вывод</tspan></text>
<text x="161.2" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="161.2" dy="0">Имя</tspan></text>
<text x="324" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="324" dy="0">Подключение</tspan></text>
<line x1="20" y1="76" x2="760" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1</tspan></text>
<text x="161.2" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">RESET</tspan></text>
<text x="324" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">10 кОм к +5 В, кнопка на GND, 100 нФ от DTR</tspan></text>
<line x1="20" y1="110" x2="760" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">2 / 3</tspan></text>
<text x="161.2" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">RXD / TXD</tspan></text>
<text x="324" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">к TX / RX преобразователя USB-UART</tspan></text>
<line x1="20" y1="144" x2="760" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">7 / 8 / 22</tspan></text>
<text x="161.2" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">VCC / GND / GND</tspan></text>
<text x="324" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">+5 В, земля; 100 нФ у VCC–GND</tspan></text>
<line x1="20" y1="178" x2="760" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">9 / 10</tspan></text>
<text x="161.2" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">XTAL1 / XTAL2</tspan></text>
<text x="324" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">кварц 16 МГц, по 22 пФ на землю</tspan></text>
<line x1="20" y1="212" x2="760" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">19</tspan></text>
<text x="161.2" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">PB5 (D13)</tspan></text>
<text x="324" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">светодиод через 330 Ом на землю</tspan></text>
<line x1="20" y1="246" x2="760" y2="246" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="268" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">20 / 21</tspan></text>
<text x="161.2" y="268" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="161.2" dy="0">AVCC / AREF</tspan></text>
<text x="324" y="268" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="324" dy="0">к +5 В / 100 нФ на землю</tspan></text>
</g></svg>
