<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Потенциометр как делитель напряжения</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<circle cx="150" cy="40" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="138" y="45" text-anchor="end" font-size="16" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="138" dy="0">+5 В</tspan></text>
<path d="M155 40L200 40L200 70" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(200 150) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-24M24 0H40"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="174" y="148" text-anchor="end" font-size="16" font-weight="600" fill="currentColor"><tspan x="174" dy="0">P 10 кОм</tspan></text>
<path d="M200 190L200 240" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(200 240)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M0 0V10M-16 10H16M-10 17H10M-4 24H4"/></g>
<line x1="310" y1="150" x2="234" y2="150" stroke="var(--accent, #2457d6)" stroke-width="3" stroke-linecap="round"/>
<path d="M222 150L234 156.6L234 143.4Z" fill="var(--accent, #2457d6)" stroke="none"/>
<circle cx="314" cy="150" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="326" y="155" text-anchor="start" font-size="16" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="326" dy="0">Uвых</tspan></text>
<text x="240" y="114" text-anchor="start" font-size="14" font-weight="600" fill="var(--accent, #2457d6)"><tspan x="240" dy="0">движок на 60 % пути</tspan><tspan x="240" dy="16.8">от земли: Uвых = 3 В</tspan></text>
<text x="240" y="290" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Uвых = Uвх · (доля поворота), если нагрузка мала по току</tspan></text>
</g></svg>
