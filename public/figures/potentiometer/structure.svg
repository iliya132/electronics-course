<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" role="img">
<title>Потенциометр: дорожка и подвижный контакт</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="60" y="90" width="360" height="28" rx="6" fill="var(--surface, #f6f7f9)" stroke="currentColor" stroke-width="2.5"/>
<line x1="60" y1="118" x2="60" y2="180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<line x1="420" y1="118" x2="420" y2="180" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<line x1="276" y1="44" x2="276" y2="76" stroke="var(--accent, #2457d6)" stroke-width="3" stroke-linecap="round"/>
<path d="M276 88L282.6 76L269.4 76Z" fill="var(--accent, #2457d6)" stroke="none"/>
<line x1="276" y1="44" x2="276" y2="28" stroke="var(--accent, #2457d6)" stroke-width="3" stroke-linecap="round"/>
<text x="286" y="36" text-anchor="start" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="286" dy="0">движок (вывод 2)</tspan></text>
<circle cx="60" cy="186" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<circle cx="420" cy="186" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="60" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="60" dy="0">вывод 1</tspan></text>
<text x="420" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="420" dy="0">вывод 3</tspan></text>
<text x="240" y="148" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">резистивная дорожка 10 кОм</tspan></text>
<line x1="60" y1="232" x2="276" y2="232" stroke="var(--ok, #1a7f4b)" stroke-width="2.5" stroke-linecap="round"/>
<line x1="276" y1="232" x2="420" y2="232" stroke="var(--bad, #b3261e)" stroke-width="2.5" stroke-linecap="round"/>
<text x="168" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="168" dy="0">Ra = 6 кОм</tspan></text>
<text x="348" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="348" dy="0">Rb = 4 кОм</tspan></text>
<text x="240" y="274" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Ra + Rb = 10 кОм при любом положении движка</tspan></text>
</g></svg>
