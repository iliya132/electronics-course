<text x="420" y="179" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="420" dy="0">нагрузка</tspan></text>
<text x="420" y="196" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="420" dy="0">10 Ом 5 Вт</tspan></text>
<circle cx="300" cy="168" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="300" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="300" dy="0">A</tspan></text>
<text x="300" y="198" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="300" dy="0">ток батареи</tspan></text>
<line x1="318" y1="168" x2="347" y2="168" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4"/>
<path d="M356 168L347 163.05L347 172.95Z" fill="currentColor" stroke="none"/>
<text x="240" y="252" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="240" dy="0">Батарею не замыкай и не заряжай без платы защиты</tspan></text>
<text x="240" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Заряд — слева, питание нагрузки — справа</tspan></text>
</g></svg>
