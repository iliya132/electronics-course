<text x="295" y="103" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="295" dy="0">с защитой</tspan></text>
<rect x="370" y="60" width="100" height="56" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.4"/>
