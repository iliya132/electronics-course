<text x="49" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="49" dy="0">USB 5 В</tspan></text>
<text x="49" y="103" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="49" dy="0">зарядка</tspan></text>
<rect x="122" y="60" width="100" height="56" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.4"/>
