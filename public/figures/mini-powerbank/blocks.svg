<text x="172" y="103" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="172" dy="0">заряд + защита</tspan></text>
<rect x="256" y="60" width="78" height="56" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.4"/>
