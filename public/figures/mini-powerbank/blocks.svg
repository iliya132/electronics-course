<path d="M370 88L361 83.05L361 92.95Z" fill="currentColor" stroke="none"/>
<text x="272" y="52" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="272" dy="0">2000 мА·ч</tspan></text>
<line x1="420" y1="116" x2="420" y2="147" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
<path d="M420 156L424.95 147L415.05 147Z" fill="currentColor" stroke="none"/>
