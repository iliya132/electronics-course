<text x="420" y="103" text-anchor="middle" font-size="10.5" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="420" dy="0">3–4,2 → 5 В</tspan></text>
<line x1="88" y1="88" x2="113" y2="88" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
