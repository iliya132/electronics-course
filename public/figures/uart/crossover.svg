<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img">
<title>Соединение UART: TX одного устройства к RX другого</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="30" y="60" width="200" height="160" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="60" width="200" height="160" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="130" y="119.8" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="130" dy="0">Устройство A</tspan><tspan x="130" dy="16.8">TX</tspan><tspan x="130" dy="16.8">RX</tspan><tspan x="130" dy="16.8">GND</tspan></text>
<rect x="530" y="60" width="200" height="160" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="530" y="60" width="200" height="160" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="630" y="119.8" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="630" dy="0">Устройство B</tspan><tspan x="630" dy="16.8">RX</tspan><tspan x="630" dy="16.8">TX</tspan><tspan x="630" dy="16.8">GND</tspan></text>
<line x1="230" y1="100" x2="530" y2="140" stroke="var(--accent, #2457d6)" stroke-width="2.6" stroke-linecap="round"/>
<line x1="230" y1="140" x2="530" y2="100" stroke="var(--ok, #1a7f4b)" stroke-width="2.6" stroke-linecap="round"/>
<line x1="230" y1="190" x2="530" y2="190" stroke="var(--muted, #5b6573)" stroke-width="2.6" stroke-linecap="round"/>
<text x="330" y="82" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="330" dy="0">TX → RX</tspan></text>
<text x="330" y="172" text-anchor="start" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="330" dy="0">RX ← TX</tspan></text>
<text x="330" y="212" text-anchor="start" font-size="13" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="330" dy="0">GND — GND (общая земля)</tspan></text>
<text x="30" y="255" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">линии скрещивают: передатчик одного — к приёмнику другого; уровни 3,3 В и 5 В не смешивать</tspan></text>
</g></svg>
