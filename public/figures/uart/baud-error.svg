<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img">
<title>Ошибка скорости UART на ATmega328P при 16 МГц (по модулю)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="380" dy="0">Ошибка скорости UART на ATmega328P при 16 МГц (по модулю)</tspan></text>
<text x="150" y="65" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="150" dy="0">9600 бод</tspan></text>
<rect x="160" y="48" width="18" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="186" y="65" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="186" dy="0">+0,16 %</tspan></text>
<text x="150" y="105" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="150" dy="0">57600 бод</tspan></text>
<rect x="160" y="88" width="88.88" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="256.88" y="105" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="256.88" dy="0">−0,79 %</tspan></text>
<text x="150" y="145" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="150" dy="0">115200 бод</tspan></text>
<rect x="160" y="128" width="238.5" height="24" rx="4" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="406.5" y="145" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="406.5" dy="0">+2,12 %</tspan></text>
<text x="150" y="185" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="150" dy="0">230400 бод</tspan></text>
<rect x="160" y="168" width="399.38" height="24" rx="4" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="567.38" y="185" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="567.38" dy="0">−3,55 % (много)</tspan></text>
