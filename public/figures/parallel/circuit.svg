<text x="240" y="268" text-anchor="middle" font-size="14" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">На обеих ветвях по 6 В. Токи складываются: 60 + 20 = 80 мА</tspan></text>
