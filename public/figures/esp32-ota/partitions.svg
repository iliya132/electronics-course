<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" role="img">
<title>Разметка Flash для OTA (4 МБ)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="20" y="60" width="100" height="70" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="20" y="60" width="100" height="70" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="70" y="86.8" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor"><tspan x="70" dy="0">загрузчик</tspan><tspan x="70" dy="13.2">+ таблица</tspan><tspan x="70" dy="13.2">разделов</tspan></text>
<rect x="130" y="60" width="80" height="70" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="130" y="60" width="80" height="70" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="170" y="93.4" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor"><tspan x="170" dy="0">nvs</tspan><tspan x="170" dy="13.2">(настройки)</tspan></text>
<rect x="220" y="60" width="100" height="70" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="220" y="60" width="100" height="70" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="270" y="93.4" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor"><tspan x="270" dy="0">otadata</tspan><tspan x="270" dy="13.2">(какой слот)</tspan></text>
<rect x="330" y="60" width="190" height="70" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="330" y="60" width="190" height="70" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="425" y="92.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="425" dy="0">ota_0</tspan><tspan x="425" dy="14.399999999999999">приложение 1,6 МБ</tspan></text>
<rect x="530" y="60" width="190" height="70" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="530" y="60" width="190" height="70" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="625" y="92.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="625" dy="0">ota_1</tspan><tspan x="625" dy="14.399999999999999">приложение 1,6 МБ</tspan></text>
<line x1="320" y1="95" x2="321" y2="95" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M330 95L321 90.05L321 99.95Z" fill="currentColor" stroke="none"/>
<line x1="320" y1="95" x2="521" y2="95" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>
<path d="M530 95L521 90.05L521 99.95Z" fill="currentColor" stroke="none"/>
<text x="20" y="190" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="20" dy="0">работает один слот; обновление записывается во второй, затем otadata переключает загрузку</tspan></text>
</g></svg>
