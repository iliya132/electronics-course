<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 268" role="img">
<title>Узлы Arduino Uno и уроки курса</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Узлы Arduino Uno и уроки курса</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Узел</tspan></text>
<text x="233" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="233" dy="0">Что делает</tspan></text>
<text x="584.43" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="584.43" dy="0">Урок</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">PTC на USB</tspan></text>
<text x="233" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233" dy="0">ограничивает ток порта 500 мА</tspan></text>
<text x="584.43" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="584.43" dy="0">предохранители и PTC</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">NCP1117</tspan></text>
<text x="233" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233" dy="0">снижает 7–12 В до 5 В; потери (Uвх − 5)·I</tspan></text>
<text x="584.43" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="584.43" dy="0">линейный стабилизатор</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Выбор источника</tspan></text>
<text x="233" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233" dy="0">USB или внешнее питание без конфликта</tspan></text>
<text x="584.43" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="584.43" dy="0">идеальный диод</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Кварц + 22 пФ</tspan></text>
<text x="233" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233" dy="0">тактовая частота 16 МГц</tspan></text>
<text x="584.43" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="584.43" dy="0">тактирование МК</tspan></text>
<line x1="20" y1="212" x2="840" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">100 нФ от DTR</tspan></text>
<text x="233" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233" dy="0">автосброс для загрузки скетча</tspan></text>
<text x="584.43" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="584.43" dy="0">сброс и загрузка</tspan></text>
</g></svg>
