<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Аналогия: ёмкость — это площадь дна ведра</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="120" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="120" dy="0">Ведро и вода</tspan></text>
<rect x="26" y="70" width="56" height="140" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
<rect x="28" y="130" width="52" height="78" rx="2" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.45"/>
<line x1="90" y1="130" x2="90" y2="210" stroke="var(--warn, #9a6700)" stroke-width="2" stroke-linecap="round"/>
<text x="54" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="54" dy="0">узкое: C мало</tspan></text>
<text x="54" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="54" dy="0">воды мало</tspan></text>
<rect x="128" y="70" width="100" height="140" rx="4" fill="none" stroke="currentColor" stroke-width="2.5"/>
<rect x="130" y="130" width="96" height="78" rx="2" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.45"/>
<line x1="236" y1="130" x2="236" y2="210" stroke="var(--warn, #9a6700)" stroke-width="2" stroke-linecap="round"/>
<text x="178" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor"><tspan x="178" dy="0">широкое: C велико</tspan></text>
<text x="178" y="250" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="178" dy="0">воды много</tspan></text>
<text x="120" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="120" dy="0">уровень одинаков (U)</tspan></text>
<line x1="240" y1="40" x2="240" y2="280" stroke="var(--border, #e3e6ea)" stroke-width="1.5" stroke-linecap="round"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="360" dy="0">Конденсатор</tspan></text>
<line x1="290" y1="120" x2="340" y2="120" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<line x1="340" y1="90" x2="340" y2="150" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
<line x1="376" y1="90" x2="376" y2="150" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
<line x1="376" y1="120" x2="430" y2="120" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<text x="330" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="330" dy="0">+Q</tspan></text>
<text x="386" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="386" dy="0">−Q</tspan></text>
<line x1="340" y1="176" x2="367" y2="176" stroke="var(--warn, #9a6700)" stroke-width="2" stroke-linecap="round"/>
<path d="M376 176L367 171.05L367 180.95Z" fill="var(--warn, #9a6700)" stroke="none"/>
<text x="358" y="198" text-anchor="middle" font-size="16" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="358" dy="0">U</tspan></text>
<text x="358" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="358" dy="0">Q = C · U</tspan></text>
<text x="358" y="256" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="358" dy="0">заряд = ёмкость × напряжение</tspan></text>
</g></svg>
