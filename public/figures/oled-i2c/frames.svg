<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" role="img">
<title>Что увидит анализатор при инициализации и выводе</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="390" dy="0">Что увидит анализатор при инициализации и выводе</tspan></text>
<rect x="20" y="42" width="740" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Байт</tspan></text>
<text x="205.6" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="205.6" dy="0">Значение</tspan></text>
<text x="442.4" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="442.4" dy="0">Смысл</tspan></text>
<line x1="20" y1="76" x2="760" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0x78</tspan></text>
<text x="205.6" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="205.6" dy="0">0x3C &lt;&lt; 1 | W</tspan></text>
<text x="442.4" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="442.4" dy="0">адрес OLED и бит записи</tspan></text>
<line x1="20" y1="110" x2="760" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0x00</tspan></text>
<text x="205.6" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="205.6" dy="0">управляющий байт</tspan></text>
<text x="442.4" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="442.4" dy="0">далее идут команды</tspan></text>
<line x1="20" y1="144" x2="760" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0xAE</tspan></text>
<text x="205.6" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="205.6" dy="0">команда</tspan></text>
<text x="442.4" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="442.4" dy="0">выключить дисплей</tspan></text>
<line x1="20" y1="178" x2="760" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0x40</tspan></text>
<text x="205.6" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="205.6" dy="0">управляющий байт</tspan></text>
<text x="442.4" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="442.4" dy="0">далее идут данные кадра</tspan></text>
<line x1="20" y1="212" x2="760" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">…1024 байта</tspan></text>
<text x="205.6" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="205.6" dy="0">данные</tspan></text>
<text x="442.4" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="442.4" dy="0">содержимое экрана</tspan></text>
</g></svg>
