<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img">
<title>Согласование ESP32 с 5 В-устройствами</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="30" y="90" width="170" height="100" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="90" width="170" height="100" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="115" y="129.4" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor"><tspan x="115" dy="0">ESP32</tspan><tspan x="115" dy="15.6">логика 3,3 В</tspan><tspan x="115" dy="15.6">макс. на выводе 3,6 В</tspan></text>
<rect x="300" y="90" width="190" height="100" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="300" y="90" width="190" height="100" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="395" y="130.6" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="395" dy="0">делитель или</tspan><tspan x="395" dy="14.399999999999999">сдвигатель уровня</tspan><tspan x="395" dy="14.399999999999999">(BSS138, 74AHCT125)</tspan></text>
<rect x="590" y="90" width="170" height="100" rx="8" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="590" y="90" width="170" height="100" rx="8" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.2"/>
<text x="675" y="130.6" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="675" dy="0">устройство 5 В</tspan><tspan x="675" dy="14.399999999999999">(лента, дисплей,</tspan><tspan x="675" dy="14.399999999999999">модуль)</tspan></text>
<line x1="200" y1="140" x2="291" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M300 140L291 135.05L291 144.95Z" fill="currentColor" stroke="none"/>
<line x1="300" y1="140" x2="209" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M200 140L209 144.95L209 135.05Z" fill="currentColor" stroke="none"/>
<line x1="490" y1="140" x2="581" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M590 140L581 135.05L581 144.95Z" fill="currentColor" stroke="none"/>
<line x1="590" y1="140" x2="499" y2="140" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M490 140L499 144.95L499 135.05Z" fill="currentColor" stroke="none"/>
<text x="30" y="250" text-anchor="start" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="30" dy="0">5 В на вход ESP32 напрямую недопустимо: повреждение вывода и всего кристалла</tspan></text>
</g></svg>
