<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" role="img">
<title>ESP32: какие GPIO можно использовать</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="440" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="440" dy="0">ESP32: какие GPIO можно использовать</tspan></text>
<rect x="20" y="42" width="840" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">GPIO</tspan></text>
<text x="196" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="196" dy="0">Ограничение</tspan></text>
<text x="532" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="532" dy="0">Рекомендация</tspan></text>
<line x1="20" y1="76" x2="860" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">34, 35, 36, 39</tspan></text>
<text x="196" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="196" dy="0">только вход, без подтяжек</tspan></text>
<text x="532" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="532" dy="0">датчики, кнопки с внешним резистором</tspan></text>
<line x1="20" y1="110" x2="860" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">6–11</tspan></text>
<text x="196" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="196" dy="0">подключены к Flash</tspan></text>
<text x="532" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="532" dy="0">не использовать</tspan></text>
<line x1="20" y1="144" x2="860" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0, 2, 5, 12, 15</tspan></text>
<text x="196" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="196" dy="0">strapping: уровень при сбросе задаёт загрузку</tspan></text>
<text x="532" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="532" dy="0">не тянуть наружу; GPIO12 в 1 даёт сбой Flash</tspan></text>
<line x1="20" y1="178" x2="860" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1, 3</tspan></text>
<text x="196" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="196" dy="0">UART0 (консоль, загрузка)</tspan></text>
<text x="532" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="532" dy="0">оставить для отладки</tspan></text>
<line x1="20" y1="212" x2="860" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">остальные</tspan></text>
<text x="196" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="196" dy="0">обычные</tspan></text>
<text x="532" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="532" dy="0">ток до 12 мА на вывод</tspan></text>
</g></svg>
