<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img">
<title>Тепловая цепь стабилизатора с радиатором</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<circle cx="40" cy="100" r="5" fill="var(--bad, #b3261e)" stroke="var(--bad, #b3261e)" stroke-width="2"/>
<text x="40" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="40" dy="0">кристалл</tspan></text>
<text x="40" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="40" dy="0">Tj</tspan></text>
<path d="M45 100L60 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(100 100) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35 0H-24M24 0H35"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="100" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="100" dy="0">θJC</tspan></text>
<path d="M135 100L150 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="150" cy="100" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<text x="150" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="150" dy="0">корпус Tc</tspan></text>
<path d="M150 100L170 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(205 100) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35 0H-24M24 0H35"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="205" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="205" dy="0">θCS</tspan></text>
<path d="M240 100L260 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="260" cy="100" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<text x="260" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="260" dy="0">радиатор</tspan></text>
<path d="M260 100L280 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(315 100) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-35 0H-24M24 0H35"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="315" y="76" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="315" dy="0">θSA</tspan></text>
<path d="M350 100L400 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="404" cy="100" r="5" fill="var(--ok, #1a7f4b)" stroke="var(--ok, #1a7f4b)" stroke-width="2"/>
<text x="404" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="404" dy="0">воздух</tspan></text>
<text x="404" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="404" dy="0">Ta</tspan></text>
<line x1="170" y1="48" x2="220" y2="48" stroke="var(--bad, #b3261e)" stroke-width="2.5" stroke-linecap="round"/>
<path d="M230 48L220 42.5L220 53.5Z" fill="var(--bad, #b3261e)" stroke="none"/>
<text x="200" y="38" text-anchor="middle" font-size="16" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="200" dy="0">P (тепловой поток)</tspan></text>
<text x="240" y="206" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Tj = Ta + P·(θJC + θCS + θSA)</tspan></text>
<text x="240" y="232" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">без радиатора вся цепь заменяется одним θJA</tspan></text>
</g></svg>
