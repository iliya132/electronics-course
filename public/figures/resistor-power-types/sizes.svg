<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Размеры резисторов в одном масштабе</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Реальные размеры в масштабе (1 мм = 40 px)</tspan></text>
<rect x="24" y="90" width="40" height="20" rx="2" fill="#222" stroke="var(--muted, #5b6573)" stroke-width="1.2"/>
<rect x="24" y="90" width="5.6" height="20" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<rect x="58.4" y="90" width="5.6" height="20" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<text x="44" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="44" dy="0">0402</tspan></text>
<text x="44" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="44" dy="0">0,063 Вт</tspan></text>
<text x="44" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="44" dy="0">1×0,5 мм</tspan></text>
<rect x="88" y="78" width="64" height="32" rx="2" fill="#222" stroke="var(--muted, #5b6573)" stroke-width="1.2"/>
<rect x="88" y="78" width="8.96" height="32" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<rect x="143.04" y="78" width="8.96" height="32" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<text x="120" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="120" dy="0">0603</tspan></text>
<text x="120" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="120" dy="0">0,1 Вт</tspan></text>
<text x="120" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="120" dy="0">1,6×0,8 мм</tspan></text>
<rect x="176" y="60" width="80" height="50" rx="2" fill="#222" stroke="var(--muted, #5b6573)" stroke-width="1.2"/>
<rect x="176" y="60" width="11.2" height="50" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<rect x="244.8" y="60" width="11.2" height="50" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<text x="216" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="216" dy="0">0805</tspan></text>
<text x="216" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="216" dy="0">0,125 Вт</tspan></text>
<text x="216" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="216" dy="0">2×1,25 мм</tspan></text>
<rect x="280" y="46" width="128" height="64" rx="2" fill="#222" stroke="var(--muted, #5b6573)" stroke-width="1.2"/>
<rect x="280" y="46" width="17.92" height="64" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<rect x="390.08" y="46" width="17.92" height="64" rx="1" fill="#b7b7b7" stroke="none" stroke-width="2"/>
<text x="344" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="344" dy="0">1206</tspan></text>
<text x="344" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="344" dy="0">0,25 Вт</tspan></text>
<text x="344" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="344" dy="0">3,2×1,6 мм</tspan></text>
<line x1="60" y1="236" x2="420" y2="236" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<rect x="114" y="190" width="252" height="92" rx="40" fill="#e4c99e" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="240" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#222"><tspan x="240" dy="0">выводной 0,25 Вт: 6,3×2,3 мм</tspan></text>
<line x1="24" y1="190" x2="64" y2="190" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
<text x="44" y="208" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="44" dy="0">1 мм</tspan></text>
</g></svg>
