<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" role="img">
<title>Предделитель таймера при 16 МГц (8 бит, быстрый ШИМ)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="360" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="360" dy="0">Предделитель таймера при 16 МГц (8 бит, быстрый ШИМ)</tspan></text>
<rect x="20" y="42" width="680" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Предделитель</tspan></text>
<text x="211.78" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="211.78" dy="0">Такт таймера</tspan></text>
<text x="432.32" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="432.32" dy="0">Частота ШИМ f/256</tspan></text>
<line x1="20" y1="76" x2="700" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1</tspan></text>
<text x="211.78" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="211.78" dy="0">16 МГц</tspan></text>
<text x="432.32" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="432.32" dy="0">62,5 кГц</tspan></text>
<line x1="20" y1="110" x2="700" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">8</tspan></text>
<text x="211.78" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="211.78" dy="0">2 МГц</tspan></text>
<text x="432.32" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="432.32" dy="0">7812 Гц</tspan></text>
<line x1="20" y1="144" x2="700" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">64</tspan></text>
<text x="211.78" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="211.78" dy="0">250 кГц</tspan></text>
<text x="432.32" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="432.32" dy="0">976,6 Гц</tspan></text>
<line x1="20" y1="178" x2="700" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">256</tspan></text>
<text x="211.78" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="211.78" dy="0">62,5 кГц</tspan></text>
<text x="432.32" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="432.32" dy="0">244 Гц</tspan></text>
<line x1="20" y1="212" x2="700" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1024</tspan></text>
<text x="211.78" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="211.78" dy="0">15,625 кГц</tspan></text>
<text x="432.32" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="432.32" dy="0">61 Гц</tspan></text>
</g></svg>
