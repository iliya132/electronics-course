<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" role="img">
<title>Типовые меры защиты и помехоустойчивости</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="450" dy="0">Типовые меры защиты и помехоустойчивости</tspan></text>
<rect x="20" y="42" width="860" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Проблема</tspan></text>
<text x="294.9" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="294.9" dy="0">Мера</tspan></text>
<text x="621.1" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="621.1" dy="0">Пример</tspan></text>
<line x1="20" y1="76" x2="880" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Разряд статики на разъём</tspan></text>
<text x="294.9" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="294.9" dy="0">TVS/ESD-диод к земле у разъёма</tspan></text>
<text x="621.1" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="621.1" dy="0">USBLC6-2SC6</tspan></text>
<line x1="20" y1="110" x2="880" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Выбросы по питанию</tspan></text>
<text x="294.9" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="294.9" dy="0">TVS на шину + PTC</tspan></text>
<text x="621.1" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="621.1" dy="0">SMAJ5.0A + 500 мА</tspan></text>
<line x1="20" y1="144" x2="880" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">ВЧ-помехи по питанию</tspan></text>
<text x="294.9" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="294.9" dy="0">ферритовая бусина + конденсаторы</tspan></text>
<text x="621.1" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="621.1" dy="0">600 Ом при 100 МГц</tspan></text>
<line x1="20" y1="178" x2="880" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Звон и излучение быстрых линий</tspan></text>
<text x="294.9" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="294.9" dy="0">последовательный резистор 22–100 Ом</tspan></text>
<text x="621.1" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="621.1" dy="0">22 Ом на тактовой линии</tspan></text>
<line x1="20" y1="212" x2="880" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Большие петли тока</tspan></text>
<text x="294.9" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="294.9" dy="0">короткие связи, сплошная земля</tspan></text>
<text x="621.1" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="621.1" dy="0">плоскость GND под всей платой</tspan></text>
</g></svg>
