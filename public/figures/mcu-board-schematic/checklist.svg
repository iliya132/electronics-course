<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 302" role="img">
<title>Чек-лист схемы платы с МК</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="450" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="450" dy="0">Чек-лист схемы платы с МК</tspan></text>
<rect x="20" y="42" width="860" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Блок</tspan></text>
<text x="212.29" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="212.29" dy="0">Что проверить</tspan></text>
<line x1="20" y1="76" x2="880" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Питание</tspan></text>
<text x="212.29" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">LDO на пик тока, конденсаторы на входе и выходе, dropout при минимальном входе</tspan></text>
<line x1="20" y1="110" x2="880" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Развязка</tspan></text>
<text x="212.29" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">100 нФ у каждого вывода питания, 10 мкФ у модуля</tspan></text>
<line x1="20" y1="144" x2="880" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Сброс/загрузка</tspan></text>
<text x="212.29" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">EN с RC, кнопки EN и BOOT, режим загрузки доступен</tspan></text>
<line x1="20" y1="178" x2="880" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Тактирование</tspan></text>
<text x="212.29" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">кварц и нагрузочные конденсаторы (если нет в модуле)</tspan></text>
<line x1="20" y1="212" x2="880" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Интерфейсы</tspan></text>
<text x="212.29" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">подтяжки I²C, USB-UART, TVS на USB</tspan></text>
<line x1="20" y1="246" x2="880" y2="246" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="268" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Сервис</tspan></text>
<text x="212.29" y="268" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="212.29" dy="0">контрольные точки, светодиод питания, шелкография</tspan></text>
</g></svg>
