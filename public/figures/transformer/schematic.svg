<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Трансформатор: две обмотки на общем сердечнике</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<circle cx="66" cy="150" r="18" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="66" y="156" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="66" dy="0">~</tspan></text>
<path d="M66 132L66 100L150 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(150 150) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-50 0H-24c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0H50"/></g>
<text x="120" y="148" text-anchor="end" font-size="16" font-weight="600" fill="currentColor"><tspan x="120" dy="0">N1</tspan></text>
<path d="M150 200L66 200L66 168" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="224" y1="96" x2="224" y2="204" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<line x1="240" y1="96" x2="240" y2="204" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<text x="232" y="82" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="232" dy="0">сердечник</tspan></text>
<g transform="translate(314 150) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-50 0H-24c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0c0 -16 12 -16 12 0H50"/></g>
<text x="344" y="148" text-anchor="start" font-size="16" font-weight="600" fill="currentColor"><tspan x="344" dy="0">N2</tspan></text>
<path d="M314 100L410 100L410 110" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(410 150) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-24M24 0H40"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="388" y="148" text-anchor="end" font-size="16" font-weight="600" fill="currentColor"><tspan x="388" dy="0">Rн</tspan></text>
<path d="M410 190L410 200L314 200" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="66" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="66" dy="0">U1 (вход)</tspan></text>
<text x="410" y="232" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="410" dy="0">U2 (выход)</tspan></text>
<text x="240" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="240" dy="0">U2 / U1 = N2 / N1       I2 / I1 = N1 / N2</tspan></text>
</g></svg>
