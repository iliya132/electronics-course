<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img">
<title>Условные обозначения логических вентилей</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="50" y="30" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="85" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="85" dy="0">&amp;</tspan></text>
<line x1="26" y1="50" x2="50" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="26" y1="74" x2="50" y2="74" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="120" y1="62" x2="150" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="85" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="85" dy="0">И (AND)</tspan></text>
<rect x="300" y="30" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="335" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="335" dy="0">≥1</tspan></text>
<line x1="276" y1="50" x2="300" y2="50" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="276" y1="74" x2="300" y2="74" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="370" y1="62" x2="400" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="335" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="335" dy="0">ИЛИ (OR)</tspan></text>
<rect x="550" y="30" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="585" y="70" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="585" dy="0">1</tspan></text>
<line x1="526" y1="62" x2="550" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="630" y1="62" x2="650" y2="62" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="625" cy="62" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="585" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="585" dy="0">НЕ (NOT)</tspan></text>
<rect x="50" y="180" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="85" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="85" dy="0">&amp;</tspan></text>
<line x1="26" y1="200" x2="50" y2="200" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="26" y1="224" x2="50" y2="224" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="130" y1="212" x2="150" y2="212" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="125" cy="212" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="85" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="85" dy="0">И-НЕ (NAND)</tspan></text>
<rect x="300" y="180" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="335" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="335" dy="0">≥1</tspan></text>
<line x1="276" y1="200" x2="300" y2="200" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="276" y1="224" x2="300" y2="224" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="380" y1="212" x2="400" y2="212" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<circle cx="375" cy="212" r="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="335" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="335" dy="0">ИЛИ-НЕ (NOR)</tspan></text>
<rect x="550" y="180" width="70" height="64" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/>
<text x="585" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor"><tspan x="585" dy="0">=1</tspan></text>
<line x1="526" y1="200" x2="550" y2="200" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="526" y1="224" x2="550" y2="224" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<line x1="620" y1="212" x2="650" y2="212" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
<text x="585" y="270" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="585" dy="0">XOR</tspan></text>
</g></svg>
