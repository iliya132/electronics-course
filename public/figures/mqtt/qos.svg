<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img">
<title>Уровни качества доставки MQTT (QoS)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="410" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="410" dy="0">Уровни качества доставки MQTT (QoS)</tspan></text>
<rect x="20" y="42" width="780" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">QoS</tspan></text>
<text x="118" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="118" dy="0">Гарантия</tspan></text>
<text x="478" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="478" dy="0">Когда использовать</tspan></text>
<line x1="20" y1="76" x2="800" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">0</tspan></text>
<text x="118" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="118" dy="0">не более одного раза, без подтверждения</tspan></text>
<text x="478" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="478" dy="0">частые показания датчиков</tspan></text>
<line x1="20" y1="110" x2="800" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">1</tspan></text>
<text x="118" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="118" dy="0">не менее одного раза (возможны дубли)</tspan></text>
<text x="478" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="478" dy="0">команды, события</tspan></text>
<line x1="20" y1="144" x2="800" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">2</tspan></text>
<text x="118" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="118" dy="0">ровно один раз (четырёхшаговое подтверждение)</tspan></text>
<text x="478" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="478" dy="0">платежи, критичные команды</tspan></text>
</g></svg>
