<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img">
<title>Обозначения элементов на схеме</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="320" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="320" dy="0">Обозначения элементов на схеме</tspan></text>
