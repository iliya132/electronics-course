<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img">
<title>Цепи сброса: подтяжка, кнопка и автосброс от USB-UART</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="30" y="30" width="90" height="36" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="30" width="90" height="36" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="75" y="53" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="75" dy="0">+5 В</tspan></text>
<rect x="30" y="110" width="110" height="46" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="110" width="110" height="46" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="85" y="130.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="85" dy="0">R 10 кОм</tspan><tspan x="85" dy="14.399999999999999">подтяжка</tspan></text>
<rect x="30" y="220" width="110" height="46" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="30" y="220" width="110" height="46" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="85" y="240.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="85" dy="0">кнопка</tspan><tspan x="85" dy="14.399999999999999">RESET → GND</tspan></text>
<rect x="300" y="120" width="160" height="90" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="300" y="120" width="160" height="90" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="380" y="153.2" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor"><tspan x="380" dy="0">МК</tspan><tspan x="380" dy="16.8">вывод RESET</tspan><tspan x="380" dy="16.8">(активный низкий)</tspan></text>
<rect x="520" y="110" width="100" height="46" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="520" y="110" width="100" height="46" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="570" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor"><tspan x="570" dy="0">C 100 нФ</tspan></text>
<rect x="640" y="110" width="100" height="46" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="640" y="110" width="100" height="46" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="690" y="130.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="690" dy="0">DTR</tspan><tspan x="690" dy="14.399999999999999">USB-UART</tspan></text>
<line x1="77.12" y1="66" x2="81.24" y2="101.06" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M82.29 110L86.16 100.48L76.33 101.64Z" fill="currentColor" stroke="none"/>
<line x1="140" y1="138.97" x2="291.05" y2="155.35" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M300 156.32L291.59 150.43L290.52 160.27Z" fill="currentColor" stroke="none"/>
<line x1="140" y1="228.46" x2="291.3" y2="188.45" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M300 186.15L290.03 183.67L292.56 193.24Z" fill="currentColor" stroke="none"/>
<line x1="640" y1="133" x2="629" y2="133" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M620 133L629 137.95L629 128.05Z" fill="currentColor" stroke="none"/>
<line x1="520" y1="141.42" x2="468.88" y2="150.03" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M460 151.53L469.7 154.91L468.05 145.15Z" fill="currentColor" stroke="none"/>
<text x="300" y="260" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="300" dy="0">RESET = 0 → МК стоит; RESET = 1 → программа работает</tspan></text>
<text x="300" y="300" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="300" dy="0">автосброс: DTR падает → импульс через 100 нФ</tspan><tspan x="300" dy="14.399999999999999">RESET на ≈ 1 мс → запуск загрузчика</tspan></text>
</g></svg>
