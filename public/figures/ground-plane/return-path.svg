<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img">
<title>Возвратный ток течёт под дорожкой сигнала (вид сверху)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="210" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="210" dy="0">Сплошная плоскость</tspan></text>
<rect x="20" y="44" width="380" height="240" rx="6" fill="var(--surface, #f6f7f9)" stroke="currentColor" stroke-width="1.6"/>
<text x="30" y="62" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">земляная плоскость</tspan></text>
<line x1="50" y1="120" x2="370" y2="120" stroke="var(--accent, #2457d6)" stroke-width="3" stroke-linecap="round"/>
<text x="50" y="108" text-anchor="start" font-size="11" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="50" dy="0">дорожка сигнала →</tspan></text>
<line x1="370" y1="132" x2="50" y2="132" stroke="var(--ok, #1a7f4b)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="170" y1="132" x2="149" y2="132" stroke="var(--ok, #1a7f4b)" stroke-width="2.4" stroke-linecap="round"/>
<path d="M140 132L149 136.95L149 127.05Z" fill="var(--ok, #1a7f4b)" stroke="none"/>
<text x="210" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ok, #1a7f4b)"><tspan x="210" dy="0">возврат идёт под дорожкой:</tspan><tspan x="210" dy="14.399999999999999">малая петля, низкая индуктивность</tspan></text>
<text x="610" y="26" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="610" dy="0">Плоскость с разрезом под дорожкой</tspan></text>
<rect x="420" y="44" width="380" height="240" rx="6" fill="var(--surface, #f6f7f9)" stroke="currentColor" stroke-width="1.6"/>
<text x="430" y="62" text-anchor="start" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="430" dy="0">земляная плоскость</tspan></text>
<line x1="450" y1="120" x2="770" y2="120" stroke="var(--accent, #2457d6)" stroke-width="3" stroke-linecap="round"/>
<text x="450" y="108" text-anchor="start" font-size="11" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="450" dy="0">дорожка сигнала →</tspan></text>
<rect x="580" y="90" width="40" height="140" rx="2" fill="none" stroke="var(--bad, #b3261e)" stroke-width="1.6" stroke-dasharray="4 3"/>
<text x="600" y="250" text-anchor="middle" font-size="11" font-weight="400" fill="var(--bad, #b3261e)"><tspan x="600" dy="0">разрез в плоскости</tspan></text>
<path d="M770 132L625 132L625 236L575 236L575 132L450 132" fill="none" stroke="var(--bad, #b3261e)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="690" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="var(--bad, #b3261e)"><tspan x="690" dy="0">обход разреза:</tspan><tspan x="690" dy="14.399999999999999">большая петля, помехи</tspan></text>
<text x="410" y="330" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="410" dy="0">нельзя прокладывать быстрые сигналы над разрезами и щелями в земле</tspan></text>
</g></svg>
