<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img">
<title>Умный вентилятор: датчик → Arduino → ШИМ → MOSFET → вентилятор</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="20" y="110" width="140" height="70" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="20" y="110" width="140" height="70" rx="8" fill="none" stroke="var(--warn, #9a6700)" stroke-width="2.2"/>
<text x="90" y="142.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="90" dy="0">NTC 10 кОм</tspan><tspan x="90" dy="14.399999999999999">делитель → A0</tspan></text>
<rect x="210" y="90" width="170" height="110" rx="8" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="210" y="90" width="170" height="110" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.2"/>
<text x="295" y="135.6" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="295" dy="0">Arduino</tspan><tspan x="295" dy="14.399999999999999">масштаб T → ШИМ</tspan><tspan x="295" dy="14.399999999999999">порог и гистерезис</tspan></text>
<rect x="430" y="110" width="150" height="70" rx="8" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="430" y="110" width="150" height="70" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.2"/>
<text x="505" y="135.6" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="505" dy="0">IRLZ44N</tspan><tspan x="505" dy="14.399999999999999">+ Rз 100 Ом,</tspan><tspan x="505" dy="14.399999999999999">Rпд 10 кОм</tspan></text>
<rect x="630" y="110" width="170" height="70" rx="8" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.16"/>
<rect x="630" y="110" width="170" height="70" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.2"/>
<text x="715" y="142.8" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="715" dy="0">вентилятор 12 В</tspan><tspan x="715" dy="14.399999999999999">+ диод 1N4007</tspan></text>
<line x1="160" y1="145" x2="201" y2="145" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M210 145L201 140.05L201 149.95Z" fill="currentColor" stroke="none"/>
<line x1="380" y1="145" x2="421" y2="145" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M430 145L421 140.05L421 149.95Z" fill="currentColor" stroke="none"/>
<text x="405" y="137" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="405" dy="0">ШИМ D9</tspan></text>
<line x1="580" y1="145" x2="621" y2="145" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
<path d="M630 145L621 140.05L621 149.95Z" fill="currentColor" stroke="none"/>
<text x="20" y="250" text-anchor="start" font-size="13" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="20" dy="0">блок питания 12 В отдельный; земли Arduino и блока соединены</tspan></text>
