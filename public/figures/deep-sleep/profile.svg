<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img">
<title>Профиль тока датчика с deep sleep: 10 мкА сон и 80 мА × 3 с каждые 10 минут</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<path d="M90 220L408.4 220L408.4 70L410 70L410 220L728.4 220L728.4 70L730 70L730 220L730 220" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="90" y1="220" x2="730" y2="220" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<line x1="90" y1="220" x2="90" y2="226" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<text x="90" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="90" dy="0">0 с</tspan></text>
<line x1="410" y1="220" x2="410" y2="226" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<text x="410" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="410" dy="0">600 с</tspan></text>
<line x1="730" y1="220" x2="730" y2="226" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
<text x="730" y="242" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="730" dy="0">1200 с</tspan></text>
<text x="82" y="74" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="82" dy="0">80 мА</tspan></text>
<text x="82" y="224" text-anchor="end" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="82" dy="0">0,01 мА</tspan></text>
<text x="250" y="208" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="250" dy="0">deep sleep: 10 мкА, 597 с</tspan></text>
<text x="406" y="60" text-anchor="end" font-size="12" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="406" dy="0">работа 3 с, 80 мА</tspan></text>
<text x="410" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor"><tspan x="410" dy="0">средний ток = (80·3 + 0,01·597)/600 ≈ 0,41 мА → 18650 на 2600 мА·ч ≈ 264 суток (идеально)</tspan></text>
</g></svg>
