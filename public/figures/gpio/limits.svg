<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img">
<title>Допустимые токи выводов (типично, проверяй даташит)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="380" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="380" dy="0">Допустимые токи выводов (типично, проверяй даташит)</tspan></text>
<rect x="20" y="42" width="720" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">МК</tspan></text>
<text x="223.25" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="223.25" dy="0">Макс. на вывод</tspan></text>
<text x="381.9" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="381.9" dy="0">Рекомендуется</tspan></text>
<text x="552.75" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="552.75" dy="0">Суммарно</tspan></text>
<line x1="20" y1="76" x2="740" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">ATmega328P (5 В)</tspan></text>
<text x="223.25" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="223.25" dy="0">40 мА</tspan></text>
<text x="381.9" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="381.9" dy="0">до 20 мА</tspan></text>
<text x="552.75" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="552.75" dy="0">200 мА на порт</tspan></text>
<line x1="20" y1="110" x2="740" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">ESP32 (3,3 В)</tspan></text>
<text x="223.25" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="223.25" dy="0">40 мА</tspan></text>
<text x="381.9" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="381.9" dy="0">до 12 мА</tspan></text>
<text x="552.75" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="552.75" dy="0">ограничено питанием</tspan></text>
<line x1="20" y1="144" x2="740" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">STM32F103 (3,3 В)</tspan></text>
<text x="223.25" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="223.25" dy="0">25 мА</tspan></text>
<text x="381.9" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="381.9" dy="0">до 8 мА</tspan></text>
<text x="552.75" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="552.75" dy="0">150 мА суммарно</tspan></text>
</g></svg>
