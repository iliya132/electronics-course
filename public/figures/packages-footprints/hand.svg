<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 268" role="img">
<title>Как выбирать корпус для ручной пайки</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="420" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="420" dy="0">Как выбирать корпус для ручной пайки</tspan></text>
<rect x="20" y="42" width="800" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Корпус</tspan></text>
<text x="182.84" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="182.84" dy="0">Шаг выводов</tspan></text>
<text x="337.68" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="337.68" dy="0">Ручная пайка</tspan></text>
<text x="518.32" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="518.32" dy="0">Комментарий</tspan></text>
<line x1="20" y1="76" x2="820" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">DIP (THT)</tspan></text>
<text x="182.84" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="182.84" dy="0">2,54 мм</tspan></text>
<text x="337.68" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="337.68" dy="0">очень просто</tspan></text>
<text x="518.32" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="518.32" dy="0">для макеток и учебных плат</tspan></text>
<line x1="20" y1="110" x2="820" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">SOIC-8</tspan></text>
<text x="182.84" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="182.84" dy="0">1,27 мм</tspan></text>
<text x="337.68" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="337.68" dy="0">просто</tspan></text>
<text x="518.32" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="518.32" dy="0">микросхемы общего назначения</tspan></text>
<line x1="20" y1="144" x2="820" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">TSSOP-16</tspan></text>
<text x="182.84" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="182.84" dy="0">0,65 мм</tspan></text>
<text x="337.68" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="337.68" dy="0">средне</tspan></text>
<text x="518.32" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="518.32" dy="0">нужны тонкое жало и флюс</tspan></text>
<line x1="20" y1="178" x2="820" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">QFN-32</tspan></text>
<text x="182.84" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="182.84" dy="0">0,5 мм</tspan></text>
<text x="337.68" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="337.68" dy="0">трудно</tspan></text>
<text x="518.32" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="518.32" dy="0">нужен фен и паста</tspan></text>
<line x1="20" y1="212" x2="820" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">BGA</tspan></text>
<text x="182.84" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="182.84" dy="0">0,5–1,0 мм</tspan></text>
<text x="337.68" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="337.68" dy="0">невозможно вручную</tspan></text>
<text x="518.32" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="518.32" dy="0">нужна печь и рентген</tspan></text>
</g></svg>
