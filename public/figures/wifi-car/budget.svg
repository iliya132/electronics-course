<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" role="img">
<title>Токи и бюджет робота</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Токи и бюджет робота</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Узел</tspan></text>
<text x="291.57" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="291.57" dy="0">Ток</tspan></text>
<text x="496.57" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="496.57" dy="0">Комментарий</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Мотор N20 (6 В), ход</tspan></text>
<text x="291.57" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">0,25–0,3 А</tspan></text>
<text x="496.57" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="496.57" dy="0">по два</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Мотор в стопоре</tspan></text>
<text x="291.57" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">0,8–1,5 А</tspan></text>
<text x="496.57" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="496.57" dy="0">драйвер держит 1,2 А непрерывно</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">ESP32 + Wi-Fi</tspan></text>
<text x="291.57" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">0,12 А (пик 0,4 А)</tspan></text>
<text x="496.57" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="496.57" dy="0">через понижающий модуль</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Итого ход</tspan></text>
<text x="291.57" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="291.57" dy="0">≈ 0,75 А от 7,4 В</tspan></text>
<text x="496.57" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="496.57" dy="0">время работы 2600 мА·ч / 0,75 А ≈ 3,5 ч</tspan></text>
</g></svg>
