<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img">
<title>Расположение накопительного конденсатора и развязки</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Конденсаторы по цепочке питания</tspan></text>
<rect x="10" y="60" width="100" height="72" rx="8" fill="none" stroke="var(--muted, #5b6573)" stroke-width="2.5"/>
<text x="60" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--muted, #5b6573)"><tspan x="60" dy="0">разъём</tspan><tspan x="60" dy="15">питания</tspan></text>
<line x1="110" y1="96" x2="120" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M128 96L120 91.6L120 100.4Z" fill="currentColor" stroke="none"/>
<rect x="128" y="60" width="100" height="72" rx="8" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2.5"/>
<text x="178" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="178" dy="0">bulk</tspan><tspan x="178" dy="15">100–470 мкФ</tspan></text>
<line x1="228" y1="96" x2="238" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M246 96L238 91.6L238 100.4Z" fill="currentColor" stroke="none"/>
<rect x="246" y="60" width="100" height="72" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
<text x="296" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor"><tspan x="296" dy="0">стабилиз.</tspan><tspan x="296" dy="15">3,3 В</tspan></text>
<line x1="346" y1="96" x2="356" y2="96" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
<path d="M364 96L356 91.6L356 100.4Z" fill="currentColor" stroke="none"/>
<rect x="364" y="60" width="100" height="72" rx="8" fill="none" stroke="var(--ok, #1a7f4b)" stroke-width="2.5"/>
<text x="414" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="414" dy="0">100 нФ</tspan><tspan x="414" dy="15">у каждой</tspan><tspan x="414" dy="15">микросхемы</tspan></text>
<text x="240" y="172" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">Bulk закрывает миллисекундные пики и пульсации,</tspan></text>
<text x="240" y="192" text-anchor="middle" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="240" dy="0">100 нФ — наносекундные броски у каждой микросхемы</tspan></text>
</g></svg>
