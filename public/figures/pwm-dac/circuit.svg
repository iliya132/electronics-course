<text x="386" y="99" text-anchor="start" font-size="15" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="386" dy="0">Uср</tspan></text>
<text x="240" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="240" dy="0">Uср = D · U, ripple ≈ U·D(1−D) / (f·R·C)</tspan></text>
