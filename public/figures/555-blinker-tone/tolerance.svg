<text x="640" y="168" text-anchor="end" font-size="13" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="640" dy="0">Гц</tspan></text>
<rect x="177.79" y="112" width="331.88" height="28" rx="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.35"/>
