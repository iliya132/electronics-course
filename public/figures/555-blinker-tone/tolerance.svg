<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img">
<title>Ожидаемый диапазон измеренной частоты мигалки</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
