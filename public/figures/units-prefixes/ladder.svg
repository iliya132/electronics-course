<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 372" role="img">
<title>Лестница приставок СИ</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="currentColor"><tspan x="240" dy="0">Каждая ступень вниз — в 1000 раз меньше</tspan></text>
<rect x="16" y="40" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="62" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">Г</tspan></text>
<text x="94" y="62" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">гига</tspan></text>
<text x="176" y="62" text-anchor="start" font-size="17" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="176" dy="0">10⁹</tspan></text>
<text x="246" y="62" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">ГГц — частота процессора</tspan></text>
<rect x="16" y="80" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="102" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">М</tspan></text>
<text x="94" y="102" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">мега</tspan></text>
<text x="176" y="102" text-anchor="start" font-size="17" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="176" dy="0">10⁶</tspan></text>
<text x="246" y="102" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">МОм, МГц — 16 МГц у Arduino</tspan></text>
<rect x="16" y="120" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">к</tspan></text>
<text x="94" y="142" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">кило</tspan></text>
<text x="176" y="142" text-anchor="start" font-size="17" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="176" dy="0">10³</tspan></text>
<text x="246" y="142" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">кОм — типичные резисторы</tspan></text>
<rect x="16" y="160" width="66" height="32" rx="6" fill="var(--accent, #2457d6)" stroke="var(--accent, #2457d6)" stroke-width="2"/>
<text x="49" y="182" text-anchor="middle" font-size="20" font-weight="700" fill="#fff"><tspan x="49" dy="0">1</tspan></text>
<text x="94" y="182" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">основная</tspan></text>
<text x="176" y="182" text-anchor="start" font-size="17" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="176" dy="0">1</tspan></text>
<text x="246" y="182" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">А, В, Ом, Вт, Ф, Гн</tspan></text>
<rect x="16" y="200" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="222" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">м</tspan></text>
<text x="94" y="222" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">милли</tspan></text>
<text x="176" y="222" text-anchor="start" font-size="17" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="176" dy="0">10⁻³</tspan></text>
<text x="246" y="222" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">мА — токи светодиодов</tspan></text>
<rect x="16" y="240" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="262" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">мк</tspan></text>
<text x="94" y="262" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">микро</tspan></text>
<text x="176" y="262" text-anchor="start" font-size="17" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="176" dy="0">10⁻⁶</tspan></text>
<text x="246" y="262" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">мкФ, мкА — ток во сне МК</tspan></text>
<rect x="16" y="280" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">н</tspan></text>
<text x="94" y="302" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">нано</tspan></text>
<text x="176" y="302" text-anchor="start" font-size="17" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="176" dy="0">10⁻⁹</tspan></text>
<text x="246" y="302" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">нФ — 100 нФ рядом с МК</tspan></text>
<rect x="16" y="320" width="66" height="32" rx="6" fill="var(--surface, #f6f7f9)" stroke="var(--muted, #5b6573)" stroke-width="2"/>
<text x="49" y="342" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor"><tspan x="49" dy="0">п</tspan></text>
<text x="94" y="342" text-anchor="start" font-size="15" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="94" dy="0">пико</tspan></text>
<text x="176" y="342" text-anchor="start" font-size="17" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="176" dy="0">10⁻¹²</tspan></text>
<text x="246" y="342" text-anchor="start" font-size="14" font-weight="400" fill="currentColor"><tspan x="246" dy="0">пФ — 22 пФ у кварца</tspan></text>
</g></svg>
