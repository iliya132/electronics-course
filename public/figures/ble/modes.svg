<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" role="img">
<title>BLE: рассылка и соединение</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">BLE: рассылка и соединение</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Режим</tspan></text>
<text x="242.46" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="242.46" dy="0">Интервал</tspan></text>
<text x="419.08" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="419.08" dy="0">Ток (порядок)</tspan></text>
<text x="646.15" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="646.15" dy="0">Для чего</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Advertising (рассылка)</tspan></text>
<text x="242.46" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="242.46" dy="0">100 мс – 1 с</tspan></text>
<text x="419.08" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="419.08" dy="0">0,1–5 мА в импульсах</tspan></text>
<text x="646.15" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="646.15" dy="0">маячки, поиск устройства</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Connected (соединение)</tspan></text>
<text x="242.46" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="242.46" dy="0">7,5 мс – 4 с</tspan></text>
<text x="419.08" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="419.08" dy="0">0,1–10 мА</tspan></text>
<text x="646.15" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="646.15" dy="0">чтение и notify</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Wi-Fi для сравнения</tspan></text>
<text x="242.46" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="242.46" dy="0">постоянно</tspan></text>
<text x="419.08" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="419.08" dy="0">80–120 мА</tspan></text>
<text x="646.15" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="646.15" dy="0">сеть, интернет</tspan></text>
</g></svg>
