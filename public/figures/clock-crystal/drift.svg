<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img">
<title>Уход часов за сутки (по точности источника)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="380" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="380" dy="0">Уход часов за сутки (по точности источника)</tspan></text>
<text x="220" y="65" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="220" dy="0">RC внутри МК ±2 %</tspan></text>
<rect x="230" y="48" width="380" height="24" rx="4" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="618" y="65" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="618" dy="0">±1728 с</tspan></text>
<text x="220" y="105" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="220" dy="0">кварц ±50 ppm</tspan></text>
<rect x="230" y="88" width="2" height="24" rx="4" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="238.95" y="105" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238.95" dy="0">±4,3 с</tspan></text>
<text x="220" y="145" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="220" dy="0">часовой кварц ±20 ppm</tspan></text>
<rect x="230" y="128" width="2" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="238.37" y="145" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238.37" dy="0">±1,7 с</tspan></text>
<text x="220" y="185" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="220" dy="0">TCXO ±2 ppm</tspan></text>
<rect x="230" y="168" width="2" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="238.04" y="185" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238.04" dy="0">±0,17 с</tspan></text>
</g></svg>
