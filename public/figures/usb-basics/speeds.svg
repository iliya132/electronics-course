<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 176" role="img">
<title>Скорости USB (шкала логарифмическая по смыслу: значения в Мбит/с)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="390" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="390" dy="0">Скорости USB (шкала логарифмическая по смыслу: значения в Мбит/с)</tspan></text>
<text x="210" y="65" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="210" dy="0">Low Speed (мышь)</tspan></text>
<rect x="220" y="48" width="2" height="24" rx="4" fill="var(--muted, #5b6573)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="229.28" y="65" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="229.28" dy="0">1,5 Мбит/с</tspan></text>
<text x="210" y="105" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="210" dy="0">Full Speed (USB 1.1)</tspan></text>
<rect x="220" y="88" width="10.25" height="24" rx="4" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="238.25" y="105" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="238.25" dy="0">12 Мбит/с</tspan></text>
<text x="210" y="145" text-anchor="end" font-size="13" font-weight="600" fill="currentColor"><tspan x="210" dy="0">High Speed (USB 2.0)</tspan></text>
<rect x="220" y="128" width="410" height="24" rx="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.55"/>
<text x="638" y="145" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="638" dy="0">480 Мбит/с</tspan></text>
</g></svg>
