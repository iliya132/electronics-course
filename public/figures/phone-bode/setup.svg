<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Смартфон как генератор и RC-фильтр, два измерения напряжения</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="16" y="70" width="112" height="110" rx="12" fill="var(--surface, #f6f7f9)" stroke="currentColor" stroke-width="2.5"/>
<text x="72" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor"><tspan x="72" dy="0">смартфон</tspan></text>
<text x="72" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="72" dy="0">приложение-</tspan><tspan x="72" dy="13.2">генератор</tspan></text>
<text x="72" y="168" text-anchor="middle" font-size="11" font-weight="400" fill="var(--warn, #9a6700)"><tspan x="72" dy="0">аудиовыход</tspan></text>
<path d="M128 100L160 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="100" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<path d="M160 100L190 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(230 100) rotate(0)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-40 0H-24M24 0H40"/><rect x="-24" y="-9" width="48" height="18" rx="2"/></g>
<text x="230" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="currentColor"><tspan x="230" dy="0">R 10 кОм</tspan></text>
<path d="M270 100L340 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="310" cy="100" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<path d="M310 100L310 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(310 148) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-28 0H-5M-5 -18V18M5 -18V18M5 0H28"/></g>
<text x="334" y="146" text-anchor="start" font-size="16" font-weight="600" fill="currentColor"><tspan x="334" dy="0">C 100 нФ</tspan></text>
<path d="M310 176L310 230L128 230L128 160" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M160 100L160 125" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<g transform="translate(160 155) rotate(90)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 0H-18M18 0H30"/><circle r="18" stroke="var(--accent, #2457d6)"/></g>
<text x="160" y="161" text-anchor="middle" font-size="18" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="160" dy="0">V~</tspan></text>
<path d="M160 185L160 230" fill="none" stroke="var(--accent, #2457d6)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="160" cy="230" r="4.5" fill="currentColor" stroke="none" stroke-width="2"/>
<text x="160" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="160" dy="0">измеряем Uвх</tspan></text>
<text x="340" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ok, #1a7f4b)"><tspan x="340" dy="0">затем Uвых (на C)</tspan></text>
<text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="240" dy="0">fc = 1 / (2π·10 кОм·100 нФ) = 159 Гц</tspan></text>
</g></svg>
