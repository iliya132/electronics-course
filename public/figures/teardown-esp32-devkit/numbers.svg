<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 234" role="img">
<title>Узлы DevKit: роли и числа</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="430" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="430" dy="0">Узлы DevKit: роли и числа</tspan></text>
<rect x="20" y="42" width="820" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Узел</tspan></text>
<text x="270.96" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="270.96" dy="0">Роль</tspan></text>
<text x="574.67" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="574.67" dy="0">Ориентир</tspan></text>
<line x1="20" y1="76" x2="840" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">AMS1117-3.3</tspan></text>
<text x="270.96" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.96" dy="0">5 В → 3,3 В, ток до 800 мА</tspan></text>
<text x="574.67" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">потери (5 − 3,3)·0,12 = 0,2 Вт</tspan></text>
<line x1="20" y1="110" x2="840" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">EN: 10 кОм + 1 мкФ</tspan></text>
<text x="270.96" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.96" dy="0">задержка старта</tspan></text>
<text x="574.67" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">τ = 10 мс</tspan></text>
<line x1="20" y1="144" x2="840" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">DTR/RTS → EN, GPIO0</tspan></text>
<text x="270.96" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.96" dy="0">автопрограммирование</tspan></text>
<text x="574.67" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">DTR=0, RTS=1: GPIO0=0</tspan></text>
<line x1="20" y1="178" x2="840" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Strapping-пины</tspan></text>
<text x="270.96" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="270.96" dy="0">уровень при сбросе</tspan></text>
<text x="574.67" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="574.67" dy="0">0, 2, 5, 12, 15</tspan></text>
</g></svg>
