<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img">
<title>Absolute Maximum и Recommended Operating — разные вещи</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="500" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="500" dy="0">Absolute Maximum и Recommended Operating — разные вещи</tspan></text>
<rect x="20" y="42" width="960" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0"></tspan></text>
<text x="233.71" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="233.71" dy="0">Absolute Maximum</tspan></text>
<text x="645.14" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="645.14" dy="0">Recommended Operating</tspan></text>
<line x1="20" y1="76" x2="980" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Что это</tspan></text>
<text x="233.71" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.71" dy="0">предел, за которым возможна поломка</tspan></text>
<text x="645.14" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="645.14" dy="0">условия, в которых гарантируются параметры</tspan></text>
<line x1="20" y1="110" x2="980" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Работать на пределе?</tspan></text>
<text x="233.71" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.71" dy="0">нельзя: только кратковременно и не гарантируется</tspan></text>
<text x="645.14" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="645.14" dy="0">это нормальный режим</tspan></text>
<line x1="20" y1="144" x2="980" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Пример (3,3 В МК)</tspan></text>
<text x="233.71" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="233.71" dy="0">вывод до 3,6 В, ток до 40 мА</tspan></text>
<text x="645.14" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="645.14" dy="0">питание 3,0–3,6 В, ток вывода до 12 мА</tspan></text>
</g></svg>
