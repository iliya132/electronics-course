<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 355" role="img">
 <title>Ключ индуктивной нагрузки. Диод параллельно нагрузке</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor"/></marker></defs>
 <g font-family="system-ui" font-size="18" fill="currentColor" stroke="none"><text x="240" y="26" text-anchor="middle">Низкобоковой ключ; общая земля</text><polyline points="320,55 320,85" fill="none" stroke="currentColor" stroke-width="2" /><text x="330" y="60" >+U нагрузки</text><rect x="290" y="85" width="60" height="60" fill="none" stroke="currentColor"/><text x="270" y="120" text-anchor="end">Нагрузка</text><polyline points="320,145 320,190" fill="none" stroke="currentColor" stroke-width="2" /><rect x="290" y="190" width="60" height="65" fill="none" stroke="currentColor"/><text x="320" y="228" text-anchor="middle" font-size="14">NMOS</text><polyline points="70,220 290,220" fill="none" stroke="currentColor" stroke-width="2" /><text x="70" y="205" >GPIO → Rg → G</text><polyline points="320,255 320,290" fill="none" stroke="currentColor" stroke-width="2" /><text x="332" y="285" >S → GND</text><polyline points="320,65 410,65 410,165 320,165" fill="none" stroke="currentColor" stroke-width="2" /><text x="420" y="110" font-size="16">D</text><text x="240" y="330" text-anchor="middle" font-size="16">Защитный диод: K к +U, A к drain</text></g></svg>