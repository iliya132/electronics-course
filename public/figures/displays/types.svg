<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" role="img">
<title>Типичные дисплеи для Arduino</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="500" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="500" dy="0">Типичные дисплеи для Arduino</tspan></text>
<rect x="20" y="42" width="960" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Дисплей</tspan></text>
<text x="217.77" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="217.77" dy="0">Интерфейс</tspan></text>
<text x="362.88" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="362.88" dy="0">Адрес I²C</tspan></text>
<text x="485.67" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="485.67" dy="0">Выводы МК</tspan></text>
<text x="664.28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="664.28" dy="0">Примечание</tspan></text>
<line x1="20" y1="76" x2="980" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">7-сегментный 4 разряда</tspan></text>
<text x="217.77" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="217.77" dy="0">прямое управление</tspan></text>
<text x="362.88" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="362.88" dy="0">—</tspan></text>
<text x="485.67" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="485.67" dy="0">8 сегментов + 4 цифры</tspan></text>
<text x="664.28" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="664.28" dy="0">мультиплексирование, резисторы 220 Ом</tspan></text>
<line x1="20" y1="110" x2="980" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">LCD 1602</tspan></text>
<text x="217.77" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="217.77" dy="0">I²C (PCF8574)</tspan></text>
<text x="362.88" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="362.88" dy="0">0x27 или 0x3F</tspan></text>
<text x="485.67" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="485.67" dy="0">2 (SDA, SCL)</tspan></text>
<text x="664.28" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="664.28" dy="0">16×2 символа, LiquidCrystal_I2C</tspan></text>
<line x1="20" y1="144" x2="980" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">OLED SSD1306 128×64</tspan></text>
<text x="217.77" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="217.77" dy="0">I²C</tspan></text>
<text x="362.88" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="362.88" dy="0">0x3C</tspan></text>
<text x="485.67" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="485.67" dy="0">2 (SDA, SCL)</tspan></text>
<text x="664.28" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="664.28" dy="0">буфер 1024 байта RAM</tspan></text>
</g></svg>
