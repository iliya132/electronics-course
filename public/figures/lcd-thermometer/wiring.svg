<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" role="img">
<title>Термометр: NTC → Arduino → LCD1602</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<rect x="30" y="60" width="190" height="70" rx="8" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2" opacity="0.16"/>
