<path d="M300 156.49L289.97 154.28L292.76 163.78Z" fill="currentColor" stroke="none"/>
<text x="30" y="290" text-anchor="start" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="30" dy="0">разрешение около 0,13 °C на отсчёт АЦП при 25 °C; усреднение 16 отсчётов уменьшает шум в 4 раза</tspan></text>
