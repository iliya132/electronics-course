<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 302" role="img">
<title>Чек-лист перед заказом платы (фрагмент)</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor"><tspan x="480" dy="0">Чек-лист перед заказом платы (фрагмент)</tspan></text>
<rect x="20" y="42" width="920" height="34" rx="6" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.2"/>
<text x="28" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Блок</tspan></text>
<text x="225.14" y="64" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="225.14" dy="0">Проверка</tspan></text>
<line x1="20" y1="76" x2="940" y2="76" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="98" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Питание</tspan></text>
<text x="225.14" y="98" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">LDO на пик с запасом 30 %; dropout при минимальном входе; конденсаторы по даташиту</tspan></text>
<line x1="20" y1="110" x2="940" y2="110" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="132" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Защита</tspan></text>
<text x="225.14" y="132" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">TVS и PTC на входе USB-C; резисторы CC 5,1 кОм; защита Li-ion</tspan></text>
<line x1="20" y1="144" x2="940" y2="144" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="166" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">МК</tspan></text>
<text x="225.14" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">развязка у каждого вывода; EN с RC; доступ к TX, RX, BOOT</tspan></text>
<line x1="20" y1="178" x2="940" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="200" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Плата</tspan></text>
<text x="225.14" y="200" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">антенна на краю без меди; сплошная земля; ширины дорожек по току; DRC чистый</tspan></text>
<line x1="20" y1="212" x2="940" y2="212" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="234" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">Файлы</tspan></text>
<text x="225.14" y="234" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">Gerber проверен в просмотрщике; BOM и CPL согласованы; футпринты по даташитам</tspan></text>
<line x1="20" y1="246" x2="940" y2="246" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
<text x="28" y="268" text-anchor="start" font-size="13" font-weight="700" fill="currentColor"><tspan x="28" dy="0">План проверки</tspan></text>
<text x="225.14" y="268" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="225.14" dy="0">порядок включения, ток холостого хода, ожидаемые напряжения</tspan></text>
</g></svg>
