<text x="189" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="var(--bad, #b3261e)"><tspan x="189" dy="0">3 В</tspan></text>
<text x="189" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="189" dy="0">A: 10к/10к</tspan><tspan x="189" dy="14.399999999999999">нагрузка 10к</tspan></text>
<rect x="258" y="128.39" width="70" height="103.61" rx="4" fill="var(--accent, #2457d6)" stroke="none" stroke-width="2" opacity="0.85"/>
<text x="293" y="120.39" text-anchor="middle" font-size="15" font-weight="700" fill="var(--accent, #2457d6)"><tspan x="293" dy="0">2,878 В</tspan></text>
<text x="293" y="252" text-anchor="middle" font-size="12" font-weight="400" fill="var(--muted, #5b6573)"><tspan x="293" dy="0">B: 10к/4,7к</tspan><tspan x="293" dy="14.399999999999999">без нагрузки</tspan></text>
<rect x="362" y="153.52" width="70" height="78.48" rx="4" fill="var(--bad, #b3261e)" stroke="none" stroke-width="2" opacity="0.85"/>
