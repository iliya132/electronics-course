<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>Расчётное напряжение на выходе обоих делителей</title>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="currentColor">
<text x="240" y="24" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor"><tspan x="240" dy="0">Ожидаемое Uвых при питании 9 В</tspan></text>
<line x1="30" y1="232" x2="460" y2="232" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
