 <title>Поток воды и электрический ток</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="currentColor"/></marker></defs>
 <g font-family="system-ui" font-size="18" fill="currentColor" stroke="none"><text x="24" y="40" >Вода: поток объёма</text><line x1="32" y1="58" x2="448" y2="58" stroke="currentColor"/><line x1="32" y1="82" x2="448" y2="82" stroke="currentColor"/><line x1="100" y1="70" x2="370" y2="70" marker-end="url(#arrow)"/><text x="24" y="170" >Провод: поток заряда</text><line x1="32" y1="188" x2="448" y2="188" stroke="currentColor"/><line x1="32" y1="212" x2="448" y2="212" stroke="currentColor"/><line x1="100" y1="200" x2="370" y2="200" marker-end="url(#arrow)"/><text x="24" y="285" >Аналогия потока, не строения вещества.</text></g></svg>