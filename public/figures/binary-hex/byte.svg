<rect x="36" y="148" width="304" height="4" rx="2" fill="var(--warn, #9a6700)" stroke="none" stroke-width="2"/>
<rect x="380" y="148" width="304" height="4" rx="2" fill="var(--ok, #1a7f4b)" stroke="none" stroke-width="2"/>
<text x="188" y="176" text-anchor="middle" font-size="15" font-weight="700" fill="var(--warn, #9a6700)"><tspan x="188" dy="0">1010₂ = A₁₆</tspan></text>
