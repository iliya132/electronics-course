<text x="421.68" y="166" text-anchor="start" font-size="13" font-weight="400" fill="currentColor"><tspan x="421.68" dy="0">375 мс</tspan></text>
<line x1="20" y1="178" x2="700" y2="178" stroke="var(--border, #e3e6ea)" stroke-width="1.4" stroke-linecap="round"/>
